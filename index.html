[-je]], [[-tje]], [[-pje]] ve [[-etje]] ekleriyle oluşturulur.","blocks":[{"h":"[[-en]] ekiyle çoğul","p":"Hollandacada en yaygın çoğul eki [[-en]]'dir. Bazen doğru telaffuzu korumak için gövdenin son ünlüsünün veya ünsüzünün yazımı değişir.","list":["[[fiets]] → [[fietsen]] (bisiklet)","[[boot]] → [[boten]] (tekne - açık hecede çift ünlü [[oo]], tek [[o]]'ya dönüşür)","[[kat]] → [[katten]] (kedi - kısa ünlünün korunması için son ünsüz ikizleşir)"],"ex":["İki bisikletim var.","Kediler uyuyor."],"tip":"Bu yazım değişiklikleri sadece ünlünün doğru telaffuzunu korumak içindir; kelimenin kendisi ve anlamı değişmez."},{"h":"[[-s]] ekiyle çoğul","p":"Vurgusuz [[-el, -em, -en, -er]] heceleriyle biten isimler ve ünlüyle biten birçok alıntı kelime [[-s]] ile çoğul yapılır.","list":["[[tafel]] → [[tafels]] (masa)","[[deken]] → [[dekens]] (yorgan/battaniye)","[[auto]] → [[auto's]] (araba)","[[foto]] → [[foto's]] (fotoğraf)"],"ex":["Üç arabam var."],"tip":"İsim [[a, o, u, y]] ünlüsüyle bittiğinde, doğru telaffuzu korumak için [[s]]'den önce apostrof gelir: [[auto's]], [[autos]] değil."},{"h":"Kuralsız Çoğullar","p":"Sık kullanılan bazı isimlerin kuralsız çoğulları vardır ve bunlar ayrıca ezberlenmelidir.","list":["[[stad]] → [[steden]] (şehir)","[[kind]] → [[kinderen]] (çocuk)","[[ei]] → [[eieren]] (yumurta)","[[schip]] → [[schepen]] (gemi)"],"tip":"Bunları sadece ezberlemeniz gerekir; sabit bir kuralları yoktur."},{"h":"Küçültme Biçimleri (verkleinwoorden)","p":"Küçültme biçimi, isme [[-je]], [[-pje]], [[-tje]] veya [[-etje]] eklerinden birinin getirilmesiyle oluşturulur ve ona **küçük** veya **sevimli** anlamı katar.","list":["Normal harflerle bitiş → [[+je]]: [[huis]] → [[huisje]], [[kop]] → [[kopje]]","[[m]] ile bitiş → [[+pje]]: [[boom]] → [[boompje]], [[raam]] → [[raampje]]","Uzun ünlüden sonra [[l, n, r]] ile bitiş → [[+tje]]: [[stoel]] → [[stoeltje]], [[deur]] → [[deurtje]]","Kısa ünlüden sonra [[l, n, r]] ile bitiş → ünsüzün ikizleşmesiyle [[+etje]]: [[man]] → [[mannetje]], [[bel]] → [[belletje]]"],"ex":["Bak, küçük bir ev!","Bir fincan kahve ister misin?"],"tip":"Küçültme biçimleri, asıl isim [[de]] olsa bile her zaman [[het]] alır: [[de tafel]] → [[het tafeltje]]."},{"h":"Küçültme Biçimlerinin Anlamı Sadece «Küçük» Değildir","p":"Bazen küçültme biçimi sevecen veya samimi bir anlam taşır, bazen de artık kendisi bağımsız ve yaygın bir kelimeye dönüşmüştür; örneğin [[kopje]] (fincan) artık mutlaka küçük bir şeye işaret etmez.","ex":["Güzel hava, değil mi?"]}],"ex":[{"exp":"Birçok isim [[-en]] ile çoğul yapılır: [[boek]] → [[boeken]]."},{"exp":"Ünlüyle biten isimler apostrof ve [[s]] ile çoğul yapılır: [[auto's]]."},{"q":"[[kat]] için doğru çoğul hangisidir?","options":["katten","kats","katen"],"exp":"Kısa [[a]] ünlüsünün korunması için son ünsüz ikizleşir: [[katten]]."},{"q":"[[kind]]'in çoğulu hangisidir?","options":["kinden","kinderen","kinds"],"exp":"[[kind]] kuralsız bir çoğula sahiptir: [[kinderen]]."},{"exp":"Kelime normal harflerle bittiği için sadece [[+je]] eklenir: [[huisje]]."},{"q":"[[boom]] (ağaç) kelimesinin küçültme biçimi hangisidir?","options":["boomje","boompje","boomtje"],"exp":"[[m]]'den sonra [[+pje]] eki gelir: [[boompje]]."},{"q":"Cümleyi doğru sırayla oluşturun: «İki bisikletim var.»","exp":"Basit cümle sırası: özne + fiil + nesne."},{"exp":"[[kopje]], [[kop]]'un küçültme biçimidir ve bu cümlede «fincan» anlamında kullanılmıştır."},{"q":"Küçültme biçimleri genellikle hangi tanımlığı alır?","options":["de","het","sadece een"],"exp":"Tüm küçültme biçimleri, istisnasız, [[het]] alır."}]},"a1-voornaamwoorden":{"title":"Özne ve İyelik Zamirleri","sum":"Özne zamirleri ([[ik, jij, u, hij, zij, wij, jullie, zij]]) özne ismin yerini alır, iyelik zamirleri ([[mijn, jouw, zijn, haar, ons/onze, jullie, hun]]) ise sahiplik gösterir.","blocks":[{"h":"Özne Zamirleri","p":"Her Hollandaca özne zamiri bir Türkçe zamire karşılık gelir; farkı, Hollandacanın **sen (samimi)** ile **siz (saygı ifade eden)** arasında ayrım yapmasıdır.","table":{"head":["Zamir","Anlamı"],"rows":[["ik","ben"],["jij / je","sen"],["u","siz (saygı ifadesi)"],["hij","o (erkek)"],["zij / ze","o (kadın)"],["wij / we","biz"],["jullie","siz (çoğul)"],["zij / ze","onlar"]]},"ex":["Amsterdam'da yaşıyorum.","Siz naziksiniz."],"tip":"[[u]] her zaman saygı ifade etmek için kullanılır; bir kişiyle veya birden fazla kişiyle konuşmanız fark etmez."},{"h":"Tam ve Kısa Biçim: [[je, we, ze]]","p":"[[jij, wij, zij]] tam ve vurgulu biçimlerdir; [[je, we, ze]] ise günlük konuşmada daha yaygın olan kısa ve vurgusuz biçimlerdir.","ex":["Geciktin!","Eve gidiyoruz."],"tip":"Tam biçim [[jij/wij/zij]], o zamiri vurgulamak istediğimizde, örneğin bir soruya cevap verirken kullanılır."},{"h":"İyelik Zamirleri","p":"Hollandaca iyelik zamirleri, Türkçedeki iyelik eklerinin aksine **isimden önce** gelir ve benim, senin, onun gibi iyelik eklerine karşılık gelir.","table":{"head":["İyelik Zamiri","Anlamı"],"rows":[["mijn","benim"],["jouw / je","senin (samimi)"],["uw","sizin (saygı ifadesi)"],["zijn","onun (erkek)"],["haar","onun (kadın)"],["ons / onze","bizim"],["jullie","sizin (çoğul)"],["hun","onların"]]},"ex":["Bu benim evim.","Senin çantan nerede?"]},{"h":"[[ons]] mu [[onze]] mi?","p":"Biçimi değişen tek iyelik zamiri [[ons/onze]]'dir: tekil [[het]] isminden önce [[ons]], tekil [[de]] isminden önce veya herhangi bir çoğul isimden önce [[onze]] kullanılır.","list":["[[ons huis]] (evimiz - tekil het-woord)","[[onze auto]] (arabamız - tekil de-woord)","[[onze kinderen]] (çocuklarımız - çoğul)"],"ex":["Evimiz büyük.","Arabamız yeni."],"tip":"Bu değişiklik sadece [[ons/onze]] için geçerlidir; diğer iyelik zamirleri hiçbir zaman değişmez."},{"h":"[[van]] ile Sahiplik","p":"Özel bir ismin (kişi adının) sahipliğini göstermek için genellikle İngilizce'deki gibi iyelik yapısı yerine [[van]] yapısı kullanılır: [[het boek van Jan]] «Jan'ın kitabı» demektir, apostrof-s ile değil.","ex":["O, Lisa'nın çantası."],"tip":"Sadece günlük konuşmada bazen [[-s]] apostrofsuz olarak isme eklenir ([[Lisa's tas]]), ama [[van]] yapısı daha yaygın ve daha resmidir."}],"ex":[{"exp":"Hollandacada «ben» için özne zamiri [[ik]]'tir."},{"q":"Hangi zamir saygılı hitap için kullanılır?","options":["jij","u","jullie"],"exp":"[[u]], «sen/siz»'in saygılı biçimidir, hem tekil hem çoğul için."},{"exp":"«Benim» için iyelik zamiri [[mijn]]'dir."},{"q":"Hangi seçenek doğrudur? (auto bir de-woord'dur)","options":["ons auto","onze auto","on auto"],"exp":"[[auto]] bir de-woord olduğu için iyelik zamiri [[onze]] kullanılır."},{"exp":"[[huis]] tekil bir het-woord olduğu için [[ons]] kullanılır."},{"q":"[[hij]] için iyelik zamiri hangisidir?","options":["haar","zijn","hun"],"exp":"[[hij]] (o, erkek) ile ilişkili iyelik zamiri [[zijn]]'dir."},{"q":"Cümleyi doğru sırayla oluşturun: «Siz naziksiniz.»","exp":"Basit cümle sırası: özne + fiil + sıfat."},{"exp":"«Senin» için iyelik zamiri [[jouw]]'dur, konuşmada genellikle kısa biçimi [[je]] de kullanılır."},{"q":"Hangi cümle doğrudur?","options":["Onze kinderen spelen buiten.","Ons kinderen spelen buiten.","Ons kind spelen buiten."],"exp":"[[kinderen]] çoğul olduğu için [[onze]] kullanılmalıdır, [[ons]] değil."}]},"a1-zijn-hebben-tegenwoordige-tijd":{"title":"zijn ve hebben Fiilleri ve Şimdiki Zaman","sum":"[[zijn]] (olmak) ve [[hebben]] (sahip olmak) fiilleri kuralsız çekimlenir; diğer kurallı fiiller ise şimdiki zamanda gövdeye (stam) [[-t]] eklenerek veya eklenmeden çekimlenir.","blocks":[{"h":"[[zijn]] (olmak) Fiilinin Çekimi","p":"[[zijn]] fiili tamamen kuralsızdır ve çekimini ezbere bilmeniz gerekir.","table":{"head":["Zamir","Fiil"],"rows":[["ik","ben"],["jij / je","bent"],["u","bent"],["hij / zij","is"],["wij / we","zijn"],["jullie","zijn"],["zij / ze (çoğul)","zijn"]]},"ex":["Ben Hollandalıyım.","O (kadın) benim kız kardeşim."]},{"h":"[[hebben]] (sahip olmak) Fiilinin Çekimi","p":"[[hebben]] fiili de kuralsızdır, ama örneklerle kalıbını ezberlemek daha kolaydır.","table":{"head":["Zamir","Fiil"],"rows":[["ik","heb"],["jij / je","hebt"],["u","hebt / heeft"],["hij / zij","heeft"],["wij / we","hebben"],["jullie","hebben"],["zij / ze (çoğul)","hebben"]]},"ex":["Bir köpeğim var.","Onun iki erkek kardeşi var."],"tip":"Soruda, özne [[jij/je]] fiilden sonra geldiğinde, fiilin sonundaki [[t]] düşer: [[Heb je een hond?]], [[Hebt je...]] değil."},{"h":"Fiil Gövdesi (stam) ve Kurallı Fiillerin Çekim Kuralı","p":"Fiil gövdesi, mastardan [[-en]] çıkarılarak elde edilir. Şimdiki zamanda: [[ik]] için sadece gövde, [[jij/u/hij/zij]] için gövde + [[-t]], ve çoğul (wij, jullie, zij) için mastarın tam hali kullanılır.","table":{"head":["Zamir","werken fiili (çalışmak)"],"rows":[["ik","werk"],["jij / je","werkt"],["u","werkt"],["hij / zij","werkt"],["wij / we","werken"],["jullie","werken"],["zij / ze","werken"]]},"ex":["Bir dükkanda çalışıyorum.","O da orada çalışıyor."]},{"h":"'t kofschip Kuralı","p":"Gövdenin son harfi **'t kofschip** harflerinden ([[t, k, f, s, ch, p]]) biriyse, [[jij/u/hij/zij]] biçiminde yine sadece [[-t]] eklenir; ama gövde zaten [[t]] ile bitiyorsa, ikinci bir [[t]] eklenmez.","list":["[[fietsen]] → gövde [[fiets]] (zaten [[-s]] ile bitiyor) → [[hij fietst]]","[[praten]] → gövde [[praat]] ([[t]] ile bitiyor) → [[hij praat]] (praatt değil)"],"tip":"Fiilin sonunda hiçbir zaman arka arkaya iki [[t]] gelmez."},{"h":"Gövdede Açık Hece Değişimi","p":"Mastarda çift ünlü varsa ve [[-en]] çıkarıldığında bu ünlü açık hecede kalıyorsa, çift ünlü tek ünlüye dönüşür; tersine, bazen de kısa ünlünün korunması için ünsüz ikizleşir.","list":["[[lopen]] → gövde [[loop]] (uzun sesin korunması için tek ünlü çifte dönüşür)","[[zitten]] → gövde [[zit]] (iki [[t]]'den biri düşer)"],"ex":["Okula yürüyerek gidiyorum.","Sen bir sandalyede oturuyorsun."]}],"ex":[{"exp":"[[zijn]]'in [[ik]] için çekimi [[ben]]'dir."},{"exp":"[[hebben]]'in [[jij]] için çekimi [[hebt]]'tir."},{"q":"[[hebben]]'in [[hij]] için doğru çekimi hangisidir?","options":["heb","hebt","heeft"],"exp":"[[hebben]] fiili [[hij/zij]] için [[heeft]] olarak çekimlenir."},{"exp":"[[zijn]]'in çoğul zamirler ([[wij, jullie, zij]]) için çekimi yine [[zijn]]'dir."},{"exp":"[[ik]] için sadece fiil gövdesi kullanılır, hiçbir ek almadan: [[werk]]."},{"q":"[[werken]]'in [[jij]] için doğru çekimi hangisidir?","options":["werk","werkt","werken"],"exp":"[[jij/u/hij/zij]] için gövdeye [[-t]] eklenir: [[werkt]]."},{"q":"[[praten]]'in [[hij]] için doğru biçimi hangisidir?","options":["hij praat","hij pratt","hij praatt"],"exp":"[[praten]]'in gövdesi zaten [[praat]]'tır ([[t]] ile biter), bu yüzden başka bir [[t]] eklenmez."},{"q":"Cümleyi doğru sırayla oluşturun: «O (kadın) bir dükkanda çalışıyor.»","exp":"Basit cümle sırası: özne + fiil + yer zarfı."},{"exp":"[[lopen]]'in gövdesi [[loop]]'tur (uzun sesin korunması için çift ünlü), ve [[hij]] için [[-t]] eklenir: [[loopt]]."}]},"a1-woordvolgorde-vragen":{"title":"Kelime Sırası ve Soru Cümleleri","sum":"Basit Hollandaca cümlelerde fiil her zaman ikinci sırada gelir (sorularda hariç), evet/hayır soruları ve soru kelimesiyle kurulan sorular ise fiilin yer değiştirmesi veya bir soru kelimesi eklenmesiyle oluşturulur.","blocks":[{"h":"Fiilin İkinci Sırada Olması Kuralı","p":"Hollandaca bir bildirme cümlesinde, çekimli fiil her zaman cümlenin **ikinci öğesidir**, mutlaka ikinci kelime olması gerekmez. Özne fiilden önce veya sonra gelebilir.","ex":["Bir elma yiyorum.","Bugün bir elma yiyorum."],"tip":"İkinci örnekte [[Vandaag]] birinci öğe olduğu için, fiilin yine ikinci sırada kalması için özne [[ik]] fiilden sonra gelir."},{"h":"Özne-Fiil-Nesne Yapısı","p":"Basit cümlenin temel yapısı, İngilizcedeki gibi özne-fiil-nesne şeklindedir.","ex":["Bir kitap satın alıyorum.","O bir gazete okuyor."]},{"h":"Evet/Hayır Soruları","p":"Evet veya hayırla cevaplanan bir soru oluşturmak için, çekimli fiil **cümlenin başına** taşınır ve özne ondan sonra gelir.","ex":["Yorgun musun?","Köpeğin var mı?","O burada mı çalışıyor?"],"tip":"Özne [[jij/je]] fiilden sonra geldiğinde, fiilin sonundaki [[-t]] düşer: [[Werk je hier?]], [[Werkt je hier?]] değil."},{"h":"Soru Kelimesiyle Kurulan Sorular (wh-vragen)","p":"Bu tür sorular bir **soru kelimesiyle** başlar ve hemen ardından fiil gelir (yine fiilin ikinci sırada olması kuralı).","table":{"head":["Soru Kelimesi","Anlamı"],"rows":[["wat","ne"],["wie","kim"],["waar","nerede"],["wanneer","ne zaman"],["waarom","neden"],["hoe","nasıl"],["welke","hangi"]]},"ex":["Nerede yaşıyorsun?","Ne yapıyorsun?","Neden geciktin?"]},{"h":"Zaman veya Yer Zarfıyla Başlayan Cümlelerde Sıralama","p":"Cümle bir zaman veya yer zarfıyla başladığında, fiil yine ikinci öğe olmalıdır, bu nedenle özne fiilden sonra gelir. Bu kurala **inversie** denir.","ex":["Yarın Amsterdam'a gidiyorum."],"tip":"Cümle özne dışında bir şeyle başladığında (zaman zarfı, yer zarfı vb.), fiil ve özne yer değiştirir."}],"ex":[{"q":"Cümleyi doğru sırayla oluşturun: «Bir elma yiyorum.»","exp":"Basit sıralama: özne + fiil + nesne."},{"q":"Cümleyi doğru sırayla oluşturun: «Yarın okula gidiyorum.» (Cümle Morgen ile başlamalı)","exp":"Cümle zaman zarfı [[Morgen]] ile başladığı için fiil [[ga]] ikinci sırada gelir ve özne [[ik]] ondan sonra gelir."},{"q":"Hangi evet/hayır sorusu doğrudur?","options":["Je bent moe?","Ben je moe?","Jij ben moe?"],"exp":"Evet/hayır sorusunda, çekimli fiil cümlenin başına gider: [[Ben je moe?]]"},{"exp":"«Nerede» için soru kelimesi [[waar]]'dır."},{"exp":"«Ne» için soru kelimesi [[wat]]'tır."},{"q":"Cümleyi doğru sırayla oluşturun: «O (kadın) burada mı çalışıyor?»","exp":"Evet/hayır sorusunda fiil önce gelir: [[Werkt zij hier?]]"},{"q":"[[Vandaag eet ik een appel]] cümlesinde özne nerede yer alıyor?","options":["Fiilden önce","Fiilden sonra","Cümlenin sonunda"],"exp":"[[Vandaag]] cümlenin başına geldiği için, fiilin yine ikinci sırada olması için özne [[ik]] fiil [[eet]]'ten sonra gelir."},{"exp":"«Neden» için soru kelimesi [[waarom]]'dur."},{"q":"Cümleyi doğru sırayla oluşturun: «Köpeğin var mı?»","exp":"Evet/hayır sorusunda fiil cümlenin başına gider ve [[je]]'den önce fiildeki [[t]] düşer: [[Heb je...]]"}]},"a1-ontkenning":{"title":"niet ve geen ile Olumsuzluk","sum":"Hollandacada bir cümleyi olumsuz yapmak için [[niet]] kullanılır; ancak ilgili isim [[een]] ile veya hiçbir tanımlık almadan geliyorsa, bu durumda [[geen]] kullanılır.","blocks":[{"h":"Genel Kural: [[geen]] Ne Zaman Kullanılır?","p":"[[geen]], [[een]]'in yerine geçer; yani o isimden **hiç** olmadığını söylemek istediğimizde kullanılır.","ex":["Bir arabam var.","Arabam yok."]},{"h":"Tanımlıksız İsimlerle [[geen]]","p":"[[geen]], çoğul isimleri veya hiç tanımlık almayan isimleri (maddeler ve yiyecekler gibi) olumsuzlamak için de kullanılır.","ex":["Kahve içiyorum.","Kahve içmiyorum.","Onun çocukları var.","Onun çocuğu yok."]},{"h":"Fiil veya Cümleyi Olumsuzlamak için [[niet]]","p":"[[niet]], **fiili, sıfatı, zarfı veya belirli tanımlık ([[de/het]]) ya da iyelik zamiri alan bir ismi** olumsuzlamak için kullanılır.","ex":["Bugün çalışmıyorum.","Bu benim kitabım değil."]},{"h":"[[niet]]'in Cümledeki Yeri","p":"[[niet]] genellikle cümlenin sonuna yakın gelir, ama sıfattan, yer zarfından, edattan veya (yardımcı fiil içeren cümlelerde) ikinci fiilden **önce** yer alır.","list":["[[Ik ga niet naar school.]] (yer zarfından önce)","[[Hij is niet aardig.]] (sıfattan önce)","[[Zij kan niet komen.]] (ikinci fiilden önce)"],"tip":"Basit bir yöntem: cümleyi zihninizde «... doğru değil» şeklinde yeniden kurabiliyorsanız, genellikle [[niet]] doğrudur, [[geen]] değil."},{"h":"[[niet]] ve [[geen]]'in Doğrudan Karşılaştırması","table":{"head":["Olumlu Cümle","Olumsuz Cümle"],"rows":[["Ik heb een hond.","Ik heb geen hond."],["Ik zie de hond.","Ik zie de hond niet."],["Dit is mijn tas.","Dit is niet mijn tas."]]},"ex":["Et yemiyorum.","O eti yemiyorum."]}],"ex":[{"q":"Ik heb ___ broer. (erkek kardeşim yok)","options":["niet","geen","geen een"],"exp":"[[broer]] tanımlıksız belirsiz bir isim olduğu için [[geen]] kullanılır."},{"exp":"İsim iyelik zamiri [[mijn]] ile geldiği için [[niet]] kullanılmalıdır."},{"q":"Zij drinkt ___ koffie.","options":["niet","geen","geen de"],"exp":"[[koffie]] tanımlıksızdır, bu yüzden [[geen]] doğrudur."},{"exp":"[[kat]] belirli tanımlık [[de]] ile geldiği için [[niet]] kullanılmalıdır."},{"q":"[[Ik zie de hond niet]] cümlesinde neden [[geen]] değil [[niet]] kullanılmış?","options":["çünkü hond çoğul bir isimdir","çünkü hond belirli tanımlık de alır","çünkü hond bir fiildir"],"exp":"İsim belirli tanımlık [[de/het]] aldığında, olumsuzlamak için [[niet]] kullanılır."},{"q":"Cümleyi doğru sırayla oluşturun: «Bugün çalışmıyorum.»","exp":"[[niet]], zaman zarfı [[vandaag]]'dan önce gelir."},{"exp":"Sıfatı ([[aardig]]) olumsuzlamak için [[niet]] kullanılır."},{"q":"Hangi cümle doğrudur?","options":["Ik heb geen tijd.","Ik heb niet tijd.","Ik heb niet een tijd."],"exp":"[[tijd]] tanımlıksız bir isimdir, bu yüzden [[geen]] kullanılmalıdır."},{"q":"Cümleyi doğru sırayla oluşturun: «O (kadın) çocuğu yok.»","exp":"[[kinderen]] tanımlıksız olduğu için [[geen]] kullanılır."}]},"a1-voorzetsels":{"title":"Yer ve Zaman Edatları","sum":"[[in, op, onder, naast, tussen, bij, achter]] gibi edatlar yeri gösterir, [[om, in, op, over, voor]] ise zamanı belirtir; bu kelimelerin çoğu bağlama göre farklı anlamlara gelebilir.","blocks":[{"h":"Sık Kullanılan Yer Edatları","table":{"head":["Edat","Anlamı"],"rows":[["in","içinde, -de"],["op","üzerinde, üstünde"],["onder","altında"],["naast","yanında"],["tussen","arasında"],["bij","yakınında, yanında"],["achter","arkasında"],["voor","önünde"]]},"ex":["Kedi masanın altında.","Kitap masanın üstünde."]},{"h":"[[in]] ile [[op]] Arasındaki Fark","p":"[[in]], bir alanın veya kabın **içinde** olan şeyler için; [[op]] ise bir yüzeyin **üstünde** olan şeyler için kullanılır.","ex":["Süt buzdolabının içinde.","Fincanlar masanın üstünde."],"tip":"[[op]], cadde, meydan ve ada için de kullanılır: [[op straat]] (caddede), [[op het eiland]] (adada)."},{"h":"[[bij]] ve [[naast]]","p":"[[bij]], bir şeyin yakınında veya birinin yanında olmak anlamına gelir; [[naast]] ise bir şeyin tam yanı başında, bitişiğinde olmak anlamına gelir.","ex":["Pencerenin yanında duruyorum.","Sandalye masanın yanında."]},{"h":"Zaman Edatları","table":{"head":["Edat","Örnek"],"rows":[["om","om acht uur (saat sekizde)"],["in","in januari (ocak ayında)"],["op","op maandag (pazartesileri)"],["over","over een week (bir hafta sonra)"],["voor","voor het eten (yemekten önce)"]]},"ex":["Ders saat dokuzda başlıyor.","Pazartesileri okula gidiyorum."]},{"h":"Günler ve Günün Zamanlarıyla İlgili Özel Noktalar","p":"Haftanın günleri için [[op]] kullanılır (örneğin [[op zaterdag]]), ama sabah ve akşam gibi günün bölümleri için [['s]] yapısı kullanılır; örneğin [['s avonds]] (akşamları) ve [['s ochtends]] (sabahları).","list":["[['s morgens]] / [['s ochtends]] (sabahları)","[['s middags]] (öğleleri)","[['s avonds]] (akşamları)","[['s nachts]] (geceleri)"],"ex":["Akşamları televizyon izliyorum."],"tip":"[['s]] her zaman küçük harfle yazılır, cümlenin başında olsa bile; bu durumda bir sonraki harf büyük yazılır: [['s Avonds]]."}],"ex":[{"exp":"[[onder]] bir şeyin altı anlamına gelir."},{"exp":"[[op]], bir yüzeyin üstünde olan bir şey için kullanılır."},{"q":"Buzdolabının içi için hangi edat doğrudur?","options":["op","in","achter"],"exp":"Süt buzdolabının içindeki alanda olduğu için [[in]] kullanılır: [[in de koelkast]]."},{"exp":"Tam saati belirtmek için [[om]] kullanılır."},{"exp":"Haftanın günleri için [[op]] kullanılır."},{"q":"«Akşamları» için hangi seçenek doğrudur?","options":["'s ochtends","'s avonds","'s middags"],"exp":"[['s avonds]] «akşamları» anlamına gelir."},{"q":"Cümleyi doğru sırayla oluşturun: «Sandalye masanın yanında.»","exp":"Basit sıralama: özne + fiil + edat + nesne."},{"exp":"Ay adları için [[in]] kullanılır."},{"q":"«Bir hafta sonra» için hangi cümle doğrudur?","options":["over een week","voor een week","om een week"],"exp":"[[over]], gelecekte bir sürenin geçmesini ifade etmek için kullanılır: [[over een week]]."}]},"a1-modale-werkwoorden":{"title":"Kip Fiilleri (Modal Fiiller)","sum":"[[kunnen]] (yapabilmek), [[mogen]] (izni olmak), [[moeten]] (mecbur olmak), [[willen]] (istemek) ve [[hoeven]] (gerekmemek) gibi kip fiilleri, başka bir fiille birlikte, o fiil mastar halinde cümlenin sonuna gelecek şekilde kullanılır.","blocks":[{"h":"Kip Fiillerinin Çekimi","p":"Kip fiilleri tekilde (ik, jij/u, hij/zij) kısa ve bir ölçüde kuralsız çekimlenir, çoğulda (wij, jullie, zij) ise tam mastar hâlinde kalır.","table":{"head":["Zamir","kunnen","mogen","moeten","willen"],"rows":[["ik","kan","mag","moet","wil"],["jij / je","kan / kunt","mag","moet","wil / wilt"],["u","kunt / kan","mag","moet","wilt"],["hij / zij","kan","mag","moet","wil"],["wij / we","kunnen","mogen","moeten","willen"],["jullie","kunnen","mogen","moeten","willen"],["zij / ze","kunnen","mogen","moeten","willen"]]}},{"h":"Her Kip Fiilinin Anlamı ve Kullanımı","list":["[[kunnen]]: yapabilmek / mümkün olmak","[[mogen]]: izni olmak","[[moeten]]: mecbur olmak, gerekmek","[[willen]]: istemek, arzu etmek","[[hoeven]]: gerekmemek (genellikle [[niet]] ile birlikte kullanılır)"],"ex":["İyi yüzebiliyorum.","Burada sigara içmene izin var."]},{"h":"Asıl Fiilin Cümle Sonundaki Yeri","p":"Cümlede bir kip fiili varsa, asıl fiil **mastar** halinde **cümlenin sonuna** gelir; kip fiilinin kendisi cümlenin ikinci sırasında yer alır.","ex":["Şimdi eve gitmem gerekiyor.","Bir fincan kahve içmek ister misin?"],"tip":"Bu yapıya **werkwoord op de laatste plaats** denir: kip fiili ikinci, asıl fiil sonda."},{"h":"[[moeten]]'e Karşı [[hoeven niet]]","p":"[[hoeven]] neredeyse her zaman [[niet]] ile kullanılır ve **gerekmiyor** anlamına gelir; bu da [[moeten]]'in (gerekiyor) tam tersidir.","ex":["Bunu yapman gerekiyor.","Bunu yapmana gerek yok."],"tip":"[[hoeven]] ile genellikle asıl fiilden önce [[te]] gelir: [[hoeven te + mastar]]; diğer kip fiilleri ise [[te]] gerektirmez."},{"h":"Diğer Kip Fiillerinin Olumsuzlanması","p":"[[mogen]] (izni olmamak), [[kunnen]] (yapamamak) ve [[willen]] (istememek) fiillerini olumsuzlamak için, diğer her fiilde olduğu gibi, sadece [[niet]] cümle sonundaki asıl fiilden önce gelir.","ex":["Burada sigara içmene izin yok.","Bunu yapamıyorum."]}],"ex":[{"exp":"[[kunnen]]'in [[ik]] için çekimi [[kan]]'dır."},{"exp":"[[mogen]]'in [[jij]] için çekimi [[mag]]'dır."},{"q":"[[moeten]]'in [[wij]] için doğru çekimi hangisidir?","options":["moet","moeten","moest"],"exp":"Çoğulda kip fiilleri tam mastar hâlinde kalır: [[wij moeten]]."},{"q":"Cümleyi doğru sırayla oluşturun: «Şimdi eve gitmem gerekiyor.»","exp":"Kip fiili [[moet]] ikinci sırada gelir, asıl fiil [[gaan]] ise mastar halinde sonda."},{"exp":"[[hoeven]]'in [[je]] için çekimi [[hoeft]]'tir."},{"q":"Hangi fiil «gerekmiyor» anlamına gelir?","options":["moeten","hoeven niet","mogen niet"],"exp":"[[hoeven]], [[niet]] ile birlikte «gerekmiyor» anlamına gelir."},{"q":"Cümleyi doğru sırayla oluşturun: «Bir fincan kahve içmek ister misin?»","exp":"Soruda kip fiili [[wil]] önce gelir, asıl fiil [[drinken]] ise mastar halinde sonda."},{"exp":"[[kunnen]]'in [[ik]] için çekimi olumsuz halde de aynı [[kan]]'dır, sadece [[niet]] eklenir."},{"q":"[[Ik moet nu naar huis gaan]] cümlesinde asıl fiil nerede yer alır?","options":["Cümlenin başında","Özneden sonra","Cümlenin sonunda mastar halinde"],"exp":"Cümlede bir kip fiili olduğunda, asıl fiil mastar halinde cümlenin sonuna gelir."}]},"a2-scheidbare-werkwoorden":{"title":"Ayrılabilir fiiller","sum":"[[opstaan]] ve [[aankomen]] gibi ayrılabilir fiiller ana cümlede birbirinden ayrılır, mastar halinde ve tamamlanmış zamanda özel bir şekilde birleşir, yan cümlede de tekrar birleşir.","blocks":[{"h":"Ayrılabilir fiil nedir?","p":"Hollandacada bazı fiiller iki bölümden oluşur: bir önek (örneğin [[op]], [[aan]], [[mee]]) ve asıl fiil. Bunlara **ayrılabilir fiiller** (scheidbare werkwoorden) denir, örneğin [[opstaan]] (kalkmak), [[aankomen]] (varmak) ve [[meenemen]] (yanına almak) gibi. Mastar halinde bu iki bölüm her zaman birbirine bitişiktir ve asıl vurgu önek üzerine gelir.","list":["[[opstaan]] = kalkmak / uyanmak","[[aankomen]] = varmak","[[meenemen]] = yanına almak","[[afspreken]] = randevulaşmak / sözleşmek","[[uitnodigen]] = davet etmek","[[instappen]] = binmek","[[weggaan]] = gitmek / terk etmek","[[terugkomen]] = geri dönmek"],"tip":"Ayrılabilir fiillerin önekinde her zaman vurgu bulunur; bu, onları [[bezoeken]] gibi ayrılamayan fiillerden ayırt etmenin yollarından biridir."},{"h":"Ana cümlede önekin yeri","p":"Şimdiki zaman veya di'li geçmiş zamanla kurulan ana cümlede, çekimli fiil öznenin sonrasında gelir, ancak ayrılabilen bölüm (önek) **cümlenin sonuna** gider.","ex":["Ben her sabah saat yedide kalkarım.","O yarın saat onda varacak.","Şemsiyeni yanına alıyor musun?"]},{"h":"Kip fiilleriyle ve mastar halinde","p":"Ayrılabilir fiil, bir kip fiiliyle (örneğin [[kunnen]], [[moeten]], [[willen]]) ya da [[gaan]]'dan sonra mastar olarak geldiğinde, iki bölümü tekrar birleşir ve cümlenin sonunda tek bir kelime olarak yer alır.","ex":["Yarın erken kalkmam gerekiyor.","Kitabı yanına almak ister misin?"]},{"h":"Tamamlanmış zaman (voltooide tijd)","p":"Ayrılabilir fiillerin geçmiş zaman ortacında (deelwoord), [[ge]] öneki kelimenin başına değil, **önek ile asıl fiil arasına** gelir.","table":{"head":["Mastar","Geçmiş zaman ortacı"],"rows":[["opstaan","opgestaan"],["aankomen","aangekomen"],["meenemen","meegenomen"],["afspreken","afgesproken"]]},"ex":["O bu sabah geç kalktı.","İyi bir plan üzerinde anlaştık."]},{"h":"Yan cümlede (bijzin)","p":"Cümle [[dat]], [[omdat]] veya [[als]] gibi bağımlı bir bağlaçla başladığında, fiil cümlenin sonuna gider ve bu durumda ayrılabilir fiilin iki bölümü tekrar **tek bir kelime** olur.","ex":["Onun yarın varacağını düşünüyorum.","Erken eve geldiği için mutlu."],"tip":"Bu nokta öğrencilerin en yaygın hatalarından biridir: yan cümlede fiilin iki bölümünün tekrar yan yana gelip tek bir kelime oluşturması gerektiğini unutmayın."}],"ex":[{"q":"Doğru cümleyi seçin (fiil: [[opstaan]]).","options":["Ik sta elke dag om zeven uur op.","Ik opsta elke dag om zeven uur.","Ik sta op elke dag om zeven uur."],"exp":"Ana cümlede çekimli fiil öznenin sonrasında gelir ve ayrılabilen bölüm ([[op]]) cümlenin sonuna gider: [[Ik sta ... op]]."},{"q":"Yan cümlede ayrılabilir fiil nasıl yazılır? Örnek: ...dat hij morgen ___ (aankomen)","options":["aan komt","komt aan","aankomt"],"exp":"Yan cümlede ayrılabilir fiilin iki bölümü tekrar birleşir ve cümlenin sonunda tek bir kelime olarak gelir: [[dat hij morgen aankomt]]."},{"q":"Fiil [[meenemen]] tamamlanmış zamanda (voltooide tijd) hangi şekli alır?","options":["heeft meegenomen","heeft genomenmee","heeft meegeenomen"],"exp":"Ayrılabilir fiillerin geçmiş zaman ortacında [[ge]], önek ile asıl fiil arasına gelir: [[mee + ge + nomen]] = [[meegenomen]]."},{"exp":"Ayrılabilir fiil [[meenemen]] ana cümlede ayrılır; önek [[mee]] cümlenin sonuna gider."},{"exp":"Fiil [[afspreken]] ana cümlede ayrılır; [[af]] bölümü cümlenin sonuna gider."},{"exp":"Ayrılabilir fiil [[thuiskomen]]'in geçmiş zaman ortacı, [[ge]]'nin önek ile asıl fiil arasına eklenmesiyle oluşur: [[thuisgekomen]]."},{"q":"Kelimeleri doğru sırayla dizin: «O yarın varacak.»","exp":"Ana cümlede fiil [[komt]] öznenin sonrasında gelir ve önek [[aan]] cümlenin sonuna gider."},{"q":"«Erken kalkmam gerekiyor.» cümlesi için doğru kelime sırası","exp":"Kip fiili [[moet]] ile, ayrılabilir fiil [[opstaan]]'ın mastar hali cümlenin sonunda tek bir kelime olarak gelir."},{"q":"Hangi yan cümle doğrudur?","options":["Ik weet dat hij morgen aankomt.","Ik weet dat hij morgen komt aan.","Ik weet dat hij aankomt morgen."],"exp":"Yan cümlede [[dat]]'tan sonra, ayrılabilir fiil tek bir kelime ([[aankomt]]) olarak cümlenin sonunda gelir."}]},"a2-onvoltooid-verleden-tijd":{"title":"Di'li geçmiş zaman (basit geçmiş)","sum":"Kurallı fiillerin di'li geçmiş zamanını oluşturmak için fiil köküne [[-te]] veya [[-de]] eklenir; kuralsız fiiller ünlü değişimiyle çekimlenir ve ezberlenmesi gerekir.","blocks":[{"h":"Di'li geçmiş zamanın kullanımı","p":"[[onvoltooid verleden tijd]] (di'li geçmiş zaman), geçmişteki olayları ve alışkanlıkları anlatmak için kullanılır; özellikle anlatım ve hikaye anlatımında, ya da geçmişteki kesin bir zaman belirtildiğinde.","ex":["Eskiden Amsterdam'da yaşıyordum.","Dün o geç saatlere kadar çalıştı."]},{"h":"Kurallı fiiller (zwakke werkwoorden)","p":"Kurallı fiillerde, fiil köküne [[-te]] veya [[-de]] eklenir. Hangisinin kullanılacağını belirlemek için ünlü **'t kofschip** kuralını uygularız: fiil kökü [[t, k, f, s, ch, p]] harflerinden biriyle bitiyorsa [[-te]] eklenir; aksi halde [[-de]] eklenir.","table":{"head":["Mastar","Kök","Di'li geçmiş (tekil)","Di'li geçmiş (çoğul)"],"rows":[["werken","werk","werkte","werkten"],["maken","maak","maakte","maakten"],["leven","leef","leefde","leefden"],["wonen","woon","woonde","woonden"]]},"tip":"'t kofschip kuralının harflerini akılda tutmak için 't kofschip ifadesini veya aynı t,k,f,s,ch,p harflerini içeren İngilizce kısaltma x-factor shoes'u hatırlayabilirsiniz."},{"h":"Kuralsız fiiller (sterke werkwoorden)","p":"Kuralsız fiillerde kökün ünlüsü değişir ve hiçbir [[-te]] veya [[-de]] eklenmez. Çoğul halde fiilin sonuna [[-en]] eklenir.","table":{"head":["Mastar","Tekil","Çoğul"],"rows":[["lopen","liep","liepen"],["eten","at","aten"],["zien","zag","zagen"],["komen","kwam","kwamen"],["geven","gaf","gaven"],["lezen","las","lazen"]]}},{"h":"Önemli yardımcı ve kip fiilleri","p":"Sık kullanılan [[zijn]], [[hebben]] fiilleri ve kip fiilleri de di'li geçmiş zamanda kuralsız şekillere sahiptir ve ayrıca ezberlenmesi gerekir.","table":{"head":["Mastar","Tekil","Çoğul"],"rows":[["zijn","was","waren"],["hebben","had","hadden"],["kunnen","kon","konden"],["moeten","moest","moesten"],["willen","wilde / wou","wilden"],["mogen","mocht","mochten"]]},"tip":"[[wou]], [[wilde]]'nin günlük konuşma dilindeki şeklidir ve gündelik konuşmada çok yaygındır."},{"h":"Di'li geçmiş zamana karşı tamamlanmış zaman","p":"Yazı dilinde ve anlatımda di'li geçmiş zaman yaygın olarak kullanılır, ancak Hollandalılar günlük konuşmada geçmişten bahsederken çoğunlukla **tamamlanmış zamanı** ([[voltooide tijd]]) kullanırlar. Bu iki zaman genellikle aynı metinde birlikte kullanılır.","ex":["Dün çalıştım ve sonra eve gittim."]}],"ex":[{"q":"Fiil [[werken]]'in [[hij]] için di'li geçmiş hali hangisidir?","options":["werkde","werkte","werkten"],"exp":"Kök [[werk]], [[k]] ile bitiyor ('t kofschip harflerinden biri), bu yüzden [[-te]] alır: [[werkte]]."},{"q":"Fiil [[wonen]]'in [[wij]] için di'li geçmiş hali hangisidir?","options":["woonden","woonten","woonde"],"exp":"Kök [[woon]], 't kofschip harfleriyle bitmiyor, bu yüzden [[-de]]/[[-den]] alır; çoğulda: [[woonden]]."},{"q":"Fiil [[gaan]]'ın tekil hali için hangi di'li geçmiş şekli doğrudur?","options":["gaande","ging","gingde"],"exp":"[[gaan]] kuralsız bir fiildir: tekil [[ging]], çoğul [[gingen]]."},{"exp":"Kök [[woon]], 't kofschip harfleriyle bitmiyor, bu yüzden [[-de]] alır: [[woonde]]."},{"exp":"[[lopen]] kuralsız bir fiildir ve tekilde [[liep]] olur."},{"exp":"[[kunnen]]'in çoğul di'li geçmiş hali [[konden]]'dir."},{"q":"«O dün geç çalıştı» için doğru kelime sırası","exp":"Çekimli fiil [[werkte]] öznenin sonrasında gelir ve zarflar onun ardından yer alır."},{"q":"«Biz eskiden Amsterdam'da yaşıyorduk» için doğru kelime sırası","exp":"Fiil [[woonden]] (çoğul di'li geçmiş) öznenin sonrasında gelir."}]},"a2-voltooide-tijd":{"title":"Tamamlanmış zaman (perfectum)","sum":"Hollandacadaki tamamlanmış zaman, [[hebben]] veya [[zijn]] yardımcı fiili ile cümlenin sonundaki geçmiş zaman ortacı (deelwoord) kullanılarak oluşturulur.","blocks":[{"h":"Genel yapı","p":"Tamamlanmış zaman, çekimli yardımcı fiil ([[hebben]] veya [[zijn]]) ile **geçmiş zaman ortacının** (voltooid deelwoord) birlikte kullanılmasıyla oluşturulur. Yardımcı fiil öznenin sonrasında gelir ve geçmiş zaman ortacı cümlenin sonuna gider.","ex":["Bir kitap okudum.","O okula gitti."]},{"h":"hebben mi, zijn mi?","p":"Fiillerin çoğu [[hebben]] ile çekimlenir. Ancak **başka bir yere hareket** veya **durum değişikliği** gösteren fiiller (örneğin [[gaan]], [[komen]], [[worden]], [[blijven]], [[sterven]]) [[zijn]] ile çekimlenir.","list":["[[hebben]]: fiillerin çoğu, örneğin [[werken]], [[eten]], [[lezen]], [[zien]]","[[zijn]]: yer veya durum değişikliği gösteren hareket fiilleri, örneğin [[gaan]], [[komen]], [[worden]], [[blijven]], [[vertrekken]]"],"tip":"[[fietsen]] gibi bazı fiiller hem [[hebben]] hem de [[zijn]] ile kullanılabilir: vurgu eylemin kendisindeyse [[hebben]], hedefe ulaşmadaysa [[zijn]] kullanılır: [[Ik heb gefietst]] (bisiklete bindim) karşısında [[Ik ben naar school gefietst]] (bisikletle okula gittim)."},{"h":"Kurallı fiillerin geçmiş zaman ortacının oluşumu","p":"Kurallı fiillerin geçmiş zaman ortacı, kökün başına [[ge-]] ve sonuna [[-t]] veya [[-d]] eklenerek oluşturulur; di'li geçmiş zamanda gördüğümüz 't kofschip kuralı burada da geçerlidir.","table":{"head":["Mastar","Kök","Geçmiş zaman ortacı"],"rows":[["werken","werk","gewerkt"],["maken","maak","gemaakt"],["leven","leef","geleefd"],["wonen","woon","gewoond"]]}},{"h":"Kuralsız fiillerin geçmiş zaman ortacı","p":"Sık kullanılan birçok fiilin kuralsız bir geçmiş zaman ortacı vardır ve bunların ayrıca ezberlenmesi gerekir.","table":{"head":["Mastar","Geçmiş zaman ortacı"],"rows":[["doen","gedaan"],["geven","gegeven"],["zien","gezien"],["nemen","genomen"],["komen","gekomen"],["gaan","gegaan"],["zijn","geweest"],["hebben","gehad"],["kopen","gekocht"],["schrijven","geschreven"]]},"tip":"[[zijn]] fiilinin kendisinin geçmiş zaman ortacı [[geweest]]'tir: [[Ik ben in Parijs geweest]] (Paris'te bulundum)."},{"h":"Cümlede kelime sırası","p":"Yardımcı fiil doğrudan öznenin sonrasında gelir, cümlenin diğer unsurları (zaman zarfı, nesne vb.) ortada yer alır ve geçmiş zaman ortacı her zaman ana cümlenin son kelimesidir.","ex":["Dün evin tamamını temizledik.","O filmi daha önce izledin mi?"]}],"ex":[{"q":"[[gaan]] ile hangi yardımcı fiil kullanılır?","options":["hebben","zijn","worden"],"exp":"[[gaan]] yer değişikliği gösteren bir hareket fiilidir, bu yüzden [[zijn]] ile çekimlenir: [[Hij is gegaan]]."},{"q":"[[kopen]] fiilinin doğru geçmiş zaman ortacı hangisidir?","options":["gekoopt","gekocht","gekopen"],"exp":"[[kopen]] kuralsız bir fiildir ve geçmiş zaman ortacı [[gekocht]]'tur."},{"q":"Doğru cümleyi seçin.","options":["Ik heb een appel gegeten.","Ik ben een appel gegeten.","Ik heb een appel eten."],"exp":"[[eten]], [[hebben]] ile çekimlenir ve geçmiş zaman ortacı [[gegeten]]'dir."},{"exp":"Fiil [[gaan]], [[zijn]] ile çekimlenir; [[zijn]]'in üçüncü tekil şahıs hali [[is]]'tir."},{"exp":"[[werken]]'in geçmiş zaman ortacı, 't kofschip kuralıyla [[gewerkt]] şeklinde oluşur."},{"exp":"[[lezen]]'in kuralsız geçmiş zaman ortacı [[gelezen]]'dir."},{"q":"Doğru sıralama: «Dün bir mektup yazdım»","exp":"Yardımcı fiil [[heb]] öznenin sonrasında gelir ve geçmiş zaman ortacı [[geschreven]] cümlenin sonuna gider."},{"q":"Doğru sıralama: «O eve gitti»","exp":"[[gaan]] bir hareket fiili olduğu için yardımcı fiil [[is]] kullanılır ve geçmiş zaman ortacı [[gegaan]] sonda gelir."}]},"a2-toekomende-tijd":{"title":"Gelecek zaman","sum":"Hollandacada gelecek zaman genellikle [[gaan]] + mastar (plan ve niyet için) veya [[zullen]] + mastar (tahmin, söz ve öneri için) ile oluşturulur.","blocks":[{"h":"Gelecek zaman oluşturmanın iki yolu","p":"Hollandaca gelecek zamanı ifade etmek için iki ana yapıya sahiptir: [[gaan]] + mastar ve [[zullen]] + mastar. Bu ikisi arasındaki seçim sadece zamana değil, **cümlenin niyet ve tonuna** bağlıdır.","list":["[[gaan]] + mastar: plan, niyet veya yakın gelecek","[[zullen]] + mastar: tahmin, söz, anlık karar veya öneri"]},{"h":"gaan + mastar","p":"[[gaan]], önceden bir plan ya da bir şey yapma niyeti olduğunda kullanılır. Asıl fiilin mastar hali cümlenin sonuna gelir.","ex":["Yarın yeni bir araba alacağım (almayı planlıyorum).","Bu hafta sonu sahile gidiyoruz."]},{"h":"zullen + mastar","p":"[[zullen]], tahminde bulunmak, söz vermek veya anlık alınan bir karar için kullanılır. Ayrıca [[Zullen we...?]] ile önerilerde de kullanılır.","table":{"head":["Zamir","zullen"],"rows":[["ik","zal"],["jij / je","zal / zult"],["hij / zij / het","zal"],["wij / we","zullen"],["jullie","zullen"],["zij / ze","zullen"]]},"ex":["Yarın muhtemelen yağmur yağacak.","Yarın seni ararım, söz veriyorum.","Birlikte kahve içelim mi?"]},{"h":"gaan ve zullen arasındaki ince fark","p":"[[gaan]], önceden belirlenmiş bir plan veya niyeti gösterir, [[zullen]] ise daha çok anlık verilen bir tahmin, öngörü veya söz için kullanılır. Günlük durumların çoğunda [[gaan]] daha doğal ve daha yaygındır.","tip":"Samimi bir öneri genellikle [[Zullen we...?]] ile başlar, [[Gaan we...?]] ile değil."},{"h":"Gelecek için şimdiki zaman","p":"Cümlede gelecekle ilgili belirli bir zaman zarfı olduğunda (örneğin [[morgen]], [[volgende week]]), geleceği ifade etmek için şimdiki zaman da kullanılabilir.","ex":["Yarın tenis oynuyorum."]}],"ex":[{"q":"Hangi cümle önceden planlanmış bir niyeti gösterir?","options":["Ik zal morgen naar de tandarts gaan.","Ik ga morgen naar de tandarts.","Ik ging morgen naar de tandarts."],"exp":"[[gaan]] + mastar, önceden belirlenmiş bir plan veya niyet için kullanılır."},{"q":"Öneride bulunmak için genellikle hangi yapı kullanılır?","options":["Gaan we samen eten?","Zullen we samen eten?","Zijn we samen eten?"],"exp":"Samimi öneriler genellikle [[Zullen we...?]] ile kurulur."},{"q":"[[wij]] için [[zullen]]'in doğru hali hangisidir?","options":["zal","zult","zullen"],"exp":"[[wij]]/[[we]] için fiil [[zullen]]'in doğru hali [[zullen]]'dir."},{"exp":"Söz vermek için [[zullen]] kullanılır; birinci tekil şahıs hali [[zal]]'dır."},{"exp":"Önceden belirlenmiş bir planı ifade etmek için [[gaan]] + mastar kullanılır."},{"exp":"Hava durumu tahmini için [[zullen]] yaygın olarak kullanılır; üçüncü tekil şahıs hali [[zal]]'dır."},{"q":"Doğru sıralama: «Yarın yeni bir kitap alacağım (almayı planlıyorum)»","exp":"[[gaan]] + mastar yapısı: [[ga]] öznenin sonrasında, mastar [[kopen]] cümlenin sonunda."},{"q":"Doğru sıralama: «Birlikte kahve içelim mi?»","exp":"Öneri [[Zullen we]] ile başlar ve asıl fiilin mastar hali ([[drinken]]) sonda gelir."}]},"a2-bijvoeglijk-naamwoord":{"title":"Sıfat ve -e eki","sum":"Bir isimden önce gelen sıfat genellikle [[-e]] eki alır; ancak [[een]] ile veya tanımlık olmadan kullanılan tekil bir het-woord'dan önce almaz.","blocks":[{"h":"Genel kural","p":"Hollandacada sıfat **isimden önce** geldiğinde, çoğu durumda ona [[-e]] eklenmesi gerekir. Bu ek, ismin cinsine (de-woord veya het-woord), tekil ya da çoğul olmasına ve tanımlığın türüne bağlıdır.","table":{"head":["Durum","Örnek"],"rows":[["de-woord (tekil, her tanımlıkla)","de mooie auto / een mooie auto"],["het-woord tekil, het/dit/dat ile","het mooie huis"],["het-woord tekil, een/geen ile veya tanımlıksız","een mooi huis"],["Çoğul (her iki cins)","mooie auto's / mooie huizen"]]}},{"h":"de-woorden her zaman -e alır","p":"İsim [[de-woord]] türündeyse, ondan önceki sıfat tanımlığı olsun olmasın her zaman [[-e]] eki alır.","ex":["Büyük bahçe çok güzel.","Onun sevimli bir köpeği var."]},{"h":"het-woorden: tanımlığa bağlıdır","p":"Tekil [[het-woorden]] için, tanımlık **belirli/işaret** ([[het]], [[dit]], [[dat]]) ise sıfat [[-e]] eki alır; ancak tanımlık **belirsiz** ([[een]]) ise veya hiç tanımlık yoksa, sıfat [[-e]] eki almadan kalır.","ex":["Güzel ev suyun kenarında.","Güzel bir evde yaşıyorum.","Bu küçük çocuk çok güler."],"tip":"Hiç tanımlık yoksa ve isim tekil bir het-woord ise, sıfat da [[-e]] eki almaz: [[mooi weer]] (güzel hava)."},{"h":"Çoğulda her zaman -e eki alınır","p":"Çoğul halde, ismin de-woord ya da het-woord olması önemli değildir; sıfat her zaman [[-e]] eki alır.","ex":["Çocuklar güzel resimler çizdiler."]},{"h":"İstisnalar ve yüklem konumu","p":"[[-en]] ile biten sıfatlar (genellikle [[houten]], [[gouden]], [[open]], [[eigen]] gibi malzeme ve köken sıfatları) hiçbir zaman [[-e]] eki almaz. Ayrıca sıfat bir fiilden sonra (örneğin [[zijn]] veya [[worden]]) gelip isimden önce değilse (yüklem konumu), hiçbir [[-e]] almaz.","list":["[[een houten tafel]] (tahta bir masa) - -e eki yok","[[de open deur]] (açık kapı) - -e eki yok"],"ex":["O ev güzel.","O araba hızlı."],"tip":"Farkı hatırlayın: [[een mooi huis]] (isimden önce, belirsiz het-woord, -e eki yok) karşısında [[Het huis is mooi]] (yüklem konumu, her zaman -e eki yok)."}],"ex":[{"q":"Hangi seçenek doğrudur? (de-woord: de auto)","options":["een groot auto","een grote auto","een groote auto"],"exp":"[[auto]] bir de-woord olduğu için sıfat her zaman [[-e]] eki alır: [[grote]]."},{"q":"Hangi seçenek doğrudur? (het-woord: het huis, belirsiz tanımlıkla)","options":["een groot huis","een grote huis"],"exp":"[[huis]] bir het-woord olduğu ve [[een]] (belirsiz tanımlık) ile geldiği için sıfat [[-e]] eki almaz: [[groot]]."},{"q":"Hangi seçenek doğrudur?","options":["het grote huis","het groot huis","het grootehuis"],"exp":"[[huis]], belirli tanımlık [[het]] ile geldiği için sıfat [[-e]] eki alır: [[grote]]."},{"exp":"[[fiets]] bir de-woord olduğu için sıfat her zaman [[-e]] eki alır."},{"exp":"[[probleem]] bir het-woord olduğu ve [[een]] ile geldiği için sıfat [[-e]] eki almaz."},{"exp":"Çoğul halde sıfat her zaman [[-e]] eki alır, het-woord için de geçerlidir."},{"q":"Doğru sıralama: «Güzel ev denizin kenarında» (het huis)","exp":"[[huis]], belirli tanımlık [[het]] ile geldiği için sıfat [[-e]] eki alır: [[mooie]]."},{"q":"Doğru sıralama: «Onun hızlı bir arabası var» (de auto)","exp":"[[auto]] bir de-woord olduğu için sıfat her zaman [[-e]] eki alır: [[snelle]]."}]},"a2-vergelijking":{"title":"Sıfat dereceleri (karşılaştırma)","sum":"Karşılaştırma için sıfata [[-er]], üstünlük derecesi için [[-st]] eklenir; [[dan]] \"-den/-dan\" anlamında ve [[net zo ... als]] eşitlik ifadesi için kullanılır.","blocks":[{"h":"Sıfatın üç derecesi","p":"Hollandacada sıfatın üç derecesi vardır: normal hal (positief), karşılaştırma derecesi (comparatief) ve üstünlük derecesi (superlatief).","table":{"head":["Derece","Örnek"],"rows":[["Normal","mooi"],["Karşılaştırma (-er)","mooier"],["Üstünlük (-st)","mooist"]]}},{"h":"Karşılaştırma derecesinin oluşumu","p":"Karşılaştırma derecesini oluşturmak için sıfatın sonuna [[-er]] eklenir. Başka bir şeyle karşılaştırmak için ardından (\"-den/-dan\" anlamında) [[dan]] kullanılır. Sıfat kendisi [[-r]] ile bitiyorsa [[-der]] eklenir.","ex":["Amsterdam, Utrecht'ten daha büyük.","Bu araba o arabadan daha pahalı.","Abim benden daha büyük (yaşlı)."]},{"h":"Üstünlük derecesinin oluşumu","p":"Üstünlük derecesi için sıfatın sonuna [[-st]] eklenir ve her zaman [[de]] veya [[het]] tanımlığıyla birlikte kullanılır. Uzun sıfatlar veya [[-s]] ile bitenler genellikle [[meest]] ile oluşturulur.","ex":["Bu, Hollanda'nın en güzel şehri.","O, tanıdığım en ilginç kişi."],"tip":"Üstünlük derecesinden sonra [[dan]] yerine [[van]] kullanılır: [[de mooiste van de klas]] (sınıfın en güzeli)."},{"h":"Kuralsız sıfatlar","p":"Sık kullanılan birkaç sıfat, karşılaştırmada kuralsız bir şekle sahiptir ve bunların ayrıca ezberlenmesi gerekir.","table":{"head":["Normal","Karşılaştırma","Üstünlük"],"rows":[["goed","beter","beste"],["veel","meer","meest"],["weinig","minder","minst"],["graag","liever","liefst"]]}},{"h":"Eşitlik: net zo ... als","p":"İki şey arasındaki eşitliği ifade etmek için [[net zo + sıfat + als]] veya [[even + sıfat + als]] yapısı kullanılır, \"...kadar aynı derecede\" anlamına gelir.","ex":["O, kardeşi kadar uzun.","Bu alıştırma, öncekiyle aynı derecede zor."]}],"ex":[{"q":"[[groot]] sıfatının karşılaştırma hali hangisidir?","options":["grootter","groter","grootser"],"exp":"Karşılaştırma hali [[-er]] eklenerek oluşur: [[groter]]."},{"q":"Hangi cümle doğrudur?","options":["Zij is mooier dan haar zus.","Zij is mooier als haar zus.","Zij is mooier van haar zus."],"exp":"Karşılaştırma halinden sonra karşılaştırma için [[als]] değil [[dan]] kullanılır."},{"q":"[[goed]] sıfatının üstünlük hali hangisidir?","options":["goedste","beste","meeste"],"exp":"[[goed]] kuralsız bir sıfattır: karşılaştırma [[beter]], üstünlük [[beste]]."},{"exp":"[[duur]]'un karşılaştırma hali, kendisi -r ile bittiği için [[-der]] eklenerek oluşur: [[duurder]]."},{"exp":"Üstünlük hali [[-st]] eklenerek oluşur: [[mooiste]]."},{"exp":"[[net zo ... als]] eşitlik yapısında sıfattan sonra [[als]] kelimesi gelir."},{"q":"Doğru sıralama: «Amsterdam, Utrecht'ten daha büyük»","exp":"Karşılaştırma yapısı: fiil [[is]], karşılaştırma sıfatı [[groter]] ve ardından [[dan]] + karşılaştırılan şey."},{"q":"Doğru sıralama: «Bu, caddenin en güzel evi»","exp":"Üstünlük hali her zaman bir tanımlıkla gelir ve ardından grubu belirtmek için [[van]] kullanılır."}]},"a2-voegwoorden":{"title":"Bağlaçlar: eşgüdümlü ve bağımlı","sum":"[[en]], [[maar]], [[want]] gibi eşgüdümlü bağlaçlar cümlenin sırasını değiştirmez, ancak [[omdat]] ve [[als]] gibi bağımlı bağlaçlar fiili cümlenin sonuna taşır.","blocks":[{"h":"İki tür bağlaç","p":"Hollandacada iki ana bağlaç türü vardır: kelime sırasını değiştirmeden iki bağımsız cümleyi birbirine bağlayan **eşgüdümlü** (nevenschikkend) bağlaçlar, ve bir cümleyi ana cümleye bağımlı kılıp fiili o cümlenin sonuna taşıyan **bağımlı** (onderschikkend) bağlaçlar."},{"h":"Eşgüdümlü bağlaçlar","p":"En önemli eşgüdümlü bağlaçlar [[en]] (ve), [[maar]] (ama), [[of]] (veya), [[want]] (çünkü) ve [[dus]] (bu yüzden)'dur. Bu bağlaçlardan sonra normal cümle sırası (özne + fiil) korunur.","ex":["Evde kalıyorum, çünkü nezle oldum.","O çok çalışıyor, bu yüzden yorgun."],"tip":"[[want]] ve [[omdat]] her ikisi de \"çünkü\" anlamına gelse de, [[want]] cümlenin sırasını değiştirmez, ancak [[omdat]] fiili cümlenin sonuna taşır. Bu, öğrencilerin en yaygın hatalarından biridir."},{"h":"Bağımlı bağlaçlar","p":"[[omdat]] (çünkü), [[als]] (eğer/-dığında), [[terwijl]] (iken), [[hoewel]] (gerçi/her ne kadar), [[voordat]] (-den önce) ve [[nadat]] (-den sonra) gibi bağımlı bağlaçlar, kendilerinden sonra gelen cümleyi, içinde çekimli fiilin cümlenin sonuna gittiği bir **yan cümleye** dönüştürür.","ex":["Nezle olduğum için evde kalıyorum.","Yağmur yağmasına rağmen bisiklete gidiyoruz."]},{"h":"Yan cümle önce geldiğinde","p":"Yan cümle, tüm cümlenin başında gelirse, ondan sonraki ana cümle **devrik sıralama** (özneden önce fiil) ile başlar.","ex":["Nezle olduğum için evde kalıyorum.","Yağmur yağarsa içeride kalırız."],"tip":"Bu durumda ana cümlenin fiilinin ([[blijf]]/[[blijven]]) virgülden hemen sonra ve özneden önce geldiğine dikkat edin."},{"h":"Sık kullanılan bağlaçların listesi","p":"Aşağıda A2 seviyesinde çok yaygın olan en sık kullanılan eşgüdümlü ve bağımlı bağlaçların bir listesini görüyorsunuz.","list":["Eşgüdümlü: [[en]] (ve), [[maar]] (ama), [[of]] (veya), [[want]] (çünkü), [[dus]] (bu yüzden)","Bağımlı: [[omdat]] (çünkü), [[als]] (eğer/-dığında), [[terwijl]] (iken), [[hoewel]] (gerçi)","Bağımlı: [[voordat]] (-den önce), [[nadat]] (-den sonra), [[totdat]] (-e kadar), [[zodat]] (öyle ki)"]}],"ex":[{"q":"Hangi bağlaç fiili cümlenin sonuna taşır?","options":["want","en","omdat"],"exp":"[[omdat]] bağımlı bir bağlaçtır ve fiili yan cümlenin sonuna taşır."},{"q":"Doğru cümleyi seçin.","options":["Ik blijf thuis want het regent.","Ik blijf thuis omdat het regent, en ik niet uitga.","Ik blijf thuis, omdat regent het."],"exp":"[[want]] (eşgüdümlü bağlaç)'tan sonra normal cümle sırası korunur: özne [[het]], fiil [[regent]]'ten önce gelir."},{"q":"Hangi cümle doğru sıralamaya sahiptir?","options":["Omdat ik ziek ben, ik blijf thuis.","Omdat ik ziek ben, blijf ik thuis.","Ik blijf omdat ziek ben ik thuis."],"exp":"Yan cümle önce geldiğinde, ana cümle devrik sıralama (özneden önce fiil) ile başlar: [[blijf ik]]."},{"exp":"Cümle sırasını değiştirmeden bir sebep belirtmek için eşgüdümlü bağlaç [[want]] kullanılır."},{"exp":"[[als]] \"eğer/-dığında\" anlamına gelir ve bir yan cümle oluşturur; ardından gelen ana cümlenin fiili devrik sırayla gelir."},{"exp":"[[dus]] (bu yüzden) sonucu ifade eder ve normal cümle sırasını korur."},{"q":"Doğru sıralama: «Nezle olduğum için evde kalıyorum»","exp":"[[omdat]]'tan sonra fiil [[ben]] yan cümlenin sonuna gider."},{"q":"Doğru sıralama: «Yağmur yağmasına rağmen bisiklete gidiyoruz»","exp":"Yan cümle [[hoewel]] ile başlar ve fiili ([[regent]]) sonuna gider; ardından ana cümle devrik sıralamayla ([[gaan we]]) gelir."}]},"a2-er":{"title":"er kullanımları","sum":"Hollandacadaki [[er]] kelimesinin birkaç kullanımı vardır: bir şeyin varlığı ([[er is/zijn]]), edat yerine kullanım ([[erover]], [[ermee]]), yere işaret etme ve sayı/miktarlarla birlikte kullanım.","blocks":[{"h":"er'e genel bakış","p":"[[er]], öğrenciler için Hollandacanın en zor ve en sık kullanılan kelimelerinden biridir, çünkü birbirinden tamamen farklı birkaç işlevi vardır. Bu derste onun dört ana kullanımını göreceğiz.","list":["Bir şeyin varlığı: [[Er is een probleem.]]","Edat + nesne yerine kullanım: [[erover]], [[ermee]]","Yere işaret etme (vurgusuz): [[Ik kom er net vandaan.]]","Sayı veya miktarla birlikte: [[Ik heb er twee.]]"]},{"h":"Varlık için er (existentieel er)","p":"Bir şeyin **var olduğunu** söylemek istediğimizde ve cümlenin öznesi belirsizse ([[een]] ile veya tanımlıksız), cümlenin başında [[er is]] (tekil için) veya [[er zijn]] (çoğul için) kullanırız.","ex":["Arabayla ilgili bir sorun var.","Sokakta çok fazla insan var."],"tip":"Özne belirliyse ([[de]] veya [[het]] ile), genellikle [[er]] kullanılmaz: [[De auto staat voor de deur.]]"},{"h":"er + edat","p":"Bir şeye (bir kişiye değil) edatla atıfta bulunduğumuzda, [[over het]], [[met het]] ve benzerleri yerine, [[er]] edatla birleşir: [[erover]], [[ermee]], [[erin]], [[erop]], [[eraan]].","ex":["Onun hakkında düşünüyorum.","Ona başladın mı?"],"tip":"Kişilere atıfta bulunurken [[er]] kullanılmaz; onun yerine zamir + edat kullanılır: bir kişi kastedildiğinde [[ermee]] değil [[met hem]] deriz."},{"h":"Yere işaret olarak er","p":"[[er]], daha önce bahsedilmiş bir yere işaret etmek için [[daar]] (vurgusuz) yerine kullanılabilir.","ex":["Hâlâ Utrecht'te mi yaşıyorsun? Evet, orada on yıldır yaşıyorum.","Oradan az önce geldim."]},{"h":"Sayı veya miktarla birlikte er","p":"Bir şeyin sayısına veya miktarına ismi tekrarlamadan atıfta bulunduğumuzda, [[er]]'i sayı veya miktar kelimeleriyle (örneğin [[veel]], [[weinig]]) birlikte kullanırız.","ex":["Erkek veya kız kardeşin var mı? Evet, iki tane var.","Yeterince var."]}],"ex":[{"q":"Bir şeyin varlığını ifade etmek için hangi cümle doğrudur?","options":["Er is een probleem.","Het is een probleem.","Er een probleem is."],"exp":"Belirsiz bir özneyle bir şeyin varlığını ifade etmek için cümle [[Er is]] / [[Er zijn]] ile başlar."},{"q":"[[over het boek]]'ün yerine hangi şekil doğrudur?","options":["erboek","overhet","erover"],"exp":"Bir şeye (kişiye değil) edatla atıfta bulunduğumuzda, [[er]] ve edat birleşir: [[erover]]."},{"q":"«Heb je kinderen?» sorusuna sayıyla verilen doğru cevap hangisidir?","options":["Ja, ik heb twee er.","Ja, ik heb er twee.","Ja, ik er heb twee."],"exp":"er'in sayıyla kullanımında, [[er]] fiilden sonra ve sayıdan önce gelir: [[ik heb er twee]]."},{"exp":"Belirsiz çoğul bir özneyle bir şeyin varlığını ifade etmek için cümle [[Er zijn]] ile başlar."},{"exp":"[[er]]'in [[over]] edatıyla birleşimi [[erover]]'dır."},{"exp":"Bir şeyin miktarına ismi tekrarlamadan atıfta bulunmak için [[er]] kullanılır: [[ik heb er niet genoeg]]."},{"q":"Doğru sıralama: «Büyük bir sorun var»","exp":"Cümle, bir şeyin varlığını ifade etmek için [[Er is]] ile başlar ve ardından belirsiz özne gelir."},{"q":"«Kaç kitabın var?» sorusuna cevabın doğru sıralaması: «Üç tane var»","exp":"Sayı hakkındaki soruya cevapta, [[er]] fiilden sonra ve sayıdan önce gelir."}]},"a2-gebiedende-wijs":{"title":"Emir cümlesi","sum":"Emir cümlesi kurmak için genellikle fiilin kökü (ik-vorm) öznesiz kullanılır; nazik hitap için fiil [[u]] ile birlikte gelir.","blocks":[{"h":"Basit emir cümlesinin kuruluşu","p":"Birine (jij/je) emir vermek için sadece **fiilin kökü** (yani [[ik]] için kullanılan şekil) kullanılır ve özne genellikle söylenmez.","ex":["Buraya gel!","İyi dinle!","Kitabı bana ver."],"tip":"Ayrılabilir fiillerde, önek emir cümlesinin sonuna gider: [[Sta op!]] (Kalk!)."},{"h":"Olumsuz emir cümlesi","p":"Olumsuz emir için [[niet]], fiilden önce veya cümlede uygun bir yerde gelir; isimler için [[geen]] kullanılır.","ex":["Bu kadar hızlı yürüme!","Merak etme.","Geç gelme!"]},{"h":"u ile nazik hitap","p":"[[u]] ile hitap edilen birine nazik bir emir veya rica için, fiil üçüncü tekil şahıs şeklini ([[-t]] ile) alır ve [[u]] onun ardından gelir.","ex":["Buyurun içeri.","Buyurun oturun.","Buyurun oturun / yerinizi alın."]},{"h":"wilt u / kunt u ile nazik rica","p":"Günlük dilde, doğrudan emir cümlesi yerine, nazik bir rica için genellikle cümlenin sonunda mastarla birlikte [[Wilt u...]] veya [[Kunt u...]] kullanılır.","ex":["Burada biraz bekleyebilir misiniz?","Kapıyı kapatabilir misiniz?"],"tip":"Bu rica şekli, günlük konuşmada [[u]] ile doğrudan emir cümlesinden çok daha nazik ve yaygındır."},{"h":"Sık kullanılan emir ifadeleri","p":"Günlük hayatta ve tabelalarda sık görülen, sabit ve çok yaygın birkaç emir ifadesi vardır.","list":["[[Pas op!]] = Dikkat et!","[[Let op!]] = Dikkat!","[[Niet roken]] = Sigara içilmez (tabelada)","[[Wacht even.]] = Bir an bekle."]}],"ex":[{"q":"jij için [[komen]] fiilinin doğru emir hali hangisidir?","options":["Jij komt!","Kom!","Komen!"],"exp":"Basit emir cümlesi, fiilin kökünden (ik şekli) oluşturulur ve özne söylenmez: [[Kom!]]"},{"q":"Doğru nazik emir cümlesi hangisidir?","options":["U komt binnen.","Komt u binnen.","Komen u binnen."],"exp":"Nazik emir cümlesinde, [[-t]] ile biten fiil [[u]]'dan önce gelir: [[Komt u binnen]]."},{"q":"Doğru olumsuz emir cümlesi hangisidir?","options":["Niet loop zo snel!","Loop niet zo snel!","Loop zo snel niet!"],"exp":"Olumsuz emir cümlesinde [[niet]], fiil ve zarftan sonra gelir: [[Loop niet zo snel!]]"},{"exp":"Basit emir cümlesi fiilin köküyle oluşturulur: [[Kom]]."},{"exp":"[[Maak je geen zorgen]] sabit ifadesi \"merak etme\" anlamına gelir."},{"exp":"[[Wilt u...]] ile nazik ricada, asıl fiilin mastar hali cümlenin sonuna gelir."},{"q":"Doğru sıralama: «Kalk!» (jij'e)","exp":"Ayrılabilir fiil [[opstaan]], emir cümlesinde de ayrılır: [[Sta op!]]"},{"q":"Doğru sıralama: «Buyurun oturun» (nazik)","exp":"Nazik emir cümlesi: [[-t]] ile fiil ([[Gaat]]), ardından [[u]], ardından cümlenin kalanı."}]},"a2-aanwijzende-voornaamwoorden":{"title":"İşaret zamirleri","sum":"Yakındaki bir şeye işaret etmek için [[deze]] (de-woord/çoğul) ve [[dit]] (het-woord), uzaktaki bir şeye işaret etmek için [[die]] (de-woord/çoğul) ve [[dat]] (het-woord) kullanılır.","blocks":[{"h":"İşaret zamirlerinin genel tablosu","p":"Hollandacadaki işaret zamirleri iki şeye bağlıdır: **uzaklık** (yakın veya uzak) ve **ismin cinsi** (de-woord veya het-woord), ayrıca tekil veya çoğul olması.","table":{"head":["Uzaklık","de-woord tekil","het-woord tekil","Çoğul (her iki cins)"],"rows":[["Yakın","deze","dit","deze"],["Uzak","die","dat","die"]]}},{"h":"deze ve dit (yakın)","p":"[[deze]], yakındaki tekil bir **de-woord**'a işaret etmek için, [[dit]] ise yakındaki tekil bir **het-woord**'a işaret etmek için kullanılır.","ex":["Bu araba yeni.","Bu ev çok eski."]},{"h":"die ve dat (uzak)","p":"[[die]], uzaktaki tekil bir **de-woord**'a (veya herhangi bir çoğul isme) işaret etmek için, [[dat]] ise uzaktaki tekil bir **het-woord**'a işaret etmek için kullanılır.","ex":["Oradaki araba komşuma ait.","Caddenin sonundaki o ev satılık."]},{"h":"Çoğul hali","p":"Çoğul halde, asıl ismin de-woord veya het-woord olması önemli değildir: yakın için her zaman [[deze]], uzak için her zaman [[die]] kullanılır.","ex":["Bu kitaplar benim.","O evler çok pahalı."]},{"h":"Bağımsız zamir olarak kullanım","p":"İşaret zamirleri isimsiz, tek başlarına ve çoğunlukla [[zijn]] fiiliyle birlikte kullanılabilir; bu kullanımda [[dit]] ve [[dat]] çok yaygındır ve sonraki isim çoğul olsa bile [[dat]] kullanılabilir.","ex":["Bu benim kardeşim.","Bu (o) güzel!","Onlar benim annem ve babam."],"tip":"[[Dat zijn mijn ouders]] cümlesinde, [[ouders]] çoğul olmasına rağmen, [[die]] değil [[dat]] kullanılır, çünkü bu kullanımda genel bir tanıtım işlevi görür, isme tam bir işaret sıfatı olarak değil."}],"ex":[{"q":"Yakındaki bir de-woord'a işaret etmek için hangi zamir doğrudur?","options":["dit","deze","dat"],"exp":"Yakındaki tekil de-woord için doğru zamir [[deze]]'dir."},{"q":"Uzaktaki bir het-woord'a işaret etmek için hangi zamir doğrudur?","options":["die","dat","deze"],"exp":"Uzaktaki tekil het-woord için doğru zamir [[dat]]'tır."},{"q":"Hangi cümle doğrudur? (het boek)","options":["Deze boek is interessant.","Dit boek is interessant.","Die boek is interessant."],"exp":"[[boek]] tekil bir het-woord olduğu ve yakındaki bir şeye işaret ettiğimiz için doğru zamir [[dit]]'tir."},{"exp":"Yakındaki tekil het-woord için doğru zamir [[dit]]'tir."},{"exp":"Çoğul halde uzaktaki bir şey için her zaman [[die]] kullanılır, de-woord veya het-woord olması önemli değildir."},{"exp":"Bağımsız tanıtımda hem [[Dit]] (yakındaki bir şey/kişi için) hem de [[Dat]] (biraz daha uzaktaki bir şey/kişi için) doğrudur."},{"q":"Doğru sıralama: «Bu araba yeni» (de auto, yakın)","exp":"[[auto]] bir de-woord olduğu ve yakın olduğu için doğru zamir [[deze]]'dir."},{"q":"Doğru sıralama: «O ev satılık» (het huis, uzak)","exp":"[[huis]] bir het-woord olduğu ve uzak olduğu için doğru zamir [[dat]]'tır."}]},"b1-voltooid-verleden-tijd":{"title":"Geçmişten önceki geçmiş zaman (Voltooid Verleden Tijd)","sum":"[[Voltooid Verleden Tijd]], **had** veya **was** + üçüncü hal (deelwoord) ile oluşturulur ve geçmişteki başka bir andan önce gerçekleşmiş bir olayı anlatmak için kullanılır.","blocks":[{"h":"Fiil yapısı","p":"Hollandaca'da bu zaman iki bölümden oluşur: yardımcı fiil **had/hadden** veya **was/waren** + [[voltooid deelwoord]] (üçüncü hal/fiilin üçüncü biçimi). [[had]] ve [[was]] arasındaki seçim, tam olarak yakın geçmiş zamanda (voltooid tegenwoordige tijd) [[heb]] ve [[ben]] arasındaki seçimle aynıdır: hareket ve durum değişikliği bildiren fiiller [[zijn]] ile, diğerleri [[hebben]] ile çekimlenir.","table":{"head":["Özne","hebben fiilleri","zijn fiilleri"],"rows":[["ik","had gewerkt","was gegaan"],["jij/u","had gewerkt","was gegaan"],["hij/zij","had gewerkt","was gegaan"],["wij/jullie/zij","hadden gewerkt","waren gegaan"]]},"ex":["Onu daha önce yapmıştım.","Onlar daha önce gitmişlerdi."],"tip":"[[blijven]], [[worden]], [[gebeuren]] gibi fiiller de [[hebben]] ile değil, [[zijn]] ile çekimlenir."},{"h":"Kullanım: geçmişten önceki geçmiş","p":"[[voltooid verleden tijd]], geçmişte başka bir andan önce yapılmış bir şeyi anlatmak istediğimizde kullanılır. Bu zaman Türkçedeki -mişti'li geçmiş zamana karşılık gelir: geçmişte bir nokta vardır (basit [[verleden tijd]] ile) ve ondan daha önce gerçekleşmiş bir olay vardır ([[voltooid verleden tijd]] ile).","ex":["İstasyona geldiğimde, tren daha önce hareket etmişti.","Daha önce hiç Paris'te bulunmadığını söyledi.","Yemeğimizi yemiş olduktan sonra yürüyüşe çıktık."]},{"h":"Yaygın işaret kelimeleri","p":"[[al]] (daha önce/çoktan), [[nog niet]] (henüz değil), [[net]] (az önce), [[voordat]] (-den önce) ve [[nadat]] (-den sonra) gibi kelimeler genellikle bu zamanla birlikte kullanılır ve iki geçmiş olay arasındaki zamansal ilişkiyi belirtir.","list":["[[al]] = daha önce, o zamana kadar","[[nog niet]] = henüz ... değil","[[net]] = az önce, demin (geçmişte)","[[voordat]]/[[nadat]] = -den önce / -den sonra"]},{"h":"Yan cümlelerde kelime sırası","p":"[[voltooid verleden tijd]] bir yan cümlede ([[toen]], [[nadat]], [[voordat]], [[omdat]]'den sonra) kullanıldığında, yardımcı fiil ([[had]]/[[was]]) yan cümlenin sonuna taşınır ve üçüncü halden sonra yer alır: **...omdat hij het geld niet had meegenomen.**","ex":["Mutluydum çünkü sonunda diplomamı almıştım.","Şiddetli yağmur yağmış olduğu için yol ıslaktı."],"tip":"Yan cümlede yardımcı fiil her zaman üçüncü halden sonra ve cümlenin en sonunda gelir: [[...dat hij het niet gezien had]] (had gezien değil)."}],"ex":[{"q":"Hangi cümle doğru pluperfect (voltooid verleden tijd) yapısını gösterir? (O daha önce gitmişti)","options":["Hij was al gegaan.","Hij had al gegaan.","Hij is al gegaan.","Hij ging al."],"exp":"[[gaan]] bir hareket fiilidir ve [[zijn]] ile çekimlenir, bu nedenle doğru biçim [[was gegaan]]'dır."},{"exp":"[[beginnen]] fiili [[zijn]] ile çekimlenir ve özne tekil (de film) olduğu için yardımcı fiil [[was]]'tır."},{"q":"Boşluğu doğru seçenekle doldurun: Ik ___ het boek al gelezen voordat de film uitkwam.","options":["had","was","heb","ben"],"exp":"[[lezen]] fiili [[hebben]] ile çekimlenir, bu nedenle bu zamandaki (voltooid verleden tijd) biçimi [[had gelezen]]'dır."},{"exp":"[[worden]] fiili [[zijn]] ile çekimlenir; tekil dişi özne (zij) → [[was]]."},{"q":"«Ben geldiğimde o daha önce gitmişti» cümlesini kurmak için kelimelerin doğru sırasını bulun.","exp":"Yapı: özne + was + al + üçüncü hal + toen + yan cümle. Yardımcı fiil [[was]]'tır çünkü [[vertrekken]] zijn ile çekimlenir."},{"q":"Hangi cümle «o ana kadar hiç Paris'te bulunmamıştı» ifadesini doğru şekilde anlatır?","options":["Hij was nog nooit in Parijs geweest.","Hij is nog nooit in Parijs geweest.","Hij was nog nooit in Parijs.","Hij heeft nog nooit in Parijs geweest."],"exp":"Geçmişte başka bir andan önce geçerli olan bir olay için [[was ... geweest]] (zijn fiilinin bu zamandaki hali) kullanılır."},{"exp":"Çoğul özne (ze/zij) yardımcı fiil [[hadden]] ile kullanılır; [[eten]] fiili [[hebben]] ile çekimlenir."},{"q":"«Ik had het gedaan» ile «Ik heb het gedaan» arasındaki fark nedir?","options":["Birincisi, bir işin geçmişte başka bir andan önce yapıldığını gösterir; ikincisi ise sadece bir işin geçmişte (şimdiye kadar) yapıldığını söyler.","Aralarında hiçbir fark yoktur.","Birincisi gelecek zaman içindir.","İkincisi bu zamandaki (voltooid verleden tijd) yapıdır."],"exp":"[[had gedaan]], geçmişten önceki geçmiş zamandır (voltooid verleden tijd); [[heb gedaan]] ise şimdiki zamanla ilişkili olan yakın geçmiş zamandır (voltooid tegenwoordige tijd)."},{"exp":"[[geboren worden]] fiili [[zijn]] ile çekimlenir; tekil özne (ik) → [[was]]."}]},"b1-betrekkelijke-bijzinnen":{"title":"İlgi cümleleri (die/dat/waar/wie)","sum":"İlgi cümleleri, [[die]], [[dat]], [[waar + edat]] ve (kişiler için) [[edat + wie]] kullanılarak önceki ismi açıklar.","blocks":[{"h":"die mi, dat mı?","p":"İlgi cümlesi kurmak için, atıfta bulunduğumuz ismin cinsine göre [[die]] veya [[dat]] kullanırız: isim bir [[de-woord]] ise (veya çoğulsa) [[die]] kullanılır; isim tekil bir [[het-woord]] ise [[dat]] kullanılır.","table":{"head":["İsim türü","İlgi zamiri","Örnek"],"rows":[["de-woord (tekil)","die","de man die..."],["het-woord (tekil)","dat","het boek dat..."],["Çoğul (de veya het)","die","de boeken die..."]]},"ex":["Orada duran adam, benim komşumdur.","Satın aldığımız ev çok eski."],"tip":"İlgi cümlesinde fiil her zaman cümlenin sonuna gider: [[het boek dat ik gisteren gekocht heb]]."},{"h":"Nesneler için waar + edat","p":"İlgi cümlesi bir edatla birlikte bir nesneye veya kavrama (kişiye değil) atıfta bulunduğunda, [[die/dat]] yerine [[waar + edat]] birleşimi kullanılır: [[waarmee]] (ki onunla), [[waarover]] (ki onun hakkında), [[waarin]] (ki onun içinde) gibi.","ex":["Bu, yazdığım kalemdir.","Hakkında konuştuğumuz kitap çok ünlü."],"list":["[[waarmee]] = ki onunla","[[waarover]] = ki onun hakkında","[[waarin]] = ki onun içinde","[[waarop]] = ki onun üzerinde / ki onu bekleyen"]},{"h":"Edattan sonra kişiler için wie","p":"Kişiler için bir edat söz konusu olduğunda, [[waar]] yerine [[edat + wie]] kullanılır, [[die]] değil: **de vrouw met wie ik praatte** (konuştuğum kadın). Edat, waar'daki gibi sonrasında değil, [[wie]]'den önce gelir.","ex":["Birlikte çalıştığım meslektaş çok naziktir.","Kendisine söylediğim arkadaşım Utrecht'te yaşıyor."],"tip":"Günlük dilde bazen başka yapılar da duyulur, ancak resmî yazıda en doğru biçim [[edat + wie]]'dir."},{"h":"Belirli bir öncül olmadan ilgi cümlesi (wat)","p":"İlgi cümlesi belirli bir isme değil, bütün bir cümleye veya genel bir kavrama atıfta bulunduğunda, ya da [[alles]], [[iets]], [[niets]] gibi belirsiz zamirlerden sonra geldiğinde, [[dat]] yerine [[wat]] kullanılır.","ex":["Bu, bildiğim her şey.","Bilmediğim hiçbir şey söylemedi."]}],"ex":[{"q":"Hangi ilgi zamiri doğrudur? «De fiets ___ ik gekocht heb, is kapot.»","options":["die","dat","wat","wie"],"exp":"[[fiets]] bir de-woord'dur, bu nedenle ilgi zamiri [[die]]'dır."},{"q":"«Het kind ___ daar speelt, is mijn zoon.» Hangi seçenek doğrudur?","options":["dat","die","wat","waar"],"exp":"[[kind]] bir het-woord'dur, bu nedenle dilbilgisi kuralına göre ilgi zamiri [[dat]]'tır (bir kişiye atıfta bulunsa da)."},{"exp":"[[werken met]] fiili [[met]] edatını alır, bu nedenle doğru birleşim [[waarmee]]'dir (sadece waar değil)."},{"q":"Hangi cümle doğrudur? (Kendisiyle sinemaya gittiğim arkadaş)","options":["De vriend met wie ik naar de bioscoop ging.","De vriend waarmee ik naar de bioscoop ging.","De vriend die ik mee naar de bioscoop ging.","De vriend wie ik naar de bioscoop ging."],"exp":"Edattan sonra kişiler için [[edat + wie]] kullanılır, [[waar]] değil (çünkü waar sadece nesneler/kavramlar içindir)."},{"exp":"[[alles]] gibi belirsiz zamirlerden sonra [[dat]] değil, [[wat]] kullanılır."},{"q":"«Okuduğum kitap çok ilginç» cümlesi için kelimelerin doğru sırasını bulun.","exp":"İlgi cümlesinin fiili ([[lees]]) o bölümün sonuna gider; [[boek]] bir het-woord olduğu için ilgi zamiri [[dat]]'tır."},{"q":"«Dit is het probleem ___ ik over praat.» Hangi seçenek?","options":["waarover","waarin","die","wat"],"exp":"[[praten over]] fiili [[over]] edatını alır, bu nedenle [[waarover]] birleşimi doğrudur."},{"exp":"[[mensen]] çoğuldur, bu nedenle ilgi zamiri her zaman [[die]]'dır (tekili het-woord olsa da)."},{"q":"«De vrouw aan wie ik het boek gaf» cümlesinde neden die değil wie kullanılmış?","options":["Çünkü ilgi zamirinden önce bir edat (aan) geliyor ve bir kişiye atıfta bulunuluyor.","Çünkü vrouw çoğuldur.","Çünkü wie her zaman die yerine kullanılır.","Hiçbir nedeni yok, ikisi de doğrudur."],"exp":"İlgi cümlesi bir kişiye atıfta bulunuyorsa ve ilgi zamirinden önce bir edat gerekiyorsa, die değil [[edat + wie]] kullanılmalıdır."}]},"b1-te-infinitief":{"title":"te + mastar yapısı (te + infinitief)","sum":"Bazı Hollandaca fiiller ve ifadeler, ikinci fiilin [[te + infinitief]] biçiminde gelmesini gerektirir; [[proberen te]], [[beginnen te]] ve [[om ... te]] yapısı gibi.","blocks":[{"h":"Amaç belirtmek için om...te yapısı","p":"[[om ... te + infinitief]] yapısı, bir işin amacını veya niyetini belirtmek için kullanılır ve Türkçedeki «...için/...mek amacıyla» ifadesine karşılık gelir. [[om]] bu bölümün başında gelir, mastar fiil ise [[te]] ile birlikte sonda yer alır.","ex":["Hollanda'da çalışabilmek için Hollandaca öğreniyorum.","Bir ev almak için para biriktiriyor."],"tip":"Bu yapıda iki fiil olduğunda (kunnen werken gibi), te yalnızca ana fiilden/ikinci mastardan önce gelir: om te kunnen werken."},{"h":"Sonrasında te + infinitief gelen fiiller","p":"Bazı fiiller her zaman ikinci fiilden önce [[te]] ile birlikte kullanılır: [[proberen te]] (denemek/çalışmak), [[beginnen te]] (başlamak), [[hoeven te]] (gerekmemek), [[vergeten te]] (unutmak) ve [[besluiten te]] (karar vermek) gibi.","list":["[[proberen te]] = denemek, çalışmak","[[beginnen te]] = başlamak","[[hoeven te]] = gerekmemek (olumsuz cümlelerde)","[[vergeten te]] = unutmak","[[besluiten te]] = karar vermek"],"ex":["Her gün spor yapmaya çalışıyorum.","Annesini aramayı unuttu."]},{"h":"Kip fiilleriyle farkı (te'siz yalın mastar)","p":"[[kunnen]], [[mogen]], [[moeten]], [[willen]], [[zullen]] gibi kip fiillerinden ([[modale werkwoorden]]) sonra, ayrıca [[gaan]], [[blijven]], [[komen]] ve [[laten]]'den sonra, ikinci fiil [[te]] olmadan yalın mastar biçiminde gelir.","table":{"head":["Kategori","Örnek"],"rows":[["te ile","Hij probeert te slapen."],["te'siz (kip fiili)","Hij kan slapen."],["te'siz (gaan/komen/blijven)","Hij gaat slapen."]]},"ex":["Bu akşam erkenden yatmak istiyorum.","Burada beklemeye devam ediyoruz."],"tip":"Yaygın hata: «Hij kan te slapen» denmemeli — kip fiilleri asla te almaz."},{"h":"Olumsuz cümlelerde hoeven te","p":"[[hoeven te]] fiili neredeyse her zaman olumsuz cümlelerde veya [[niet]]/[[geen]] ile birlikte kullanılır ve «gerekmemek» anlamına gelir; bu, «gerekmek/zorunda olmak» anlamına gelen [[moeten]]'in tersidir.","ex":["Bunu yapman gerekmiyor.","Onların yarın çalışmasına gerek yok."]}],"ex":[{"q":"Hangi seçenek doğrudur? «Hij leert elke dag Nederlands ___ beter te spreken.»","options":["om","te","voor","dat"],"exp":"Amaç belirtmek için [[om ... te]] yapısı kullanılır."},{"exp":"[[proberen]] fiili [[te + infinitief]] ile birlikte kullanılır."},{"q":"Hangi cümle dilbilgisi açısından doğrudur?","options":["Hij kan goed zwemmen.","Hij kan goed te zwemmen.","Hij kan te goed zwemmen.","Hij te kan goed zwemmen."],"exp":"Kip fiili [[kunnen]]'den sonra, ikinci fiil [[te]] olmadan yalın mastar biçiminde gelir."},{"exp":"[[hoeven te]] olumsuz cümlede «gerekmemek» anlamına gelir; tekil özne je → hoeft."},{"q":"«Treni kaçırmamak için erken kalktım» cümlesi için kelimelerin doğru sırasını bulun.","exp":"Amaç belirten [[om ... te]] yapısı: mastar fiil [[missen]], [[te]] ile birlikte sonda gelir."},{"q":"Hangi fiilden sonra te gerekmez?","options":["gaan","proberen","beginnen","vergeten"],"exp":"[[gaan]], kip fiilleri gibi te olmadan kullanılır: «Hij gaat slapen.»"},{"exp":"[[vergeten te]] = unutmak, te + infinitief ile birlikte kullanılır."},{"q":"hoeven te ile moeten arasındaki fark nedir?","options":["hoeven te, gerekmemek anlamına gelir (genellikle olumsuz cümlede); moeten ise gereklilik/zorunluluk anlamına gelir.","Aralarında hiçbir fark yoktur.","hoeven te sadece olumlu cümlede kullanılır.","moeten her zaman te ile gelir."],"exp":"[[hoeven te]] genellikle olumsuzlukla «gerekmemek» için, [[moeten]] ise «gerekmek» için kullanılır."},{"exp":"[[besluiten te]] = karar vermek, te + infinitief ile birlikte kullanılır."}]},"b1-voorwaardelijke-wijs":{"title":"Şart kipi (zou/zouden + mastar)","sum":"Hollandaca şart kipi [[zou]]/[[zouden]] + mastar fiil ile oluşturulur ve [[als]] cümleleriyle birlikte gerçek ve gerçek olmayan şartları ifade etmek için kullanılır.","blocks":[{"h":"zou/zouden yapısı","p":"[[zou]] (tekil) ve [[zouden]] (çoğul), şart kipinin yardımcı fiilleridir ve ana fiil mastar biçiminde cümlenin sonunda bunlarla birlikte gelir: **Ik zou dat niet doen.**","table":{"head":["Özne","zou/zouden"],"rows":[["ik, jij/u, hij/zij","zou"],["wij, jullie, zij","zouden"]]},"ex":["Paris'e seyahat etmeyi çok isterdim.","O sorunu başka bir şekilde çözerdik."]},{"h":"Gerçek şart (reële conditie)","p":"Şart gerçekleşebilir ve gerçek olduğunda, [[als]] cümlesi şimdiki zamanla gelir ve ana cümle de şimdiki/gelecek zaman veya emir kipinde olabilir; [[zou]]'ya gerek yoktur.","ex":["Yağmur yağarsa şemsiye alırım.","Vaktin varsa bana yardım edebilirsin."],"tip":"Gerçek şartta yardımcı fiil [[zou]]'ya gerek yoktur; sadece basit şimdiki zaman kullanılır."},{"h":"Gerçek olmayan şart (irreële conditie) ve zou","p":"Gerçek olmayan veya varsayımsal şartlar için (şu anda veya geçmişte gerçekleşmemiş bir şey), [[als]] cümlesi [[verleden tijd]] (basit geçmiş zaman) ile gelir ve ana cümle [[zou/zouden]] + mastar ile oluşturulur.","ex":["Zengin olsaydım bir ev alırdım (ama değilim).","Daha çok vakitleri olsaydı daha sık seyahat ederlerdi."],"tip":"Geçmişle ilgili gerçek olmayan şartlar için [[als]] + geçmişten önceki geçmiş zaman (voltooid verleden tijd) ve [[zou/zouden hebben/zijn]] + üçüncü hal kullanılır: Als ik het geweten had, zou ik anders gehandeld hebben."},{"h":"Fiilin yeri: cümlenin başında veya ortasında als","p":"[[als]] cümlesi cümlenin başında geldiğinde, ondan sonraki ana cümle bir fiille başlar (özne-fiil devrik sırası), çünkü [[als]] cümlesi kendisi birinci sırayı işgal etmiştir.","ex":["Hava güzel olsaydı parka giderdik.","Parka giderdik, hava güzel olsaydı."],"tip":"Her iki sıralama da (als başta veya ortada) doğrudur; sadece als başta geldiğinde fiil virgülden hemen sonra gelmelidir."}],"ex":[{"q":"Gerçek olmayan şart için hangi seçenek doğrudur? «Als ik meer geld ___, zou ik een auto kopen.»","options":["had","heb","had gehad","zou hebben"],"exp":"Gerçek olmayan şartta als cümlesi [[verleden tijd]] (had) ile gelir ve ana cümle [[zou]] + mastar ile oluşturulur."},{"exp":"Bu gerçek bir şarttır (yarın yağmur yağması mümkündür), bu nedenle zou değil basit şimdiki zaman kullanılır."},{"q":"Hangi cümle doğru gerçek olmayan şartı gösterir?","options":["Als ik jou was, zou ik dat niet zeggen.","Als ik jou ben, zal ik dat niet zeggen.","Als ik jou was, zeg ik dat niet.","Als ik jou zou zijn, zeg ik dat niet."],"exp":"Doğru yapı: als + verleden tijd (was) ... zou + infinitief (zou zeggen)."},{"exp":"Çoğul özne (wij), çoğul yardımcı fiil [[zouden]]'e ihtiyaç duyar."},{"q":"«Vaktim olsaydı sana yardım ederdim» cümlesi için kelimelerin doğru sırasını bulun.","exp":"Cümle als ile başladığı için, ana cümle fiille (zou) başlar: özne-fiil devrik sırası."},{"q":"«Als ik het eerder geweten had, ___ ik anders gehandeld hebben.» Hangi seçenek?","options":["zou","had","ben","zal"],"exp":"Geçmişle ilgili gerçek olmayan şart için ana cümle [[zou/zouden]] + hebben/zijn + üçüncü hal ile oluşturulur."},{"exp":"Gerçek şart basit şimdiki zamanla (bent) ifade edilir, çünkü gerçek bir olasılık vardır."},{"q":"«Zou je me kunnen helpen?» cümlesinde neden zou kullanılmış?","options":["Kibar ve dolaylı bir rica yapmak için","Gelecek zamanı ifade etmek için","Genel bir gerçeği ifade etmek için","kunnen fiili her zaman zou ile geldiği için"],"exp":"[[zou]] + kunnen genellikle sadece şart için değil, kibar ricalar oluşturmak için de kullanılır."},{"exp":"Sabit ifade «als ik jou was» (senin yerinde olsaydım), ik öznesi için de [[was]] ile kullanılır."}]},"b1-lijdende-vorm":{"title":"Edilgen çatı (Lijdende Vorm)","sum":"Edilgen çatı, [[worden]] (süreç için) veya [[zijn]] (sonuç/durum için) + üçüncü hal ile oluşturulur; eylemi yapan özne [[door]] ile tanıtılır.","blocks":[{"h":"worden-passief: süreç ve eylem","p":"Bir eylemin yapılmakta olduğunu veya yapıldığını belirtmek için (süreğe odaklanarak), yardımcı fiil olarak [[worden]] + üçüncü hal kullanılır. Bu, Hollandacadaki en yaygın edilgen çatı türüdür.","table":{"head":["Zaman","Yapı","Örnek"],"rows":[["Şimdiki zaman","word(t)/worden + üçüncü hal","Het huis wordt gebouwd."],["Geçmiş zaman","werd(en) + üçüncü hal","Het huis werd gebouwd."]]},"ex":["Bu kitap çok sayıda insan tarafından okunuyor.","Mektup dün gönderildi."],"tip":"Yardımcı fiil [[worden]], cümlenin zamanıyla uyumlu olmalıdır: şimdiki zaman = word/wordt/worden, geçmiş zaman = werd/werden."},{"h":"zijn-passief: sonuç ve durum","p":"Bir eylemin nihai sonucuna odaklanıldığında (sürecin kendisine değil), [[zijn]] + üçüncü hal kullanılır. Bu edilgen çatı türü genellikle önceden tamamlanmış bir durumu tanımlar.","ex":["Bu ev daha önce yapılmış (şu anda bu durumda).","Kapı kapalı (şu anki durum)."],"tip":"Karşılaştırın: [[De deur wordt gesloten]] (şu anda biri kapıyı kapatıyor; süreç) ile [[De deur is gesloten]] (kapı önceden kapatılmış; sonuç)."},{"h":"door ile eylemi yapanın tanıtılması","p":"Edilgen cümlede, eylemi kimin veya neyin yaptığını belirtmek istediğimizde, eylemi yapandan önce [[door]] kullanırız.","ex":["Bu tablo ünlü bir sanatçı tarafından yapıldı.","Bu karar müdür tarafından alınıyor."]},{"h":"Etken cümlenin edilgene çevrilmesi","p":"Etken (active) bir cümleyi edilgene çevirmek için, etken cümlenin nesnesi edilgen cümlenin öznesine dönüşür, fiil [[worden]] + üçüncü hal biçimine değişir ve asıl özne (belirtilirse) [[door]]'dan sonra gelir.","ex":["Aşçı yemeği hazırlıyor. Yemek aşçı tarafından hazırlanıyor."],"tip":"Nesnesi olmayan veya geçişsiz (onovergankelijk) fiiller, örneğin [[slapen]] veya [[komen]], genellikle edilgen yapılamaz."}],"ex":[{"q":"Hangi cümle doğru edilgen (worden-passief) yapıdadır? (Bu ev yapılıyor)","options":["Het huis wordt gebouwd.","Het huis is gebouwd.","Het huis bouwt.","Het huis heeft gebouwd."],"exp":"Şimdiki zamanda süren bir süreç için [[wordt]] + üçüncü hal kullanılır."},{"exp":"worden-passief'te geçmiş zaman için, (tekil) yardımcı fiil [[werd]] kullanılır."},{"q":"«De deur wordt gesloten» ile «De deur is gesloten» arasındaki fark nedir?","options":["Birincisi kapanma sürecinin devam ettiğini gösterir, ikincisi kapalı olma sonucunu/durumunu gösterir.","Aralarında hiçbir fark yoktur.","Birincisi geçmiş zamandır, ikincisi şimdiki zaman.","İkincisi edilgen değildir."],"exp":"[[wordt]] = süreç için worden-passief; [[is]] = nihai sonuç/durum için zijn-passief."},{"exp":"Tekil özne (dit gebouw) + şimdiki zaman → [[wordt]]."},{"q":"«Bu kitap milyonlarca kişi tarafından okunuyor» cümlesi için kelimelerin doğru sırasını bulun.","exp":"Edilgen yapı: yeni özne + wordt + (door + asıl özne) + üçüncü hal."},{"q":"«De regering neemt de beslissing.» etken cümlesini edilgene çevirin.","options":["De beslissing wordt door de regering genomen.","De regering wordt de beslissing genomen.","De beslissing is de regering genomen.","De beslissing neemt door de regering."],"exp":"Etken cümlenin nesnesi (de beslissing) edilgen cümlenin öznesi olur ve asıl özne [[door]]'dan sonra gelir."},{"exp":"[[oplossen]] fiilinin üçüncü hali [[opgelost]]'tur; zijn-passief ile nihai sonuç/durum ifade edilir."},{"q":"Hangi fiil genellikle edilgen yapılamaz?","options":["slapen","bouwen","lezen","schrijven"],"exp":"[[slapen]] gibi geçişsiz (onovergankelijk) bir fiilin nesnesi yoktur, bu nedenle edilgene çevrilemez."},{"exp":"Çoğul özne (veel huizen), çoğul yardımcı fiil [[worden]] ile gelir."}]},"b1-vaste-voorzetsels":{"title":"Sabit edatlarla kullanılan fiiller","sum":"Çoğu Hollandaca fiil sabit bir edatla birlikte gelir: [[wachten op]], [[houden van]], [[denken aan]] gibi; bu birleşime atıfta bulunmak veya onun hakkında soru sormak için [[er/waar + edat]] kullanılır.","blocks":[{"h":"Sabit edatlı yaygın fiiller","p":"Birçok Hollandaca fiil, fiilin anlamını tamamlayan belirli bir edatla her zaman birlikte gelir ve bu edat fiille birlikte korunmalıdır.","list":["[[wachten op]] = beklemek","[[houden van]] = sevmek","[[denken aan]] = düşünmek (bir şeyi)","[[zich ergeren aan]] = bir şeye kızmak/sinirlenmek","[[geloven in]] = bir şeye inanmak","[[zorgen voor]] = bir şeye bakmak/ilgilenmek"],"ex":["Otobüsü bekliyorum.","O çikolatayı seviyor."],"tip":"Bu birleşimler ezbere öğrenilmelidir, çünkü edat Türkçede genellikle farklıdır veya kullanılmayabilir, ama Hollandacada zorunludur."},{"h":"Daha önce bahsedilen bir şeye atıfta bulunmak için er + edat","p":"İsmi tekrar etmeden, sabit bir edatla daha önce bahsedilmiş bir kavrama atıfta bulunmak istediğimizde, edattan önce [[er]] getiririz: [[erop]] (ona/onun için), [[eraan]] (onu), [[ervan]] (ondan) gibi.","ex":["Randevuyu düşünüyor musun? Evet, onu düşünüyorum.","Cevabı bekliyor musun? Evet, onu bekliyorum."],"tip":"Atıfta bulunulan bir kişi ise, [[er + edat]] yerine [[edat + şahıs zamiri]] kullanılır: denk aan hem/haar, eraan değil."},{"h":"waar + edat ile soru kurma","p":"Sabit bir edatla gelen bir şey hakkında soru sormak için, [[waar]]'ı o edatla birleştiririz: [[waarop]] (ne için), [[waaraan]] (neye), [[waarvan]] (neden) gibi.","ex":["Neyi bekliyorsun?","Neyi düşünüyorsun?"],"tip":"Kişiler için [[waar + edat]] yerine [[edat + wie]] kullanılır: Aan wie denk je? (waaraan değil)."},{"h":"Daha fazla sık kullanılan fiil listesi","p":"B1 seviye
