<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="گرامر اسپل: یادگیری بازی‌محور گرامر زبان هلندی برای فارسی‌زبانان، از سطح A1 تا C1" />
<meta name="color-scheme" content="light dark" />
<title>گرامر اسپل | یادگیری گرامر هلندی</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/* Grammatica Spel — styles */
:root {
  --bg: #f4f2ec;
  --bg-elevated: #ffffff;
  --bg-sunken: #eceadf;
  --text: #1a2233;
  --text-muted: #5c6678;
  --primary: #1d4e89;
  --primary-dark: #123559;
  --primary-light: #e6eef8;
  --gold: #cf9a1e;
  --gold-light: #faf0d8;
  --border: #dcd9cd;
  --success: #2e9e5b;
  --success-bg: #e5f6ec;
  --error: #d1483f;
  --error-bg: #fbe8e6;
  --radius-s: 8px;
  --radius: 14px;
  --radius-l: 20px;
  --shadow: 0 2px 12px rgba(30, 40, 60, .08);
  --shadow-l: 0 8px 28px rgba(30, 40, 60, .14);
  --font-ui: 'Vazirmatn', 'Tahoma', system-ui, sans-serif;
  --font-nl: 'Bricolage Grotesque', system-ui, sans-serif;
  --maxw: 880px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161f;
    --bg-elevated: #1a2030;
    --bg-sunken: #0d1017;
    --text: #e9ecf3;
    --text-muted: #9aa3b5;
    --primary: #5b9bd8;
    --primary-dark: #3f7cb5;
    --primary-light: #1e2c42;
    --gold: #e3bb4c;
    --gold-light: #332a13;
    --border: #2b3346;
    --success: #4fbd7f;
    --success-bg: #163428;
    --error: #e07068;
    --error-bg: #3a1f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161f;
  --bg-elevated: #1a2030;
  --bg-sunken: #0d1017;
  --text: #e9ecf3;
  --text-muted: #9aa3b5;
  --primary: #5b9bd8;
  --primary-dark: #3f7cb5;
  --primary-light: #1e2c42;
  --gold: #e3bb4c;
  --gold-light: #332a13;
  --border: #2b3346;
  --success: #4fbd7f;
  --success-bg: #163428;
  --error: #e07068;
  --error-bg: #3a1f1d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}
html[dir="rtl"] body { direction: rtl; }

.nl {
  font-family: var(--font-nl);
  direction: ltr;
  unicode-bidi: isolate;
  display: inline-block;
  font-weight: 500;
}

a { color: inherit; }
button { font-family: inherit; }

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 16px;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 1.05rem;
  color: var(--primary);
  cursor: pointer;
  background: none;
  border: none;
  padding: 6px;
  min-height: 48px;
}
.brand-tile {
  width: 26px; height: 26px; border-radius: 6px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: inline-block;
  position: relative;
  flex-shrink: 0;
}
.spacer { flex: 1; }
.streak-chip {
  display: flex; align-items: center; gap: 4px;
  background: var(--gold-light); color: var(--gold);
  border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
  padding: 6px 10px; border-radius: 999px; font-weight: 700; font-size: .85rem;
  min-height: 36px;
}
.icon-btn {
  width: 44px; height: 44px; min-width: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 1px solid var(--border); background: var(--bg-elevated);
  cursor: pointer; font-size: 1.1rem; color: var(--text);
}
.icon-btn:hover { background: var(--primary-light); }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  background: linear-gradient(160deg, var(--primary-dark), var(--primary));
  color: #fff;
  border-radius: var(--radius-l);
  margin: 16px;
  padding: 26px 20px 22px;
  overflow: hidden;
  isolation: isolate;
}
.hero::before {
  content: "";
  position: absolute; inset: 0;
  opacity: .16;
  background-image:
    repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 22px),
    repeating-linear-gradient(-45deg, #fff 0 2px, transparent 2px 22px);
  z-index: -1;
}
.hero h1 { margin: 0 0 4px; font-size: 1.3rem; font-weight: 800; }
.hero p { margin: 0; opacity: .9; font-size: .92rem; }
.hero-progress {
  margin-top: 16px;
  background: rgba(255,255,255,.22);
  border-radius: 999px;
  height: 12px;
  overflow: hidden;
}
.hero-progress > i {
  display: block; height: 100%;
  background: var(--gold);
  border-radius: 999px;
  transition: width .5s ease;
}
.hero-stats {
  display: flex; gap: 18px; margin-top: 12px; font-size: .85rem; flex-wrap: wrap;
}
.hero-stats b { font-size: 1.05rem; display: block; }

/* ---------- Section ---------- */
.section { padding: 10px 16px 28px; }
.section-title {
  font-weight: 800; font-size: 1.05rem; margin: 18px 0 10px;
  display: flex; align-items: center; gap: 8px;
}

/* ---------- Level picker ---------- */
.level-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
@media (max-width: 480px) {
  .level-row { grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
}
.level-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 6px;
  text-align: center;
  cursor: pointer;
  min-height: 80px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.level-card b { font-size: 1.05rem; }
.level-card .mini-bar {
  width: 80%; height: 5px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden;
}
.level-card .mini-bar > i { display: block; height: 100%; background: var(--primary); }
.level-card.active { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
.level-card.locked { opacity: .55; }

/* ---------- Study path ---------- */
.path {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  padding: 10px 0 20px;
  position: relative;
}
.path-node-wrap {
  display: flex; flex-direction: column; align-items: center;
  width: 100%;
  position: relative;
}
.path-connector {
  width: 4px; height: 26px; background: var(--border); border-radius: 2px;
}
.path-node {
  width: 100%;
  max-width: 560px;
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  min-height: 64px;
  text-align: start;
}
.path-node:hover { border-color: var(--primary); }
.node-dot {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  background: var(--bg-sunken);
  border: 2px solid var(--border);
  font-weight: 800;
  color: var(--text-muted);
}
.path-node.done .node-dot { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.path-node.current .node-dot { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.node-info { flex: 1; min-width: 0; }
.node-info .t { font-weight: 700; font-size: .95rem; }
.node-info .s { font-size: .8rem; color: var(--text-muted); margin-top: 2px; }
.node-stars { display: flex; gap: 2px; font-size: .95rem; flex-shrink: 0; color: var(--border); }
.node-stars .on { color: var(--gold); }

/* ---------- Game cards ---------- */
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .game-grid { grid-template-columns: 1fr; } }
.game-card {
  background: linear-gradient(160deg, var(--primary), var(--primary-dark));
  color: #fff; border-radius: var(--radius); padding: 18px;
  cursor: pointer; min-height: 110px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--shadow);
}
.game-card .g-title { font-weight: 800; font-size: 1.05rem; }
.game-card .g-desc { font-size: .82rem; opacity: .9; margin-top: 4px; }
.game-card .g-best { font-size: .78rem; margin-top: 10px; color: var(--gold); font-weight: 700; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius-s); padding: 12px 20px; font-weight: 700;
  font-size: .95rem; cursor: pointer; min-height: 48px;
  transition: transform .12s ease;
}
.btn:active { transform: scale(.97); }
.btn.secondary { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border); }
.btn.ghost { background: transparent; color: var(--primary); }
.btn.gold { background: var(--gold); color: #2a2008; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.sticky-cta {
  position: sticky; bottom: 0; z-index: 30;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}

/* ---------- Topic page ---------- */
.topic-header { padding: 18px 16px 6px; }
.crumb { color: var(--text-muted); font-size: .82rem; cursor: pointer; }
.topic-header h1 { font-size: 1.25rem; margin: 6px 0 4px; }
.topic-header .nlname { color: var(--text-muted); font-size: .95rem; }
.block-card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin: 0 16px 14px;
}
.block-card h3 { margin: 0 0 8px; font-size: 1.02rem; color: var(--primary); }
.block-card p { margin: 0 0 8px; }
table.gtable { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: .9rem; }
table.gtable th, table.gtable td { border: 1px solid var(--border); padding: 7px 8px; text-align: start; }
table.gtable th { background: var(--bg-sunken); font-weight: 700; }
.block-card ul { margin: 6px 0; padding-inline-start: 22px; }
.block-card li { margin-bottom: 4px; }
.ex-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-sunken); border-radius: var(--radius-s);
  padding: 8px 10px; margin-top: 8px;
}
.ex-row .ex-text { flex: 1; }
.ex-row .ex-fa { color: var(--text-muted); font-size: .85rem; margin-top: 2px; }
.tts-btn {
  width: 36px; height: 36px; min-width: 36px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-elevated);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  font-size: 1rem;
}
.tip-box {
  display: flex; gap: 8px; background: var(--gold-light); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
  border-radius: var(--radius-s); padding: 10px 12px; margin-top: 8px; font-size: .88rem;
}

/* ---------- Session / exercise engine ---------- */
.session-head {
  position: sticky; top: 0; z-index: 25;
  background: var(--bg); padding: 10px 16px; border-bottom: 1px solid var(--border);
}
.progress-bar { height: 10px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; }
.progress-bar > i { display: block; height: 100%; background: var(--primary); transition: width .35s ease; }
.session-meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--text-muted); margin-top: 6px; }
.q-card {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 16px; margin: 16px; min-height: 160px;
}
.q-text { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  text-align: start; padding: 12px 14px; border-radius: var(--radius-s);
  border: 1.5px solid var(--border); background: var(--bg-elevated); cursor: pointer;
  font-size: .95rem; min-height: 48px; color: var(--text);
}
.opt-btn:hover { border-color: var(--primary); }
.opt-btn.correct { border-color: var(--success); background: var(--success-bg); }
.opt-btn.wrong { border-color: var(--error); background: var(--error-bg); }
.opt-btn.dim { opacity: .55; }
.opt-btn[disabled] { cursor: default; }

.fill-input {
  width: 100%; padding: 12px 14px; font-size: 1rem; border-radius: var(--radius-s);
  border: 1.5px solid var(--border); background: var(--bg-elevated); color: var(--text);
  font-family: var(--font-nl); direction: ltr; text-align: start; min-height: 48px;
}
.fill-input.correct { border-color: var(--success); }
.fill-input.wrong { border-color: var(--error); }

.order-tokens, .order-pool {
  display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px;
  padding: 10px; border-radius: var(--radius-s); border: 1.5px dashed var(--border);
  direction: ltr; justify-content: flex-start;
}
.order-pool { margin-top: 10px; }
.token-btn {
  font-family: var(--font-nl); direction: ltr;
  padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--border);
  background: var(--bg-elevated); cursor: pointer; font-size: .95rem; min-height: 44px;
}
.token-btn:hover { border-color: var(--primary); }
.token-btn:disabled { opacity: .35; cursor: default; }

.feedback-panel {
  margin: 0 16px 16px; padding: 14px; border-radius: var(--radius);
  display: none;
}
.feedback-panel.show { display: block; }
.feedback-panel.ok { background: var(--success-bg); border: 1px solid var(--success); }
.feedback-panel.bad { background: var(--error-bg); border: 1px solid var(--error); }
.feedback-panel .fb-title { font-weight: 800; margin-bottom: 4px; }
.feedback-panel.ok .fb-title { color: var(--success); }
.feedback-panel.bad .fb-title { color: var(--error); }

.session-actions { padding: 0 16px 20px; }

/* ---------- Summary ---------- */
.summary-card {
  text-align: center; padding: 30px 20px; margin: 20px 16px;
  background: var(--bg-elevated); border-radius: var(--radius-l); border: 1px solid var(--border);
}
.summary-stars { font-size: 2.2rem; letter-spacing: 6px; color: var(--border); margin: 10px 0; }
.summary-stars .on { color: var(--gold); }
.summary-xp { font-weight: 800; color: var(--primary); font-size: 1.3rem; margin-top: 6px; }

/* ---------- Games ---------- */
.game-stage {
  text-align: center; padding: 20px 16px;
}
.game-timer { font-weight: 800; font-size: 1.4rem; color: var(--primary); }
.game-word { font-size: 2.2rem; font-weight: 800; font-family: var(--font-nl); direction: ltr; margin: 24px 0; }
.game-btns { display: flex; gap: 12px; justify-content: center; }
.lives { font-size: 1.4rem; letter-spacing: 6px; margin-bottom: 10px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 16px; inset-inline: 16px; z-index: 60;
  background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: var(--radius-s);
  text-align: center; font-size: .9rem; box-shadow: var(--shadow-l);
  transform: translateY(120%); transition: transform .3s ease;
}
.toast.show { transform: translateY(0); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }

footer.app-footer { text-align: center; padding: 24px 16px 40px; color: var(--text-muted); font-size: .8rem; }

</style>
</head>

<div id="app"><div class="empty-state">در حال بارگذاری...</div></div>
<script>
window.GRAMMATICA_DATA = window.GRAMMATICA_DATA || {};
window.GRAMMATICA_DATA.A1 = [
  {
    id: "a1-lidwoorden",
    level: "A1",
    title: "حروف تعریف: de، het و een",
    nl: "de / het / een",
    sum: "در هلندی برای اسم‌های معین از [[de]] یا [[het]] و برای اسم‌های نامعین از [[een]] استفاده می‌شود؛ انتخاب بین [[de]] و [[het]] به جنس دستوری اسم بستگی دارد.",
    blocks: [
      {
        h: "حرف تعریف معین: [[de]] و [[het]]",
        p: "در فارسی حرف تعریف معین وجود ندارد، اما در هلندی هر اسم یا با [[de]] یا با [[het]] می‌آید که هر دو معادل **آن / -ه** هستند. اسم‌هایی که با [[de]] می‌آیند را **de-woorden** و اسم‌هایی که با [[het]] می‌آیند را **het-woorden** می‌نامند. حدود سه‌چهارم اسم‌های هلندی [[de]] می‌گیرند.",
        ex: [
          { nl: "De tafel is bruin.", fa: "میز قهوه‌ای است." },
          { nl: "Het boek is interessant.", fa: "کتاب جالب است." }
        ],
        tip: "بهترین روش یادگیری هر اسم تازه این است که آن را همراه با [[de]] یا [[het]] خودش حفظ کنید، نه اسم به‌تنهایی."
      },
      {
        h: "چه زمانی [[het]] استفاده می‌شود",
        p: "گروهی از اسم‌ها همیشه [[het]] می‌گیرند: **کوچک‌شده‌ها** (verkleinwoorden که با [[-je]] تمام می‌شوند)، نام **زبان‌ها**، **فلزها** و **جهت‌های جغرافیایی**، و اسم‌هایی که از **فعل به‌صورت مصدر** ساخته شده‌اند.",
        list: [
          "کوچک‌شده‌ها: [[het huisje]] (خانه‌ی کوچک)، [[het boekje]] (کتابچه)",
          "زبان‌ها: [[het Nederlands]]، [[het Perzisch]]",
          "فلزها و جهت‌ها: [[het goud]]، [[het noorden]]",
          "مصدر به‌عنوان اسم: [[het lezen]] (خوانْدن)، [[het eten]] (غذا/خوردن)"
        ],
        ex: [
          { nl: "Het Nederlands is niet zo moeilijk.", fa: "هلندی آن‌قدرها هم سخت نیست." },
          { nl: "Het eten smaakt lekker.", fa: "غذا خوشمزه است." }
        ]
      },
      {
        h: "چه زمانی [[de]] استفاده می‌شود",
        p: "اسم‌های **جمع** همیشه [[de]] می‌گیرند، حتی اگر مفرد آن‌ها [[het]] باشد. همچنین اسم‌های مربوط به **افراد و شغل‌ها** و بیشتر **درخت‌ها، گل‌ها، میوه‌ها و سبزیجات** معمولاً [[de]] می‌گیرند.",
        table: { head: ["مفرد", "جمع"], rows: [["het huis", "de huizen"], ["het boek", "de boeken"], ["de auto", "de auto's"]] },
        ex: [
          { nl: "Het kind speelt buiten.", fa: "بچه بیرون بازی می‌کند." },
          { nl: "De kinderen spelen buiten.", fa: "بچه‌ها بیرون بازی می‌کنند." }
        ],
        tip: "در جمع فرقی بین [[de]] و [[het]] وجود ندارد؛ همه‌ی جمع‌ها [[de]] می‌گیرند."
      },
      {
        h: "حرف تعریف نامعین: [[een]]",
        p: "[[een]] معادل **یک / -ی** در فارسی است و برای معرفی چیزی ناشناخته یا نامشخص به کار می‌رود. برخلاف [[de]] و [[het]]، [[een]] برای هر دو گروه اسم یکسان است و تفاوتی ندارد.",
        ex: [
          { nl: "Ik zie een hond.", fa: "من یک سگ می‌بینم." },

  function trTopic(topic) {
    var L = curLang();

    var pack = window.GRAMMATICA_I18N && window.GRAMMATICA_I18N[L] && window.GRAMMATICA_I18N[L].topics;
    var ov = pack && pack[topic.id];
    if (!ov) return topic;
    var merged = Object.assign({}, topic);
    if (ov.title) merged.title = ov.title;
    if (ov.sum) merged.sum = ov.sum;
    if (ov.blocks && topic.blocks) {
      merged.blocks = topic.blocks.map(function (b, i) {
        var ob = ov.blocks[i];
        if (!ob) return b;
        var nb = Object.assign({}, b);
        if (ob.h != null) nb.h = ob.h;
        if (ob.p != null) nb.p = ob.p;
        if (ob.list) nb.list = ob.list;
        if (ob.tip != null) nb.tip = ob.tip;
        if (b.table && ob.table) nb.table = ob.table;
        if (b.ex && ob.ex) {
          nb.ex = b.ex.map(function (e, ei) {
            return ob.ex[ei] != null ? Object.assign({}, e, { fa: ob.ex[ei] }) : e;
          });
        }
        return nb;
      });
    }
    if (ov.ex && topic.ex) {
      merged.ex = topic.ex.map(function (e, i) {
        var oe = ov.ex[i];
        if (!oe) return e;
        var ne = Object.assign({}, e);
        if (oe.q != null) ne.q = oe.q;
        if (oe.options) ne.options = oe.options;

        return ne;

  /* ---------------- formatter ---------------- */
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  var LATIN_RUN = /[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ'’.\-]*(?:[  ][A-Za-zÀ-ÖØ-öø-ÿ'’.\-]+)*/g;
  function wrapLatin(text) {
    return text.replace(LATIN_RUN, function (m) {
      if (!m.trim()) return m;
      return '<span class="nl">' + m + '</span>';
    });
  }
  function fmt(raw) {
    if (!raw) return '';
    var s = escapeHtml(String(raw));
    var parts = [];
    var lastIndex = 0;
    var re = /\[\[([^\]]+)\]\]/g;
    var m;
    while ((m = re.exec(s))) {
      parts.push({ t: 'text', v: s.slice(lastIndex, m.index) });
      parts.push({ t: 'nl', v: m[1] });
      lastIndex = re.lastIndex;
    }
    parts.push({ t: 'text', v: s.slice(lastIndex) });
    return parts.map(function (p) {
      if (p.t === 'nl') return '<span class="nl">' + p.v + '</span>';
      var v = p.v.replace(/\*\*([^*]+)\*\*/g, function (_mm, inner) {
        return '<strong>' + wrapLatin(inner) + '</strong>';
      });
      var segs = v.split(/(<strong>[\s\S]*?<\/strong>)/g);
      v = segs.map(function (seg) { return seg.indexOf('<strong>') === 0 ? seg : wrapLatin(seg); }).join('');
      return v;
    }).join('');
  }
  function fmtNl(raw) {

  /* ---------------- state ---------------- */
  var STORAGE_KEY = 'grammatica.v1';

  function todayStr() {

    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function bumpStreak() {
    var today = todayStr();
    var st = STATE.streak;
    if (st.last === today) return;
    if (st.last) {
      var prev = new Date(st.last + 'T00:00:00');
      var now = new Date(today + 'T00:00:00');
      var diffDays = Math.round((now - prev) / 86400000);
      st.count = diffDays === 1 ? st.count + 1 : 1;
    } else {
      st.count = 1;
    }
    st.last = today;
    saveState();
  }

  /* ---------------- tts ---------------- */
  function pickDutchVoice(voices) {
    var best = null, bestScore = -1;
    for (var i = 0; i < voices.length; i++) {
      var v = voices[i];
      var lang = (v.lang || '').toLowerCase();
      if (lang.indexOf('nl') !== 0) continue;
      var score = 1;
      if (lang === 'nl-nl') score += 10;
      if (!v.localService) score += 8;
      if (/google|neural|wavenet|premium|enhanced|natural/i.test(v.name || '')) score += 5;
      if (score > bestScore) { bestScore = score; best = v; }
    }
    return best;
  }
  function speakNow(text) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'nl-NL';
    var nlVoice = pickDutchVoice(window.speechSynthesis.getVoices() || []);
    if (nlVoice) u.voice = nlVoice;
    else toast(tt('ttsUnavailable'));
    u.rate = 0.92;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
  }
  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var existing = window.speechSynthesis.getVoices() || [];
      if (existing.length === 0) {
        window.speechSynthesis.onvoiceschanged = function () { speakNow(text); };
      } else {
        speakNow(text);
      }
    } catch (e) { /* ignore */ }
  }

  /* ---------------- utils ---------------- */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  /* ---------------- SESSION ENGINE ---------------- */
  var SESSION = null;

  function buildQueue(exercises) {
    return shuffle(exercises.map(function (ex, i) { return { ex: ex, firstTry: true, origIndex: i }; }));
  }

  function startSession(opts) {
    SESSION = {
      title: opts.title,
      backHash: opts.backHash,
      retry: opts.retry !== false,
      total: opts.exercises.length,
      queue: buildQueue(opts.exercises),
      solved: 0,
      correctFirstTry: 0,
      combo: 0,
      xp: 0,
      current: null,
      answered: false,
      orderState: null,
      onComplete: opts.onComplete
    };
    nextQuestion();
  }

  function nextQuestion() {
    SESSION.answered = false;
    SESSION.orderState = null;
    if (SESSION.queue.length === 0) { finishSession(); return; }
    SESSION.current = SESSION.queue[0];
    if (SESSION.current.ex.type === 'order') {
      SESSION.orderState = { order: shuffle(SESSION.current.ex.tokens.map(function (_t, i) { return i; })), built: [] };
    }
    renderSessionView();
  }

  function finishSession() {
    var acc = SESSION.total ? SESSION.correctFirstTry / SESSION.total : 0;
    var stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : acc >= 0.5 ? 1 : 0;
    bumpStreak();
    STATE.xp = (STATE.xp || 0) + SESSION.xp;
    var result = { accuracy: acc, stars: stars, xp: SESSION.xp, total: SESSION.total, correct: SESSION.correctFirstTry };
    if (SESSION.onComplete) SESSION.onComplete(result);
    saveState();
    renderSummary(result);
  }

  function registerAnswer(isCorrect) {
    var item = SESSION.current;
    SESSION.answered = true;
    if (isCorrect) {
      if (item.firstTry) {
        SESSION.correctFirstTry++;
        SESSION.combo++;
        SESSION.xp += 10 + Math.min(SESSION.combo, 10) * 2;
      } else {
        SESSION.combo = 0;
        SESSION.xp += 3;
      }
      SESSION.queue.shift();
      SESSION.solved++;
    } else {
      SESSION.combo = 0;
      if (SESSION.retry) {
        item.firstTry = false;
        SESSION.queue.shift();
        SESSION.queue.push(item);
      } else {
        SESSION.queue.shift();
        SESSION.solved++;
      }
    }
    renderSessionView(isCorrect);
  }

  function renderSessionView(lastCorrect) {
    clearActiveTimer();
    if (!SESSION.current) return;
    var ex = SESSION.current.ex;
    var pct = SESSION.total ? Math.round((SESSION.solved / SESSION.total) * 100) : 0;
    var body = '';
    if (ex.type === 'mc') {
      body = '<div class="q-text">' + fmt(ex.q) + '</div><div class="options">' +
        ex.options.map(function (opt, i) {
          var cls = '';
          if (SESSION.answered) {
            if (i === ex.answer) cls = 'correct';
            else cls = 'dim';
          }
          return '<button class="opt-btn ' + cls + '" ' + (SESSION.answered ? 'disabled' : '') + ' data-act="mcPick" data-arg="' + i + '">' + fmt(opt) + '</button>';
        }).join('') + '</div>';
    } else if (ex.type === 'fill') {
      body = '<div class="q-text">' + fmt(ex.q) + '</div>' +
        '<input class="fill-input" id="fillInput" ' + (SESSION.answered ? 'disabled' : '') + ' placeholder="' + escAttr(tt('fillPlaceholder')) + '" autocomplete="off" autocapitalize="off" spellcheck="false" />' +
        (SESSION.answered ? '' : '<div style="margin-top:12px"><button class="btn secondary" data-act="fillCheck">' + escapeHtml(tt('checkAnswer')) + '</button></div>');
    } else if (ex.type === 'order') {
      var osBuilt = SESSION.orderState.built.map(function (idx, pos) {
        return '<button class="token-btn" data-act="ordUnpick" data-arg="' + pos + '">' + escapeHtml(ex.tokens[idx]) + '</button>';
      }).join('');
      var osPool = SESSION.orderState.order.filter(function (idx) { return SESSION.orderState.built.indexOf(idx) === -1; })
        .map(function (idx) { return '<button class="token-btn" data-act="ordPick" data-arg="' + idx + '">' + escapeHtml(ex.tokens[idx]) + '</button>'; }).join('');
      body = '<div class="q-text">' + fmt(ex.q) + '</div>' +
        '<div class="order-tokens">' + (osBuilt || '<span style="color:var(--text-muted);font-size:.85rem">' + escapeHtml(tt('pickWordsHint')) + '</span>') + '</div>' +
        '<div class="order-pool">' + osPool + '</div>' +
        (SESSION.answered ? '' : '<div style="margin-top:12px"><button class="btn secondary" data-act="ordCheck">' + escapeHtml(tt('checkSentence')) + '</button></div>');
    }

    var feedback = '';
    if (SESSION.answered) {
      feedback = '<div class="feedback-panel show ' + (lastCorrect ? 'ok' : 'bad') + '">' +
        '<div class="fb-title">' + (lastCorrect ? escapeHtml(tt('correctFeedback')) : escapeHtml(tt('wrongFeedback'))) + '</div>' +
        '<div>' + fmt(ex.exp || '') + '</div></div>' +
        '<div class="session-actions"><button class="btn block" data-act="sessNext">' + escapeHtml(tt('continueBtn')) + '</button></div>';
    }

    var html =
      '<div class="session-head"><div class="wrap">' +
      '<div class="progress-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="session-meta"><span>' + ltrNum(SESSION.solved + ' / ' + SESSION.total) + '</span><span>' + escapeHtml(tt('comboLabel', { n: SESSION.combo })) + '</span></div>' +
      '</div></div>' +
      '<div class="q-card" id="qCard">' + body + '</div>' +
      feedback;

    app.innerHTML = topbarHtml() + html + footerHtml() + '<div class="toast" id="toast"></div>';
  }

  function checkFillAnswer() {
    if (SESSION.answered) return;
    var ex = SESSION.current.ex;
    var input = document.getElementById('fillInput');
    var val = normAnswer(input.value);
    var ok = ex.answers.some(function (a) { return normAnswer(a) === val; });
    input.classList.add(ok ? 'correct' : 'wrong');
    if (!ok) input.value += '  ✗';
    registerAnswer(ok);
  }

  function checkOrderAnswer() {
    if (SESSION.answered) return;
    var ex = SESSION.current.ex;
    var built = SESSION.orderState.built;
    if (built.length !== ex.tokens.length) { toast(tt('placeAllWords')); return; }
    var builtWords = built.map(function (idx) { return ex.tokens[idx]; });
    var ok = ex.answers.some(function (ans) {
      if (ans.length !== builtWords.length) return false;
      for (var i = 0; i < ans.length; i++) if (ans[i] !== builtWords[i]) return false;
      return true;
    });
    registerAnswer(ok);
  }

  /* ---------------- SUMMARY ---------------- */
  function renderSummary(result) {
    var isTest = typeof result.passed === 'boolean';
    var html =
      '<div class="summary-card">' +
      '<div style="font-size:2.4rem">' + (isTest ? (result.passed ? '🎉' : '💪') : (result.stars >= 2 ? '🎉' : '💪')) + '</div>' +
      '<h2 style="margin:10px 0 0">' + escapeHtml(isTest ? (result.passed ? tt('testPassed') : tt('testFailed')) : tt('exerciseResult')) + '</h2>' +
      (!isTest ? '<div class="summary-stars">' + starsHtml(result.stars) + '</div>' : '') +
      '<div>' + escapeHtml(tt('accuracyLine', { pct: Math.round(result.accuracy * 100), correct: result.correct, total: result.total })) + '</div>' +
      (isTest ? '<div style="color:var(--text-muted);font-size:.85rem;margin-top:4px">' + escapeHtml(tt('passThreshold')) + '</div>' : '') +
      '<div class="summary-xp">+' + ltrNum(result.xp) + ' XP</div>' +
      '<div style="margin-top:22px;display:flex;flex-direction:column;gap:10px">' +
      '<button class="btn block" data-act="sessDone">' + escapeHtml(tt('okBtn')) + '</button>' +
      '</div></div>';
    app.innerHTML = topbarHtml() + html + footerHtml() + '<div class="toast" id="toast"></div>';
  }

  /* ---------------- PRACTICE / LEVEL TEST entry points ---------------- */
  function renderPractice(id) {
    var t = findTopic(id);
    if (!t || !t.ex || !t.ex.length) { setApp('<div class="empty-state">' + escapeHtml(tt('noExercises')) + '</div>'); return; }
    startSession({
      exercises: t.ex,
      retry: true,
      backHash: 'l-' + t.level.toLowerCase(),
      onComplete: function (result) {
        var prev = STATE.topics[t.id] || { stars: 0, attempts: 0 };
        STATE.topics[t.id] = {
          stars: Math.max(prev.stars || 0, result.stars),
          accuracy: result.accuracy,
          attempts: (prev.attempts || 0) + 1,
          completedAt: Date.now()
        };
        saveState();
      }
    });
    SESSION.__afterDone = function () { navigate('l-' + t.level.toLowerCase()); };
  }

  function renderLevelTest(level) {
    var topics = dataFor(level);
    var pool = [];
    topics.forEach(function (t) { (t.ex || []).forEach(function (e) { pool.push(e); }); });
    if (pool.length < 4) { setApp('<div class="empty-state">' + escapeHtml(tt('notEnoughTestQuestions')) + '</div>'); return; }
    var picked = shuffle(pool).slice(0, Math.min(12, pool.length));
    startSession({
      exercises: picked,
      retry: false,
      backHash: 'l-' + level.toLowerCase(),
      onComplete: function (result) {
        var passed = result.accuracy >= 0.8;
        var prev = STATE.tests[level] || { bestPct: 0, attempts: 0, passed: false };
        STATE.tests[level] = {
          passed: prev.passed || passed,
          bestPct: Math.max(prev.bestPct || 0, Math.round(result.accuracy * 100)),
          attempts: (prev.attempts || 0) + 1
        };
        result.passed = passed;
        saveState();
      }
    });
    SESSION.__afterDone = function () { navigate('l-' + level.toLowerCase()); };
  }

  /* ---------------- GAME: de/het sprint ---------------- */
  var GAME = null;
  function renderGameDeHet() {
    var nouns = allNouns();
    if (!nouns.length) { setApp('<div class="empty-state">' + escapeHtml(tt('noGameData')) + '</div>'); return; }
    GAME = { type: 'dehet', time: 45, score: 0, wrong: 0, pool: shuffle(nouns), idx: 0, current: null };
    nextDeHetWord();
    renderGameDeHetView();
    activeTimer = setInterval(function () {
      GAME.time--;
      if (GAME.time <= 0) { clearActiveTimer(); finishDeHet(); return; }
      var tEl = document.getElementById('gTimer');
      if (tEl) tEl.textContent = GAME.time + 's';
    }, 1000);
  }
  function nextDeHetWord() {
    if (GAME.idx >= GAME.pool.length) { GAME.pool = shuffle(allNouns()); GAME.idx = 0; }
    GAME.current = GAME.pool[GAME.idx++];
  }
  function renderGameDeHetView() {
    var html =
      '<div class="game-stage">' +
      '<div class="game-timer" id="gTimer">' + ltrNum(GAME.time + 's') + '</div>' +
      '<div style="margin-top:6px;color:var(--text-muted)">' + escapeHtml(tt('scoreLabel', { n: GAME.score })) + '</div>' +
      '<div class="game-word" id="gWord">' + escapeHtml(GAME.current.nl) + '</div>' +
      '<div class="game-btns">' +
      '<button class="btn secondary" style="min-width:110px" data-act="dehetPick" data-arg="de">de</button>' +
      '<button class="btn secondary" style="min-width:110px" data-act="dehetPick" data-arg="het">het</button>' +
      '</div>' +
      '<div style="margin-top:30px"><button class="btn ghost" data-act="go" data-arg="home">' + escapeHtml(tt('endGameBtn')) + '</button></div>' +
      '</div>';
    app.innerHTML = topbarHtml() + html + footerHtml() + '<div class="toast" id="toast"></div>';
  }
  function pickDeHet(choice) {
    if (!GAME) return;
    var ok = choice === GAME.current.gender;
    if (ok) GAME.score++; else GAME.wrong++;
    toast(ok ? tt('dehetCorrect', { g: GAME.current.gender }) : tt('dehetWrong', { g: GAME.current.gender }));
    nextDeHetWord();
    renderGameDeHetView();
  }
  function finishDeHet() {
    clearActiveTimer();
    var best = Math.max(STATE.games.dehet.best || 0, GAME.score);
    STATE.games.dehet.best = best;
    bumpStreak();
    saveState();
    var html =
      '<div class="summary-card"><div style="font-size:2.4rem">⏱️</div>' +
      '<h2>' + escapeHtml(tt('timeUp')) + '</h2>' +
      '<div style="font-size:1.4rem;font-weight:800;color:var(--primary);margin:8px 0">' + escapeHtml(tt('scoreLabel', { n: GAME.score })) + '</div>' +
      '<div style="color:var(--text-muted)">' + escapeHtml(tt('bestScore', { n: best })) + '</div>' +
      '<div style="margin-top:22px;display:flex;flex-direction:column;gap:10px">' +
      '<button class="btn block" data-act="go" data-arg="game-dehet">' + escapeHtml(tt('playAgain')) + '</button>' +
      '<button class="btn secondary block" data-act="go" data-arg="home">' + escapeHtml(tt('backHomeBtn')) + '</button>' +
      '</div></div>';
    app.innerHTML = topbarHtml() + html + footerHtml() + '<div class="toast" id="toast"></div>';
  }

  /* ---------------- GAME: Survive ---------------- */
  function renderGameSurvive() {
    var pool = allMcExercises();
    if (pool.length < 4) { setApp('<div class="empty-state">' + escapeHtml(tt('noSurviveQuestions')) + '</div>'); return; }
    GAME = { type: 'survive', lives: 3, score: 0, pool: shuffle(pool), idx: 0, current: null, answered: false };
    nextSurviveQ();
    renderGameSurviveView();
  }
  function nextSurviveQ() {
    if (GAME.idx >= GAME.pool.length) { GAME.pool = shuffle(allMcExercises()); GAME.idx = 0; }
    GAME.current = GAME.pool[GAME.idx++];
    GAME.answered = false;
  }
  function renderGameSurviveView() {
    var ex = GAME.current;
    var opts = ex.options.map(function (opt, i) {
      var cls = '';
      if (GAME.answered) cls = (i === ex.answer) ? 'correct' : 'dim';
      return '<button class="opt-btn ' + cls + '" ' + (GAME.answered ? 'disabled' : '') + ' data-act="survivePick" data-arg="' + i + '">' + fmt(opt) + '</button>';
    }).join('');
    var livesHtml = '';
    for (var i = 0; i < 3; i++) livesHtml += i < GAME.lives ? '❤️' : '🖤';
    var overNow = GAME.lives <= 0;
    var fb = GAME.answered ? ('<div class="feedback-panel show ' + (GAME.lastOk ? 'ok' : 'bad') + '"><div class="fb-title">' + (GAME.lastOk ? escapeHtml(tt('surviveCorrect')) : escapeHtml(tt('surviveWrong'))) + '</div><div>' + fmt(ex.exp || '') + '</div></div>' +
      '<div class="session-actions"><button class="btn block" data-act="surviveNext">' + escapeHtml(overNow ? tt('surviveEndBtn') : tt('continueBtn')) + '</button></div>') : '';
    var html =
      '<div class="game-stage" style="padding-bottom:0">' +
      '<div class="lives">' + ltrNum(livesHtml) + '</div>' +
      '<div style="color:var(--text-muted)">' + escapeHtml(tt('scoreLabel', { n: GAME.score })) + '</div>' +
      '</div>' +
      '<div class="q-card"><div class="q-text">' + fmt(ex.q) + '</div><div class="options">' + opts + '</div></div>' +
      fb;
    app.innerHTML = topbarHtml() + html + footerHtml() + '<div class="toast" id="toast"></div>';
  }
  function pickSurvive(i) {
    if (GAME.answered) return;
    GAME.answered = true;
    var ok = i === GAME.current.answer;
    GAME.lastOk = ok;
    if (ok) GAME.score++; else GAME.lives--;
    renderGameSurviveView();
    if (!ok && GAME.lives <= 0) {
      setTimeout(function () { }, 0);
    }
  }
  function surviveNext() {
    if (GAME.lives <= 0) { finishSurvive(); return; }
    nextSurviveQ();
    renderGameSurviveView();
  }
  function finishSurvive() {
    var best = Math.max(STATE.games.survive.best || 0, GAME.score);
    STATE.games.survive.best = best;
    bumpStreak();
    saveState();
    var html =
      '<div class="summary-card"><div style="font-size:2.4rem">💀</div>' +
      '<h2>' + escapeHtml(tt('gameOver')) + '</h2>' +
      '<div style="font-size:1.4rem;font-weight:800;color:var(--primary);margin:8px 0">' + escapeHtml(tt('scoreLabel', { n: GAME.score })) + '</div>' +
      '<div style="color:var(--text-muted)">' + escapeHtml(tt('bestScore', { n: best })) + '</div>' +
      '<div style="margin-top:22px;display:flex;flex-direction:column;gap:10px">' +
      '<button class="btn block" data-act="go" data-arg="game-survive">' + escapeHtml(tt('playAgain')) + '</button>' +
      '<button class="btn secondary block" data-act="go" data-arg="home">' + escapeHtml(tt('backHomeBtn')) + '</button>' +
      '</div></div>';
    app.innerHTML = topbarHtml() + html + footerHtml() + '<div class="toast" id="toast"></div>';
  }

  /* ---------------- delegated events ---------------- */
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var arg = el.getAttribute('data-arg');
    switch (act) {
      case 'go': navigate(arg); break;
      case 'theme': cycleTheme(); break;
      case 'lang': cycleLang(); break;
      case 'speak': speak(arg); break;
      case 'mcPick':
        if (!SESSION.answered) registerAnswer(parseInt(arg, 10) === SESSION.current.ex.answer);
        break;
      case 'fillCheck': checkFillAnswer(); break;
      case 'ordPick':
        if (!SESSION.answered) { SESSION.orderState.built.push(parseInt(arg, 10)); renderSessionView(); }
        break;
      case 'ordUnpick':
        if (!SESSION.answered) { SESSION.orderState.built.splice(parseInt(arg, 10), 1); renderSessionView(); }
        break;
      case 'ordCheck': checkOrderAnswer(); break;
      case 'sessNext': nextQuestion(); break;
      case 'sessDone':
        if (SESSION && SESSION.__afterDone) { var fn = SESSION.__afterDone; SESSION = null; fn(); }
        else navigate('home');
        break;
      case 'dehetPick': pickDeHet(arg); break;
      case 'survivePick': pickSurvive(parseInt(arg, 10)); break;
      case 'surviveNext': surviveNext(); break;
      default: break;
    }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'fillInput') {
      e.preventDefault();
      checkFillAnswer();
    }
  });

  /* ---------------- test hook (read-only introspection for smoke tests) ---------------- */
  window.__APP_DEBUG__ = {
    getCurrentExercise: function () { return SESSION && SESSION.current ? SESSION.current.ex : null; },
    isAnswered: function () { return !!(SESSION && SESSION.answered); },
    getGame: function () { return GAME; },
    getState: function () { return STATE; },
    getSession: function () { return SESSION ? { total: SESSION.total, solved: SESSION.solved, queueLen: SESSION.queue.length, combo: SESSION.combo, currentQ: SESSION.current && SESSION.current.ex.q } : null; }
  };

  /* ---------------- boot ---------------- */
  applyTheme();
  applyLang();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
  }
  render();
})();

</script>
</body>
</html>
