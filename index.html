د)","dat","het boek dat..."],["جمع (de أو het)","die","de boeken die..."]]},"ex":["ذاك الرجل الذي يقف هناك هو جاري.","البيت الذي اشتريناه قديم جدًا."],"tip":"يذهب الفعل في الجملة الموصولة دائمًا إلى نهايتها: [[het boek dat ik gisteren gekocht heb]]."},{"h":"waar + حرف جر للأشياء","p":"عندما تشير الجملة الموصولة إلى شيء أو مفهوم (لا شخص) بواسطة حرف جر، يُستخدم تركيب [[waar + حرف جر]] بدلًا من [[die/dat]]، مثل [[waarmee]] (الذي به)، و[[waarover]] (الذي عنه)، و[[waarin]] (الذي فيه).","ex":["هذا هو القلم الذي أكتب به.","الكتاب الذي كنا نتحدث عنه مشهور جدًا."],"list":["[[waarmee]] = الذي به","[[waarover]] = الذي عنه","[[waarin]] = الذي فيه","[[waarop]] = الذي عليه / الذي يُنتظر"]},{"h":"wie للأشخاص بعد حرف الجر","p":"بالنسبة للأشخاص، عندما يكون هناك حرف جر، نستخدم [[حرف جر + wie]] بدلًا من [[waar]]، لا [[die]]: **de vrouw met wie ik praatte** (المرأة التي كنت أتحدث معها). يأتي حرف الجر قبل [[wie]]، لا بعده كما في waar.","ex":["الزميل الذي أعمل معه لطيف جدًا.","الصديق الذي أخبرته يعيش في أوترخت."],"tip":"في الكلام العامي تُسمع أحيانًا تراكيب أخرى، لكن في الكتابة الرسمية يُعدّ [[حرف جر + wie]] الشكل الأصح."},{"h":"الجملة الموصولة بلا مرجع محدد (wat)","p":"عندما تشير الجملة الموصولة إلى جملة كاملة أو مفهوم عام (لا إلى اسم محدد)، أو بعد ضمائر نكرة مثل [[alles]] و[[iets]] و[[niets]]، يُستخدم [[wat]] بدلًا من [[dat]].","ex":["هذا كل ما أعرفه.","لم يقل شيئًا لم أكن أعرفه."]}],"ex":[{"q":"أي ضمير موصول هو الصحيح؟ «De fiets ___ ik gekocht heb, is kapot.»","options":["die","dat","wat","wie"],"exp":"[[fiets]] من نوع de-woord، لذا الضمير الموصول هو [[die]]."},{"q":"«Het kind ___ daar speelt, is mijn zoon.» أي خيار هو الصحيح؟","options":["dat","die","wat","waar"],"exp":"[[kind]] من نوع het-woord، فطبقًا للقاعدة النحوية يكون الضمير الموصول [[dat]] (حتى عندما يشير إلى شخص)."},{"exp":"الفعل [[werken met]] يأخذ حرف الجر [[met]]، لذا التركيب الصحيح هو [[waarmee]] (لا waar فقط)."},{"q":"أي جملة هي الصحيحة؟ (الصديق الذي ذهبت معه إلى السينما)","options":["De vriend met wie ik naar de bioscoop ging.","De vriend waarmee ik naar de bioscoop ging.","De vriend die ik mee naar de bioscoop ging.","De vriend wie ik naar de bioscoop ging."],"exp":"للأشخاص بعد حرف الجر، يُستخدم [[حرف جر + wie]]، لا [[waar]] (المخصص للأشياء/المفاهيم فقط)."},{"exp":"بعد ضمائر النكرة مثل [[alles]] يُستخدم [[wat]]، لا [[dat]]."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «الكتاب الذي أقرؤه مثير جدًا للاهتمام».","exp":"يذهب فعل الجملة الموصولة ([[lees]]) إلى نهاية ذلك الجزء؛ وبما أن [[boek]] من نوع het-woord، فالضمير الموصول هو [[dat]]."},{"q":"«Dit is het probleem ___ ik over praat.» أي خيار؟","options":["waarover","waarin","die","wat"],"exp":"الفعل [[praten over]] يأخذ حرف الجر [[over]]، لذا التركيب الصحيح هو [[waarover]]."},{"exp":"[[mensen]] جمع، لذا الضمير الموصول هو دائمًا [[die]] (حتى لو كان مفرده het-woord)."},{"q":"لماذا استُخدم wie لا die في جملة «De vrouw aan wie ik het boek gaf»؟","options":["لأن حرف جر (aan) ورد قبل الضمير الموصول وهو يشير إلى شخص.","لأن vrouw جمع.","لأن wie تُستخدم دائمًا بدلًا من die.","لا يوجد سبب، كلاهما صحيح."],"exp":"عندما تشير الجملة الموصولة إلى شخص ويكون حرف الجر لازمًا قبل الضمير الموصول، يجب استخدام [[حرف جر + wie]]، لا die."}]},"b1-te-infinitief":{"title":"تركيب te + المصدر (te + infinitief)","sum":"تحتاج بعض الأفعال والعبارات الهولندية إلى أن يأتي الفعل الثاني بصيغة [[te + infinitief]]، مثل [[proberen te]] و[[beginnen te]] وتركيب [[om ... te]].","blocks":[{"h":"صيغة om...te للتعبير عن الهدف","p":"يُستخدم تركيب [[om ... te + infinitief]] للتعبير عن الهدف أو الغاية من فعل ما، وهو يقابل «لكي...» في العربية. تأتي [[om]] في بداية هذا الجزء، ويقع الفعل في صيغة المصدر مع [[te]] في النهاية.","ex":["أتعلّم الهولندية لكي أتمكن من العمل في هولندا.","يدّخر المال لكي يشتري بيتًا."],"tip":"إذا كان لدينا فعلان في هذا التركيب (مثل kunnen werken)، فإن te تأتي فقط قبل الفعل الرئيسي/المصدر الثاني: om te kunnen werken."},{"h":"الأفعال التي يتبعها te + infinitief","p":"بعض الأفعال تكون دائمًا مصحوبة بـ [[te]] قبل الفعل الثاني، منها [[proberen te]] (المحاولة)، و[[beginnen te]] (البدء في)، و[[hoeven te]] (عدم الحاجة إلى)، و[[vergeten te]] (النسيان)، و[[besluiten te]] (اتخاذ القرار).","list":["[[proberen te]] = المحاولة","[[beginnen te]] = البدء في","[[hoeven te]] = عدم الحاجة (في الجمل المنفية)","[[vergeten te]] = النسيان","[[besluiten te]] = اتخاذ القرار"],"ex":["أحاول أن أمارس الرياضة كل يوم.","نسي أن يتصل بأمه."]},{"h":"الفرق مع الأفعال الوجهية (المصدر البسيط بلا te)","p":"بعد الأفعال الوجهية ([[modale werkwoorden]]) مثل [[kunnen]] و[[mogen]] و[[moeten]] و[[willen]] و[[zullen]]، وكذلك بعد [[gaan]] و[[blijven]] و[[komen]] و[[laten]]، يأتي الفعل الثاني بصيغة المصدر البسيط بلا [[te]].","table":{"head":["الفئة","مثال"],"rows":[["مع te","Hij probeert te slapen."],["بلا te (فعل وجهي)","Hij kan slapen."],["بلا te (gaan/komen/blijven)","Hij gaat slapen."]]},"ex":["أريد أن أذهب إلى الفراش مبكرًا الليلة.","سننتظر هنا."],"tip":"خطأ شائع: لا تَقُل «Hij kan te slapen» — الأفعال الوجهية لا تأخذ te أبدًا."},{"h":"hoeven te في الجمل المنفية","p":"يُستخدم الفعل [[hoeven te]] تقريبًا دائمًا في الجمل المنفية أو مع [[niet]]/[[geen]]، ويعني «عدم الحاجة إلى»، بخلاف [[moeten]] الذي يُستخدم للدلالة على «الوجوب».","ex":["لست مضطرًا لفعل هذا.","ليسوا مضطرين للعمل غدًا."]}],"ex":[{"q":"أي خيار هو الصحيح؟ «Hij leert elke dag Nederlands ___ beter te spreken.»","options":["om","te","voor","dat"],"exp":"للتعبير عن الهدف يُستخدم تركيب [[om ... te]]."},{"exp":"يُستخدم الفعل [[proberen]] مع [[te + infinitief]]."},{"q":"أي جملة صحيحة نحويًا؟","options":["Hij kan goed zwemmen.","Hij kan goed te zwemmen.","Hij kan te goed zwemmen.","Hij te kan goed zwemmen."],"exp":"بعد الفعل الوجهي [[kunnen]]، يأتي الفعل الثاني بلا [[te]] وبصيغة المصدر البسيط."},{"exp":"[[hoeven te]] في الجملة المنفية تعني «عدم الحاجة»؛ الفاعل المفرد je ← hoeft."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «استيقظت مبكرًا لكي لا أفوّت القطار».","exp":"تركيب [[om ... te]] للتعبير عن الهدف: يأتي الفعل بصيغة المصدر [[missen]] مع [[te]] في النهاية."},{"q":"أي فعل لا يحتاج إلى te بعده؟","options":["gaan","proberen","beginnen","vergeten"],"exp":"[[gaan]] تُستخدم كالأفعال الوجهية بلا [[te]]: «Hij gaat slapen.»"},{"exp":"[[vergeten te]] = النسيان (أن)، تُستخدم مع te + infinitief."},{"q":"ما الفرق بين hoeven te وmoeten؟","options":["hoeven te تعني عدم الضرورة (وتُستخدم عادة في الجملة المنفية)، وmoeten تعني الضرورة/الوجوب.","لا فرق بينهما.","hoeven te تُستخدم فقط في الجملة المثبتة.","moeten تأتي دائمًا مع te."],"exp":"تُستخدم [[hoeven te]] عادة مع النفي للدلالة على «عدم الحاجة»، و[[moeten]] للدلالة على «الوجوب»."},{"exp":"[[besluiten te]] = اتخاذ القرار، وتُستخدم مع te + infinitief."}]},"b1-voorwaardelijke-wijs":{"title":"صيغة الشرط (zou/zouden + المصدر)","sum":"تُبنى صيغة الشرط الهولندية من [[zou]]/[[zouden]] + الفعل في صيغة المصدر، وتُستخدم للتعبير عن الشروط الحقيقية وغير الحقيقية مع جمل [[als]].","blocks":[{"h":"بنية zou/zouden","p":"[[zou]] (للمفرد) و[[zouden]] (للجمع) هما الفعلان المساعدان لصيغة الشرط، ويأتيان مع الفعل الرئيسي بصيغة المصدر في نهاية الجملة: **Ik zou dat niet doen.**","table":{"head":["الفاعل","zou/zouden"],"rows":[["ik, jij/u, hij/zij","zou"],["wij, jullie, zij","zouden"]]},"ex":["أحب أن أسافر إلى باريس (لو أمكن).","كنا سنحل تلك المشكلة بطريقة أخرى."]},{"h":"الشرط الحقيقي (reële conditie)","p":"عندما يكون الشرط قابلًا للتحقق وحقيقيًا، تأتي جملة [[als]] بصيغة الزمن الحاضر، ويمكن أن تكون الجملة الرئيسية بصيغة الحاضر/المستقبل أو الأمر؛ ولا حاجة إلى [[zou]].","ex":["إذا أمطرت، سآخذ مظلة.","إذا كان لديك وقت، يمكنك أن تساعدني."],"tip":"في الشرط الحقيقي، لا حاجة إلى الفعل المساعد [[zou]]؛ يُستخدم فقط الزمن الحاضر البسيط."},{"h":"الشرط غير الحقيقي (irreële conditie) وzou","p":"للشروط غير الحقيقية أو الافتراضية (أمر لم يتحقق الآن أو في الماضي)، تأتي جملة [[als]] بصيغة [[verleden tijd]] (الماضي البسيط)، وتُبنى الجملة الرئيسية من [[zou/zouden]] + المصدر.","ex":["لو كنت غنيًا، لاشتريت بيتًا (لكنني لست كذلك).","لو كان لديهم وقت أكثر، لكانوا سافروا أكثر."],"tip":"للشروط غير الحقيقية المتعلقة بالماضي، تُستخدم [[als]] + الماضي التام البعيد مع [[zou/zouden hebben/zijn]] + الفعل الثالث: Als ik het geweten had, zou ik anders gehandeld hebben."},{"h":"موضع الفعل: als في بداية الجملة أو وسطها","p":"إذا وردت جملة [[als]] في بداية الجملة، فإن الجملة الرئيسية بعدها تبدأ بفعل (انقلاب في ترتيب الفاعل والفعل)، لأن جملة [[als]] نفسها تحتل الموضع الأول.","ex":["لو كان الجو جميلًا، لذهبنا إلى الحديقة.","كنا سنذهب إلى الحديقة لو كان الجو جميلًا."],"tip":"كلا الترتيبين (als في الأول أو في الثاني) صحيحان، لكن عندما تأتي als أولًا يجب أن يأتي الفعل مباشرة بعد الفاصلة."}],"ex":[{"q":"أي خيار صحيح للشرط غير الحقيقي؟ «Als ik meer geld ___, zou ik een auto kopen.»","options":["had","heb","had gehad","zou hebben"],"exp":"في الشرط غير الحقيقي، تأتي جملة als بصيغة [[verleden tijd]] (had)، وتأتي الجملة الرئيسية بـ [[zou]] + المصدر."},{"exp":"هذا شرط حقيقي (من المحتمل أن تمطر غدًا)، لذا يُستخدم الزمن الحاضر البسيط، لا zou."},{"q":"أي جملة تُظهر الشرط غير الحقيقي الصحيح؟","options":["Als ik jou was, zou ik dat niet zeggen.","Als ik jou ben, zal ik dat niet zeggen.","Als ik jou was, zeg ik dat niet.","Als ik jou zou zijn, zeg ik dat niet."],"exp":"البنية الصحيحة: als + verleden tijd (was) ... zou + infinitief (zou zeggen)."},{"exp":"الفاعل الجمع (wij) يحتاج إلى الفعل المساعد الجمعي [[zouden]]."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «لو كان لدي وقت، لساعدتك».","exp":"لأن الجملة بدأت بـ als، تبدأ الجملة الرئيسية بفعل (zou): انقلاب في ترتيب الفاعل والفعل."},{"q":"«Als ik het eerder geweten had, ___ ik anders gehandeld hebben.» أي خيار؟","options":["zou","had","ben","zal"],"exp":"للشرط غير الحقيقي المتعلق بالماضي، تُبنى الجملة الرئيسية من [[zou/zouden]] + hebben/zijn + الفعل الثالث."},{"exp":"يُعبَّر عن الشرط الحقيقي بالزمن الحاضر البسيط (bent)، لأنه ممكن التحقق فعليًا."},{"q":"لماذا استُخدمت zou في جملة «Zou je me kunnen helpen?»؟","options":["للتعبير عن طلب مهذب وغير مباشر","للتعبير عن زمن المستقبل","للتعبير عن حقيقة عامة","لأن الفعل kunnen يأتي دائمًا مع zou"],"exp":"تُستخدم [[zou]] + kunnen غالبًا لصياغة طلبات مهذبة، لا للشرط فقط."},{"exp":"العبارة الثابتة «als ik jou was» (لو كنت مكانك) تُستخدم مع [[was]]، حتى مع فاعل ik."}]},"b1-lijdende-vorm":{"title":"صيغة المجهول (Lijdende Vorm)","sum":"تُبنى صيغة المجهول من [[worden]] (للعملية الجارية) أو [[zijn]] (للنتيجة/الحالة) + الفعل الثالث؛ ويُعرَّف الفاعل المنفِّذ للفعل بواسطة [[door]].","blocks":[{"h":"worden-passief: العملية والفعل","p":"للتعبير عن أن فعلًا ما يجري تنفيذه أو يُنفَّذ (مع التركيز على العملية)، نستخدم [[worden]] كفعل مساعد + الفعل الثالث. وهذا هو أكثر أنواع المجهول شيوعًا في الهولندية.","table":{"head":["الزمن","البنية","مثال"],"rows":[["الحاضر","word(t)/worden + الفعل الثالث","Het huis wordt gebouwd."],["الماضي","werd(en) + الفعل الثالث","Het huis werd gebouwd."]]},"ex":["يُقرأ هذا الكتاب من قبل أناس كثيرين.","أُرسلت الرسالة بالأمس."],"tip":"يجب أن يتوافق الفعل المساعد [[worden]] مع زمن الجملة: الحاضر = word/wordt/worden، الماضي = werd/werden."},{"h":"zijn-passief: النتيجة والحالة","p":"عندما يكون التركيز على النتيجة النهائية لفعل ما (لا على العملية نفسها)، تُستخدم [[zijn]] + الفعل الثالث. وهذا النوع من المجهول يصف عادة حالة اكتملت من قبل.","ex":["هذا البيت مبنيّ بالفعل (وهو الآن في تلك الحالة).","الباب مغلق (الحالة الراهنة)."],"tip":"قارن: [[De deur wordt gesloten]] (شخص ما يغلق الباب الآن؛ عملية) مقابل [[De deur is gesloten]] (الباب مغلق مسبقًا؛ نتيجة)."},{"h":"تقديم الفاعل المنفِّذ بواسطة door","p":"في جملة المجهول، إذا أردنا أن نذكر من قام بالفعل أو ما الذي نفّذه، نستخدم [[door]] قبل الفاعل المنفِّذ.","ex":["رُسمت هذه اللوحة على يد فنان مشهور.","يُتخذ هذا القرار من قبل المدير."]},{"h":"تحويل الجملة المبنية للمعلوم إلى المجهول","p":"لتحويل الجملة المبنية للمعلوم (active) إلى المجهول، يتحول مفعول جملة المعلوم إلى فاعل جملة المجهول، ويتغيّر الفعل إلى [[worden]] + الفعل الثالث، ويأتي الفاعل الأصلي (إن ذُكر) بعد [[door]].","ex":["الطاهي يُحضّر الطعام. يُحضَّر الطعام من قبل الطاهي."],"tip":"الأفعال التي لا تأخذ مفعولًا أو اللازمة (onovergankelijk)، مثل [[slapen]] أو [[komen]]، لا تُصاغ عادة في المجهول."}],"ex":[{"q":"أي جملة مجهول (worden-passief) هي الصحيحة؟ (هذا البيت يُبنى)","options":["Het huis wordt gebouwd.","Het huis is gebouwd.","Het huis bouwt.","Het huis heeft gebouwd."],"exp":"للعملية الجارية في زمن الحاضر، تُستخدم [[wordt]] + الفعل الثالث."},{"exp":"للماضي في worden-passief، يُستخدم الفعل المساعد [[werd]] (للمفرد)."},{"q":"ما الفرق بين «De deur wordt gesloten» و«De deur is gesloten»؟","options":["الأولى تُظهر عملية الإغلاق الجارية، والثانية تُظهر نتيجة/حالة كون الباب مغلقًا.","لا فرق بينهما.","الأولى في الماضي، والثانية في الحاضر.","الثانية ليست مجهولًا."],"exp":"[[wordt]] = worden-passief للعملية؛ [[is]] = zijn-passief للنتيجة/الحالة النهائية."},{"exp":"الفاعل المفرد (dit gebouw) + زمن الحاضر ← [[wordt]]."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «يقرأ هذا الكتاب ملايين الأشخاص».","exp":"بنية المجهول: الفاعل الجديد + wordt + (door + الفاعل الأصلي) + الفعل الثالث."},{"q":"حوّل الجملة المبنية للمعلوم «De regering neemt de beslissing.» إلى المجهول.","options":["De beslissing wordt door de regering genomen.","De regering wordt de beslissing genomen.","De beslissing is de regering genomen.","De beslissing neemt door de regering."],"exp":"يصبح مفعول جملة المعلوم (de beslissing) فاعلًا في جملة المجهول، ويأتي الفاعل الأصلي بعد [[door]]."},{"exp":"الفعل الثالث لـ [[oplossen]] هو [[opgelost]]؛ وبصيغة zijn-passief تُبيَّن النتيجة/الحالة النهائية."},{"q":"أي فعل لا يمكن عادة تحويله إلى المجهول؟","options":["slapen","bouwen","lezen","schrijven"],"exp":"الفعل اللازم (onovergankelijk) مثل [[slapen]] لا يأخذ مفعولًا، فلا يمكن تحويله إلى المجهول."},{"exp":"الفاعل الجمع (veel huizen) يأتي مع الفعل المساعد الجمعي [[worden]]."}]},"b1-vaste-voorzetsels":{"title":"الأفعال المرتبطة بحرف جر ثابت","sum":"كثير من الأفعال الهولندية ترتبط بحرف جر ثابت، مثل [[wachten op]] و[[houden van]] و[[denken aan]]؛ وللإشارة إلى هذا التركيب أو السؤال عنه، يُستخدم [[er/waar + حرف جر]].","blocks":[{"h":"أفعال شائعة مع حرف جر ثابت","p":"كثير من الأفعال الهولندية ترتبط دائمًا بحرف جر محدد يُكمل معنى الفعل، ويجب حفظه مع الفعل.","list":["[[wachten op]] = انتظار شيء ما","[[houden van]] = الإعجاب/الحب","[[denken aan]] = التفكير في","[[zich ergeren aan]] = الانزعاج من","[[geloven in]] = الإيمان بـ","[[zorgen voor]] = الاعتناء بـ"],"ex":["أنا أنتظر الحافلة.","هي تحب الشوكولاتة."],"tip":"يجب حفظ هذه التراكيب، لأن حرف الجر في العربية غالبًا ما يختلف أو يمكن حذفه، بينما هو إلزامي في الهولندية."},{"h":"er + حرف جر للإشارة إلى شيء سبق ذكره","p":"عندما نريد الإشارة إلى مفهوم سبق ذكره بحرف جر ثابت دون تكرار الاسم، نضع [[er]] قبل حرف الجر، مثل [[erop]] (عليه/له)، و[[eraan]] (إليه)، و[[ervan]] (منه).","ex":["هل تفكر في الموعد؟ نعم، أفكر فيه.","هل تنتظر الجواب؟ نعم، أنتظره."],"tip":"إذا كان المرجع شخصًا، يُستخدم [[حرف جر + ضمير شخصي]] بدلًا من [[er + حرف جر]]: denk aan hem/haar، لا eraan."},{"h":"تكوين السؤال بـ waar + حرف جر","p":"لطرح سؤال عن شيء يرتبط بحرف جر ثابت، نركّب [[waar]] مع ذلك الحرف، مثل [[waarop]] (على ماذا)، و[[waaraan]] (إلى ماذا)، و[[waarvan]] (من ماذا).","ex":["ماذا تنتظر؟","فيمَ تفكر؟"],"tip":"للأشخاص، يُستخدم [[حرف جر + wie]] بدلًا من [[waar + حرف جر]]: Aan wie denk je؟ (لا waaraan)."},{"h":"قائمة بأفعال أكثر شيوعًا","p":"هناك أفعال أخرى مع حرف جر ثابت شائعة في مستوى B1، ويجب تعلمها مع حرف جرها لا بمفردها.","list":["[[praten over]] = التحدث عن","[[dromen van]] = الحلم بـ","[[genieten van]] = الاستمتاع بـ","[[twijfelen aan]] = الشك في","[[rekenen op]] = الاعتماد على"],"ex":["غالبًا ما نتحدث عن السياسة.","أشك في خطته."]}],"ex":[{"q":"أي حرف جر يرافق الفعل wachten؟","options":["op","aan","van","in"],"exp":"[[wachten op]] = الانتظار لـ، وهو تركيب ثابت."},{"exp":"[[houden van]] = الحب/الإعجاب، وحرف الجر الثابت هو [[van]]."},{"q":"«Denk je aan je moeder? Ja, ik denk ___.» أي خيار؟","options":["eraan","erop","ervan","aan het"],"exp":"للإشارة إلى مرجع سبق ذكره بـ [[aan]]، تُستخدم [[eraan]]."},{"exp":"الفعل [[wachten op]] يتحول في السؤال مع waar إلى [[waarop]]."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «غالبًا ما أفكر في العطلة».","exp":"[[denken aan]] = التفكير في؛ يأتي الظرف [[vaak]] بعد الفعل وقبل حرف الجر."},{"q":"أي جملة صحيحة للإشارة إلى شخص (لا شيء)؟","options":["Ik denk vaak aan haar.","Ik denk er vaak aan haar.","Ik denk vaak eraan haar.","Ik denk haar vaak aan."],"exp":"لا تُستخدم [[er + حرف جر]] للأشخاص؛ بل يُستخدم بدلًا منها [[حرف جر + ضمير شخصي]]: aan haar."},{"exp":"[[twijfelen aan]] = الشك في؛ تصريف الفعل مع الفاعل ik: twijfel."},{"q":"«Waar praten jullie over?» عن أي فعل ثابت يدور هذا السؤال؟","options":["praten over","praten aan","praten van","praten op"],"exp":"[[praten over]] = التحدث عن؛ وسؤاله هو [[waarover]]."},{"exp":"[[genieten van]] = الاستمتاع بـ، وحرف الجر الثابت هو [[van]]."}]},"b1-tmp-volgorde":{"title":"ترتيب الزمان-الحال-المكان (TMP) في الجملة","sum":"في الجملة الهولندية، تأتي ظروف الزمان والحال (الكيفية) والمكان عادة بالترتيب [[Tijd - Manier - Plaats]] (الزمان - الحال - المكان).","blocks":[{"h":"القاعدة الأساسية لـ TMP","p":"عندما يكون لدينا عدة ظروف مختلفة في جملة واحدة، يكون ترتيبها الطبيعي عادة **الزمان (Tijd) ← الحال/الكيفية (Manier) ← المكان (Plaats)**. ويمكن تذكر ذلك بالاختصار [[TMP]].","ex":["سأذهب غدًا بالقطار إلى أمستردام.","هي تعمل بجد كل يوم في المكتب."],"tip":"إذا غاب أحد هذه العناصر الثلاثة، تبقى البقية بالترتيب نفسه؛ إذ يُحذف فقط الجزء غير الموجود."},{"h":"أمثلة إضافية على ترتيب TMP","p":"في هذه الأمثلة نرى بوضوح كيف تأخذ كل فئة من الظروف (الزمان، الحال، المكان) موضعها الصحيح.","table":{"head":["الزمان","الحال","المكان"],"rows":[["morgen","met de trein","naar Amsterdam"],["elke dag","hard","op kantoor"],["vanavond","samen","in het restaurant"]]},"ex":["سنأكل الليلة معًا في المطعم."]},{"h":"استثناءات: التوكيد والموضع الأول في الجملة","p":"للتأكيد أكثر على الزمان أو المكان، يمكن نقله إلى بداية الجملة (الموضع الأول، قبل الفعل). وفي هذه الحالة يحافظ الفعل على موضعه الثاني (قاعدة V2)، بينما تبقى بقية الظروف بالترتيب نفسه TMP.","ex":["غدًا سأذهب بالقطار إلى أمستردام.","إلى أمستردام، سأذهب غدًا بالقطار."],"tip":"عندما يُنقل أحد الظروف إلى بداية الجملة، يأتي الفاعل بعد الفعل (انقلاب في الترتيب)، لأن الفعل يجب أن يحافظ على الموضع الثاني في الجملة."},{"h":"موضع ظرف المكان بالنسبة إلى المفعول المباشر","p":"يأتي ظرف المكان عادة بعد المفعول المباشر (إذا كان قصيرًا ومحددًا). وفي مستوى B1، من الأفضل اتباع القاعدة الأساسية TMP والإبقاء على ظروف المكان قريبة من نهاية الجملة.","ex":["سيضع الكتاب غدًا بهدوء على الطاولة."]}],"ex":[{"q":"أي ترتيب للكلمات يوافق قاعدة TMP الصحيحة؟","options":["Ik ga morgen met de bus naar school.","Ik ga met de bus morgen naar school.","Ik ga naar school morgen met de bus.","Ik ga met de bus naar school morgen."],"exp":"الترتيب الصحيح: الزمان (morgen) ← الحال (met de bus) ← المكان (naar school)."},{"exp":"حرف جر المكان لكلمة «المكتب» في الهولندية هو [[op kantoor]]."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «سنذهب الليلة معًا إلى السينما».","exp":"ترتيب TMP: الزمان (vanavond) ← الحال (samen) ← المكان (naar de bioscoop)."},{"q":"في جملة «Morgen ga ik naar het park.»، لماذا جاء الفاعل (ik) بعد الفعل؟","options":["لأن ظرف الزمان (morgen) أخذ الموضع الأول في الجملة، ويجب أن يبقى الفعل في الموضع الثاني.","لأن الفاعل يأتي دائمًا بعد الفعل.","لأن morgen فعل.","لا يوجد سبب خاص."],"exp":"بحسب قاعدة V2 في الهولندية، يحتل الفعل دائمًا الموضع الثاني في الجملة؛ فعندما يأتي الظرف في البداية، يُنقل الفاعل إلى ما بعد الفعل."},{"exp":"حرف جر المكان [[door het park]] يعني «عبر الحديقة»، ويقع في جزء المكان من الجملة."},{"q":"أي جملة ليس لها الترتيب الصحيح؟","options":["Ik ga naar Amsterdam morgen met de trein.","Ik ga morgen met de trein naar Amsterdam.","Morgen ga ik met de trein naar Amsterdam.","Met de trein ga ik morgen naar Amsterdam."],"exp":"في الخيار الأول لم يُراعَ ترتيب TMP (جاء المكان قبل الزمان والحال)."},{"exp":"يجب أن يأتي ظرف الزمان [[vanavond]] قبل الحال/المكان."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «هو يعمل بجد كل يوم في المصنع».","exp":"ترتيب TMP: الزمان (elke dag) ← الحال (hard) ← المكان (in de fabriek)."},{"q":"ما معنى الاختصار TMP في قواعد اللغة الهولندية؟","options":["Tijd, Manier, Plaats (الزمان، الحال، المكان)","Tijd, Modus, Persoon","Tekst, Manier, Positie","Tijd, Mening, Plaats"],"exp":"TMP هو اختصار للترتيب المعتاد للظروف في الجملة الهولندية: الزمان، الحال (الكيفية)، المكان."}]},"b1-indirecte-rede":{"title":"الكلام المنقول غير المباشر (Indirecte Rede)","sum":"في الكلام المنقول غير المباشر الهولندي، تُفتتح الجملة بـ [[dat]] أو بأدوات الاستفهام، وغالبًا ما يتراجع زمن الفعل درجة واحدة إلى الوراء (tense shift).","blocks":[{"h":"نقل الجمل الخبرية بـ dat","p":"لنقل الجمل الخبرية (غير الاستفهامية) بصيغة غير مباشرة، نستخدم [[dat]]، ويُنقل الفعل إلى نهاية الجملة الفرعية.","ex":["يقول: «أنا متعب.» يقول إنه متعب.","قالت إنها ستأتي غدًا."],"tip":"لا يتغيّر زمن الفعل الرئيسي ([[zegt/zei]])؛ بل قد يتغيّر فقط الفعل داخل جملة [[dat]] تبعًا لزمن الفعل الرئيسي."},{"h":"تحول زمن الفعل (tense shift)","p":"عندما يكون فعل النقل الرئيسي في الماضي ([[zei]]، [[vertelde]])، فإن الفعل داخل جملة [[dat]] يتراجع هو أيضًا عادة درجة واحدة إلى الوراء: يتحول الزمن الحاضر إلى الماضي البسيط، ويتحول الماضي البسيط إلى الماضي التام البعيد.","table":{"head":["الكلام المباشر","الكلام غير المباشر (بعد فعل في الماضي)"],"rows":[["'Ik werk hard.'","dat hij hard werkte."],["'Ik heb het gedaan.'","dat hij het gedaan had."],["'Ik zal komen.'","dat hij zou komen."]]},"ex":["قال: «أعمل بجد.» قال إنه كان يعمل بجد."],"tip":"إذا كان الفعل الرئيسي في زمن الحاضر ([[zegt]])، فلا حاجة عادة إلى تغيير الزمن."},{"h":"نقل الأسئلة بأداة استفهام أو of","p":"لنقل الأسئلة التي تبدأ بأداة استفهام (wie، wat، waar، wanneer، hoe، waarom)، تُحفظ الأداة نفسها. أما لأسئلة نعم/لا (بلا أداة استفهام)، فنستخدم [[of]] (هل).","ex":["سأل: «أين تسكن؟» سأل أين أسكن.","سألت: «هل ستأتي غدًا؟» سألت عما إذا كنت سآتي غدًا."],"tip":"في كلتا الحالتين، يُنقل الفعل إلى نهاية الجملة الفرعية، كما في الجمل مع [[dat]]."},{"h":"نقل الأوامر والطلبات بـ om...te","p":"لنقل أمر أو طلب (صيغة الأمر) بشكل غير مباشر، يُستخدم عادة تركيب [[om ... te + infinitief]]، لا [[dat]].","ex":["قال: «أغلق الباب.» طلب مني أن أغلق الباب.","طلب منا المعلم أن نلتزم الصمت."]}],"ex":[{"q":"ما هو الكلام غير المباشر لجملة «Ik ben ziek.» بعد «Hij zei dat...»؟","options":["hij ziek was.","hij ziek is.","hij ziek was geweest.","hij was ziek."],"exp":"لأن الفعل الرئيسي ([[zei]]) في الماضي، يتحول الزمن الحاضر داخل القول ([[ben]]) إلى الماضي البسيط ([[was]])؛ ويأتي الفعل في نهاية جملة dat."},{"exp":"لنقل الجمل الخبرية تُستخدم أداة الربط [[dat]]."},{"q":"ما هو النقل غير المباشر لسؤال «Waar woon je?»؟","options":["Hij vroeg waar ik woonde.","Hij vroeg dat waar ik woonde.","Hij vroeg of waar ik woonde.","Hij vroeg waar woon ik."],"exp":"للأسئلة التي فيها أداة استفهام، تُحفظ الأداة نفسها (waar) ويذهب الفعل إلى نهاية الجملة؛ ولا تُستخدم dat أو of."},{"exp":"لنقل أسئلة نعم/لا (بلا أداة استفهام)، تُستخدم [[of]]."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «قال إنه سيأتي غدًا» (كلام منقول غير مباشر).","exp":"البنية: الفاعل + zei + dat + فاعل الجملة الفرعية + ... + الفعل المساعد (zou) + الفعل الرئيسي (komen) في النهاية."},{"q":"ما هو الشكل الصحيح لنقل الأمر «Doe de deur dicht.»؟","options":["Hij vroeg mij om de deur dicht te doen.","Hij vroeg mij dat de deur dicht doen.","Hij zei dat doe de deur dicht.","Hij vroeg of ik de deur dichtdoe."],"exp":"لنقل أمر/طلب، يُستخدم تركيب [[om ... te + infinitief]]."},{"exp":"بما أن القول الأصلي كان بصيغة الماضي التام الحاضر (heb gelezen) وفعل النقل الرئيسي في الماضي، فإنه يتراجع درجة واحدة إلى الماضي التام البعيد (had gelezen)."},{"q":"أي جملة صحيحة بخصوص tense shift؟","options":["عندما يكون فعل النقل الرئيسي في الماضي، يتراجع زمن الفعل داخل القول هو أيضًا عادة درجة واحدة إلى الوراء.","لا يتغيّر زمن الفعل أبدًا في الكلام المنقول غير المباشر.","الأفعال الوجهية فقط هي التي يحدث لها tense shift.","لا يحدث tense shift إلا في اللغة المكتوبة."],"exp":"القاعدة العامة: الفعل الرئيسي في الماضي ← الفعل داخل القول يتراجع هو أيضًا درجة واحدة (الحاضر←الماضي، الماضي←الماضي التام البعيد)."},{"exp":"بنية نقل الطلب: [[om ... te + infinitief]]؛ تأتي te قبل الفعل في صيغة المصدر zijn."}]},"b1-toen-als-wanneer":{"title":"الفرق بين toen وals وwanneer","sum":"تُستخدم [[toen]] لحدث محدد في الماضي، و[[als]] للأحداث المتكررة والشرط، و[[wanneer]] للسؤال أو للأحداث المتكررة في الحاضر/المستقبل.","blocks":[{"h":"toen: لحظة محددة في الماضي","p":"تُستخدم [[toen]] فقط لحدث **وقع مرة واحدة ومحدد** في زمن الماضي؛ ولا تُستخدم أبدًا للحاضر أو المستقبل أو للأحداث المتكررة.","ex":["عندما كنت في العاشرة من عمري، انتقلنا إلى روتردام.","عندما رن الهاتف، كنت للتو تحت الدش."],"tip":"إذا كانت الجملة في زمن الماضي وتتحدث عن حدث معين (غير متكرر)، فإن [[toen]] هي الصحيحة دائمًا، لا [[als]]."},{"h":"als: التكرار في الماضي والشرط","p":"تُستخدم [[als]] في زمن الماضي للأحداث **المتكررة أو المعتادة** (وتقابل «كلما»)، كما تُستخدم للتعبير عن الشرط في أي زمن (الحاضر، المستقبل، أو حتى الماضي المتكرر).","ex":["عندما (كلما) كنت صغيرًا، كنت ألعب في الخارج غالبًا.","إذا أمطرت، سأبقى في الداخل."],"tip":"علامات التكرار في الماضي هي عادة كلمات مثل [[vaak]] و[[altijd]] و[[elke keer]] التي ترافق [[als]]."},{"h":"wanneer: السؤال والتكرار في الحاضر/المستقبل","p":"تُستخدم [[wanneer]] عادة **لطرح سؤال** عن الزمن (متى؟)، كما يمكن استخدامها مثل [[als]] للأحداث المتكررة في زمن الحاضر أو المستقبل (في الكتابة الأكثر رسمية).","ex":["متى تأتي إلى البيت؟","كلما أمطرت، أحمل مظلة."],"tip":"في الكلام اليومي، غالبًا ما تُفضَّل [[als]] على [[wanneer]] للتكرار في الحاضر/المستقبل؛ إذ تبدو [[wanneer]] أكثر رسمية."},{"h":"جدول مقارنة سريع","p":"لتسهيل الحفظ، يلخّص هذا الجدول استخدام الكلمات الثلاث.","table":{"head":["الكلمة","الاستخدام","مثال"],"rows":[["toen","مرة واحدة، ماضٍ","Toen ik aankwam, regende het."],["als","تكرار (ماضٍ/حاضر/مستقبل) أو شرط","Als ik moe ben, ga ik slapen."],["wanneer","سؤال؛ أو تكرار (رسمي)","Wanneer ga je op vakantie?"]]}}],"ex":[{"q":"أي خيار هو الصحيح؟ «___ ik klein was, woonden we in Utrecht.»","options":["Toen","Als","Wanneer","Of"],"exp":"بما أن هذه فترة محددة ووقعت مرة واحدة في الماضي (وليست متكررة)، يجب استخدام [[toen]]."},{"exp":"للحدث المتكرر في الماضي (وتدل عليه كلمة altijd)، تُستخدم [[als]]، لا toen."},{"q":"أي جملة صحيحة للسؤال «متى تذهب إلى السينما؟»","options":["Wanneer ga je naar de bioscoop?","Toen ga je naar de bioscoop?","Als ga je naar de bioscoop?","Of ga je naar de bioscoop?"],"exp":"لتكوين سؤال عن الزمن تُستخدم [[wanneer]]."},{"exp":"هذا حدث محدد ووقع مرة واحدة، لذا [[toen]] هي الصحيحة."},{"q":"لماذا جملة «Als ik klein was, ging ik altijd met mijn opa wandelen.» صحيحة بـ als، لا toen؟","options":["لأن هذا فعل متكرر/عادة في الماضي (وعلامته كلمة altijd).","لأن als أصح دائمًا من toen.","لأن الجملة عن المستقبل.","لا يوجد سبب؛ كلاهما متطابقان تمامًا."],"exp":"تُستخدم [[als]] في الماضي للتكرار/العادة؛ أما [[toen]] فهي فقط لحدث محدد ووقع مرة واحدة."},{"exp":"في السؤال غير المباشر عن الزمن، تُستخدم [[wanneer]]."},{"q":"ابحث عن الترتيب الصحيح للكلمات لجملة «عندما وصلت إلى المحطة، كان القطار قد رحل».","exp":"بما أنها لحظة محددة في الماضي، تُستخدم [[toen]]؛ ويأتي فعل الجملة الفرعية (aankwam) في نهاية ذلك الجزء."},{"q":"أي جملة غير صحيحة؟","options":["Toen het regent, blijf ik binnen.","Als het regent, blijf ik binnen.","Toen het regende, bleef ik binnen.","Als het regende, bleef ik altijd binnen."],"exp":"لا تُستخدم [[toen]] أبدًا لزمن الحاضر؛ ويجب أن تكون الجملة الأولى بـ [[als]]."},{"q":"متى يمكننا استخدام wanneer بدلًا من als في الماضي؟","options":["أبدًا؛ للحدث المتكرر في الماضي يجب استخدام als، لا wanneer.","يمكن دائمًا استبدال als بـ wanneer.","تُستخدم wanneer فقط في الماضي.","toen وwanneer قابلتان للتبادل دائمًا."],"exp":"تُستخدم [[wanneer]] للسؤال أو التكرار في الحاضر/المستقبل؛ أما للتكرار في الماضي فيجب استخدام [[als]]، لا wanneer."}]},"b2-lijdende-vorm-varianten":{"title":"صيغة المجهول: الحالات المتقدمة","sum":"بالإضافة إلى المجهول بـ[[worden]] والمجهول بـ[[zijn]]، يمكن تكوين صيغة المجهول أيضاً مع الأفعال الوجهية ([[moeten worden gedaan]])، مع [[te + infinitief]] ([[te lezen zijn]])، وبشكل غير شخصي ([[er wordt gedanst]]).","blocks":[{"h":"مراجعة: المجهول بـ[[worden]] مقابل المجهول بـ[[zijn]]","p":"توجد في اللغة الهولندية نوعان من صيغة المجهول. **المجهول بـ[[worden]]** يشير إلى **فعل قيد الحدوث** (مجهول الفعل)، مثل [[De deur wordt geopend]] (شخص ما يفتح الباب الآن). **المجهول بـ[[zijn]]** يشير إلى **نتيجة مكتملة/حالة** (مجهول الحالة)، مثل [[De deur is geopend]] (الباب مفتوح الآن، نتيجة العمل).","table":{"head":["نوع المجهول","البنية","الاستخدام"],"rows":[["المجهول بـworden","[[worden/werd + voltooid deelwoord]]","فعل قيد الحدوث أو واقعة"],["المجهول بـzijn","[[zijn/was + voltooid deelwoord]]","نتيجة أو حالة بعد الفعل"]]},"ex":["تُغسَل السيارة كل أسبوع (فعل متكرر).","السيارة قد غُسلت (هي نظيفة الآن؛ نتيجة).","كُتب التقرير أمس (فعل في الماضي).","كان التقرير قد كُتب قبل أن أصل (حالة/نتيجة في الماضي)."]},{"h":"المجهول الوجهي: [[moeten/kunnen/mogen + worden + voltooid deelwoord]]","p":"عندما يُدمَج فعل وجهي (مثل [[moeten]]، [[kunnen]]، [[mogen]]) مع جملة مجهولة، تكون البنية كما يلي: الفعل الوجهي المُصرَّف في الموضع الثاني من الجملة + في النهاية مجموعة الأفعال التي تضم صفة الحال التامة و[[worden]]. مثل [[Het werk moet gedaan worden]] (يجب إنجاز هذا العمل). كلا الترتيبين [[gedaan worden]] و[[worden gedaan]] شائعان في مجموعة الأفعال.","ex":["يجب إنجاز هذا العمل غداً.","كان يمكن تجنب ذلك الخطأ بسهولة.","لا ينبغي اتخاذ قرارات كهذه دون سبب."]},{"h":"المجهول بصيغة [[zijn + te + infinitief]]","p":"تعبّر بنية [[zijn + te + infinitief]] عن **إمكانية أو سهولة** إنجاز أمر ما، أي ما يقابل «قابل للقراءة» ونحوها في العربية. مثل [[Dit boek is goed te lezen]] أي «هذا الكتاب يُقرأ بسهولة / قابل للقراءة». في الأفعال المنفصلة (ذات السابقة الانفصالية)، توضع [[te]] بين السابقة والفعل، مثل [[op te lossen]].","ex":["هذا الكتاب قابل للقراءة بسهولة.","لم يكن النص قابلاً للفهم.","هذه المشكلة ليست قابلة للحل بسهولة."],"tip":"في الأفعال المنفصلة مثل [[oplossen]]، توضع [[te]] دائماً بين السابقة والجزء الأساسي من الفعل: [[op-te-lossen]]، وليس [[te oplossen]]."},{"h":"المجهول غير الشخصي: [[er wordt gedanst]]","p":"عندما يكون الفعل **لازماً** (لا مفعول مباشر له) ونريد التأكيد على الفعل نفسه دون ذكر فاعل، يُستخدم المجهول غير الشخصي: [[er]] + [[worden]] + صفة الحال التامة. مثل [[Er wordt hier niet gerookt]] (لا يُدخَّن هنا). وإذا بدأت الجملة بعنصر آخر، تنتقل [[er]] إلى ما بعد الفعل: [[Hier wordt niet gerookt]] أو [[Gisteravond werd er laat gewerkt]].","ex":["لا يُدخَّن هنا.","رقصوا وغنّوا طوال الليل.","عُمل حتى وقت متأخر الليلة الماضية."],"tip":"بما أنه لا يوجد فاعل منطقي في المجهول غير الشخصي (الفعل لازم)، لا يمكن تحويل هذه الجملة إلى مجهول شخصي."}],"ex":[{"q":"Het boek ___ op dit moment vertaald (de vertaler is er nu mee bezig).","options":["is","wordt","werd","zijn"],"exp":"بما أن الفعل قيد الحدوث (لا نتيجة)، يجب استخدام المجهول بـ[[worden]]: [[wordt vertaald]]."},{"q":"Nadat het werk af was, ___ het al ingeleverd (النتيجة المكتملة في الماضي).","options":["werd","wordt","was","zijn"],"exp":"هنا يُشار إلى نتيجة مكتملة في الماضي (حالة)، لذلك يُستخدم المجهول بـ[[zijn]] في صيغة الماضي، أي [[was]]."},{"exp":"في المجهول الوجهي، يأتي الفعل الوجهي (moet) ثم مجموعة [[afgemaakt worden]] أو [[worden afgemaakt]]؛ وكلا الترتيبين مقبول."},{"q":"أي جملة هي المعادل الصحيح لـ«The rules must be followed»؟","options":["De regels moeten gevolgd worden.","De regels moeten volgen worden.","De regels moeten worden gevolgen.","De regels zijn gevolgd moeten worden."],"exp":"البنية الصحيحة: الفعل الوجهي ([[moeten]]) + صفة الحال التامة ([[gevolgd]]) + [[worden]]."},{"exp":"تعبّر بنية [[zijn + te + infinitief]] عن إمكانية أو سهولة إنجاز أمر ما: [[te begrijpen]] تعني «قابل للفهم»."},{"q":"أي جملة هي نموذج للمجهول غير الشخصي؟","options":["Er wordt hard gewerkt.","Het werk wordt gedaan.","Hij wordt geholpen.","De brief werd gestuurd."],"exp":"في المجهول غير الشخصي لا يوجد فاعل منطقي والفعل لازم ([[werken]])؛ وتبدأ الجملة بـ[[er]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «عُمل حتى وقت متأخر الليلة الماضية.» (المجهول غير الشخصي)","exp":"عندما يكون عنصر آخر مثل [[Gisteravond]] في الموضع الأول من الجملة، يأتي الفاعل الشكلي [[er]] بعد الفعل، لا في بداية الجملة."},{"q":"رتّب الترتيب الصحيح: «يمكن حل هذه المشكلة بسهولة.»","exp":"في المجهول الوجهي، يمكن أن تأتي مجموعة الأفعال بترتيبين: [[opgelost worden]] أو [[worden opgelost]]."},{"exp":"عندما تبدأ الجملة بصيغة المجهول غير الشخصي، فإنها تبدأ بالفاعل الشكلي [[er]] والفعل [[worden]]."}]},"b2-deelwoorden":{"title":"صيغ الصفة الفعلية (Deelwoorden)","sum":"يمكن استخدام صيغ الصفة الفعلية للحال ([[-end]]) والماضي كـ**صفة**، أو **ظرف**، أو في قالب **جملة وصفية مختزلة**، مثل [[een lachend kind]] و[[de gesloten deur]].","blocks":[{"h":"صيغة الصفة الفعلية للحال كصفة ([[-end]])","p":"تُصاغ صيغة الصفة الفعلية للحال بإضافة [[-end]] إلى المصدر ([[lachen]] ← [[lachend]])، وتأتي قبل الاسم كالصفة. وتنطبق عليها القاعدة المعتادة لإضافة [[-e]] في نهاية الصفة: تُضاف [[-e]] دائماً قبل الاسم الجمع أو مع أداة التعريف المحددة؛ بينما تبقى دون [[-e]] قبل اسم het غير المحدد المفرد.","ex":["كان طفل ضاحك يلعب في الحديقة.","أثارت الأرقام المتناقصة قلق المحللين.","جعلت الشمس المحرقة الجو حاراً جداً."]},{"h":"صيغة الصفة الفعلية للحال كظرف","p":"يمكن لصيغة الصفة الفعلية للحال، دون أي تغيير (دون إضافة [[-e]])، أن تصف كظرف **طريقة أداء الفعل الأساسي** أو فعلاً متزامناً معه. مثل [[Lopend naar huis dacht hij aan het gesprek]] (بينما كان يمشي عائداً إلى المنزل، كان يفكر في المحادثة).","ex":["صعدت الدرج وهي تغني.","ترك الملعب وهو يلوّح بيده."]},{"h":"صيغة الصفة الفعلية للماضي كصفة","p":"يمكن أيضاً أن تأتي صيغة الصفة الفعلية للماضي (مثل [[gesloten]]، [[gebroken]]، [[gemaakt]]) قبل الاسم كصفة، لتدل على حالة **ناتجة/مجهولة**. والنقطة المهمة: صيغ الصفة الفعلية التي تنتهي بـ[[-en]] (مثل [[gesloten]]، [[gebroken]]، [[geschreven]]) **لا تأخذ أبداً** [[-e]] إضافية؛ أما تلك التي تنتهي بـ[[-d]] أو [[-t]] (مثل [[gemaakt]]) فتتبع القاعدة المعتادة للصفة.","table":{"head":["نوع صيغة الصفة الفعلية","مثال","قابلة للتغيير بـ-e؟"],"rows":[["المنتهية بـ-en (مثل gesloten)","de gesloten deur / een gesloten doos","لا، تبقى دائماً دون تغيير"],["المنتهية بـ-d/-t (مثل gemaakt)","een gemaakt plan / het gemaakte plan","نعم، وفق القاعدة المعتادة للصفة"]]},"ex":["أدهش الباب المغلق الجميع.","تمت الموافقة على الخطة المُعدَّة."]},{"h":"الجملة الوصفية المختزلة (participiale bijzin)","p":"يمكن لصيغة الصفة الفعلية للماضي في بداية الجملة أن تحل محل جملة فرعية سببية أو زمانية كاملة، خصوصاً في الأسلوب الرسمي والأدبي. مثل [[Vermoeid door de lange reis, viel hij meteen in slaap]] بدلاً من [[Omdat hij vermoeid was door de lange reis, viel hij meteen in slaap]].","ex":["خائفاً من الصوت العالي، هرب القط.","جالسةً عند النافذة، كانت تنظر إلى المطر."],"tip":"تُلاحظ هذه البنية أكثر في الكتابة الرسمية والأدبية، وهي معادلة لجملة ظرفية كاملة بـ[[omdat]] أو [[terwijl]]."}],"ex":[{"q":"Een ___ kind speelde in de tuin. (lachen، صيغة الصفة الفعلية للحال)","options":["lachend","lachende","lacht","gelachen"],"exp":"بما أن [[kind]] اسم het وجاء مع أداة التعريف غير المحددة [[een]]، تأتي صيغة الصفة الفعلية للحال دون إضافة [[-e]]: [[lachend]]."},{"q":"De ___ cijfers verontrustten de analisten. (dalen، الجمع)","options":["dalend","dalende","daalt","gedaald"],"exp":"تُضاف [[-e]] دائماً قبل الاسم الجمع: [[dalende]] cijfers."},{"exp":"تعبّر صيغة الصفة الفعلية للحال دون إضافة [[-e]]، كظرف، عن حالة متزامنة مع الفعل الأساسي."},{"q":"أي اختيار صحيح: 'de ___ deur' (sluiten، الماضي، صفة)","options":["gesloten","geslotene","sluitend","gesloten e"],"exp":"صيغة الصفة الفعلية للماضي التي تنتهي بـ[[-en]] (مثل [[gesloten]]) لا تأخذ [[-e]] أبداً، سواء مع اسم de أو اسم het."},{"q":"أي اختيار صحيح: 'een ___ plan' (maken، الماضي، اسم het، غير محدد)","options":["gemaakt","gemaakte","makend","gemaken"],"exp":"بما أن [[plan]] اسم het وجاء مع [[een]] غير المحددة، تأتي صيغة الصفة الفعلية للماضي (المنتهية بـ-t) دون [[-e]]: [[gemaakt]]."},{"exp":"مع أداة التعريف المحددة [[het]] تُضاف [[-e]] دائماً، حتى لاسم het: [[het gemaakte plan]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «خائفاً من الصوت العالي، هرب القط.»","exp":"تأتي الجملة الوصفية بصيغة الصفة الفعلية للماضي في بداية الجملة، وتُفصل عن الجملة الأساسية بفاصلة؛ وهي معادلة لـ«لأنه كان خائفاً»."},{"q":"أي جملة هي نموذج لصيغة الصفة الفعلية للحال كظرف؟","options":["Zingend liep ze de trap op.","De zingende vogels waren mooi.","Zij heeft gezongen.","Het gezang was prachtig."],"exp":"في الاختيار الأول، تصف [[Zingend]] دون أي تطابق مع اسم، كظرف، طريقة أداء الفعل الأساسي ([[liep]])."}]},"b2-nominalisatie":{"title":"التحويل إلى اسم من الفعل (Nominalisatie)","sum":"في الأسلوب **الكتابي الرسمي** الهولندي، يُستخدم غالباً التحويل إلى اسم ([[nominalisatie]]) بدلاً من الفعل، مثل [[het onderzoeken]] أو [[het onderzoek]] بدلاً من جملة فعلية كاملة.","blocks":[{"h":"التحويل إلى اسم بصيغة [[het + infinitief]]","p":"يتحول مصدر الفعل، مع أداة التعريف [[het]]، إلى اسم محايد (مجرد). تُستخدم هذه البنية عندما لا يوجد اسم مشتق شائع من ذلك الفعل، أو عندما نريد تسمية الفعل نفسه بشكل عام. مثل [[het roken]] (التدخين) أو [[het ontbreken]] (الغياب/النقص).","ex":["التدخين ممنوع هنا.","بسبب غياب الدليل، أُغلقت القضية."]},{"h":"التحويل إلى اسم بلواصق اسمية ([[-ing]]، [[-tie]] وغيرها)","p":"كثير من الأفعال لها اسم مشتق خاص بها، يُستخدم في الأسلوب الرسمي بدلاً من الجملة الفعلية: [[ontwikkelen]] ← [[ontwikkeling]]، [[informeren]] ← [[informatie]]، [[vergaderen]] ← [[vergadering]]، [[afronden]] ← [[afronding]]. وتُوصَل هذه الأسماء عادة ببقية الجملة بحرف الجر [[van]].","ex":["تقدَّم تطوير المدينة سريعاً.","بعد إتمام البحث، نُشر التقرير."]},{"h":"إعادة كتابة الجملة من الأسلوب الفعلي إلى الأسلوب الاسمي","p":"في إعادة الكتابة، يتحول فاعل الجملة الفرعية عادةً إلى تعبير [[door + اسم]]، ويتحول الفعل الأساسي إلى اسم مشتق. مثل: [[Nadat de minister het voorstel had goedgekeurd, ging de wet in]] ← [[Na de goedkeuring van het voorstel door de minister ging de wet in]].","ex":["بعد موافقة الوزير على المقترح، دخل القانون حيز التنفيذ.","بسبب ارتفاع الأسعار، زاد التضخم."]},{"h":"ملاحظات وقيود","p":"الإفراط في التحويل إلى اسم يمكن أن يجعل النص ثقيلاً ومجرداً وصعب القراءة (ما يُعرف بـ«الهولندية البيروقراطية»). وفي الحديث اليومي يكون الأسلوب الفعلي أكثر طبيعية في العادة، بينما يُخصَّص التحويل إلى اسم أكثر للتقارير الرسمية والمقالات العلمية والنصوص القانونية.","list":["التقارير الإدارية والرسمية","المقالات العلمية والأكاديمية","النصوص القانونية والحقوقية","العناوين الصحفية"],"tip":"في اللغة الهولندية الكتابية الرسمية، يمكن للإفراط في التحويل إلى اسم أن يجعل النص ثقيلاً وغير طبيعي؛ وفي الحديث يُستخدم الفعل عادة."}],"ex":[{"q":"أي اختيار هو المعادل الاسمي (الرسمي) لـ'Doordat de prijzen stijgen, ...'؟","options":["Door de stijging van de prijzen, ...","Door het stijgen prijzen, ...","Door prijzen stijgend, ...","Door de prijzen te stijgen, ..."],"exp":"الصيغة الاسمية الرسمية للفعل [[stijgen]] هي الاسم [[de stijging]]، الذي يُوصَل ببقية الجملة بـ[[van]]."},{"exp":"يُستبدَل الفعل [[afronden]] في الأسلوب الرسمي غالباً بالاسم المشتق [[afronding]]، لا بـ[[het + المصدر]]."},{"q":"أي جملة هي نموذج لـ[[het + المصدر]] بوصفه اسماً؟","options":["Het roken is hier verboden.","Het rook is hier verboden.","Roken verboden hier is.","Hij rookt hier niet."],"exp":"في [[het roken]]، تحول المصدر [[roken]]، مع أداة التعريف [[het]]، إلى اسم محايد."},{"exp":"عندما لا يوجد اسم مشتق شائع، تُستخدم بنية [[het + المصدر]] لتحويل الفعل إلى اسم: [[het ontbreken]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «بعد موافقة الوزير على المقترح، دخل القانون حيز التنفيذ.»","exp":"يتحول فاعل الجملة الفعلية الأصلية ([[minister]]) في البنية الاسمية إلى تعبير [[door + اسم]]، ويتحول الفعل الأساسي إلى الاسم [[goedkeuring]]."},{"q":"ما الاسم المشتق الرسمي من الفعل 'ontwikkelen'؟","options":["ontwikkeling","ontwikkelen","ontwikkelaar","ontwikkelend"],"exp":"تحوّل اللاصقة [[-ing]] الفعل [[ontwikkelen]] إلى الاسم الرسمي [[ontwikkeling]]."},{"q":"أي مثال يمثل أسلوباً اسمياً مفرطاً وغير طبيعي؟","options":["Door de uitvoering van de betaling door de klant werd de levering van het product door het bedrijf gestart.","Toen de klant betaalde, stuurde het bedrijf het product.","De klant betaalde en het bedrijf leverde.","Zodra de klant betaald had, leverde het bedrijf."],"exp":"تسلسل متتابع من التعبيرات الاسمية بـ[[van]]/[[door]] يجعل النص ثقيلاً وغير طبيعي؛ وفي الكتابة الجيدة ينبغي الحفاظ على التوازن."},{"exp":"الاسم الرسمي المشتق من [[ontwikkelen]] هو [[ontwikkeling]]."}]},"b2-formeel-register":{"title":"السجل الرسمي وغير الرسمي","sum":"يختلف السجل **الرسمي** و**غير الرسمي** في اللغة الهولندية في الضمير ([[u]] مقابل [[je/jij]])، والمفردات ([[derhalve]] مقابل [[daarom]])، وأعراف كتابة الرسائل.","blocks":[{"h":"الضمير [[u]] مقابل [[je/jij]]","p":"[[u]] ضمير المخاطب الرسمي والمهذب، ويُستخدم مع الغرباء وكبار السن والمواقف الرسمية وخدمة العملاء. و[[je/jij]] ضمير غير رسمي للأصدقاء والعائلة والأقران والأطفال. ويُصرَّف الفعل مع [[u]] كما يُصرَّف مع [[hij/zij]]: [[u heeft/hebt]]، [[u bent]]، [[u kunt/kan]].","ex":["هل يمكنكم مساعدتي؟ (رسمي)","هل يمكنك مساعدتي؟ (غير رسمي)"]},{"h":"المفردات والروابط الرسمية","p":"في الكتابة الرسمية، تحل كلمات وروابط معينة محل مرادفاتها اليومية.","table":{"head":["رسمي","غير رسمي","المعنى"],"rows":[["derhalve","daarom","لذلك"],["teneinde","om... te","لغرض أن"],["hetgeen","wat","الذي (يشير إلى كل الجملة السابقة)"],["desondanks","toch","مع ذلك"],["dientengevolge","daardoor","نتيجة لذلك"]]},"ex":["كان مريضاً، لذلك لم يتمكن من الحضور. (رسمي)","كان مريضاً، فلهذا لم يتمكن من الحضور. (غير رسمي)"]},{"h":"أعراف الرسائل والبريد الإلكتروني الرسمي","p":"تبدأ الرسالة الهولندية الرسمية عادةً بـ[[Geachte heer/mevrouw,]] وتنتهي بـ[[Met vriendelijke groet,]]. وتُصاغ الطلبات الرسمية غالباً ببنية الشرط المهذبة [[zou u... kunnen]]، لا بالبنية الأبسط [[kun je]].","ex":["السيد يانسن الفاضل، بالإشارة إلى رسالتكم المؤرخة في 3 مايو...","هل يمكنكم الرد بحلول الغد؟"],"tip":"التعبير الثابت [[naar aanleiding van]] (بالإشارة إلى/بناءً على) وإنهاء الرسالة بـ[[Met vriendelijke groet]] من أكثر أعراف الرسائل الرسمية الهولندية شيوعاً."},{"h":"علامات أخرى للأسلوب الرسمي","p":"يتجنب الأسلوب الرسمي الصيغ المختصرة ([['t]]، [['n]]، [[ie]])، ويستخدم الشكل الكامل للكلمات ([[het]]، [[een]]، [[hij]]). كما يُفضِّل المجهول والأسلوب الاسمي (nominalisatie) أكثر، ويستخدم أقل الأدوات الوجهية العامية مثل [[toch]] و[[gewoon]].","ex":["هذا الأمر غير ممكن. (رسمي)","لا يمكن هذا، وخلاص. (غير رسمي)"]}],"ex":[{"q":"أي جملة مناسبة في رسالة رسمية إلى شخص غير معروف؟","options":["Kunt u mij hierover informeren?","Kun je me hierover vertellen?","Vertel me er even over.","Weet jij hier iets van?"],"exp":"في رسالة رسمية إلى شخص غير معروف، يجب استخدام الضمير [[u]] ونغمة رسمية."},{"q":"ما المعادل الرسمي لـ'daarom'؟","options":["derhalve","toch","gewoon","maar"],"exp":"[[derhalve]] هو المعادل الرسمي لـ«daarom/لذلك»، ويُستخدم في الكتابة الرسمية."},{"exp":"التعبير الثابت الرسمي [[naar aanleiding van]]، بمعنى «بالإشارة إلى/بناءً على»، يأتي دائماً بحرف الجر [[van]]."},{"q":"أي جملة غير رسمية؟","options":["'t Kan gewoon niet, joh.","Dit is helaas niet mogelijk.","Wij kunnen hieraan niet voldoen.","Dit verzoek kan niet worden ingewilligd."],"exp":"استخدام الصيغة المختصرة [['t]] بدلاً من [[het]] والكلمة العامية [[joh]] علامة على أسلوب غير رسمي تماماً."},{"q":"رتّب الجملة الرسمية: «هل يمكنكم الرد بحلول الغد؟»","exp":"استخدام صيغة الشرط [[zou... kunnen]] مع [[u]] يعطي الطلب نغمة أكثر تهذيباً ورسمية من الصيغة الأبسط [[kun je]]."},{"exp":"التعبير الثابت لإنهاء الرسالة الرسمية الهولندية هو [[Met vriendelijke groet]] (أو groeten)."},{"q":"أي وصف لـ'hetgeen' غير صحيح؟","options":["تُستخدم hetgeen فقط للإشارة إلى الأشخاص","hetgeen هي المعادل الرسمي لـ'wat' وتشير إلى الجملة السابقة بأكملها","hetgeen شائعة في الكتابة الرسمية والقانونية","يمكن استبدال hetgeen بـ'wat' في الأسلوب غير الرسمي"],"exp":"تُستخدم [[hetgeen]] للإشارة إلى الأشياء أو المفاهيم أو الجملة السابقة بأكملها، لا للأشخاص؛ لذلك الاختيار الأول غير صحيح."},{"q":"في محادثة غير رسمية مع صديق، أي ضمير أكثر طبيعية؟","options":["je/jij","u","Uw","U"],"exp":"في الحديث الودي وغير الرسمي يُستخدم [[je/jij]] دائماً، لا [[u]] المخصص للمواقف الرسمية والأشخاص غير المعروفين أو الأكبر سناً."}]},"b2-modale-partikels":{"title":"الأدوات الوجهية","sum":"الأدوات الوجهية مثل [[toch]]، [[wel]]، [[maar]]، [[eens]]، [[even]] و[[gewoon]] لا تحمل بذاتها معنى معجمياً مستقلاً، لكنها تُغيّر بشكل دقيق نغمة المتكلم وموقفه.","blocks":[{"h":"[[toch]]: طلب التأكيد أو تضاد لطيف مع التوقع","p":"تُستخدم [[toch]] غالباً لطلب التأكيد أو التيقن من شيء نتوقعه، أو للتعبير عن تضاد لطيف مع افتراض سابق. مثل [[Je komt toch?]] (ستأتي، أليس كذلك؟) أو [[Het is toch niet zo moeilijk]] (إنه في النهاية ليس بهذه الصعوبة).","ex":["ما زلت تتذكر، أليس كذلك؟","حسناً، افعله على أي حال."]},{"h":"[[wel]]: تأكيد لطيف في مواجهة الشك","p":"تؤكّد [[wel]] أمراً ما في مواجهة الشك أو القلق أو التوقع السلبي. مثل [[Het zal wel lukken]] (سينجح الأمر في النهاية، لا تقلق).","ex":["سيتأخر، لكنه سيأتي في النهاية.","نعم، هذا صحيح (رغم الشك السابق)."]},{"h":"[[maar]] و[[eens]]: تخفيف حدة الأمر والطلب","p":"تُلطّف [[maar]] في الجمل الأمرية النغمة وتجعلها ودية، كأن الأمر بسيط وسهل: [[Kom maar binnen]] (تعال، لا بأس). وتُلطّف [[eens]] الطلب على هيئة «جرّب مرة/لحظة واحدة»: [[Kijk eens hier]]. والتركيب [[maar eens]] شائع أيضاً: [[Probeer het maar eens]].","ex":["اجلس، لا بأس.","استمع جيداً للحظة."]},{"h":"[[even]] و[[gewoon]]: التقليل من شأن الطلب وتبسيط الواقع","p":"تُظهر [[even]] أن الأمر المطلوب قصير وسهل، مثل [[Kun je dat even checken?]]. و[[gewoon]]، بمعنى «فقط/مجرد»، تصف واقعاً بسيطاً دون تعقيد، أو تجعل أمراً يبدو عادياً: [[Doe het gewoon]] (فقط افعله).","ex":["انتظر لحظة.","هو فقط متعب، ليس غاضباً."],"tip":"يمكن دمج عدة أدوات وجهية معاً (مثل [[toch wel]]، [[maar eens]])، مما يجعل النغمة أكثر لطفاً أو طبيعية؛ وترتيب هذه الأدوات ثابت نسبياً في العادة."}],"ex":[{"q":"Je komt ___ naar het feest? (طلب تأكيد لطيف)","options":["toch","eens","even","gewoon"],"exp":"تُستخدم [[toch]] في نهاية الجملة أو وسطها لطلب التأكيد أو التيقن من شيء نتوقعه."},{"q":"Het zal ___ wel goed komen. (التهدئة/التأكيد اللطيف في مواجهة الشك)","options":["toch","wel","maar","eens"],"exp":"تعبّر [[wel]] عن تأكيد لطيف في مواجهة الشك أو القلق: «سيكون الأمر بخير في النهاية»."},{"exp":"تُلطّف [[maar]] في الجمل الأمرية النغمة وتجعلها ودية، كأن الأمر بسيط وسهل."},{"q":"Kun je dat ___ checken voor me? (طلب صغير وسريع)","options":["eens","even","gewoon","toch"],"exp":"تُظهر [[even]] أن الأمر المطلوب قصير وبسيط، وتجعل الطلب يبدو أكثر تهذيباً وأقل عناءً."},{"exp":"تصف [[gewoon]] هنا، بمعنى «فقط/مجرد»، الواقع ببساطة ودون تعقيد."},{"q":"Probeer het ___ eens. (الجمع بين التشجيع وطلب التجربة)","options":["maar","toch","wel","even"],"exp":"التركيب [[maar eens]] معتاد: [[maar]] تُلطّف النغمة، و[[eens]] تعني «جرّب مرة واحدة»."},{"q":"أي جملة تحمل أطبع معادل لـ«ستأتي في النهاية، أليس كذلك؟»؟","options":["Je komt toch?","Je komt even?","Je komt gewoon?","Je komt maar?"],"exp":"تنقل [[toch]] بدقة هذا النوع من طلب تأكيد التوقع."},{"exp":"تجعل [[eens]] في الجمل الأمرية، بمعنى «لحظة/مرة واحدة»، الطلب أكثر واقعية وألطف قليلاً."}]},"b2-samengestelde-voegwoorden":{"title":"الروابط المتقدمة","sum":"تعبّر روابط متقدمة مثل [[ondanks dat]]، [[ook al]]، [[zodat]]، [[zodra]]، [[terwijl]]، [[mits]] و[[tenzij]] عن علاقات التنازل والنتيجة والزمن والشرط، وكل منها له نقاطه النحوية الخاصة.","blocks":[{"h":"[[ondanks dat]] و[[ook al]]: على الرغم من أن","p":"كلاهما يعبّر عن علاقة تنازلية (concessief) بمعنى «على الرغم من أن/حتى لو»، ويُكوِّن جملة فرعية بترتيب الفعل في النهاية. ويعتبر بعض اللغويين [[ondanks dat]] أقل رسمية نوعاً ما (والمعادل الأكثر رسمية: [[ondanks het feit dat]])، في حين أن [[ook al]] طبيعية وشائعة تماماً، وتُرافقها غالباً [[toch]] في الجملة الأساسية.","ex":["على الرغم من أن المطر كان يتساقط، قمنا بالمشي.","حتى لو تأخر الوقت، سنذهب رغم ذلك."]},{"h":"[[zodat]] مقابل [[zodra]]","p":"يُخلَط بين هذين الرابطين غالباً بسبب تشابههما الظاهري، لكن معناهما مختلف تماماً. تعبّر [[zodat]] عن علاقة **النتيجة أو الهدف** (بحيث/حتى). وتعبّر [[zodra]] عن علاقة **زمنية** (حالما/ما إن).","ex":["همس، بحيث لم يسمعه أحد.","حالما أصل إلى المنزل، سأتصل بك."]},{"h":"[[terwijl]]: التزامن أو التضاد","p":"تُستخدم [[terwijl]] للتعبير عن **تزامن** فعلين، وكذلك للتعبير عن **التضاد**، بحسب السياق.","ex":["كانت تقرأ كتاباً، في حين كان هو يطبخ. (تزامن)","كان يتذمر، في حين أنه هو نفسه ارتكب الخطأ. (تضاد)"]},{"h":"[[mits]] و[[tenzij]]: الشرط الموجب والسالب","p":"[[mits]] شرط موجب رسمي نسبياً بمعنى «بشرط أن». و[[tenzij]] شرط سالب بمعنى «إلا إذا».","ex":["يمكنك الذهاب، بشرط أن تعود في الوقت المحدد.","سنستمر، إلا إذا تساقط مطر غزير."],"tip":"في الجملة الفرعية التي تبدأ بهذه الروابط، ينتقل الفعل إلى نهاية الجملة الفرعية؛ وإذا جاءت هذه الجملة في بداية الجملة الكاملة، يأتي فعل الجملة الأساسية مباشرة بعدها (انقلاب الترتيب)."}],"ex":[{"q":"___ ik moe was, ging ik toch naar de training. (على الرغم من أن)","options":["Ook al","Zodat","Mits","Tenzij"],"exp":"تعبّر [[ook al]]، بمعنى «على الرغم من أن/حتى لو»، عن علاقة تنازلية."},{"q":"Hij fluisterde, ___ niemand het zou horen. (النتيجة/الهدف)","options":["zodra","zodat","terwijl","mits"],"exp":"تعبّر [[zodat]] عن نتيجة الفعل أو هدفه؛ ويجب ألا تُخلط بـ[[zodra]] (حالما)."},{"exp":"تعبّر [[zodra]]، بمعنى «حالما»، عن علاقة زمنية، لا عن نتيجة."},{"q":"Je mag gaan, ___ je op tijd terug bent. (شرط موجب رسمي)","options":["tenzij","mits","terwijl","ondanks dat"],"exp":"[[mits]] شرط موجب رسمي نسبياً بمعنى «بشرط أن»."},{"q":"We gaan door met de wedstrijd, ___ het heel hard gaat regenen. (إلا إذا)","options":["mits","tenzij","zodat","ook al"],"exp":"تعبّر [[tenzij]] عن شرط سالب بمعنى «إلا إذا»."},{"exp":"تُستخدم [[terwijl]] للتعبير عن تزامن فعلين، أو التضاد في بعض الأحيان."},{"q":"رتّب الجملة: «على الرغم من أن المطر كان يتساقط، قمنا بالمشي.»","exp":"بعد الجملة الفرعية التي تبدأ بـ[[ondanks dat]] وتنتهي بفاصلة، يأتي فعل الجملة الأساسية مباشرة (انقلاب الترتيب): [[gingen we]]."},{"q":"رتّب الجملة: «حالما أتى، بدأنا.»","exp":"ينتقل فعل الجملة الفرعية بـ[[zodra]] إلى نهاية الجملة ([[kwam]])، وبعد الفاصلة يأتي فعل الجملة الأساسية."}]},"b2-infinitiefconstructies":{"title":"البنى المصدرية المتقدمة","sum":"تُظهر البنى المصدرية المتقدمة مثل [[aan het + infinitief]] (الاستمرارية)، و[[laten + infinitief]] (السببية)، و[[zitten/staan/liggen + te + infinitief]] تفاصيل طريقة أداء الفعل.","blocks":[{"h":"[[aan het + infinitief]]: الحالة الاستمرارية","p":"تعبّر بنية [[zijn + aan het + infinitief]] عن فعل قيد الحدوث، شبيه بالزمن المستمر في لغات أخرى. مثل [[Ik ben aan het koken]] (أنا أطبخ الآن).","ex":["هي تدرس الآن.","كنا نتحدث عندما رنّ الهاتف."]},{"h":"[[laten + infinitief]]: البنية السببية","p":"[[laten]] + المصدر بمعنى سببي: «جعل شخص آخر يقوم بأمر ما» أو «السماح بحدوث أمر ما». مثل [[Ik laat mijn auto repareren]] (أعطي سيارتي لتُصلَّح؛ لا أُصلّحها بنفسي).","ex":["تقص شعرها (عند الحلاق).","دعه يذهب."]},{"h":"[[zitten/staan/liggen + te + infinitief]]: الوضعية الجسدية + فعل قيد الحدوث","p":"تصف أفعال الوضعية ([[zitten]]، [[staan]]، [[liggen]]، وأحياناً [[lopen]]) مع [[te + infinitief]] فعلاً قيد الحدوث مرتبطاً بالوضعية الجسدية الطبيعية لذلك الفعل. ويعتمد اختيار فعل الوضعية على الوضعية الجسدية المنطقية للنشاط: [[zitten]] للقراءة/الجلوس، و[[liggen]] للنوم، و[[staan]] للوقوف والانتظار.","ex":["هو جالس ويقرأ.","هي واقفة وتنتظر الحافلة.","الأطفال مستلقون ونائمون."]},{"h":"مقارنة [[aan het]] بـ[[zitten/staan/liggen te]]","p":"كلتا البنيتين استمراريتان، لكن [[zitten/staan/liggen + te]] تُظهر أيضاً الوضعية الجسدية، ولها نغمة أكثر حيوية وعامية؛ أما [[aan het]] فهي أكثر حياداً وعمومية، وتُفضَّل عندما لا تكون الوضعية الجسدية مهمة أو محددة.","tip":"إذا لم تكن وضعية الشخص الجسدية محددة أو مهمة، فإن [[aan het]] أكثر طبيعية؛ وإذا كانت الوضعية الجسدية متوافقة طبيعياً مع الفعل (كالجلوس للقراءة)، فإن [[zitten/staan/liggen te]] أكثر شيوعاً وحيوية."}],"ex":[{"q":"Ik ben ___ koken. (فعل قيد الحدوث الآن)","options":["aan het","te","laten","zitten"],"exp":"تُستخدم بنية الاستمرارية [[aan het + المصدر]] للتعبير عن «كون المرء في حالة فعل ما»: [[aan het koken]]."},{"q":"Zij ___ haar haar knippen bij de kapper. (السببية، فعل يقوم به شخص آخر)","options":["is","laat","zit","staat"],"exp":"[[laten]] + المصدر بمعنى سببي «جعل شخص آخر يقوم بأمر ما»: [[haar laten knippen]]."},{"exp":"بما أن القراءة تتم عادة في وضعية الجلوس، فإن فعل الوضعية [[zitten]] هو الاختيار الأكثر طبيعية: [[zit te lezen]]."},{"q":"De kinderen ___ te slapen. (مستلقون، منشغلون بالنوم)","options":["zitten","staan","liggen","lopen"],"exp":"للنوم، فعل الوضعية الطبيعي هو [[liggen]]: [[liggen te slapen]]."},{"q":"'We waren aan het praten toen de telefoon ging.' أي فعل تصف هذه الجملة؟","options":["فعلاً كان قيد الحدوث في الماضي","فعلاً لم يبدأ بعد","حالة دائمة","طلباً"],"exp":"تصف [[aan het + المصدر]] في صيغة الماضي فعلاً استمرارياً في الماضي."},{"exp":"بعد [[laten]]، يأتي الفعل الثاني كمصدر بسيط (دون te): [[laten uitleggen]]."},{"q":"رتّب الجملة: «كانت واقفة عند النافذة تنتظر الحافلة.»","exp":"للوقوف والانتظار، فعل الوضعية الطبيعي هو [[staan]] + [[te]] + المصدر: [[staan te wachten]]."},{"q":"رتّب الجملة: «أنا مشغول بكتابة رسالة.»","exp":"في بنية [[aan het + المصدر]]، يأتي المفعول ([[een brief]]) قبل [[aan het]]: [[ben een brief aan het schrijven]]."}]},"c1-beknopte-bijzinnen":{"title":"الجمل الفرعية المختزلة","sum":"عندما يكون فاعل الجملة الفرعية والجملة الأساسية واحداً، يمكن اختزال الجملة الفرعية باستخدام **مصدر** أو **صيغة صفة فعلية**، مثل [[Gebouwd in de 17e eeuw, trekt het kasteel toeristen]].","blocks":[{"h":"استبدال الجملة الغائية/السببية بـ[[om... te + infinitief]]","p":"عندما تشارك الجملة الفرعية الغائية أو السببية الفاعل نفسه مع الجملة الأساسية، يمكن اختزالها ببنية [[om... te + infinitief]]. مثل [[Hij trainde hard om de wedstrijd te winnen]] بدلاً من جملة أكمل بـ[[zodat]] أو [[omdat]].","ex":["لتصل في الوقت المحدد، انطلقت مبكراً.","قرأ الكتاب ليعرف المزيد."]},{"h":"الاستبدال بصيغة الصفة الفعلية للماضي","p":"عندما يمكن تحويل فعل الجملة الفرعية إلى المجهول، ويكون فاعله مطابقاً لفاعل الجملة الأساسية، يمكن اختزال الجملة بصيغة الصفة الفعلية للماضي في بداية الجملة. مثل [[Omdat het boek goed geschreven was, werd het een bestseller]] ← [[Goed geschreven, werd het boek een bestseller]].","ex":["مبنيّة في القرن السابع عشر، تجذب هذه القلعة الكثير من السياح.","مقتنعة بالحجج، صوّتت اللجنة بالموافقة."]},{"h":"الاستبدال بصيغة الصفة الفعلية للحال","p":"عندما تعبّر الجملة الفرعية عن تزامن أو سبب مع فاعل مشترك، يمكن تحويل فعلها إلى صيغة الصفة الفعلية للحال. مثل [[Terwijl hij liep, dacht hij aan haar]] ← [[Lopend, dacht hij aan haar]].","ex":["مع علمه بأن الأمر خطير، ذهب رغم ذلك.","وقد أدرك أنه تأخر، ركض نحو المحطة."]},{"h":"القيد الأساسي: ضرورة الفاعل المشترك","p":"هذا الاختزال ممكن فقط عندما يكون فاعل الجملة الفرعية مطابقاً تماماً للفاعل (المنطقي) للجملة الأساسية. وإذا اختلف الفاعلان، يجب أن تبقى الجملة الفرعية كاملة بأداة ربطها (voegwoord) الخاصة.","tip":"إذا لم يكن فاعل الجملة الفرعية مطابقاً لفاعل الجملة الأساسية، لا يمكن اختزالها؛ وفي هذه الحالة يجب الحفاظ على الجملة كاملة بأداة الربط voegwoord."}],"ex":[{"q":"أي اختيار هو النسخة المختزلة لـ'Omdat hij moe was, ging hij slapen.'؟","options":["Moe, ging hij slapen.","Hij moe was, ging hij slapen.","Omdat moe, ging hij slapen.","Moe zijnd, ging hij slapen."],"exp":"عندما يكون فاعل الجملة الفرعية والأساسية واحداً، يمكن وضع الصفة/صيغة الصفة الفعلية ([[moe]]) مباشرة في بداية الجملة، وحذف أداة الربط والفعل."},{"q":"أي جملة لا يمكن تحويلها ببساطة إلى جملة مختزلة؟","options":["Omdat ik moe was, ging ik naar bed.","Omdat hij het boek goed schreef, werd het succesvol.","Omdat zij ziek was, bleef ze thuis.","Omdat het laat was, gingen we naar huis."],"exp":"في الاختيار الثاني، فاعل الجملة الفرعية ([[hij]]) لا يطابق الفاعل المنطقي للجملة الأساسية ([[het boek]])؛ لذلك الاختزال البسيط غير ممكن."},{"exp":"صيغة الصفة الفعلية للماضي [[Gebouwd]] في بداية الجملة تختزل الجملة الفرعية «لأنها بُنيت في القرن السابع عشر»."},{"exp":"تحل صيغة الصفة الفعلية للحال [[Wetende]] محل «Omdat hij wist» لأن الفاعل واحد."},{"q":"رتّب الجملة: «لتصل في الوقت المحدد، انطلقت مبكراً.»","exp":"للتعبير عن الهدف مع فاعل مشترك، تُستخدم بنية [[om... te + المصدر]] في بداية الجملة."},{"q":"رتّب الجملة: «مقتنعة بالحجج، صوّتت اللجنة بالموافقة.»","exp":"تحل صيغة الصفة الفعلية للماضي [[Overtuigd]] محل الجملة الكاملة «Omdat de commissie overtuigd was»."},{"q":"جملة 'Gebouwd in de 17e eeuw, trekt het kasteel veel toeristen.' معادلة لأي جملة كاملة؟","options":["Omdat het kasteel in de 17e eeuw gebouwd werd, trekt het veel toeristen.","Terwijl het kasteel gebouwd wordt, trekt het toeristen.","Het kasteel bouwt zichzelf in de 17e eeuw.","Mits het kasteel gebouwd is, trekt het toeristen."],"exp":"تحل الجملة الوصفية المختزلة بفعل المجهول الماضي ([[gebouwd]]) محل الجملة السببية الكاملة بـ[[omdat]] والفعل المجهول."},{"exp":"[[Geschrokken]] هي صيغة الصفة الفعلية للماضي من الفعل [[schrikken]]، وتختزل الجملة «لأن القط كان خائفاً»."}]},"c1-naamwoordstijl":{"title":"الأسلوب الاسمي مقابل الأسلوب الفعلي","sum":"تُفضِّل الهولندية الرسمية والأكاديمية غالباً **الأسلوب الاسمي** ([[naamwoordstijl]]) على **الأسلوب الفعلي** ([[werkwoordstijl]])، أي أنها تعبّر عن الأفعال، بدلاً من الفعل، في قالب عبارات اسمية مثل [[de stijging van de prijzen]].","blocks":[{"h":"تعريف الأسلوب الاسمي والأسلوب الفعلي","p":"يعتمد **[[werkwoordstijl]]** (الأسلوب الفعلي) على الفعل والجمل الفرعية؛ وهو طبيعي وحيوي ويُستخدم أكثر في الحديث والسرد. ويُكثّف **[[naamwoordstijl]]** (الأسلوب الاسمي) المعلومات في عبارات اسمية؛ وهو شائع في الهولندية الأكاديمية والإدارية والصحفية، ويخلق نغمة أكثر موضوعية ورسمية، لكنه قد يجعل النص أثقل.","ex":["قررت الحكومة رفع الضريبة. (الأسلوب الفعلي)","اتخذت الحكومة قرار رفع الضريبة. (الأسلوب الاسمي)"]},{"h":"كيفية تحويل الفعل إلى عبارة اسمية","p":"للتحويل إلى الأسلوب الاسمي، يتحول الفعل الأساسي إلى اسم مشتق (غالباً بلاصقة [[-ing]] أو [[-tie]])، ويُوصَل ببقية الجملة بحرف الجر [[van]] أو [[tot]] أو [[over]]؛ وفي بعض الأحيان تُكثَّف عدة جمل فرعية في جملة اسمية واحدة.","table":{"head":["الأسلوب الفعلي","الأسلوب الاسمي"],"rows":[["doordat de prijzen stijgen","door de stijging van de prijzen"],["nadat het onderzoek is afgerond","na afronding van het onderzoek"],["omdat het probleem is opgelost","door de oplossing van het probleem"]]},"ex":["بسبب ارتفاع الأسعار، زاد التضخم.","بعد انتهاء البحث، نُشر التقرير."]},{"h":"الاستخدام الأسلوبي: أين ولماذا","p":"الأسلوب الاسمي شائع في التقارير الرسمية والمقالات العلمية والنصوص القانونية والعناوين الصحفية، بسبب كثافته ونغمته الموضوعية/المحايدة. لكن الإفراط في استخدامه يُنتقَد بوصفه «هولندية بيروقراطية» (ambtelijk Nederlands)، لأنه يجعل النص صعباً وغير طبيعي.","list":["التقارير الرسمية والإدارية","المقالات العلمية والأكاديمية","النصوص القانونية والحقوقية","العناوين الصحفية المكثفة"]},{"h":"نموذج إعادة كتابة كاملة","p":"تُظهر مقارنة جملة واحدة في كلا الأسلوبين كيف يتحول فاعل الجملة الفرعية إلى تعبير [[door + اسم]]، ويتحول الفعل الأساسي إلى اسم مشتق.","ex":["عندما ارتفعت الأسعار، ارتفع التضخم أيضاً. (الأسلوب الفعلي)","تسبب ارتفاع الأسعار في ارتفاع التضخم. (الأسلوب الاسمي)"],"tip":"في الهولندية المكتوبة بجودة، يستخدم الكُتّاب المحترفون عادة مزيجاً من الأسلوبين الاسمي والفعلي، لتكون النصوص دقيقة وقابلة للقراءة في آن واحد."}],"ex":[{"q":"أي اختيار هو النسخة الاسمية لـ'De regering besloot dat ze de belasting zou verhogen.'؟","options":["De regering nam het besluit tot belastingverhoging.","De regering besluit belasting verhogen.","De regering, verhogend belasting, besloot.","Verhoging belasting besloot de regering."],"exp":"في الأسلوب الاسمي، يتحول الفعل الأساسي إلى اسم ([[besluit]])، ويتحول فعل الجملة الفرعية إلى اسم مركب ([[belastingverhoging]])."},{"exp":"الاسم المشتق الرسمي من [[stijgen]] هو [[stijging]]."},{"q":"أي جملة هي نموذج أطبع للأسلوب الفعلي؟","options":["Toen de prijzen stegen, steeg de inflatie.","Door de stijging van de prijzen steeg de inflatie.","Bij stijging van prijzen, inflatiestijging.","De prijsstijging veroorzaakte inflatiestijging."],"exp":"الاختيار الأول، بجملته الزمنية الفعلية ([[toen... stegen]])، نموذج للأسلوب الفعلي الحيوي والأكثر طبيعية في الحديث؛ بقية الاختيارات اسمية."},{"exp":"الاسم الرسمي المشتق من [[afronden]] هو [[afronding]]، وهو شائع في الأسلوب الاسمي الرسمي."},{"q":"ما الخاصية الأساسية للأسلوب الاسمي (naamwoordstijl)؟","options":["تُكثَّف المعلومات في عبارات اسمية وتصبح النغمة أكثر موضوعية ورسمية","الجملة دائماً أقصر من الأسلوب الفعلي","شائع فقط في اللغة العامية","تُحذف الأفعال الأساسية وتبقى الجملة دون فعل"],"exp":"في الأسلوب الاسمي، تُعبَّر الأفعال كأسماء وتُوصَل ببقية الجملة بـvan/door، مما يخلق نغمة أكثر موضوعية ورسمية؛ ولا تكون الجملة أقصر دائماً."},{"q":"رتّب الجملة الاسمية: «بعد موافقة البرلمان على القانون، أصبح نافذاً.»","exp":"يتحول فاعل الجملة الفرعية ([[parlement]]) إلى تعبير [[door het parlement]]، ويتحول الفعل الأساسي ([[goedkeuren]]) إلى اسم ([[goedkeuring]])."},{"q":"أي نص هو نموذج للهولندية البيروقراطية المفرطة في التحول إلى اسم؟","options":["Met betrekking tot de uitvoering van de aanvraag tot verlening van de vergunning wordt verwezen naar bijlage 2.","Je aanvraag staat in bijlage 2.","We hebben je aanvraag ontvangen.","Bijlage 2 bevat je aanvraag."],"exp":"سلسلة طويلة ومتتابعة من العبارات الاسمية بـvan/tot نموذج كلاسيكي للهولندية البيروقراطية الثقيلة والصعبة القراءة."},{"exp":"الاسم المشتق الرسمي من الفعل [[oplossen]] هو [[oplossing]]."}]},"c1-partikels-nuance":{"title":"الأدوات والكلمات الدلالية الدقيقة المتقدمة","sum":"تلعب الكلمات الدلالية الدقيقة المتقدمة مثل [[nu eenmaal]]، [[immers]]، [[overigens]]، وبنية [[enerzijds...anderzijds]] دوراً خطابياً وحجاجياً مهماً في الكتابة الرسمية الهولندية.","blocks":[{"h":"[[nu eenmaal]]: الحقيقة الثابتة التي لا تتغير","p":"تعبّر [[nu eenmaal]] عن حقيقة ثابتة لا تتغير ومقبولة، غالباً بنغمة استسلام نسبي أو واقعية، بمعنى «هكذا هو الحال/هذه هي الحقيقة».","ex":["القوانين هكذا وبس، لا يمكن فعل شيء.","هو عنيد قليلاً، وهذه طبيعته الثابتة."]},{"h":"[[immers]]: سبب مقبول مسبقاً","p":"تُذكِّر [[immers]] بسبب يفترض المتكلم أن السامع يعرفه أو يقبله مسبقاً، أي ما يقابل «لأنكم تعرفون/كما تعلمون». وتأتي عادة بعد الفاعل والفعل، لا في بداية الجملة.","ex":["يجب أن نكون حذرين، فهذا عمل خطير (كما نعلم).","لم يتمكن من الحضور، فقد كان مريضاً (كما نعلم)."]},{"h":"[[overigens]]: ملاحظة جانبية","p":"تُقدِّم [[overigens]] ملاحظة جانبية أو تغييراً لطيفاً في الموضوع، أي ما يقابل «على أي حال/بالمناسبة».","ex":["تمت الموافقة على الخطة. بالمناسبة، لم يسألني أحد عن رأيي.","هي، وهي بالمناسبة مثل أختها، موسيقية جداً."]},{"h":"[[enerzijds... anderzijds]]: البنية ثنائية الجانب","p":"تُقدِّم هذه البنية جانبين متكاملين أو متضادين لموضوع واحد، أي ما يقابل «من جانب... ومن جانب آخر». وهي رسمية ومناسبة للحجاج الكتابي. وبما أن كلا الجزأين يأتي في بداية جملته الخاصة، يأتي الفعل مباشرة بعدهما (انقلاب الترتيب).","ex":["من جانب، أريد أن أدخر مالاً أكثر، ومن جانب آخر أريد أن أستمتع بالحياة أيضاً.","من جانب، توفر التكنولوجيا فرصاً، ومن جانب آخر تحمل معها مخاطر أيضاً."],"tip":"تُستخدم هذه الكلمات أكثر في الحجاج الكتابي والرسمي، وتضفي على النص بنية منطقية وتماسكاً."}],"ex":[{"q":"Zo zijn de regels ___. (الحقيقة الثابتة التي لا تتغير)","options":["nu eenmaal","immers","overigens","enerzijds"],"exp":"تعبّر [[nu eenmaal]] عن حقيقة ثابتة لا تتغير ومقبولة، بنغمة استسلام نسبي."},{"q":"We moeten voorzichtig zijn, het is ___ gevaarlijk werk. (سبب مقبول مسبقاً)","options":["overigens","immers","nu eenmaal","anderzijds"],"exp":"تُذكِّر [[immers]] بسبب يفترض المتكلم أن السامع يعرفه أو يقبله مسبقاً."},{"exp":"تُقدِّم [[Overigens]] ملاحظة جانبية أو تغييراً لطيفاً في الموضوع، أي ما يقابل «على أي حال/بالمناسبة»."},{"q":"أي جملة تستخدم بنية 'enerzijds...anderzijds' بشكل صحيح؟","options":["Enerzijds wil ik sparen, anderzijds wil ik genieten.","Enerzijds wil ik sparen, maar ook genieten.","Anderzijds wil ik sparen, enerzijds genieten.","Enerzijds, anderzijds wil ik sparen en genieten."],"exp":"البنية الصحيحة: [[Enerzijds]] + الجملة الأولى، [[anderzijds]] + الجملة الثانية، لعرض جانبين متكاملين أو متضادين لموضوع واحد."},{"exp":"تصف [[nu eenmaal]] هذه الصفة بوصفها حقيقة ثابتة وغير قابلة للتغيير عن الشخص."},{"q":"ما الدور الذي تؤديه 'overigens' عادة في الجملة؟","options":["إضافة ملاحظة جانبية أو تغيير لطيف في الموضوع","بيان سبب مقبول مسبقاً","بيان تضاد شديد","بيان شرط"],"exp":"تُستخدم [[overigens]] لإضافة ملاحظة جانبية غير متوقعة أو تغيير مسار خفيف في الحديث/الكتابة."},{"q":"رتّب الجملة: «من جانب، توفر التكنولوجيا فرصاً، ومن جانب آخر تحمل خطراً أيضاً.»","exp":"في كلا الجملتين يأتي الفعل مباشرة بعد [[enerzijds]]/[[anderzijds]] (انقلاب الترتيب، لأن هذه الكلمات في بداية جملتها)."},{"q":"أي جملة تُظهر مفهوم 'immers' بشكل صحيح؟","options":["Hij kon niet komen, hij was immers ziek.","Hij was immers ziek, dus kwam hij niet weten.","Immers, hij komt morgen misschien.","Hij is immers ziek geweest, maar nu niet meer."],"exp":"في الاختيار الأول، تُذكِّر [[immers]] بسبب (المرض) مفترَض أو مقبول مسبقاً لتوضيح عدم حضوره."}]},"c1-complexe-zinsbouw":{"title":"بنية الجملة المعقدة","sum":"يمكن للجمل الهولندية المعقدة أن تحتوي على عدة جمل فرعية متداخلة، وانقلاب ترتيب بعد عنصر مُقدَّم، ومجموعة أفعال نهائية من ثلاثة أفعال أو أكثر (مثل [[had moeten worden gedaan]]).","blocks":[{"h":"الجمل الفرعية المتداخلة","p":"تسمح الهولندية بتداخل عدة جمل فرعية في جملة واحدة. ويجب الانتباه إلى أي فعل ينتمي إلى أي جملة: يبقى فعل الجملة الأساسية في الموضع الثاني (V2)، وتنقل كل جملة فرعية فعلها إلى نهاية جملتها الخاصة (لا إلى نهاية الجملة بأكملها).","ex":["أعتقد أنه قال إنه سيأتي إذا لم يتساقط المطر."]},{"h":"انقلاب الترتيب بعد العنصر المُقدَّم","p":"وفقاً لقاعدة الفعل الثاني (V2)، عندما تبدأ الجملة بعنصر غير الفاعل (ظرف، جملة فرعية، تعبير ظرفي)، يجب أن يأتي الفعل المُصرَّف مباشرة بعده، ويأتي الفاعل بعد الفعل.","ex":["بسبب سوء الأحوال الجوية، أُلغيت المباراة.","لم أرَ أبداً شيئاً بهذا الحمق."]},{"h":"مجموعة الأفعال النهائية من ثلاثة أفعال أو أكثر","p":"عندما يجتمع فعل وجهي وفعل مساعد زمني وفعل أساسي (أو مجهول)، تتشكل مجموعة من ثلاثة أفعال أو أكثر في نهاية الجملة الفرعية. والترتيب «الأخضر» (المعياري والأوضح في الكتابة الرسمية): الفعل المساعد الزمني + الفعل الوجهي + الفعل الأساسي/المجهول. مثل [[dat hij het had moeten doen]] أو في المجهول: [[dat het had moeten worden gedaan]].","ex":["لم أكن أعلم أنه كان يجب أن يُعيد الكتاب من قبل.","يُظن أن ذلك القرار كان يجب أن يُتَّخذ في وقت أبكر."]},{"h":"ملاحظات أسلوبية لوضوح الجملة المعقدة","p":"للحفاظ على قابلية القراءة في الجمل المعقدة، يُفضَّل الاكتفاء بعدد معقول من الجمل المتداخلة، ومراعاة علامات الترقيم الصحيحة، وتفضيل الترتيب الأخضر في مجموعات الأفعال.","tip":"في مجموعات الأفعال الثلاثية أو الأكبر، الترتيب «الأخضر» (الفعل المساعد + الفعل الوجهي + الفعل الأساسي) له عادة قابلية قراءة أفضل من الترتيب «الأحمر»، خصوصاً في الكتابة الرسمية."}],"ex":[{"q":"في جملة 'Omdat het regende, bleven we binnen.' في أي موضع يقع فعل الجملة الأساسية (bleven)؟","options":["مباشرة بعد الجملة الفرعية المُقدَّمة (انقلاب الترتيب)","في نهاية الجملة بأكملها","قبل الجملة الفرعية","في الموضع الثاني من الجملة الفرعية"],"exp":"بما أن الجملة الفرعية 'Omdat het regende' تعمل كعنصر في الموضع الأول من الجملة، يجب أن يأتي فعل الجملة الأساسية مباشرة بعدها (قاعدة انقلاب الترتيب/الفعل الثاني)."},{"q":"رتّب الجملة: «لم أرَ أبداً شيئاً بهذا الحمق.»","exp":"بما أن الظرف السلبي [[Nooit]] جاء في بداية الجملة، يأتي الفعل المساعد ([[heb]]) مباشرة بعده وقبل الفاعل ([[ik]])."},{"exp":"في مجموعة الأفعال الثلاثية، يقع الفعل الوجهي [[moeten]] بين الفعل المساعد ([[had]]) والفعل الأساسي المجهول ([[worden genomen]]): [[had moeten worden genomen]]."},{"q":"أي ترتيب لمجموعة الأفعال 'dat hij het ... doen' (hebben/kunnen/doen) أكثر معيارية وشيوعاً (الترتيب الأخضر)؟","options":["had kunnen doen","kunnen had doen","doen had kunnen","had doen kunnen"],"exp":"الترتيب الأخضر المعياري: الفعل المساعد الزمني ([[had]]) + الفعل الوجهي ([[kunnen]]) + الفعل الأساسي ([[doen]])."},{"q":"رتّب الجملة: «أعتقد أنه قال إنه سيأتي إذا لم يتساقط المطر.»","exp":"تحتوي هذه الجملة على ثلاث طبقات من الجمل المتداخلة؛ وتنقل كل جملة فرعية فعلها إلى نهاية جملتها الخاصة، لا إلى نهاية الجملة بأكملها."},{"q":"'Door het slechte weer, werd de wedstrijd afgelast.' أي ملاحظة نحوية تُظهرها هذه الجملة؟","options":["انقلاب الترتيب بعد عنصر مُقدَّم غير الفاعل","المجهول غير الشخصي","الجملة الوصفية المختزلة","بنية aan het"],"exp":"بما أن التعبير الظرفي 'Door het slechte weer' جاء في الموضع الأول، يأتي الفعل ([[werd]]) مباشرة بعده وقبل الفاعل ([[de wedstrijd]])."},{"exp":"الترتيب الطبيعي لمجموعة الأفعال: [[had]] (مساعد) + [[moeten]] (وجهي) + [[teruggeven]] (فعل أساسي)."},{"q":"في الكتابة الرسمية، أي ترتيب لمجموعة الأفعال الثلاثية يتمتع عادة بقابلية قراءة أفضل؟","options":["الترتيب الأخضر (الفعل المساعد - الفعل الوجهي - الفعل الأساسي)","الترتيب الأحمر (الفعل الأساسي - الفعل الوجهي - الفعل المساعد)","لا يوجد أي فرق","يجب أن يأتي الفعل المساعد دائماً في النهاية"],"exp":"في الأسلوب الكتابي الرسمي، يُعتبر الترتيب الأخضر (الفعل المساعد، ثم الفعل الوجهي، ثم الفعل الأساسي) عادة أوضح وأكثر معيارية."}]},"c1-idiomatische-uitdrukkingen-grammatica":{"title":"التعبيرات الاصطلاحية الثابتة وقواعدها","sum":"كثير من التعبيرات الثابتة الهولندية ([[vaste verbindingen]]) لها حرف جر ثابت ([[rekening houden met]])، أو ترتيب كلمات ثابت، أو أداة تعريف غير قابلة للتغيير، ويجب حفظها كوحدة كاملة.","blocks":[{"h":"حروف الجر الثابتة في التعبيرات الاصطلاحية","p":"كثير من التعبيرات الثابتة له حرف جر محدد وغير قابل للتغيير يجب حفظه مع الفعل؛ وتغيير حرف الجر هذا يُفسد المعنى أو يجعل الجملة خاطئة.","table":{"head":["التعبير","حرف الجر الثابت","المعنى"],"rows":[["rekening houden","met","أخذ بعين الاعتبار"],["afhankelijk zijn","van","كونه معتمداً على"],["zich concentreren","op","التركيز على"],["de voorkeur geven","aan","تفضيل"]]},"ex":["يجب أن يأخذ التكاليف بعين الاعتبار.","فضَّل الشاي على القهوة."]},{"h":"ترتيب الكلمات الثابت في التعبيرات","p":"بعض التعبيرات الثابتة له ترتيب كلمات غير قابل للتغيير، حتى لو سمحت القواعد العادية بالتبديل، فلا ينبغي تغيير هذا الترتيب في هذه التعبيرات. مثل [[voor de dag komen met]] (الخروج بشيء/تقديم مقترح) أو [[in de gaten houden]] (مراقبة شيء).","ex":["كان يراقب الوضع جيداً.","هل يمكنك أخيراً أن تقدم حلاً؟"]},{"h":"دون تغيير أداة التعريف","p":"في بعض التعبيرات الثابتة، تكون أداة التعريف (أو غيابها) جزءاً لا يتجزأ من التعبير، ولا يمكن تغييرها أو تحويلها إلى جمع. مثل [[de deur uit gaan]] (لا [[een deur]]) أو [[het heeft geen zin]] (حيث لا تُجمَع [[zin]] هنا).","ex":["خرج من المنزل مبكراً.","لا فائدة من الانتظار."]},{"h":"ملاحظات لتعلم التعبيرات الثابتة","p":"أفضل طريقة هي حفظ التعبير كاملاً (الفعل + حرف الجر + البنية) كوحدة واحدة، لا حفظ الفعل بمفرده. ولاختبار ما إذا كان تعبير ما اصطلاحياً وثابتاً أم لا، يمكن استبدال أحد مكوناته: فإذا فسد المعنى أو بدا غريباً للناطق الأصلي، فإن هذا التعبير [[vaste verbinding]].","tip":"أفضل طريقة لتعلم الأفعال الاصطلاحية الثابتة هي حفظ التعبير كاملاً مع حرف جره، لا حفظ الفعل بمفرده."}],"ex":[{"q":"Hij moet rekening houden ___ de kosten. (حرف الجر الثابت)","options":["met","van","aan","op"],"exp":"التعبير الثابت [[rekening houden met]] يأتي دائماً بحرف الجر [[met]] وغير قابل للتغيير."},{"exp":"التعبير الثابت [[afhankelijk zijn van]] يأتي دائماً بـ[[van]]."},{"q":"Hij gaf de voorkeur ___ thee boven koffie. (حرف الجر الثابت)","options":["aan","voor","op","met"],"exp":"التعبير الثابت [[de voorkeur geven aan]] يأتي دائماً بـ[[aan]]."},{"exp":"التعبير الثابت [[voor de dag komen met]]، بمعنى «الخروج بحل»، يأتي دائماً بـ[[met]] وترتيب كلماته ثابت."},{"q":"أي جملة تستخدم التعبير الثابت 'in de gaten houden' بشكل صحيح؟","options":["Hij hield de situatie goed in de gaten.","Hij hield in de gaten de situatie goed.","Hij hield de gaten goed in situatie.","Hij hield goed de situatie gaten in."],"exp":"في التعبير الثابت [[in de gaten houden]]، ترتيب الكلمات ثابت، ولا يمكن إلا للمفعول ([[de situatie]]) أن يقع بين الفعل وهذا التعبير."},{"q":"'Het heeft geen zin om te wachten.' لماذا 'geen zin' في هذا التعبير غير قابلة للجمع وثابتة؟","options":["لأن هذا تعبير اصطلاحي ثابت له شكل غير قابل للتغيير","لأن zin غير قابلة للجمع دائماً وفي كل استخداماتها","لأن zin تعني فقط 'جملة'","لأن هذه قاعدة إملائية"],"exp":"[[het heeft geen zin]] تعبير اصطلاحي ثابت، شكله (بما فيه عدم جمع [[zin]] بهذا المعنى) ثابت وغير قابل للتغيير."},{"exp":"التعبير الثابت [[zich concentreren op]] يأتي دائماً بـ[[op]]."},{"q":"رتّب الجملة: «خرج من المنزل مبكراً.»","exp":"يُستخدم التعبير الثابت [[de deur uit gaan]] دائماً بأداة التعريف المحددة [[de]] (لا een) وترتيب كلمات ثابت."}]},"c1-stijlfiguren-formeel-schrijven":{"title":"الأساليب البلاغية في الكتابة الرسمية","sum":"تستفيد الكتابة الهولندية الرسمية والحجاجية من أساليب مثل **المجهول** لتحقيق الموضوعية، و**التلطيف/التحوّط** ([[zou kunnen]]، [[lijkt erop dat]])، والروابط الحجاجية الرسمية ([[niettemin]]، [[enerzijds...anderzijds]]).","blocks":[{"h":"المجهول لتحقيق الموضوعية","p":"حذف الفاعل البشري واستخدام المجهول (وأحياناً مع المجهول غير الشخصي [[er wordt]]) يعطي النص نغمة موضوعية وغير شخصية، وهو شائع في الكتابة العلمية والرسمية؛ ولا يُذكَر فاعل الفعل ([[door + فاعل]]) إلا عندما يكون مهماً.","ex":["أُجري بحث حول آثار هذه السياسة.","أُجري هذا البحث بين عامي 2020 و2022."]},{"h":"التلطيف والتحوّط في التعبير (hedging)","p":"يُعبِّر التلطيف (hedging) عن الدعاوى بحذر وبصورة أقل قطعية، وهو شائع في الحجاج العلمي. ومن العبارات الأساسية: [[zou kunnen wijzen op]] (قد يشير إلى...)، [[het lijkt erop dat]] (يبدو أن)، [[mogelijk]] (ربما)، [[in zekere zin]] (بشكل ما).","ex":["قد يشير هذا إلى ارتباط بين هذين العاملين.","يبدو أن هذا الإجراء كان له تأثير."]},{"h":"الروابط الحجاجية الرسمية","p":"تمنح الروابط الرسمية النص بنية منطقية وتُنظِّم الحجاج.","table":{"head":["الرابط","الاستخدام"],"rows":[["niettemin","مع ذلك (نتيجة مخالفة للتوقع)"],["desalniettemin","مع ذلك (تأكيد أكثر رسمية وقوة)"],["daarentegen","في المقابل، على العكس"],["bovendien","علاوة على ذلك"]]},"ex":["النتائج إيجابية؛ ومع ذلك، لا يزال البحث الإضافي ضرورياً.","نمت المجموعة الأولى سريعاً، في حين تقلصت المجموعة الأخرى على العكس."]},{"h":"الجمع بين الأساليب في فقرة حجاجية","p":"في الكتابة الرسمية المحترفة، تُجمَع غالباً صيغة المجهول والتلطيف والروابط الحجاجية في فقرة واحدة، للحفاظ على الموضوعية والتماسك المنطقي معاً.","ex":["أُجري البحث على مرحلتين. يبدو أن النتائج تشير إلى فعالية هذا الإجراء؛ ومع ذلك، يُستحسن إجراء مزيد من الدراسة."],"tip":"الاستخدام المتوازن لهذه الأساليب يجعل النص رسمياً ومقنعاً، لكن الإفراط في التلطيف (hedging) يمكن أن يجعل الحجة تبدو ضعيفة ومتردِّدة."}],"ex":[{"q":"أي جملة هي نموذج للمجهول لخلق الموضوعية في الكتابة الرسمية؟","options":["Er is onderzoek gedaan naar de effecten van het beleid.","Wij hebben onderzoek gedaan naar de effecten van het beleid.","Ik denk dat het beleid goed werkt.","Jullie moeten onderzoek doen naar het beleid."],"exp":"حذف الفاعل البشري واستخدام المجهول غير الشخصي ([[Er is onderzoek gedaan]]) يعطي النص نغمة موضوعية وغير شخصية، شائعة في الكتابة الرسمية/العلمية."},{"q":"'Dit zou kunnen wijzen op een verband.' نموذج لأي أسلوب بلاغي؟","options":["التلطيف/التحوّط في التعبير (hedging)","المجهول لتحقيق الموضوعية","رابط حجاجي","أداة وجهية"],"exp":"يطرح التعبير [[zou kunnen wijzen op]] الدعوى بحذر وبصورة غير قطعية، وهو نموذج كلاسيكي للتلطيف في الكتابة العلمية."},{"exp":"يُستخدم التعبير الثابت [[het lijkt erop dat]] للتعبير بحذر عن انطباع أو استنتاج."},{"q":"أي رابط ينقل أكثر إحساس بالتضاد رسمية وتأكيداً؟","options":["desalniettemin","maar","toch","en"],"exp":"[[desalniettemin]] هو أكثر معادل رسمية وتأكيداً لـ«مع ذلك/على أي حال» بين الاختيارات."},{"exp":"تعبّر [[niettemin]] أو [[desalniettemin]] عن علاقة مخالفة للتوقع بين جزأي الجملة بنغمة رسمية."},{"q":"ما الدور الذي تؤديه 'daarentegen' في الجملة؟","options":["إظهار التضاد/المقابلة مع النقطة السابقة","إضافة نقطة تكميلية دون تضاد","بيان سبب","بيان شرط"],"exp":"تُستخدم [[daarentegen]]، بمعنى «في المقابل/على العكس»، لمقابلة فكرتين أو مجموعتين من البيانات."},{"q":"رتّب الجملة: «أُجري هذا البحث بين عامي 2020 و2022.» (المجهول الرسمي)","exp":"حذف الفاعل المنفِّذ واستخدام الفعل المجهول ([[werd uitgevoerd]]) يُحوِّل التركيز من «من قام بهذا» إلى الحدث نفسه؛ وهو نموذج للأسلوب الرسمي الموضوعي."},{"q":"ما خطر الإفراط في استخدام عبارات التلطيف (hedging) في نص حجاجي؟","options":["قد يجعل الحجة تبدو ضعيفة ومتردِّدة","يجعل النص أقصر","يجعل النص غير رسمي","يتسبب في الإفراط في استخدام صيغة المجهول في الجملة"],"exp":"الإفراط في استخدام العبارات المتحوّطة مثل [[zou kunnen]]، [[mogelijk]]، [[lijkt erop dat]] يمكن أن يُضعف قوة حجة الكاتب ويجعل النص يبدو متردِّداً."}]}}};

window.GRAMMATICA_I18N.tr = {"topics":{"a1-lidwoorden":{"title":"Belirteçler: de, het ve een","sum":"Hollandacada belirli isimler için [[de]] veya [[het]], belirsiz isimler için [[een]] kullanılır; [[de]] ile [[het]] arasındaki seçim ismin dilbilgisel cinsiyetine bağlıdır.","blocks":[{"h":"Belirli tanımlık: [[de]] ve [[het]]","p":"Türkçede belirli tanımlık diye bir kavram yoktur, ama Hollandacada her isim ya [[de]] ya da [[het]] ile gelir ve bu ikisi de Türkçedeki **belirtme/-ki** anlamına yakındır. [[de]] ile gelen isimlere **de-woorden**, [[het]] ile gelenlere **het-woorden** denir. Hollandaca isimlerin yaklaşık dörtte üçü [[de]] alır.","ex":["Masa kahverengidir.","Kitap ilginçtir."],"tip":"Yeni bir ismi öğrenmenin en iyi yolu, onu yalnız başına değil, kendi [[de]] veya [[het]]'i ile birlikte ezberlemektir."},{"h":"[[het]] ne zaman kullanılır","p":"Bir grup isim her zaman [[het]] alır: **küçültme biçimleri** ([[-je]] ile biten verkleinwoorden), **dil** adları, **metal** ve **yön** adları, ve **mastar halindeki fiillerden** türetilmiş isimler.","list":["Küçültme biçimleri: [[het huisje]] (küçük ev), [[het boekje]] (küçük kitap/kitapçık)","Diller: [[het Nederlands]], [[het Perzisch]]","Metaller ve yönler: [[het goud]], [[het noorden]]","İsim olarak kullanılan mastar: [[het lezen]] (okumak), [[het eten]] (yemek/yemek yemek)"],"ex":["Hollandaca o kadar da zor değil.","Yemek lezzetli."]},{"h":"[[de]] ne zaman kullanılır","p":"**Çoğul** isimler, tekilleri [[het]] olsa bile her zaman [[de]] alır. Ayrıca **kişi ve meslek** adları ile çoğu **ağaç, çiçek, meyve ve sebze** adı da genellikle [[de]] alır.","table":{"head":["Tekil","Çoğul"],"rows":[["het huis","de huizen"],["het boek","de boeken"],["de auto","de auto's"]]},"ex":["Çocuk dışarıda oynuyor.","Çocuklar dışarıda oynuyor."],"tip":"Çoğulda [[de]] ile [[het]] arasında fark yoktur; tüm çoğullar [[de]] alır."},{"h":"Belirsiz tanımlık: [[een]]","p":"[[een]] Türkçedeki **bir** sözcüğüne karşılık gelir ve bilinmeyen veya belirsiz bir şeyi tanıtmak için kullanılır. [[de]] ve [[het]]'in aksine, [[een]] her iki isim grubu için aynıdır ve fark göstermez.","ex":["Bir köpek görüyorum.","O güzel bir ev."],"tip":"[[een]] hiçbir zaman çoğul bir isimle kullanılmaz; belirsiz çoğul için hiç tanımlık kullanılmaz: [[Ik zie honden.]] (Köpekler görüyorum.)"},{"h":"Öğrenmek için pratik bir yol","p":"Hollandaca sözlüklerde [[het]] isimleri genellikle **(het)** işaretiyle belirtilir, geri kalan isimler [[de]]'dir. En iyi yol, her yeni ismi tanımlığıyla birlikte ezberlemektir.","list":["[[de man]] - adam","[[het meisje]] - kız (küçültme biçimi, her zaman het)","[[de stad]] - şehir","[[het land]] - ülke"]}],"ex":[{"exp":"[[boek]] bir het-woord'dur, bu yüzden tanımlığı [[het]]'tir."},{"exp":"Köpek henüz tanıtılmadığı ve belirsiz olduğu için belirsiz tanımlık [[een]] kullanırız."},{"q":"[[het huis]]'in çoğulu hangisidir?","options":["de huizen","het huizen","de huisen"],"exp":"Çoğul isimler, tekilleri [[het]] olsa bile her zaman [[de]] alır: [[de huizen]]."},{"q":"Hangi isim grubu her zaman [[het]] ile gelir?","options":["Dil adları","Meslek adları","Meyve adları"],"exp":"[[het Nederlands]] gibi dil adları her zaman [[het]] alır."},{"exp":"Dil adları her zaman [[het]] alır."},{"q":"Cümleyi doğru sırayla oluşturun: «Bir köpek görüyorum.»","exp":"Basit cümle sırası: özne + fiil + nesne: [[Ik zie een hond.]]"},{"exp":"Çoğul isim [[kinderen]] her zaman [[de]] ile gelir."},{"q":"Hangi cümle yanlıştır?","options":["Het huisje is klein.","De tafel is bruin.","Een boeken zijn duur."],"exp":"[[een]] hiçbir zaman çoğul bir isimle kullanılmaz; doğru cümle [[Boeken zijn duur.]]'dur."},{"q":"Cümleyi doğru sırayla oluşturun: «Çocuklar dışarıda oynuyor.»","exp":"[[kinderen]] çoğul olduğu için tanımlığı [[de]]'dir."}]},"a1-meervoud-verkleinwoord":{"title":"Çoğul ve Küçültme Biçimleri","sum":"Hollandacada çoğul genellikle [[-en]] veya [[-s]] ile yapılır (bazen ünlü veya ünsüz yazımında değişiklikle), küçültme biçimleri ise [
