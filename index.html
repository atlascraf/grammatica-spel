es not always become shorter."},{"q":"Put together the nominal sentence: 'After the law was approved by parliament, it took effect.'","exp":"The subject of the subordinate clause ([[parlement]]) becomes the phrase [[door het parlement]], and the main verb ([[goedkeuren]]) becomes the noun ([[goedkeuring]])."},{"q":"Which text is an example of excessively nominal bureaucratic Dutch?","options":["Met betrekking tot de uitvoering van de aanvraag tot verlening van de vergunning wordt verwezen naar bijlage 2.","Je aanvraag staat in bijlage 2.","We hebben je aanvraag ontvangen.","Bijlage 2 bevat je aanvraag."],"exp":"A long chain of successive nominal phrases with van/tot is a classic example of heavy, hard-to-read bureaucratic Dutch."},{"exp":"The formal noun derived from the verb [[oplossen]] is [[oplossing]]."}]},"c1-partikels-nuance":{"title":"Advanced Particles and Nuance Words","sum":"Advanced nuance words such as [[nu eenmaal]], [[immers]], [[overigens]], and the construction [[enerzijds...anderzijds]] play an important discourse and argumentative role in formal Dutch writing.","blocks":[{"h":"[[nu eenmaal]]: an unchangeable fact","p":"[[nu eenmaal]] expresses an unchangeable, accepted fact, often with a somewhat resigned or matter-of-fact tone, meaning 'that's just the way it is'.","ex":["That's just how the rules are, nothing can be done about it.","He's just a bit stubborn, that's all (it's a fixed trait of his)."]},{"h":"[[immers]]: a reason already taken for granted","p":"[[immers]] recalls a reason that the speaker assumes the listener already knows or accepts, similar to 'because, as you know'. It usually comes after the subject and verb, not at the start of the sentence.","ex":["We must be careful, since this is dangerous work (as we already know).","He couldn't come, since he was ill (as we know)."]},{"h":"[[overigens]]: an incidental remark","p":"[[overigens]] introduces an incidental remark or a mild shift in topic, similar to 'by the way/incidentally'.","ex":["The plan was approved. Incidentally, no one asked for my opinion.","She, who incidentally is just like her sister, is very musical."]},{"h":"[[enerzijds... anderzijds]]: the two-sided construction","p":"This construction introduces two complementary or contrasting aspects of a topic, similar to 'on the one hand... on the other hand'. It is formal and suited to written argumentation. Because both parts come at the start of their own clause, the verb comes immediately after them (inversion).","ex":["On the one hand, I want to save more money; on the other hand, I also want to enjoy life.","On the one hand, technology provides opportunities; on the other hand, it also carries risks."],"tip":"These words are mainly used in formal written argumentation and give the text logical structure and coherence."}],"ex":[{"q":"Zo zijn de regels ___. (an unchangeable fact)","options":["nu eenmaal","immers","overigens","enerzijds"],"exp":"[[nu eenmaal]] expresses an unchangeable, accepted fact, with a somewhat resigned tone."},{"q":"We moeten voorzichtig zijn, het is ___ gevaarlijk werk. (a reason already taken for granted)","options":["overigens","immers","nu eenmaal","anderzijds"],"exp":"[[immers]] recalls a reason that the speaker assumes the listener already knows or accepts."},{"exp":"[[Overigens]] introduces an incidental remark or a mild shift in topic, similar to 'by the way/incidentally'."},{"q":"Which sentence correctly uses the 'enerzijds...anderzijds' construction?","options":["Enerzijds wil ik sparen, anderzijds wil ik genieten.","Enerzijds wil ik sparen, maar ook genieten.","Anderzijds wil ik sparen, enerzijds genieten.","Enerzijds, anderzijds wil ik sparen en genieten."],"exp":"Correct structure: [[Enerzijds]] + the first clause, [[anderzijds]] + the second clause, to show two complementary or contrasting aspects of a topic."},{"exp":"[[nu eenmaal]] describes this trait as a fixed, unchangeable fact about the person."},{"q":"What role does 'overigens' usually play in a sentence?","options":["Adding an incidental remark or a mild shift in topic","Expressing a reason already taken for granted","Expressing a strong contrast","Expressing a condition"],"exp":"[[overigens]] is used to add an unexpected incidental remark or a slight change of direction in speech/writing."},{"q":"Put the sentence together: 'On the one hand, technology provides opportunity; on the other hand, it also carries risk.'","exp":"In both clauses, the verb comes immediately after [[enerzijds]]/[[anderzijds]] (inversion, because these words are at the start of their own clause)."},{"q":"Which sentence correctly illustrates the meaning of 'immers'?","options":["Hij kon niet komen, hij was immers ziek.","Hij was immers ziek, dus kwam hij niet weten.","Immers, hij komt morgen misschien.","Hij is immers ziek geweest, maar nu niet meer."],"exp":"In the first option, [[immers]] recalls a reason (illness) that is already assumed/accepted, to explain why he didn't come."}]},"c1-complexe-zinsbouw":{"title":"Complex Sentence Structure","sum":"Complex Dutch sentences can contain several nested subordinate clauses, inversion after a fronted element, and a final verb cluster with three or more verbs (such as [[had moeten worden gedaan]]).","blocks":[{"h":"Nested subordinate clauses","p":"Dutch allows several subordinate clauses to be nested within one sentence. Care must be taken to see which verb belongs to which clause: the verb of the main clause stays in second position (V2), and each subordinate clause moves its own verb to the end of that same clause (not to the end of the whole sentence).","ex":["I think he said that he would come if it didn't rain."]},{"h":"Inversion after a fronted element","p":"According to the verb-second (V2) rule, when a sentence begins with an element other than the subject (an adverb, a subordinate clause, an adverbial phrase), the conjugated verb must come immediately after it, and the subject is placed after the verb.","ex":["Due to the bad weather, the match was cancelled.","Never have I seen anything so ridiculous."]},{"h":"The final verb cluster with three or more verbs","p":"When a modal verb, a tense auxiliary, and a main verb (or passive) combine, a cluster of three or more verbs forms at the end of the subordinate clause. The 'green' order (standard and clearer in formal writing) is: tense auxiliary + modal verb + main/passive verb. For example, [[dat hij het had moeten doen]], or with the passive: [[dat het had moeten worden gedaan]].","ex":["I didn't know that he should have returned the book already.","It is thought that the decision should have been made earlier."]},{"h":"Stylistic tips for clarity in complex sentences","p":"To maintain readability in complex sentences, it is best to keep the number of nested clauses within a reasonable limit, use correct punctuation, and prefer the green order in verb clusters.","tip":"In verb clusters of three or more, the 'green' order (auxiliary + modal + main verb) is usually more readable than the 'red' order, especially in formal writing."}],"ex":[{"q":"In the sentence 'Omdat het regende, bleven we binnen.', what position does the main clause's verb (bleven) occupy?","options":["Immediately after the fronted subordinate clause (inversion)","At the end of the whole sentence","Before the subordinate clause","In the second position of the subordinate clause"],"exp":"Since the subordinate clause 'Omdat het regende' functions as an element in first position in the sentence, the main clause's verb must come immediately after it (the inversion/verb-second rule)."},{"q":"Put the sentence together: 'Never have I seen anything so ridiculous.'","exp":"Since the negative adverb [[Nooit]] is at the start of the sentence, the auxiliary verb ([[heb]]) comes immediately after it and before the subject ([[ik]])."},{"exp":"In the three-verb cluster, the modal verb [[moeten]] is placed between the auxiliary verb ([[had]]) and the main passive verb ([[worden genomen]]): [[had moeten worden genomen]]."},{"q":"Which order for the verb cluster 'dat hij het ... doen' (hebben/kunnen/doen) is more standard and common (the green order)?","options":["had kunnen doen","kunnen had doen","doen had kunnen","had doen kunnen"],"exp":"Standard green order: tense auxiliary ([[had]]) + modal verb ([[kunnen]]) + main verb ([[doen]])."},{"q":"Put the sentence together: 'I think he said that he would come if it didn't rain.'","exp":"This sentence has three layers of nested clauses; each subordinate clause moves its own verb to the end of that same clause, not to the end of the whole sentence."},{"q":"'Door het slechte weer, werd de wedstrijd afgelast.' Which grammatical point does this illustrate?","options":["Inversion after a non-subject fronted element","The impersonal passive","A reduced participial clause","The [[aan het]] construction"],"exp":"Since the adverbial phrase 'Door het slechte weer' is in first position, the verb ([[werd]]) comes immediately after it and before the subject ([[de wedstrijd]])."},{"exp":"The natural order of the verb cluster: [[had]] (auxiliary) + [[moeten]] (modal) + [[teruggeven]] (main verb)."},{"q":"In formal writing, which order of a three-verb cluster usually has better readability?","options":["The green order (auxiliary - modal - main verb)","The red order (main verb - modal - auxiliary)","There is no difference","The auxiliary verb must always come last"],"exp":"In formal written style, the green order (auxiliary, then modal, then main verb) is generally considered clearer and more standard."}]},"c1-idiomatische-uitdrukkingen-grammatica":{"title":"Fixed Idiomatic Expressions and Their Grammar","sum":"Many fixed Dutch expressions ([[vaste verbindingen]]) have a fixed preposition ([[rekening houden met]]), a fixed word order, or an unchangeable article, which must be memorized as a complete unit.","blocks":[{"h":"Fixed prepositions in idiomatic expressions","p":"Many fixed expressions have a specific, unchangeable preposition that must be memorized along with the verb; changing that preposition ruins the meaning or makes the sentence incorrect.","table":{"head":["Expression","Fixed preposition","Meaning"],"rows":[["rekening houden","met","to take into account"],["afhankelijk zijn","van","to be dependent on"],["zich concentreren","op","to concentrate on"],["de voorkeur geven","aan","to give preference to"]]},"ex":["He must take the costs into account.","He preferred tea over coffee."]},{"h":"Fixed word order in expressions","p":"Some fixed expressions have an unchangeable word order that must not be altered in these expressions, even if ordinary grammar would allow reordering. For example, [[voor de dag komen met]] (to come up with something/propose) or [[in de gaten houden]] (to keep an eye on).","ex":["He kept a close eye on the situation.","Can you finally come up with a solution?"]},{"h":"An unchangeable article","p":"In some fixed expressions, the article (or its absence) is an inseparable part of the expression and cannot be changed or pluralized. For example, [[de deur uit gaan]] (not [[een deur]]) or [[het heeft geen zin]] (where [[zin]] is not pluralized here).","ex":["He left the house early.","There's no point in waiting."]},{"h":"Tips for learning fixed expressions","p":"The best method is to memorize the whole expression (verb + preposition + structure) as one unit, rather than memorizing the verb alone. To test whether an expression is idiomatic and fixed, you can substitute one component: if the meaning breaks down or it sounds odd to a native speaker, that expression is a [[vaste verbinding]].","tip":"The best way to learn fixed idiomatic verbs is to memorize the whole expression along with its preposition, not the verb alone."}],"ex":[{"q":"Hij moet rekening houden ___ de kosten. (fixed preposition)","options":["met","van","aan","op"],"exp":"The fixed expression [[rekening houden met]] always takes the preposition [[met]] and cannot be changed."},{"exp":"The fixed expression [[afhankelijk zijn van]] always takes [[van]]."},{"q":"Hij gaf de voorkeur ___ thee boven koffie. (fixed preposition)","options":["aan","voor","op","met"],"exp":"The fixed expression [[de voorkeur geven aan]] always takes [[aan]]."},{"exp":"The fixed expression [[voor de dag komen met]], meaning 'to come up with something', always takes [[met]] and has a fixed word order."},{"q":"Which sentence correctly uses the fixed expression 'in de gaten houden'?","options":["Hij hield de situatie goed in de gaten.","Hij hield in de gaten de situatie goed.","Hij hield de gaten goed in situatie.","Hij hield goed de situatie gaten in."],"exp":"In the fixed expression [[in de gaten houden]], the word order is fixed, and only the object ([[de situatie]]) can be placed between the verb and this expression."},{"q":"'Het heeft geen zin om te wachten.' Why is 'geen zin' unpluralizable and fixed in this expression?","options":["Because this is a fixed idiomatic expression with an unchangeable form","Because [[zin]] is always unpluralizable in all its uses","Because [[zin]] only means 'sentence'","Because this is a spelling rule"],"exp":"[[het heeft geen zin]] is a fixed idiomatic expression whose form (including not pluralizing [[zin]] in this sense) is fixed and unchangeable."},{"exp":"The fixed expression [[zich concentreren op]] always takes [[op]]."},{"q":"Put the sentence together: 'He left the house early.'","exp":"The fixed expression [[de deur uit gaan]] is always used with the definite article [[de]] (not een) and a fixed word order."}]},"c1-stijlfiguren-formeel-schrijven":{"title":"Stylistic Devices in Formal Writing","sum":"Formal and argumentative Dutch writing makes use of devices such as the **passive voice** for objectivity, **hedging** ([[zou kunnen]], [[lijkt erop dat]]), and formal argumentative connectives ([[niettemin]], [[enerzijds...anderzijds]]).","blocks":[{"h":"The passive for objectivity","p":"Omitting the human subject and using the passive (sometimes together with the impersonal passive [[er wordt]]) gives the text an objective, impersonal tone that is common in academic and formal writing; the agent of the action ([[door + subject]]) is mentioned only when it matters.","ex":["Research has been conducted into the effects of this policy.","This research was conducted between 2020 and 2022."]},{"h":"Hedging and cautious phrasing","p":"Hedging phrases claims cautiously and less definitively, and is common in academic argumentation. Key phrases: [[zou kunnen wijzen op]] (could indicate...), [[het lijkt erop dat]] (it appears that), [[mogelijk]] (possibly), [[in zekere zin]] (in a sense).","ex":["This could indicate a connection between these two factors.","It appears that this measure has had an effect."]},{"h":"Formal argumentative connectives","p":"Formal connectives give the text a logical structure and organize the argumentation.","table":{"head":["Connective","Use"],"rows":[["niettemin","nevertheless (an unexpected result)"],["desalniettemin","nevertheless (a more formal and emphatic version)"],["daarentegen","in contrast, on the contrary"],["bovendien","furthermore"]]},"ex":["The results are positive; nevertheless, more research is needed.","The first group grew quickly, while the other group, by contrast, shrank."]},{"h":"Combining devices in an argumentative paragraph","p":"In professional formal writing, the passive voice, hedging, and argumentative connectives are often combined within a single paragraph to maintain both objectivity and logical coherence.","ex":["The research was conducted in two phases. The results appear to indicate the effectiveness of this measure; nevertheless, further study is desirable."],"tip":"Balanced use of these devices makes a text formal and persuasive, but overusing hedging can make the argument seem weak and hesitant."}],"ex":[{"q":"Which sentence is an example of the passive used to create objectivity in formal writing?","options":["Er is onderzoek gedaan naar de effecten van het beleid.","Wij hebben onderzoek gedaan naar de effecten van het beleid.","Ik denk dat het beleid goed werkt.","Jullie moeten onderzoek doen naar het beleid."],"exp":"Omitting the human subject and using the impersonal passive ([[Er is onderzoek gedaan]]) gives the text an objective, impersonal tone that is common in formal/academic writing."},{"q":"'Dit zou kunnen wijzen op een verband.' This is an example of which stylistic device?","options":["Hedging/cautious phrasing","The passive for objectivity","An argumentative connective","A modal particle"],"exp":"The phrase [[zou kunnen wijzen op]] presents the claim cautiously and non-definitively, a classic example of hedging in academic writing."},{"exp":"The fixed phrase [[het lijkt erop dat]] is used to cautiously express an impression or conclusion."},{"q":"Which connective conveys the most formal and most emphatic sense of contrast?","options":["desalniettemin","maar","toch","en"],"exp":"[[desalniettemin]] is the most formal and most emphatic equivalent of 'nevertheless/however' among the options."},{"exp":"[[niettemin]] or [[desalniettemin]] expresses the unexpected relationship between two parts of a sentence in a formal tone."},{"q":"What role does 'daarentegen' play in a sentence?","options":["Showing contrast/opposition to the preceding point","Adding a complementary point without contrast","Expressing a reason","Expressing a condition"],"exp":"[[daarentegen]], meaning 'in contrast/conversely', is used to contrast two ideas or two sets of data."},{"q":"Put the sentence together: 'This research was conducted between 2020 and 2022.' (formal passive)","exp":"Omitting the agent and using the passive verb ([[werd uitgevoerd]]) shifts the focus from 'who did this' to the event itself; an example of objective formal style."},{"q":"What risk does overusing hedging phrases pose in an argumentative text?","options":["It may make the argument seem weak and hesitant","It shortens the text","It makes the text informal","It causes the sentence to become excessively passive"],"exp":"Overusing cautious phrases like [[zou kunnen]], [[mogelijk]], [[lijkt erop dat]] can weaken the writer's argument and make the text appear hesitant."}]}}};

window.GRAMMATICA_I18N.ar = {"topics":{"a1-lidwoorden":{"title":"أدوات التعريف: de و het و een","sum":"في اللغة الهولندية تُستخدم [[de]] أو [[het]] مع الأسماء المعرّفة، و[[een]] مع الأسماء غير المعرّفة؛ ويتوقف الاختيار بين [[de]] و[[het]] على الجنس النحوي للاسم.","blocks":[{"h":"أداة التعريف: [[de]] و [[het]]","p":"على عكس العربية التي تستخدم أداة تعريف واحدة (الـ)، في الهولندية يأتي كل اسم إما مع [[de]] أو مع [[het]]، وكلاهما يقابل في المعنى أداة التعريف العربية **الـ**. الأسماء التي تأتي مع [[de]] تسمى **de-woorden**، والأسماء التي تأتي مع [[het]] تسمى **het-woorden**. نحو ثلاثة أرباع الأسماء الهولندية تأخذ [[de]].","ex":["الطاولة بنية اللون.","الكتاب مثير للاهتمام."],"tip":"أفضل طريقة لتعلّم أي اسم جديد هي حفظه مع أداة تعريفه الخاصة، [[de]] أو [[het]]، لا الاسم بمفرده."},{"h":"متى تُستخدم [[het]]","p":"توجد مجموعة من الأسماء تأخذ [[het]] دائماً: **التصغيرات** (verkleinwoorden المنتهية بـ [[-je]])، وأسماء **اللغات**، و**المعادن** و**الجهات الجغرافية**، والأسماء المشتقة من **فعل في صيغة المصدر**.","list":["التصغيرات: [[het huisje]] (بيت صغير)، [[het boekje]] (كتيّب)","اللغات: [[het Nederlands]]، [[het Perzisch]]","المعادن والجهات: [[het goud]]، [[het noorden]]","المصدر كاسم: [[het lezen]] (القراءة)، [[het eten]] (الطعام/الأكل)"],"ex":["الهولندية ليست صعبة إلى هذا الحد.","الطعام لذيذ الطعم."]},{"h":"متى تُستخدم [[de]]","p":"الأسماء **الجمع** تأخذ [[de]] دائماً، حتى إذا كان مفردها يأخذ [[het]]. كما أن الأسماء المتعلقة بـ**الأشخاص والمهن**، وأغلب **الأشجار والزهور والفواكه والخضروات**، تأخذ [[de]] عادة.","table":{"head":["المفرد","الجمع"],"rows":[["het huis","de huizen"],["het boek","de boeken"],["de auto","de auto's"]]},"ex":["الطفل يلعب في الخارج.","الأطفال يلعبون في الخارج."],"tip":"لا فرق بين [[de]] و [[het]] في الجمع؛ فكل صيغ الجمع تأخذ [[de]]."},{"h":"أداة التعريف غير المعرّفة: [[een]]","p":"تقابل [[een]] في المعنى **واحد/تنوين التنكير** في العربية، وتُستخدم لتقديم شيء مجهول أو غير محدد. وعلى عكس [[de]] و [[het]]، فإن [[een]] واحدة لكلتا مجموعتي الأسماء ولا فرق فيها.","ex":["أنا أرى كلباً.","ذلك بيت جميل."],"tip":"لا تأتي [[een]] أبداً مع اسم جمع؛ فللجمع غير المعرّف لا نستخدم أداة تعريف على الإطلاق: [[Ik zie honden.]] (أنا أرى كلاباً.)"},{"h":"طريقة عملية للتعلّم","p":"في القواميس الهولندية، تُعلَّم أسماء [[het]] عادة بعلامة **(het)** وتكون بقية الأسماء [[de]]. أفضل طريقة هي حفظ كل اسم جديد مع أداة تعريفه.","list":["[[de man]] - رجل","[[het meisje]] - فتاة (تصغير، تأخذ het دائماً)","[[de stad]] - مدينة","[[het land]] - بلد"]}],"ex":[{"exp":"[[boek]] اسم من نوع het-woord، لذا أداة تعريفه هي [[het]]."},{"exp":"بما أن الكلب لم يُذكر من قبل وهو غير محدد، نستخدم أداة التعريف غير المعرّفة [[een]]."},{"q":"ما هو جمع [[het huis]]؟","options":["de huizen","het huizen","de huisen"],"exp":"الأسماء الجمع تأخذ [[de]] دائماً، حتى إذا كان مفردها [[het]]: [[de huizen]]."},{"q":"أي مجموعة من الأسماء تأتي دائماً مع [[het]]؟","options":["أسماء اللغات","أسماء المهن","أسماء الفواكه"],"exp":"أسماء اللغات مثل [[het Nederlands]] تأخذ [[het]] دائماً."},{"exp":"أسماء اللغات تأخذ [[het]] دائماً."},{"q":"رتّب الجملة بالترتيب الصحيح: «أنا أرى كلباً.»","exp":"ترتيب الجملة البسيط: الفاعل + الفعل + المفعول به: [[Ik zie een hond.]]"},{"exp":"الاسم الجمع [[kinderen]] يأتي دائماً مع [[de]]."},{"q":"أي جملة غير صحيحة؟","options":["Het huisje is klein.","De tafel is bruin.","Een boeken zijn duur."],"exp":"لا تأتي [[een]] أبداً مع اسم جمع؛ والجملة الصحيحة هي [[Boeken zijn duur.]]"},{"q":"رتّب الجملة بالترتيب الصحيح: «الأطفال يلعبون في الخارج.»","exp":"بما أن [[kinderen]] جمع، فإن أداة تعريفه هي [[de]]."}]},"a1-meervoud-verkleinwoord":{"title":"الجمع والتصغير","sum":"في الهولندية يُصنع الجمع عادة بإضافة [[-en]] أو [[-s]] (وقد يتغيّر رسم الحركة أو الصامت أحياناً)، وتُصنع التصغيرات بإضافة اللواحق [[-je]] و [[-tje]] و [[-pje]] و [[-etje]].","blocks":[{"h":"الجمع بلاحقة [[-en]]","p":"أشيع لاحقة جمع في الهولندية هي [[-en]]. وقد يتغيّر رسم الحركة الطويلة أو الصامت الأخير في الجذع أحياناً للحفاظ على النطق الصحيح.","list":["[[fiets]] → [[fietsen]] (دراجة)","[[boot]] → [[boten]] (قارب - الحركة المزدوجة [[oo]] في المقطع المفتوح تتحول إلى حركة مفردة [[o]])","[[kat]] → [[katten]] (قطة - يُضاعَف الصامت الأخير للحفاظ على الحركة القصيرة)"],"ex":["لديّ دراجتان.","القطط نائمة."],"tip":"هذه التغيّرات الكتابية هي فقط للحفاظ على النطق الصحيح للحركة؛ الكلمة ومعناها لا يتغيّران."},{"h":"الجمع بلاحقة [[-s]]","p":"الأسماء المنتهية بمقطع غير منبور مثل [[-el, -em, -en, -er]]، وكذلك كثير من الكلمات المستعارة المنتهية بحركة، تُجمع بإضافة [[-s]].","list":["[[tafel]] → [[tafels]] (طاولة)","[[deken]] → [[dekens]] (غطاء)","[[auto]] → [[auto's]] (سيارة)","[[foto]] → [[foto's]] (صورة)"],"ex":["لديّ ثلاث سيارات."],"tip":"عندما ينتهي الاسم بحركة مثل [[a, o, u, y]]، توضع فاصلة عُلوية (أبوستروف) قبل [[s]] للحفاظ على النطق الصحيح: [[auto's]]، لا [[autos]]."},{"h":"صيغ الجمع الشاذة","p":"عدد من الأسماء شائعة الاستخدام لها صيغ جمع شاذة يجب حفظها كل واحدة على حدة.","list":["[[stad]] → [[steden]] (مدينة)","[[kind]] → [[kinderen]] (طفل)","[[ei]] → [[eieren]] (بيضة)","[[schip]] → [[schepen]] (سفينة)"],"tip":"يجب حفظ هذه الصيغ فقط؛ فلا توجد قاعدة ثابتة لها."},{"h":"التصغيرات (verkleinwoorden)","p":"يُصنع التصغير بإضافة إحدى اللواحق [[-je]] أو [[-pje]] أو [[-tje]] أو [[-etje]] إلى الاسم، ويعطيه معنى **الصغر** أو **المحبّة**.","list":["الانتهاء بحروف عادية → [[+je]]: [[huis]] → [[huisje]]، [[kop]] → [[kopje]]","الانتهاء بـ [[m]] → [[+pje]]: [[boom]] → [[boompje]]، [[raam]] → [[raampje]]","الانتهاء بـ [[l, n, r]] بعد حركة طويلة → [[+tje]]: [[stoel]] → [[stoeltje]]، [[deur]] → [[deurtje]]","الانتهاء بـ [[l, n, r]] بعد حركة قصيرة → [[+etje]] مع تضعيف الصامت: [[man]] → [[mannetje]]، [[bel]] → [[belletje]]"],"ex":["انظر، بيت صغير!","هل تريد فنجان قهوة؟"],"tip":"التصغيرات تأخذ [[het]] دائماً، حتى إذا كان الاسم الأصلي [[de]]: [[de tafel]] → [[het tafeltje]]."},{"h":"معنى التصغيرات لا يقتصر على «الصغر»","p":"أحياناً يحمل التصغير دلالة المحبة أو العفوية، وأحياناً يتحول هو نفسه إلى كلمة مستقلة شائعة، مثل [[kopje]] (فنجان) التي لا تشير بالضرورة إلى شيء صغير.","ex":["الجو لطيف، أليس كذلك؟"]}],"ex":[{"exp":"كثير من الأسماء تُجمع بإضافة [[-en]]: [[boek]] → [[boeken]]."},{"exp":"الأسماء المنتهية بحركة تُجمع بإضافة فاصلة عُلوية و [[s]]: [[auto's]]."},{"q":"ما هو الجمع الصحيح لـ [[kat]]؟","options":["katten","kats","katen"],"exp":"يُضاعَف الصامت الأخير للحفاظ على الحركة القصيرة [[a]]: [[katten]]."},{"q":"ما هو جمع [[kind]]؟","options":["kinden","kinderen","kinds"],"exp":"لـ [[kind]] جمع شاذ: [[kinderen]]."},{"exp":"بما أن الكلمة تنتهي بحروف عادية، تُضاف فقط [[+je]]: [[huisje]]."},{"q":"ما هو تصغير [[boom]] (شجرة)؟","options":["boomje","boompje","boomtje"],"exp":"بعد [[m]] تأتي اللاحقة [[+pje]]: [[boompje]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «لديّ دراجتان.»","exp":"ترتيب الجملة البسيط: الفاعل + الفعل + المفعول به."},{"exp":"[[kopje]] تصغير [[kop]] وتُستخدم هنا بمعنى «فنجان»."},{"q":"أي أداة تعريف تأخذها التصغيرات عادة؟","options":["de","het","een فقط"],"exp":"كل التصغيرات، بلا استثناء، تأخذ [[het]]."}]},"a1-voornaamwoorden":{"title":"ضمائر الفاعل والملكية","sum":"ضمائر الفاعل ([[ik, jij, u, hij, zij, wij, jullie, zij]]) تحل محل الاسم الفاعل، وضمائر الملكية ([[mijn, jouw, zijn, haar, ons/onze, jullie, hun]]) تدل على الملكية.","blocks":[{"h":"ضمائر الفاعل","p":"كل ضمير فاعل هولندي يقابل ضميراً عربياً، مع فرق أن الهولندية تميّز بين **أنتَ (الودية)** و **أنتم/حضرتكم (المهذبة)**.","table":{"head":["الضمير","المعنى"],"rows":[["ik","أنا"],["jij / je","أنتَ/أنتِ"],["u","أنتَ/أنتم (المهذبة)"],["hij","هو"],["zij / ze","هي"],["wij / we","نحن"],["jullie","أنتم (الجمع)"],["zij / ze","هم/هن"]]},"ex":["أنا أعيش في أمستردام.","أنتم لطيفون."],"tip":"تُستخدم [[u]] دائماً للتعبير عن الاحترام، سواء كنت تتحدث إلى شخص واحد أو إلى عدة أشخاص."},{"h":"الصيغة الكاملة والصيغة المختصرة: [[je, we, ze]]","p":"[[jij, wij, zij]] صيغ كاملة ومنبورة، و [[je, we, ze]] صيغ مختصرة وغير منبورة أكثر شيوعاً في الكلام اليومي.","ex":["تأخرتَ!","نحن نذهب إلى البيت."],"tip":"تُستخدم الصيغة الكاملة [[jij/wij/zij]] عندما نريد التأكيد على هذا الضمير، مثلاً في الرد على سؤال."},{"h":"ضمائر الملكية","p":"ضمائر الملكية الهولندية، على عكس العربية، تأتي **قبل الاسم**، وتقابل في المعنى ضمائر الملكية المتصلة مثل: -ي، -كَ، -هُ.","table":{"head":["ضمير الملكية","المعنى"],"rows":[["mijn","-ي (ملكي)"],["jouw / je","-كَ (الودية)"],["uw","-كم (المهذبة)"],["zijn","-هُ (له)"],["haar","-ها (لها)"],["ons / onze","-نا"],["jullie","-كم (الجمع)"],["hun","-هم"]]},"ex":["هذا بيتي.","أين حقيبتك؟"]},{"h":"[[ons]] أم [[onze]]؟","p":"الضمير الملكي الوحيد الذي يتغيّر شكله هو [[ons/onze]]: يُستخدم [[ons]] قبل اسم مفرد من نوع [[het]]، و [[onze]] قبل اسم مفرد من نوع [[de]] أو أي اسم جمع.","list":["[[ons huis]] (بيتنا - het-woord مفرد)","[[onze auto]] (سيارتنا - de-woord مفرد)","[[onze kinderen]] (أطفالنا - جمع)"],"ex":["بيتنا كبير.","سيارتنا جديدة."],"tip":"هذا التغيّر يخص [[ons/onze]] فقط؛ باقي ضمائر الملكية لا تتغيّر أبداً."},{"h":"الملكية بواسطة [[van]]","p":"لإظهار ملكية اسم خاص (اسم شخص)، تُستخدم عادة بنية [[van]] بدلاً من حالة الملكية الإنجليزية (الفاصلة العلوية-s): [[het boek van Jan]] تعني «كتاب يان»، لا بإضافة فاصلة علوية-s.","ex":["تلك حقيبة ليزا."],"tip":"فقط في اللغة المحكية تُضاف أحياناً [[-s]] بدون فاصلة علوية إلى الاسم ([[Lisa's tas]])، لكن بنية [[van]] أكثر شيوعاً ورسمية."}],"ex":[{"exp":"ضمير الفاعل لـ «أنا» في الهولندية هو [[ik]]."},{"q":"أي ضمير يُستخدم للخطاب المهذب؟","options":["jij","u","jullie"],"exp":"[[u]] هو الصيغة المهذبة لـ«أنتَ/أنتم»، للمفرد والجمع."},{"exp":"ضمير الملكية لـ «أنا» هو [[mijn]]."},{"q":"أي اختيار صحيح؟ (auto اسم من نوع de-woord)","options":["ons auto","onze auto","on auto"],"exp":"بما أن [[auto]] اسم de-woord، يُستخدم ضمير الملكية [[onze]]."},{"exp":"بما أن [[huis]] اسم het-woord مفرد، يُستخدم [[ons]]."},{"q":"ما هو ضمير الملكية الموافق لـ [[hij]]؟","options":["haar","zijn","hun"],"exp":"ضمير الملكية الموافق لـ [[hij]] (هو) هو [[zijn]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «أنتم لطيفون.»","exp":"ترتيب الجملة البسيط: الفاعل + الفعل + الصفة."},{"exp":"ضمير الملكية لـ «أنتَ» هو [[jouw]] الذي يُستخدم في الكلام غالباً بصيغته المختصرة [[je]]."},{"q":"أي جملة صحيحة؟","options":["Onze kinderen spelen buiten.","Ons kinderen spelen buiten.","Ons kind spelen buiten."],"exp":"بما أن [[kinderen]] جمع، يجب استخدام [[onze]] لا [[ons]]."}]},"a1-zijn-hebben-tegenwoordige-tijd":{"title":"الفعلان zijn و hebben والزمن الحاضر البسيط","sum":"الفعلان [[zijn]] (يكون) و [[hebben]] (يملك) يُصرَّفان بشكل شاذ، وبقية الأفعال القياسية تُصرَّف في زمن الحاضر بإضافة [[-t]] أو بدونها إلى جذع الفعل (stam).","blocks":[{"h":"تصريف الفعل [[zijn]] (يكون)","p":"الفعل [[zijn]] شاذ تماماً ويجب حفظ تصريفه.","table":{"head":["الضمير","الفعل"],"rows":[["ik","ben"],["jij / je","bent"],["u","bent"],["hij / zij","is"],["wij / we","zijn"],["jullie","zijn"],["zij / ze (جمع)","zijn"]]},"ex":["أنا هولندي.","هي أختي."]},{"h":"تصريف الفعل [[hebben]] (يملك)","p":"الفعل [[hebben]] شاذ أيضاً، ولكن يمكن حفظ نمطه بسهولة أكبر من خلال أمثلة أكثر.","table":{"head":["الضمير","الفعل"],"rows":[["ik","heb"],["jij / je","hebt"],["u","hebt / heeft"],["hij / zij","heeft"],["wij / we","hebben"],["jullie","hebben"],["zij / ze (جمع)","hebben"]]},"ex":["لديّ كلب.","لديه أخوان."],"tip":"في السؤال، عندما يأتي الفاعل [[jij/je]] بعد الفعل، يُحذَف [[t]] في آخر الفعل: [[Heb je een hond?]] لا [[Hebt je...]]"},{"h":"جذع الفعل (stam) وقاعدة تصريف الأفعال القياسية","p":"يُستخرج جذع الفعل بحذف [[-en]] من المصدر. في زمن الحاضر: مع [[ik]] يُستخدم الجذع فقط، ومع [[jij/u/hij/zij]] الجذع + [[-t]]، ومع الجمع (wij, jullie, zij) يُستخدم المصدر الكامل نفسه.","table":{"head":["الضمير","فعل werken (يعمل)"],"rows":[["ik","werk"],["jij / je","werkt"],["u","werkt"],["hij / zij","werkt"],["wij / we","werken"],["jullie","werken"],["zij / ze","werken"]]},"ex":["أنا أعمل في متجر.","هي تعمل هناك أيضاً."]},{"h":"قاعدة 't kofschip","p":"إذا كان الحرف الأخير في الجذع من حروف **'t kofschip** (وهي [[t, k, f, s, ch, p]])، فإن صيغة [[jij/u/hij/zij]] تضيف [[-t]] فقط أيضاً؛ لكن إذا كان الجذع نفسه ينتهي بـ [[t]]، فلا تُضاف [[t]] ثانية.","list":["[[fietsen]] → الجذع [[fiets]] (ينتهي أصلاً بـ [[-s]]) → [[hij fietst]]","[[praten]] → الجذع [[praat]] (ينتهي بـ [[t]]) → [[hij praat]] (لا praatt)"],"tip":"لا تأتي أبداً [[t]] مزدوجة متتالية في آخر الفعل."},{"h":"تغيّر المقطع المفتوح في الجذع","p":"عندما يحتوي المصدر على حركة مزدوجة وتقع هذه الحركة، بعد حذف [[-en]]، في مقطع مفتوح، تتحول الحركة المزدوجة إلى حركة مفردة؛ وفي المقابل يُضاعَف الصامت أحياناً للحفاظ على الحركة القصيرة.","list":["[[lopen]] → الجذع [[loop]] (تتحول الحركة المفردة إلى مزدوجة للحفاظ على الصوت الطويل)","[[zitten]] → الجذع [[zit]] (تُحذَف إحدى [[t]] المزدوجتين)"],"ex":["أنا أمشي إلى المدرسة.","أنتَ جالس على كرسي."]}],"ex":[{"exp":"تصريف [[zijn]] مع [[ik]] هو [[ben]]."},{"exp":"تصريف [[hebben]] مع [[jij]] هو [[hebt]]."},{"q":"ما هو التصريف الصحيح لـ [[hij]] مع [[hebben]]؟","options":["heb","hebt","heeft"],"exp":"يُصرَّف الفعل [[hebben]] مع [[hij/zij]] إلى [[heeft]]."},{"exp":"تصريف [[zijn]] مع ضمائر الجمع ([[wij, jullie, zij]]) هو [[zijn]] نفسه."},{"exp":"مع [[ik]] يُستخدم جذع الفعل فقط، بدون أي لاحقة: [[werk]]."},{"q":"ما هو التصريف الصحيح لـ [[jij]] مع [[werken]]؟","options":["werk","werkt","werken"],"exp":"مع [[jij/u/hij/zij]] تُضاف [[-t]] إلى الجذع: [[werkt]]."},{"q":"ما هي الصيغة الصحيحة لـ [[hij]] مع [[praten]]؟","options":["hij praat","hij pratt","hij praatt"],"exp":"جذع [[praten]] هو نفسه [[praat]] (ينتهي بـ [[t]])، فلا تُضاف [[t]] أخرى."},{"q":"رتّب الجملة بالترتيب الصحيح: «هي تعمل في متجر.»","exp":"ترتيب الجملة البسيط: الفاعل + الفعل + ظرف المكان."},{"exp":"جذع [[lopen]] هو [[loop]] (حركة مزدوجة للحفاظ على الصوت الطويل)، ومع [[hij]] تُضاف [[-t]]: [[loopt]]."}]},"a1-woordvolgorde-vragen":{"title":"ترتيب الكلمات والجمل الاستفهامية","sum":"في الجمل الهولندية البسيطة يأتي الفعل دائماً في المرتبة الثانية (إلا في السؤال)، وتُصنع أسئلة نعم/لا والأسئلة الاستفهامية بتقديم الفعل أو بإضافة كلمة استفهام.","blocks":[{"h":"قاعدة الفعل في المرتبة الثانية","p":"في الجملة الخبرية الهولندية، يكون الفعل المصرَّف دائماً **العنصر الثاني** في الجملة، وليس بالضرورة الكلمة الثانية. يمكن أن يأتي الفاعل قبل الفعل أو بعده.","ex":["أنا آكل تفاحة.","اليوم أنا آكل تفاحة."],"tip":"في المثال الثاني، بما أن [[Vandaag]] أصبح العنصر الأول، يأتي الفاعل [[ik]] بعد الفعل ليبقى الفعل في المرتبة الثانية."},{"h":"بنية الفاعل-الفعل-المفعول","p":"البنية الأساسية للجملة البسيطة، كما في الإنجليزية، هي فاعل-فعل-مفعول.","ex":["أنا أشتري كتاباً.","هي تقرأ جريدة."]},{"h":"سؤال نعم/لا","p":"لصنع سؤال يُجاب عنه بنعم أو لا، يُنقَل الفعل المصرَّف إلى **بداية الجملة** ويأتي الفاعل بعده.","ex":["هل أنتَ متعب؟","هل لديك كلب؟","هل تعمل هي هنا؟"],"tip":"عندما يأتي الفاعل [[jij/je]] بعد الفعل، يُحذَف [[-t]] في آخر الفعل: [[Werk je hier?]] لا [[Werkt je hier?]]"},{"h":"الأسئلة الاستفهامية (wh-vragen)","p":"تبدأ الأسئلة الاستفهامية بـ**كلمة استفهام** ويأتي الفعل مباشرة بعدها (نفس قاعدة الفعل في المرتبة الثانية).","table":{"head":["كلمة الاستفهام","المعنى"],"rows":[["wat","ماذا"],["wie","مَن"],["waar","أين"],["wanneer","متى"],["waarom","لماذا"],["hoe","كيف"],["welke","أي"]]},"ex":["أين تعيش؟","ماذا تفعل؟","لماذا تأخرت؟"]},{"h":"الترتيب في الجمل التي تبدأ بظرف زمان أو مكان","p":"عندما تبدأ الجملة بظرف زمان أو مكان، يجب أن يبقى الفعل العنصر الثاني، فيأتي الفاعل بعد الفعل. تُسمى هذه القاعدة **inversie** (الانقلاب).","ex":["غداً سأذهب إلى أمستردام."],"tip":"كل مرة تبدأ الجملة بشيء غير الفاعل (ظرف زمان، ظرف مكان، إلخ)، يتبادل الفعل والفاعل مواقعهما."}],"ex":[{"q":"رتّب الجملة بالترتيب الصحيح: «أنا آكل تفاحة.»","exp":"ترتيب بسيط: الفاعل + الفعل + المفعول به."},{"q":"رتّب الجملة بالترتيب الصحيح: «غداً أذهب إلى المدرسة.» (يجب أن تبدأ الجملة بـ Morgen)","exp":"بما أن الجملة تبدأ بظرف الزمان [[Morgen]]، يأتي الفعل [[ga]] في المرتبة الثانية والفاعل [[ik]] بعده."},{"q":"أي سؤال نعم/لا صحيح؟","options":["Je bent moe?","Ben je moe?","Jij ben moe?"],"exp":"في سؤال نعم/لا، يُنقَل الفعل المصرَّف إلى بداية الجملة: [[Ben je moe?]]"},{"exp":"كلمة الاستفهام لـ «أين» هي [[waar]]."},{"exp":"كلمة الاستفهام لـ «ماذا» هي [[wat]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «هل تعمل هي هنا؟»","exp":"في سؤال نعم/لا يأتي الفعل أولاً: [[Werkt zij hier?]]"},{"q":"في جملة [[Vandaag eet ik een appel]]، أين يقع الفاعل؟","options":["قبل الفعل","بعد الفعل","في آخر الجملة"],"exp":"بما أن [[Vandaag]] جاءت في بداية الجملة، يقع الفاعل [[ik]] بعد الفعل [[eet]] ليبقى الفعل في المرتبة الثانية."},{"exp":"كلمة الاستفهام لـ «لماذا» هي [[waarom]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «هل لديك كلب؟»","exp":"في سؤال نعم/لا ينتقل الفعل إلى بداية الجملة ويُحذَف [[t]] الفعل قبل [[je]]: [[Heb je...]]"}]},"a1-ontkenning":{"title":"النفي بـ niet و geen","sum":"لنفي الجملة في الهولندية تُستخدم [[niet]]، إلا إذا جاء الاسم المقصود مع [[een]] أو بدون أي أداة تعريف، فتُستخدم [[geen]] في تلك الحالة.","blocks":[{"h":"القاعدة العامة: متى تُستخدم [[geen]]؟","p":"تحل [[geen]] محل [[een]]، أي عندما نريد أن نقول إنه **لا** وجود لذلك الاسم على الإطلاق.","ex":["لديّ سيارة.","ليست لديّ سيارة."]},{"h":"[[geen]] مع الأسماء بدون أداة تعريف","p":"تُستخدم [[geen]] أيضاً لنفي الأسماء الجمع أو الأسماء التي لا تحمل أداة تعريف أصلاً (مثل المواد والمأكولات).","ex":["أنا أشرب قهوة.","أنا لا أشرب قهوة.","لديها أطفال.","ليس لديها أطفال."]},{"h":"[[niet]] لنفي الفعل أو الجملة","p":"تُستخدم [[niet]] لنفي **الفعل أو الصفة أو الظرف أو الاسم الذي يحمل أداة تعريف معرّفة ([[de/het]]) أو ضمير ملكية**.","ex":["أنا لا أعمل اليوم.","هذا ليس كتابي."]},{"h":"موضع [[niet]] في الجملة","p":"تأتي [[niet]] عادة قريبة من آخر الجملة، ولكنها تقع **قبل** الصفة أو ظرف المكان أو حرف الجر أو الفعل الثاني (في الجمل التي تحتوي على فعل مساعد).","list":["[[Ik ga niet naar school.]] (قبل ظرف المكان)","[[Hij is niet aardig.]] (قبل الصفة)","[[Zij kan niet komen.]] (قبل الفعل الثاني)"],"tip":"طريقة بسيطة: إذا استطعت إعادة صياغة الجملة ذهنياً على شكل «ليس صحيحاً أن...»، فإن [[niet]] تكون غالباً هي الصحيحة، لا [[geen]]."},{"h":"مقارنة مباشرة بين [[niet]] و [[geen]]","table":{"head":["الجملة المثبتة","الجملة المنفية"],"rows":[["Ik heb een hond.","Ik heb geen hond."],["Ik zie de hond.","Ik zie de hond niet."],["Dit is mijn tas.","Dit is niet mijn tas."]]},"ex":["أنا لا آكل اللحم.","أنا لا آكل ذلك اللحم."]}],"ex":[{"q":"Ik heb ___ broer. (ليس لديّ أخ)","options":["niet","geen","geen een"],"exp":"بما أن [[broer]] اسم غير معرّف بدون أداة تعريف، تُستخدم [[geen]]."},{"exp":"بما أن الاسم جاء مع ضمير الملكية [[mijn]]، يجب استخدام [[niet]]."},{"q":"Zij drinkt ___ koffie.","options":["niet","geen","geen de"],"exp":"[[koffie]] بدون أداة تعريف، فـ [[geen]] هي الصحيحة."},{"exp":"بما أن [[kat]] جاء مع أداة التعريف المعرّفة [[de]]، يجب استخدام [[niet]]."},{"q":"لماذا استُخدمت [[niet]] لا [[geen]] في [[Ik zie de hond niet]]؟","options":["لأن hond اسم جمع","لأن hond يحمل أداة التعريف المعرّفة de","لأن hond فعل"],"exp":"عندما يحمل الاسم أداة تعريف معرّفة [[de/het]]، تُستخدم [[niet]] للنفي."},{"q":"رتّب الجملة بالترتيب الصحيح: «أنا لا أعمل اليوم.»","exp":"تأتي [[niet]] قبل ظرف الزمان [[vandaag]]."},{"exp":"لنفي الصفة ([[aardig]]) تُستخدم [[niet]]."},{"q":"أي جملة صحيحة؟","options":["Ik heb geen tijd.","Ik heb niet tijd.","Ik heb niet een tijd."],"exp":"[[tijd]] اسم بدون أداة تعريف، فيجب استخدام [[geen]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «هي ليس لديها أطفال.»","exp":"بما أن [[kinderen]] بدون أداة تعريف، تُستخدم [[geen]]."}]},"a1-voorzetsels":{"title":"حروف الجر الخاصة بالمكان والزمان","sum":"حروف جر مثل [[in, op, onder, naast, tussen, bij, achter]] تدل على المكان، و [[om, in, op, over, voor]] تعبّر عن الزمان؛ وكثير من هذه الكلمات يختلف معناها حسب السياق.","blocks":[{"h":"حروف الجر المكانية الشائعة","table":{"head":["حرف الجر","المعنى"],"rows":[["in","في، داخل"],["op","على، فوق"],["onder","تحت"],["naast","بجانب، إلى جوار"],["tussen","بين"],["bij","قرب، عند"],["achter","خلف"],["voor","أمام"]]},"ex":["القطة تحت الطاولة.","الكتاب على الطاولة."]},{"h":"الفرق بين [[in]] و [[op]]","p":"تُستخدم [[in]] لما هو **داخل** فضاء أو وعاء، وتُستخدم [[op]] لما يقع **على سطح** شيء.","ex":["الحليب في الثلاجة.","الفناجين على الطاولة."],"tip":"تُستخدم [[op]] أيضاً مع الشارع والساحة والجزيرة: [[op straat]] (في الشارع)، [[op het eiland]] (في الجزيرة)."},{"h":"[[bij]] و [[naast]]","p":"تعني [[bij]] قرب شيء أو عند شخص، وتعني [[naast]] بجانب الشيء تماماً.","ex":["أنا واقف قرب النافذة.","الكرسي بجانب الطاولة."]},{"h":"حروف الجر الزمانية","table":{"head":["حرف الجر","مثال"],"rows":[["om","om acht uur (الساعة الثامنة)"],["in","in januari (في يناير)"],["op","op maandag (أيام الاثنين)"],["over","over een week (بعد أسبوع)"],["voor","voor het eten (قبل الطعام)"]]},"ex":["الدرس يبدأ في الساعة التاسعة.","أذهب إلى المدرسة أيام الاثنين."]},{"h":"ملاحظات خاصة بأيام الأسبوع وأوقات اليوم","p":"تُستخدم [[op]] مع أيام الأسبوع (مثل [[op zaterdag]])، ولكن مع أجزاء اليوم مثل الصباح والمساء تُستخدم بنية [['s]]، مثل [['s avonds]] (مساءً) و [['s ochtends]] (صباحاً).","list":["[['s morgens]] / [['s ochtends]] (صباحاً)","[['s middags]] (ظهراً)","[['s avonds]] (مساءً/عشياً)","[['s nachts]] (ليلاً)"],"ex":["مساءً أشاهد التلفاز."],"tip":"تُكتَب [['s]] دائماً بحرف صغير، حتى في بداية الجملة؛ وفي تلك الحالة تُكتَب الكلمة التالية بحرف كبير: [['s Avonds]]."}],"ex":[{"exp":"[[onder]] تعني تحت شيء."},{"exp":"تُستخدم [[op]] لما يقع على سطح شيء."},{"q":"أي حرف جر صحيح لداخل الثلاجة؟","options":["op","in","achter"],"exp":"بما أن الحليب داخل فضاء الثلاجة، تُستخدم [[in]]: [[in de koelkast]]."},{"exp":"للتعبير عن الساعة المحددة تُستخدم [[om]]."},{"exp":"تُستخدم [[op]] مع أيام الأسبوع."},{"q":"أي اختيار صحيح لـ «مساءً»؟","options":["'s ochtends","'s avonds","'s middags"],"exp":"[['s avonds]] تعني «مساءً»."},{"q":"رتّب الجملة بالترتيب الصحيح: «الكرسي بجانب الطاولة.»","exp":"ترتيب بسيط: الفاعل + الفعل + حرف الجر + المفعول."},{"exp":"تُستخدم [[in]] مع أسماء الشهور."},{"q":"أي جملة صحيحة لـ «بعد أسبوع»؟","options":["over een week","voor een week","om een week"],"exp":"تُستخدم [[over]] للتعبير عن مرور مدة في المستقبل: [[over een week]]."}]},"a1-modale-werkwoorden":{"title":"الأفعال الوجهية","sum":"الأفعال الوجهية مثل [[kunnen]] (يستطيع) و [[mogen]] (يُسمح له) و [[moeten]] (يجب عليه) و [[willen]] (يريد) و [[hoeven]] (لا حاجة) تُستخدم مع فعل آخر في صيغة المصدر في آخر الجملة.","blocks":[{"h":"تصريف الأفعال الوجهية","p":"تُصرَّف الأفعال الوجهية في المفرد (ik, jij/u, hij/zij) بشكل قصير وشاذ نوعاً ما، وتبقى في الجمع (wij, jullie, zij) على صيغة المصدر الكاملة.","table":{"head":["الضمير","kunnen","mogen","moeten","willen"],"rows":[["ik","kan","mag","moet","wil"],["jij / je","kan / kunt","mag","moet","wil / wilt"],["u","kunt / kan","mag","moet","wilt"],["hij / zij","kan","mag","moet","wil"],["wij / we","kunnen","mogen","moeten","willen"],["jullie","kunnen","mogen","moeten","willen"],["zij / ze","kunnen","mogen","moeten","willen"]]}},{"h":"معنى واستخدام كل فعل وجهي","list":["[[kunnen]]: الاستطاعة / الإمكانية","[[mogen]]: السماح","[[moeten]]: الوجوب، يجب","[[willen]]: الإرادة، الرغبة","[[hoeven]]: عدم الحاجة (تُستخدم عادة مع [[niet]])"],"ex":["أستطيع السباحة جيداً.","يُسمح لك بالتدخين هنا."]},{"h":"موضع الفعل الأساسي في آخر الجملة","p":"عندما يكون الفعل الوجهي في الجملة، يأتي الفعل الأساسي في صيغة **المصدر** في **آخر الجملة**؛ ويقع الفعل الوجهي نفسه في المرتبة الثانية من الجملة.","ex":["يجب أن أذهب إلى البيت الآن.","هل تريد أن تشرب فنجان قهوة؟"],"tip":"تُسمى هذه البنية **werkwoord op de laatste plaats** (الفعل في المكان الأخير): الفعل الوجهي ثانياً، والفعل الأساسي أخيراً."},{"h":"[[hoeven niet]] في مقابل [[moeten]]","p":"تُستخدم [[hoeven]] تقريباً دائماً مع [[niet]] وتعني **لا حاجة/لا داعي**، وهي تماماً نقيض [[moeten]] (يجب).","ex":["يجب عليك أن تفعل هذا.","لا حاجة أن تفعل هذا."],"tip":"مع [[hoeven]] تأتي عادة [[te]] قبل الفعل الأساسي: [[hoeven te + مصدر]]، على عكس بقية الأفعال الوجهية التي لا تحتاج [[te]]."},{"h":"نفي الأفعال الوجهية الأخرى","p":"لنفي [[mogen]] (عدم السماح) و [[kunnen]] (عدم الاستطاعة) و [[willen]] (عدم الإرادة)، تأتي [[niet]] فقط قبل الفعل الأساسي في آخر الجملة، كما في أي فعل آخر.","ex":["لا يُسمح لك بالتدخين هنا.","لا أستطيع أن أفعل هذا."]}],"ex":[{"exp":"تصريف [[kunnen]] مع [[ik]] هو [[kan]]."},{"exp":"تصريف [[mogen]] مع [[jij]] هو [[mag]]."},{"q":"ما هو التصريف الصحيح لـ [[wij]] مع [[moeten]]؟","options":["moet","moeten","moest"],"exp":"في الجمع، تبقى الأفعال الوجهية بصيغة المصدر الكاملة: [[wij moeten]]."},{"q":"رتّب الجملة بالترتيب الصحيح: «يجب أن أذهب إلى البيت الآن.»","exp":"يأتي الفعل الوجهي [[moet]] ثانياً ويأتي الفعل الأساسي [[gaan]] بصيغة المصدر في الآخر."},{"exp":"تصريف [[hoeven]] مع [[je]] هو [[hoeft]]."},{"q":"أي فعل يعني «لا حاجة»؟","options":["moeten","hoeven niet","mogen niet"],"exp":"تعني [[hoeven]] مع [[niet]] «لا حاجة»."},{"q":"رتّب الجملة بالترتيب الصحيح: «هل تريد أن تشرب فنجان قهوة؟»","exp":"في السؤال، يأتي الفعل الوجهي [[wil]] أولاً ويأتي الفعل الأساسي [[drinken]] بصيغة المصدر في الآخر."},{"exp":"تصريف [[kunnen]] مع [[ik]] في حالة النفي أيضاً هو [[kan]]، وتُضاف فقط [[niet]]."},{"q":"في جملة [[Ik moet nu naar huis gaan]] أين يقع الفعل الأساسي؟","options":["بداية الجملة","بعد الفاعل","آخر الجملة بصيغة المصدر"],"exp":"عندما يكون الفعل الوجهي في الجملة، يأتي الفعل الأساسي بصيغة المصدر في آخر الجملة."}]},"a2-scheidbare-werkwoorden":{"title":"الأفعال المنفصلة","sum":"الأفعال المنفصلة مثل [[opstaan]] و [[aankomen]] تنفصل في الجملة الرئيسية، وتتصل بشكل خاص في المصدر والزمن التام، وتعود لتتصل من جديد في الجملة التابعة.","blocks":[{"h":"ما هو الفعل المنفصل؟","p":"في الهولندية بعض الأفعال تتكون من جزئين: بادئة (مثل [[op]]، [[aan]]، [[mee]]) والفعل الأساسي. تُسمى هذه **الأفعال المنفصلة** (scheidbare werkwoorden)، مثل [[opstaan]] (ينهض/يستيقظ) و [[aankomen]] (يصل) و [[meenemen]] (يأخذ معه). في حالة المصدر يبقى هذان الجزءان متصلين دائماً، ويقع النبر الأساسي على البادئة.","list":["[[opstaan]] = ينهض / يستيقظ من النوم","[[aankomen]] = يصل","[[meenemen]] = يأخذ معه","[[afspreken]] = يحدد موعداً","[[uitnodigen]] = يدعو","[[instappen]] = يركب (المركبة)","[[weggaan]] = يذهب / يرحل","[[terugkomen]] = يعود"],"tip":"يقع النبر دائماً على بادئة الأفعال المنفصلة؛ وهذه إحدى طرق تمييزها عن الأفعال غير المنفصلة مثل [[bezoeken]]."},{"h":"موضع البادئة في الجملة الرئيسية","p":"في الجملة الرئيسية في زمن الحاضر أو الماضي البسيط، يأتي الفعل المصرَّف بعد الفاعل، أما الجزء المنفصل (البادئة) فينتقل إلى **آخر الجملة**.","ex":["أستيقظ كل صباح في الساعة السابعة.","ستصل غداً في الساعة العاشرة.","هل تأخذ شمسيتك معك؟"]},{"h":"مع الأفعال الوجهية والمصدر","p":"عندما يأتي الفعل المنفصل بصيغة المصدر مع فعل وجهي (مثل [[kunnen]]، [[moeten]]، [[willen]]) أو بعد [[gaan]]، يعود الجزءان ليتصلا من جديد ويقعان كلمة واحدة في آخر الجملة.","ex":["يجب أن أستيقظ باكراً غداً.","هل تريد أخذ الكتاب معك؟"]},{"h":"الزمن التام (voltooide tijd)","p":"في اسم المفعول (deelwoord) للأفعال المنفصلة، تقع بادئة [[ge]] ليس في بداية الكلمة بل **بين البادئة والفعل الأساسي**.","table":{"head":["المصدر","اسم المفعول"],"rows":[["opstaan","opgestaan"],["aankomen","aangekomen"],["meenemen","meegenomen"],["afspreken","afgesproken"]]},"ex":["استيقظ متأخراً هذا الصباح.","اتفقنا على برنامج جميل."]},{"h":"في الجملة التابعة (bijzin)","p":"عندما تبدأ الجملة بحرف ربط تابع مثل [[dat]] أو [[omdat]] أو [[als]]، ينتقل الفعل إلى آخر الجملة، وفي هذه الحالة يعود جزءا الفعل المنفصل ليصبحا **كلمة واحدة**.","ex":["أعتقد أنه سيصل غداً.","هي سعيدة لأنها تعود إلى البيت باكراً."],"tip":"هذه النقطة من أكثر الأخطاء الشائعة لدى متعلمي اللغة: لا تنسَ أنه في الجملة التابعة يجب أن يعود جزءا الفعل ليلتصقا معاً ويصبحا كلمة واحدة."}],"ex":[{"q":"اختر الجملة الصحيحة (الفعل [[opstaan]]).","options":["Ik sta elke dag om zeven uur op.","Ik opsta elke dag om zeven uur.","Ik sta op elke dag om zeven uur."],"exp":"في الجملة الرئيسية، يأتي الفعل المصرَّف بعد الفاعل، وينتقل الجزء المنفصل ([[op]]) إلى آخر الجملة: [[Ik sta ... op]]."},{"q":"في الجملة التابعة، كيف تُكتب الأفعال المنفصلة؟ مثال: ...dat hij morgen ___ (aankomen)","options":["aan komt","komt aan","aankomt"],"exp":"في الجملة التابعة، يعود جزءا الفعل المنفصل ليتصلا معاً ويصبحا كلمة واحدة في آخر الجملة: [[dat hij morgen aankomt]]."},{"q":"ما هو شكل الفعل [[meenemen]] في الزمن التام (voltooide tijd)؟","options":["heeft meegenomen","heeft genomenmee","heeft meegeenomen"],"exp":"في اسم مفعول الأفعال المنفصلة، تقع [[ge]] بين البادئة والفعل الأساسي: [[mee + ge + nomen]] = [[meegenomen]]."},{"exp":"ينفصل الفعل المنفصل [[meenemen]] في الجملة الرئيسية؛ تنتقل البادئة [[mee]] إلى آخر الجملة."},{"exp":"ينفصل الفعل [[afspreken]] في الجملة الرئيسية؛ ينتقل الجزء [[af]] إلى آخر الجملة."},{"exp":"يُصنع اسم مفعول الفعل المنفصل [[thuiskomen]] بإضافة [[ge]] بين البادئة والفعل الأساسي: [[thuisgekomen]]."},{"q":"رتّب الكلمات بالترتيب الصحيح: «سيصل غداً.»","exp":"في الجملة الرئيسية يأتي الفعل [[komt]] بعد الفاعل وتنتقل البادئة [[aan]] إلى آخر الجملة."},{"q":"الترتيب الصحيح لكلمات جملة «يجب أن أستيقظ باكراً.»","exp":"مع الفعل الوجهي [[moet]]، يأتي مصدر الفعل المنفصل [[opstaan]] كلمة واحدة في آخر الجملة."},{"q":"أي جملة تابعة صحيحة؟","options":["Ik weet dat hij morgen aankomt.","Ik weet dat hij morgen komt aan.","Ik weet dat hij aankomt morgen."],"exp":"في الجملة التابعة بعد [[dat]]، يأتي الفعل المنفصل كلمة واحدة ([[aankomt]]) في آخر الجملة."}]},"a2-onvoltooid-verleden-tijd":{"title":"الماضي البسيط","sum":"لصنع الماضي البسيط للأفعال القياسية تُضاف [[-te]] أو [[-de]] إلى جذع الفعل؛ وتُصرَّف الأفعال الشاذة بتغيير الحركة ويجب حفظها.","blocks":[{"h":"استخدام الماضي البسيط","p":"يُستخدم [[onvoltooid verleden tijd]] (الماضي البسيط) للتعبير عن أحداث وعادات الماضي، خاصة في السرد والحكاية، أو عندما يكون زمن الماضي محدداً بدقة.","ex":["كنتُ أعيش سابقاً في أمستردام.","عمل بالأمس حتى وقت متأخر."]},{"h":"الأفعال القياسية (zwakke werkwoorden)","p":"في الأفعال القياسية، تُضاف [[-te]] أو [[-de]] إلى جذع الفعل. للتمييز بين الاثنتين نستخدم القاعدة المعروفة **'t kofschip**: إذا انتهى جذع الفعل بأحد الحروف [[t, k, f, s, ch, p]]، تُضاف [[-te]]؛ وإلا تُضاف [[-de]].","table":{"head":["المصدر","الجذع","الماضي البسيط (المفرد)","الماضي البسيط (الجمع)"],"rows":[["werken","werk","werkte","werkten"],["maken","maak","maakte","maakten"],["leven","leef","leefde","leefden"],["wonen","woon","woonde","woonden"]]},"tip":"لتذكّر حروف قاعدة 't kofschip يمكنك تذكّر عبارة 't kofschip نفسها أو المختصر الإنجليزي x-factor shoes الذي يضم نفس الحروف t,k,f,s,ch,p."},{"h":"الأفعال الشاذة (sterke werkwoorden)","p":"في الأفعال الشاذة، تتغيّر حركة الجذع ولا تُضاف أي [[-te]] أو [[-de]]. في حالة الجمع تُضاف [[-en]] إلى آخر الفعل.","table":{"head":["المصدر","المفرد","الجمع"],"rows":[["lopen","liep","liepen"],["eten","at","aten"],["zien","zag","zagen"],["komen","kwam","kwamen"],["geven","gaf","gaven"],["lezen","las","lazen"]]}},{"h":"الأفعال المساعدة والوجهية المهمة","p":"الأفعال الشائعة [[zijn]] و [[hebben]] والأفعال الوجهية لها أيضاً صيغة شاذة في الماضي البسيط يجب حفظها على حدة.","table":{"head":["المصدر","المفرد","الجمع"],"rows":[["zijn","was","waren"],["hebben","had","hadden"],["kunnen","kon","konden"],["moeten","moest","moesten"],["willen","wilde / wou","wilden"],["mogen","mocht","mochten"]]},"tip":"[[wou]] صيغة محكية لـ [[wilde]] وهي شائعة جداً في الكلام اليومي."},{"h":"الماضي البسيط مقابل الزمن التام","p":"في اللغة المكتوبة والسرد، الماضي البسيط شائع الاستخدام، ولكن في الكلام اليومي يستخدم الهولنديون غالباً **الزمن التام** ([[voltooide tijd]]) للتحدث عن الماضي. وغالباً ما يُجمَع هذان الزمنان في نص واحد.","ex":["عملتُ بالأمس وبعد ذلك ذهبتُ إلى البيت."]}],"ex":[{"q":"ما هي صيغة الماضي البسيط للفعل [[werken]] مع [[hij]]؟","options":["werkde","werkte","werkten"],"exp":"ينتهي الجذع [[werk]] بحرف [[k]] (أحد حروف 't kofschip)، فيأخذ [[-te]]: [[werkte]]."},{"q":"ما هي صيغة الماضي البسيط للفعل [[wonen]] مع [[wij]]؟","options":["woonden","woonten","woonde"],"exp":"لا ينتهي الجذع [[woon]] بحروف 't kofschip، فيأخذ [[-de]]/[[-den]]؛ في الجمع: [[woonden]]."},{"q":"أي صيغة من الماضي البسيط للفعل [[gaan]] في حالة المفرد صحيحة؟","options":["gaande","ging","gingde"],"exp":"[[gaan]] فعل شاذ: المفرد [[ging]]، الجمع [[gingen]]."},{"exp":"لا ينتهي الجذع [[woon]] بحروف 't kofschip، فيأخذ [[-de]]: [[woonde]]."},{"exp":"[[lopen]] فعل شاذ ويتحول في المفرد إلى [[liep]]."},{"exp":"الماضي البسيط لـ [[kunnen]] في حالة الجمع هو [[konden]]."},{"q":"ترتيب درست الكلمات لجملة «عمل بالأمس حتى وقت متأخر»","exp":"يأتي الفعل المصرَّف [[werkte]] بعد الفاعل وتأتي الظروف بعده."},{"q":"الترتيب الصحيح لكلمات جملة «كنا نعيش سابقاً في أمستردام»","exp":"يأتي الفعل [[woonden]] (الماضي البسيط الجمعي) بعد الفاعل."}]},"a2-voltooide-tijd":{"title":"الزمن التام (الماضي القريب)","sum":"يُصنع الزمن التام الهولندي بالفعل المساعد [[hebben]] أو [[zijn]] مع اسم المفعول (deelwoord) في آخر الجملة.","blocks":[{"h":"البنية العامة","p":"يُصنع الزمن التام من الفعل المساعد المصرَّف ([[hebben]] أو [[zijn]]) مع **اسم المفعول** (voltooid deelwoord). يأتي الفعل المساعد بعد الفاعل وينتقل اسم المفعول إلى آخر الجملة.","ex":["قرأتُ كتاباً.","ذهبت إلى المدرسة."]},{"h":"hebben أم zijn؟","p":"أغلب الأفعال تُصرَّف مع [[hebben]]. أما الأفعال التي تدل على **الانتقال إلى مكان آخر** أو **تغيّر الحالة** (مثل [[gaan]]، [[komen]]، [[worden]]، [[blijven]]، [[sterven]]) فتُصرَّف مع [[zijn]].","list":["[[hebben]]: أغلب الأفعال، مثل [[werken]]، [[eten]]، [[lezen]]، [[zien]]","[[zijn]]: الأفعال الحركية مع تغيّر المكان أو الحالة، مثل [[gaan]]، [[komen]]، [[worden]]، [[blijven]]، [[vertrekken]]"],"tip":"بعض الأفعال مثل [[fietsen]] تأتي مع [[hebben]] وأيضاً مع [[zijn]]: إذا كان التأكيد على الفعل نفسه فتُستخدم [[hebben]]، وإذا كان التأكيد على الوصول إلى المقصد فتُستخدم [[zijn]]: [[Ik heb gefietst]] (ركبتُ الدراجة) في مقابل [[Ik ben naar school gefietst]] (ذهبتُ بالدراجة إلى المدرسة)."},{"h":"صنع اسم المفعول للأفعال القياسية","p":"يُصنع اسم مفعول الأفعال القياسية بإضافة [[ge-]] في أول الجذع و [[-t]] أو [[-d]] في آخره؛ وقاعدة 't kofschip نفسها التي رأيناها في الماضي البسيط تُطبَّق هنا أيضاً.","table":{"head":["المصدر","الجذع","اسم المفعول"],"rows":[["werken","werk","gewerkt"],["maken","maak","gemaakt"],["leven","leef","geleefd"],["wonen","woon","gewoond"]]}},{"h":"اسم المفعول للأفعال الشاذة","p":"كثير من الأفعال شائعة الاستخدام لها اسم مفعول شاذ يجب حفظه على حدة.","table":{"head":["المصدر","اسم المفعول"],"rows":[["doen","gedaan"],["geven","gegeven"],["zien","gezien"],["nemen","genomen"],["komen","gekomen"],["gaan","gegaan"],["zijn","geweest"],["hebben","gehad"],["kopen","gekocht"],["schrijven","geschreven"]]},"tip":"اسم مفعول [[zijn]] هو نفسه [[geweest]]: [[Ik ben in Parijs geweest]] (كنتُ في باريس)."},{"h":"ترتيب الكلمات في الجملة","p":"يأتي الفعل المساعد مباشرة بعد الفاعل، وتقع بقية عناصر الجملة (ظرف الزمان، المفعول به، إلخ) في الوسط، ويكون اسم المفعول دائماً آخر كلمة في الجملة الرئيسية.","ex":["نظّفنا بالأمس البيت كله.","هل شاهدتَ ذلك الفيلم من قبل؟"]}],"ex":[{"q":"أي فعل مساعد يُستخدم مع [[gaan]]؟","options":["hebben","zijn","worden"],"exp":"[[gaan]] فعل حركي مع تغيّر المكان، فيُصرَّف مع [[zijn]]: [[Hij is gegaan]]."},{"q":"ما هو اسم المفعول الصحيح للفعل [[kopen]]؟","options":["gekoopt","gekocht","gekopen"],"exp":"[[kopen]] فعل شاذ واسم مفعوله [[gekocht]]."},{"q":"اختر الجملة الصحيحة.","options":["Ik heb een appel gegeten.","Ik ben een appel gegeten.","Ik heb een appel eten."],"exp":"يُصرَّف [[eten]] مع [[hebben]] واسم مفعوله [[gegeten]]."},{"exp":"يُصرَّف الفعل [[gaan]] مع [[zijn]]؛ صيغة الغائب المفرد لـ [[zijn]] هي [[is]]."},{"exp":"يُصنع اسم مفعول [[werken]] بقاعدة 't kofschip على شكل [[gewerkt]]."},{"exp":"اسم المفعول الشاذ لـ [[lezen]] هو [[gelezen]]."},{"q":"الترتيب الصحيح: «كتبتُ بالأمس رسالة»","exp":"يأتي الفعل المساعد [[heb]] بعد الفاعل وينتقل اسم المفعول [[geschreven]] إلى آخر الجملة."},{"q":"الترتيب الصحيح: «ذهب إلى البيت»","exp":"بما أن [[gaan]] فعل حركي، يُستخدم الفعل المساعد [[is]] ويأتي اسم المفعول [[gegaan]] في الآخر."}]},"a2-toekomende-tijd":{"title":"زمن المستقبل","sum":"يُصنع المستقبل في الهولندية عادة بـ [[gaan]] + المصدر (للخطة والنية) أو [[zullen]] + المصدر (للتوقع والوعد والاقتراح).","blocks":[{"h":"طريقتان لصنع المستقبل","p":"للتعبير عن المستقبل، تملك الهولندية بنيتين أساسيتين: [[gaan]] + المصدر و [[zullen]] + المصدر. يعتمد الاختيار بين الاثنتين على **نية الجملة ولهجتها**، لا فقط على الزمن.","list":["[[gaan]] + المصدر: الخطة أو النية أو المستقبل القريب","[[zullen]] + المصدر: التوقع، الوعد، القرار اللحظي، أو الاقتراح"]},{"h":"gaan + المصدر","p":"تُستخدم [[gaan]] عندما يكون هناك تخطيط مسبق أو نية لفعل شيء. يأتي مصدر الفعل الأساسي في آخر الجملة.","ex":["سأشتري غداً سيارة جديدة (أنوي شراءها).","سنذهب هذا الأسبوع إلى الشاطئ."]},{"h":"zullen + المصدر","p":"تُستخدم [[zullen]] للتوقع أو الوعد أو قرار يُتخذ في اللحظة نفسها. وتُستخدم أيضاً في الاقتراحات بصيغة [[Zullen we...?]]","table":{"head":["الضمير","zullen"],"rows":[["ik","zal"],["jij / je","zal / zult"],["hij / zij / het","zal"],["wij / we","zullen"],["jullie","zullen"],["zij / ze","zullen"]]},"ex":["من المحتمل أن تمطر غداً.","سأتصل بك غداً، أعدك بذلك.","ما رأيك أن نشرب القهوة معاً؟"]},{"h":"الفرق الدقيق بين gaan و zullen","p":"تدل [[gaan]] على خطة أو نية محددة مسبقاً، بينما تُستخدم [[zullen]] أكثر للتخمين أو التوقع أو وعد يُقطَع في اللحظة. في كثير من المواقف اليومية، تكون [[gaan]] أكثر طبيعية وشيوعاً.","tip":"يبدأ الاقتراح الودي عادة بـ [[Zullen we...?]]، لا [[Gaan we...?]]"},{"h":"الزمن الحاضر للتعبير عن المستقبل","p":"عندما يكون ظرف الزمان المستقبلي محدداً بوضوح في الجملة (مثل [[morgen]]، [[volgende week]])، يمكن استخدام الزمن الحاضر البسيط أيضاً للتعبير عن المستقبل.","ex":["غداً سألعب التنس."]}],"ex":[{"q":"أي جملة تدل على نية مخطَّطة مسبقاً؟","options":["Ik zal morgen naar de tandarts gaan.","Ik ga morgen naar de tandarts.","Ik ging morgen naar de tandarts."],"exp":"تُستخدم [[gaan]] + المصدر للتعبير عن خطة أو نية محددة مسبقاً."},{"q":"ما هي البنية الشائعة لتقديم اقتراح؟","options":["Gaan we samen eten?","Zullen we samen eten?","Zijn we samen eten?"],"exp":"تُصنع الاقتراحات الودية عادة بـ [[Zullen we...?]]"},{"q":"ما هي الصيغة الصحيحة لـ [[zullen]] مع [[wij]]؟","options":["zal","zult","zullen"],"exp":"مع [[wij]]/[[we]] الصيغة الصحيحة للفعل [[zullen]] هي [[zullen]]."},{"exp":"للوعد، تُستخدم [[zullen]]؛ وصيغتها للمتكلم المفرد هي [[zal]]."},{"exp":"للتعبير عن خطة محددة مسبقاً، تُستخدم [[gaan]] + المصدر."},{"exp":"للتوقع بشأن الطقس، تُستخدم [[zullen]] كثيراً؛ وصيغتها للغائب المفرد هي [[zal]]."},{"q":"الترتيب الصحيح: «سأشتري غداً كتاباً جديداً (أنوي شراءه)»","exp":"بنية [[gaan]] + المصدر: [[ga]] بعد الفاعل والمصدر [[kopen]] في آخر الجملة."},{"q":"الترتيب الصحيح: «ما رأيك أن نشرب القهوة معاً؟»","exp":"يبدأ الاقتراح بـ [[Zullen we]] ويأتي مصدر الفعل الأساسي ([[drinken]]) في الآخر."}]},"a2-bijvoeglijk-naamwoord":{"title":"الصفة ولاحقة -e","sum":"تأخذ الصفة قبل الاسم عادة [[-e]]، إلا إذا جاءت قبل اسم مفرد من نوع het-woord مع [[een]] أو بدون أداة تعريف.","blocks":[{"h":"القاعدة العامة","p":"في الهولندية، عندما تأتي الصفة **قبل الاسم**، يجب في أغلب الحالات إضافة [[-e]] إليها. تعتمد هذه اللاحقة على جنس الاسم (de-woord أو het-woord)، وعلى كونه مفرداً أو جمعاً، وعلى نوع أداة التعريف.","table":{"head":["الحالة","المثال"],"rows":[["de-woord (مفرد، أي أداة تعريف)","de mooie auto / een mooie auto"],["het-woord مفرد مع het/dit/dat","het mooie huis"],["het-woord مفرد مع een/geen/بدون أداة تعريف","een mooi huis"],["الجمع (كلا الجنسين)","mooie auto's / mooie huizen"]]}},{"h":"أسماء de-woorden تأخذ -e دائماً","p":"إذا كان الاسم من نوع [[de-woord]]، فإن الصفة قبله تأخذ [[-e]] دائماً، سواء كانت له أداة تعريف أم لا.","ex":["الحديقة الكبيرة رائعة الجمال.","لديها كلب لطيف."]},{"h":"أسماء het-woorden: يعتمد على أداة التعريف","p":"مع [[het-woorden]] المفردة، إذا كانت أداة التعريف **معرّفة/إشارية** ([[het]]، [[dit]]، [[dat]])، تأخذ الصفة [[-e]]؛ أما إذا كانت أداة التعريف **غير معرّفة** ([[een]]) أو لم تكن هناك أداة تعريف أصلاً، تبقى الصفة بدون [[-e]].","ex":["البيت الجميل يقع على الماء.","أنا أعيش في بيت جميل.","هذا الطفل الصغير يضحك كثيراً."],"tip":"إذا لم تكن هناك أداة تعريف وكان الاسم من نوع het-woord مفرد، فإن الصفة أيضاً لا تأخذ [[-e]]: [[mooi weer]] (جو جميل)."},{"h":"الجمع يأخذ -e دائماً","p":"في حالة الجمع، لا فرق إن كان الاسم de-woord أو het-woord؛ تأخذ الصفة [[-e]] دائماً.","ex":["رسم الأطفال لوحات جميلة."]},{"h":"الاستثناءات والحالة الخبرية","p":"الصفات المنتهية بـ [[-en]] (عادة صفات الجنس والمنشأ مثل [[houten]]، [[gouden]]، [[open]]، [[eigen]]) لا تأخذ [[-e]] أبداً. كذلك عندما تأتي الصفة بعد الفعل (مثل [[zijn]] أو [[worden]]) وليس قبل الاسم (الحالة الخبرية)، فإنها لا تأخذ [[-e]] أبداً.","list":["[[een houten tafel]] (طاولة خشبية) - بدون -e","[[de open deur]] (الباب المفتوح) - بدون -e"],"ex":["ذلك البيت جميل.","تلك السيارة سريعة."],"tip":"تذكّر الفرق: [[een mooi huis]] (قبل الاسم، het-woord غير معرّف، بدون e) في مقابل [[Het huis is mooi]] (الحالة الخبرية، دائماً بدون e)."}],"ex":[{"q":"أي اختيار صحيح؟ (de-woord: de auto)","options":["een groot auto","een grote auto","een groote auto"],"exp":"بما أن [[auto]] اسم de-woord، تأخذ الصفة [[-e]] دائماً: [[grote]]."},{"q":"أي اختيار صحيح؟ (het-woord: het huis، مع أداة تعريف غير معرّفة)","options":["een groot huis","een grote huis"],"exp":"بما أن [[huis]] اسم het-woord وجاء مع [[een]] (أداة تعريف غير معرّفة)، لا تأخذ الصفة [[-e]]: [[groot]]."},{"q":"أي اختيار صحيح؟","options":["het grote huis","het groot huis","het grootehuis"],"exp":"بما أن [[huis]] جاء مع أداة التعريف المعرّفة [[het]]، تأخذ الصفة [[-e]]: [[grote]]."},{"exp":"بما أن [[fiets]] اسم de-woord، تأخذ الصفة [[-e]] دائماً."},{"exp":"بما أن [[probleem]] اسم het-woord وجاء مع [[een]]، لا تأخذ الصفة [[-e]]."},{"exp":"في حالة الجمع، تأخذ الصفة [[-e]] دائماً، حتى مع het-woord."},{"q":"الترتيب الصحيح: «البيت الجميل يقع على البحر» (het huis)","exp":"بما أن [[huis]] جاء مع أداة التعريف المعرّفة [[het]]، تأخذ الصفة [[-e]]: [[mooie]]."},{"q":"الترتيب الصحيح: «لديه سيارة سريعة» (de auto)","exp":"بما أن [[auto]] اسم de-woord، تأخذ الصفة [[-e]] دائماً: [[snelle]]."}]},"a2-vergelijking":{"title":"درجات الصفة (المقارنة)","sum":"للمقارنة تُضاف إلى الصفة [[-er]]، ولصيغة التفضيل المطلق [[-st]]؛ وتُستخدم [[dan]] بمعنى «من»، و [[net zo ... als]] للتعبير عن التساوي.","blocks":[{"h":"درجات الصفة الثلاث","p":"للصفة في الهولندية ثلاث درجات: الحالة العادية (positief)، حالة المقارنة أو التفضيل (comparatief)، وحالة التفضيل المطلق (superlatief).","table":{"head":["الحالة","المثال"],"rows":[["العادية","mooi"],["التفضيلية (-er)","mooier"],["المطلقة (-st)","mooist"]]}},{"h":"صنع حالة التفضيل","p":"لصنع حالة التفضيل، تُضاف [[-er]] إلى آخر الصفة. وبعدها تُستخدم [[dan]] (بمعنى «من») للمقارنة بشيء آخر. وإذا كانت الصفة نفسها تنتهي بـ [[-r]]، تُضاف [[-der]].","ex":["أمستردام أكبر من أوتريخت.","هذه السيارة أغلى من تلك السيارة.","أخي أكبر مني (سناً)."]},{"h":"صنع حالة التفضيل المطلق (الأعلى)","p":"لصنع حالة التفضيل المطلق، تُضاف [[-st]] إلى آخر الصفة وتكون دائماً مصحوبة بأداة التعريف [[de]] أو [[het]]. الصفات الطويلة أو المنتهية بـ [[-s]] تُصنع عادة باستخدام [[meest]].","ex":["هذه أجمل مدينة في هولندا.","هو أكثر شخص مثير للاهتمام أعرفه."],"tip":"بعد حالة التفضيل المطلق تُستخدم [[van]] بدلاً من [[dan]]: [[de mooiste van de klas]] (الأجمل في الصف)."},{"h":"الصفات الشاذة","p":"عدد من الصفات شائعة الاستخدام لها صيغة شاذة في المقارنة يجب حفظها على حدة.","table":{"head":["العادية","التفضيلية","المطلقة"],"rows":[["goed","beter","beste"],["veel","meer","meest"],["weinig","minder","minst"],["graag","liever","liefst"]]}},{"h":"التساوي: net zo ... als","p":"للتعبير عن التساوي بين شيئين تُستخدم بنية [[net zo + الصفة + als]] أو [[even + الصفة + als]]، بمعنى «بنفس القدر الذي...».","ex":["هو بنفس طول أخيه.","هذا التمرين بنفس صعوبة التمرين السابق."]}],"ex":[{"q":"ما هي حالة التفضيل للصفة [[groot]]؟","options":["grootter","groter","grootser"],"exp":"تُصنع حالة التفضيل بإضافة [[-er]]: [[groter]]."},{"q":"أي جملة صحيحة؟","options":["Zij is mooier dan haar zus.","Zij is mooier als haar zus.","Zij is mooier van haar zus."],"exp":"بعد حالة التفضيل تُستخدم [[dan]] للمقارنة، لا [[als]]."},{"q":"ما هي حالة التفضيل المطلق للصفة [[goed]]؟","options":["goedste","beste","meeste"],"exp":"[[goed]] صفة شاذة: التفضيلية [[beter]]، المطلقة [[beste]]."},{"exp":"تُصنع حالة التفضيل لـ [[duur]] بإضافة [[-der]] (لأنها تنتهي بـ -r): [[duurder]]."},{"exp":"تُصنع حالة التفضيل المطلق بإضافة [[-st]]: [[mooiste]]."},{"exp":"في بنية التساوي [[net zo ... als]]، تأتي كلمة [[als]] بعد الصفة."},{"q":"الترتيب الصحيح: «أمستردام أكبر من أوتريخت»","exp":"بنية المقارنة: الفعل [[is]]، الصفة التفضيلية [[groter]]، ثم [[dan]] + المقارَن به."},{"q":"الترتيب الصحيح: «هذا أجمل بيت في الشارع»","exp":"تأتي حالة التفضيل المطلق دائماً مع أداة تعريف، وبعدها تُستخدم [[van]] لتحديد المجموعة."}]},"a2-voegwoorden":{"title":"حروف الربط التنسيقية والتبعية","sum":"حروف الربط التنسيقية مثل [[en]] و [[maar]] و [[want]] لا تغيّر ترتيب الجملة، لكن حروف الربط التبعية مثل [[omdat]] و [[als]] تدفع الفعل إلى آخر الجملة.","blocks":[{"h":"نوعان من حروف الربط","p":"توجد في الهولندية فئتان أساسيتان من حروف الربط: **التنسيقية** (nevenschikkend) التي تصل جملتين مستقلتين دون تغيير ترتيب الكلمات، و**التبعية** (onderschikkend) التي تجعل جملة تابعة للجملة الرئيسية وتدفع الفعل إلى آخرها."},{"h":"حروف الربط التنسيقية","p":"أهم حروف الربط التنسيقية هي [[en]] (و)، [[maar]] (لكن)، [[of]] (أو)، [[want]] (لأن) و [[dus]] (لذلك/فإذن). بعد هذه الحروف يبقى ترتيب الجملة العادي (الفاعل + الفعل) كما هو.","ex":["سأبقى في البيت، لأنني مصاب بالبرد.","هو يعمل كثيراً، فإذن هو متعب."],"tip":"على الرغم من أن [[want]] و [[omdat]] تعنيان كلاهما «لأن»، فإن [[want]] لا تغيّر ترتيب الجملة، بينما [[omdat]] تدفع الفعل إلى آخر الجملة. هذا من أكثر الأخطاء الشائعة لدى متعلمي اللغة."},{"h":"حروف الربط التبعية","p":"حروف الربط التبعية مثل [[omdat]] (لأن)، [[als]] (إذا/عندما)، [[terwijl]] (في حين)، [[hoewel]] (مع أن)، [[voordat]] (قبل أن) و [[nadat]] (بعد أن) تحوّل الجملة التي تليها إلى **جملة تابعة** ينتقل فيها الفعل المصرَّف إلى آخرها.","ex":["سأبقى في البيت لأنني مصاب بالبرد.","مع أن المطر يتساقط، سنذهب لركوب الدراجات."]},{"h":"عندما تأتي الجملة التابعة أولاً","p":"إذا جاءت الجملة التابعة في بداية الجملة الكاملة، تبدأ الجملة الرئيسية بعدها بـ**الانقلاب** (الفعل قبل الفاعل).","ex":["لأنني مصاب بالبرد، سأبقى في البيت.","إذا تساقط المطر، سنبقى داخل البيت."],"tip":"لاحظ أنه في هذه الحالة يأتي فعل الجملة الرئيسية ([[blijf]]/[[blijven]]) مباشرة بعد الفاصلة وقبل الفاعل."},{"h":"قائمة حروف الربط الشائعة","list":["تنسيقية: [[en]] (و)، [[maar]] (لكن)، [[of]] (أو)، [[want]] (لأن)، [[dus]] (لذلك)","تبعية: [[omdat]] (لأن)، [[als]] (إذا/عندما)، [[terwijl]] (في حين)، [[hoewel]] (مع أن)","تبعية: [[voordat]] (قبل أن)، [[nadat]] (بعد أن)، [[totdat]] (حتى)، [[zodat]] (بحيث)"]}],"ex":[{"q":"أي حرف ربط يدفع الفعل إلى آخر الجملة؟","options":["want","en","omdat"],"exp":"[[omdat]] حرف ربط تبعي ويدفع الفعل إلى آخر الجملة التابعة."},{"q":"اختر الجملة الصحيحة.","options":["Ik blijf thuis want het regent.","Ik blijf thuis omdat het regent, en ik niet uitga.","Ik blijf thuis, omdat regent het."],"exp":"بعد [[want]] (تنسيقي)، يبقى ترتيب الجملة العادي: الفاعل [[het]] قبل الفعل [[regent]]."},{"q":"أي جملة ترتيبها صحيح؟","options":["Omdat ik ziek ben, ik blijf thuis.","Omdat ik ziek ben, blijf ik thuis.","Ik blijf omdat ziek ben ik thuis."],"exp":"عندما تأتي الجملة التابعة أولاً، تبدأ الجملة الرئيسية بالانقلاب (الفعل قبل الفاعل): [[blijf ik]]."},{"exp":"للتعبير عن السبب دون تغيير ترتيب الجملة، يُستخدم حرف الربط التنسيقي [[want]]."},{"exp":"تعني [[als]] «إذا/عندما» وتُنشئ جملة تابعة يأتي فيها فعل الجملة الرئيسية بعدها بالانقلاب."},{"exp":"تعبّر [[dus]] (لذلك) عن النتيجة وتحافظ على ترتيب الجملة العادي."},{"q":"الترتيب الصحيح: «سأبقى في البيت لأنني مصاب بالبرد»","exp":"بعد [[omdat]]، ينتقل الفعل [[ben]] إلى آخر الجملة التابعة."},{"q":"الترتيب الصحيح: «مع أن المطر يتساقط، سنذهب لركوب الدراجات»","exp":"تبدأ الجملة التابعة بـ [[hoewel]] وينتقل فعلها ([[regent]]) إلى آخرها؛ وتأتي الجملة الرئيسية بعدها بالانقلاب ([[gaan we]])."}]},"a2-er":{"title":"استخدامات er","sum":"للكلمة [[er]] في الهولندية استخدامات عدة: الدلالة على الوجود ([[er is/zijn]])، والحلول محل حرف الجر ([[erover]]، [[ermee]])، والإشارة إلى المكان، والمصاحبة مع الأعداد والكميات.","blocks":[{"h":"نظرة عامة على er","p":"تُعد [[er]] من أصعب الكلمات الهولندية وأكثرها استخداماً بالنسبة لمتعلمي اللغة، لأن لها عدة أدوار مختلفة تماماً. في هذا الدرس نرى استخداماتها الأساسية الأربعة.","list":["الدلالة على الوجود: [[Er is een probleem.]]","الحلول محل حرف الجر + الشيء: [[erover]]، [[ermee]]","الإشارة إلى المكان (بدون نبر): [[Ik kom er net vandaan.]]","المصاحبة مع عدد أو كمية: [[Ik heb er twee.]]"]},{"h":"er للدلالة على الوجود (existentieel er)","p":"عندما نريد أن نقول إن شيئاً **موجود** ويكون فاعل الجملة غير معرّف (مع [[een]] أو بدون أداة تعريف)، نستخدم [[er is]] (للمفرد) أو [[er zijn]] (للجمع) في بداية الجملة.","ex":["توجد مشكلة في السيارة.","يوجد أشخاص كثيرون في الشارع."],"tip":"إذا كان الفاعل معرّفاً (مع [[de]] أو [[het]])، فإن [[er]] لا تُستخدم عادة: [[De auto staat voor de deur.]]"},{"h":"er + حرف الجر","p":"عندما نشير إلى شيء (لا شخص) بحرف جر، يُستبدَل [[over het]] و [[met het]] ونحوها بـ [[er]] مع حرف الجر: [[erover]]، [[ermee]]، [[erin]]، [[erop]]، [[eraan]].","ex":["أنا أفكر في ذلك.","هل بدأتَ به؟"],"tip":"لا تُستخدم [[er]] للإشارة إلى الأشخاص؛ بل يُستخدم عندها الضمير + حرف الجر: عندما يكون المقصود شخصاً نقول [[met hem]]، لا [[ermee]]."},{"h":"er للإشارة إلى المكان","p":"يمكن استخدام [[er]] بدلاً من [[daar]] (بدون نبر) للإشارة إلى مكان ذُكر من قبل.","ex":["أما زلتَ تعيش في أوتريخت؟ نعم، أعيش هناك منذ عشر سنوات.","لقد أتيتُ من هناك الآن."]},{"h":"er مع العدد أو الكمية","p":"عندما نشير إلى عدد أو كمية شيء دون تكرار الاسم، نستخدم [[er]] مع العدد أو كلمات الكمية (مثل [[veel]]، [[weinig]]).","ex":["هل لديك إخوة أو أخوات؟ نعم، لديّ اثنان.","لديّ ما يكفي."]}],"ex":[{"q":"أي جملة صحيحة للتعبير عن وجود شيء؟","options":["Er is een probleem.","Het is een probleem.","Er een probleem is."],"exp":"للتعبير عن وجود شيء مع فاعل غير معرّف، تبدأ الجملة بـ [[Er is]] / [[Er zijn]]."},{"q":"ما هي الصيغة الصحيحة للحلول محل [[over het boek]]؟","options":["erboek","overhet","erover"],"exp":"عندما نشير إلى شيء (لا شخص) بحرف جر، تتحد [[er]] مع حرف الجر: [[erover]]."},{"q":"ما هو الرد الصحيح على «Heb je kinderen?» بالإشارة إلى عدد؟","options":["Ja, ik heb twee er.","Ja, ik heb er twee.","Ja, ik er heb twee."],"exp":"في استخدام er مع العدد، تأتي [[er]] بعد الفعل وقبل العدد: [[ik heb er twee]]."},{"exp":"للتعبير عن وجود شيء مع فاعل جمع غير معرّف، تبدأ الجملة بـ [[Er zijn]]."},{"exp":"اتحاد [[er]] مع حرف الجر [[over]] يعطي [[erover]]."},{"exp":"للإشارة إلى كمية شيء دون تكرار الاسم، تُستخدم [[er]]: [[ik heb er niet genoeg]]."},{"q":"الترتيب الصحيح: «توجد مشكلة كبيرة»","exp":"تبدأ الجملة للتعبير عن وجود شيء بـ [[Er is]] ويأتي بعدها الفاعل غير المعرّف."},{"q":"الترتيب الصحيح لجزء الرد على «كم كتاباً لديك؟»: «لديّ ثلاثة»","exp":"في الرد على سؤال عن العدد، تأتي [[er]] بعد الفعل وقبل العدد."}]},"a2-gebiedende-wijs":{"title":"صيغة الأمر","sum":"لصنع جملة الأمر تُستخدم عادة جذر الفعل (صيغة ik) بدون فاعل؛ وللحالة المهذبة يُصاحب الفعل [[u]].","blocks":[{"h":"صنع جملة الأمر البسيطة","p":"لإعطاء أمر لشخص (jij/je)، يُستخدم فقط **جذر الفعل** (الصيغة نفسها المستخدمة مع [[ik]]) ولا يُذكر الفاعل عادة.","ex":["تعال هنا!","استمع جيداً!","أعطني الكتاب."],"tip":"في الأفعال المنفصلة، تنتقل البادئة إلى آخر جملة الأمر: [[Sta op!]] (قم!)"},{"h":"جملة الأمر المنفية","p":"للأمر المنفي، تأتي [[niet]] قبل الفعل أو في المكان المناسب من الجملة؛ ومع الأسماء تُستخدم [[geen]].","ex":["لا تمشِ بهذه السرعة!","لا تقلق.","لا تتأخر!"]},{"h":"الحالة المهذبة مع u","p":"للأمر أو الطلب المهذب من شخص يُخاطَب بـ [[u]]، يأخذ الفعل صيغة الغائب المفرد نفسها (مع [[-t]]) ويأتي [[u]] بعده.","ex":["تفضل بالدخول.","تفضل بالجلوس.","تفضل، خذ مكانك."]},{"h":"الطلب المهذب بـ wilt u / kunt u","p":"في اللغة اليومية، يُستخدم غالباً [[Wilt u...]] أو [[Kunt u...]] مع مصدر الفعل في آخر الجملة للطلب المهذب، بدلاً من جملة الأمر المباشرة.","ex":["هل يمكنك الانتظار هنا قليلاً؟","هل يمكنك إغلاق الباب؟"],"tip":"هذا الشكل من الطلب أكثر تهذيباً وشيوعاً من جملة الأمر المباشرة مع [[u]] في الكلام اليومي."},{"h":"عبارات أمرية شائعة","p":"هناك عدد من العبارات الأمرية الثابتة والشائعة جداً تُرى كثيراً في الحياة اليومية وعلى اللوحات.","list":["[[Pas op!]] = احذر!","[[Let op!]] = انتبه!","[[Niet roken]] = ممنوع التدخين (على اللوحات)","[[Wacht even.]] = انتظر لحظة."]}],"ex":[{"q":"ما هي الصيغة الصحيحة لجملة الأمر للفعل [[komen]] مع jij؟","options":["Jij komt!","Kom!","Komen!"],"exp":"تُصنع جملة الأمر البسيطة من جذر الفعل (نفس صيغة ik) ولا يُذكر الفاعل: [[Kom!]]"},{"q":"ما هي جملة الأمر المهذبة الصحيحة؟","options":["U komt binnen.","Komt u binnen.","Komen u binnen."],"exp":"في جملة الأمر المهذبة، يأتي الفعل مع [[-t]] قبل [[u]]: [[Komt u binnen]]."},{"q":"ما هي جملة الأمر المنفية الصحيحة؟","options":["Niet loop zo snel!","Loop niet zo snel!","Loop zo snel niet!"],"exp":"في جملة الأمر المنفية، تأتي [[niet]] بعد الفعل والظرف: [[Loop niet zo snel!]]"},{"exp":"تُصنع جملة الأمر البسيطة بجذر الفعل: [[Kom]]."},{"exp":"العبارة الثابتة [[Maak je geen zorgen]] تعني «لا تقلق»."},{"exp":"في الطلب المهذب بـ [[Wilt u...]]، يأتي مصدر الفعل الأساسي في آخر الجملة."},{"q":"الترتيب الصحيح: «قم!» (لـ jij)","exp":"ينفصل الفعل المنفصل [[opstaan]] في جملة الأمر أيضاً: [[Sta op!]]"},{"q":"الترتيب الصحيح: «تفضل بالجلوس» (مهذب)","exp":"جملة الأمر المهذبة: الفعل مع [[-t]] ([[Gaat]])، ثم [[u]]، ثم بقية الجملة."}]},"a2-aanwijzende-voornaamwoorden":{"title":"ضمائر الإشارة","sum":"للإشارة إلى شيء قريب تُستخدم [[deze]] (de-woord/جمع) و [[dit]] (het-woord)، وللإشارة إلى شيء بعيد تُستخدم [[die]] (de-woord/جمع) و [[dat]] (het-woord).","blocks":[{"h":"جدول عام لضمائر الإشارة","p":"تعتمد ضمائر الإشارة في الهولندية على شيئين: **المسافة** (قريب أو بعيد) و**جنس الاسم** (de-woord أو het-woord)، وكذلك على كونه مفرداً أو جمعاً.","table":{"head":["المسافة","de-woord مفرد","het-woord مفرد","الجمع (كلا الجنسين)"],"rows":[["قريب","deze","dit","deze"],["بعيد","die","dat","die"]]}},{"h":"deze و dit (القريب)","p":"تُستخدم [[deze]] للإشارة إلى **de-woord مفرد** قريب، و [[dit]] للإشارة إلى **het-woord مفرد** قريب.","ex":["هذه السيارة جديدة.","هذا البيت قديم جداً."]},{"h":"die و dat (البعيد)","p":"تُستخدم [[die]] للإشارة إلى **de-woord مفرد** بعيد (أو أي اسم جمع)، و [[dat]] للإشارة إلى **het-woord مفرد** بعيد.","ex":["تلك السيارة هناك ملك جاري.","ذلك البيت في آخر الشارع معروض للبيع."]},{"h":"حالة الجمع","p":"في حالة الجمع، لا فرق إن كان الاسم الأصلي de-woord أو het-woord: للقريب تُستخدم دائماً [[deze]] وللبعيد تُستخدم دائماً [[die]].","ex":["هذه الكتب لي.","تلك البيوت غالية جداً."]},{"h":"الاستخدام المستقل كضمير","p":"يمكن استخدام ضمائر الإشارة بمفردها، دون اسم، وغالباً مع الفعل [[zijn]]؛ وفي هذا الاستخدام تكون [[dit]] و [[dat]] شائعتين جداً، بل يمكن استخدام [[dat]] حتى عندما يكون الاسم التالي جمعاً.","ex":["هذا أخي.","هذا جميل!","هؤلاء والداي."],"tip":"في جملة [[Dat zijn mijn ouders]]، مع أن [[ouders]] جمع، تُستخدم [[dat]] (لا [[die]])، لأنها في هذا الاستخدام أداة تعريف عامة، لا صفة إشارية كاملة للاسم."}],"ex":[{"q":"ما هو الضمير الصحيح للإشارة إلى de-woord قريب؟","options":["dit","deze","dat"],"exp":"لـ de-woord مفرد قريب، الضمير الصحيح هو [[deze]]."},{"q":"ما هو الضمير الصحيح للإشارة إلى het-woord بعيد؟","options":["die","dat","deze"],"exp":"لـ het-woord مفرد بعيد، الضمير الصحيح هو [[dat]]."},{"q":"أي جملة صحيحة؟ (het boek)","options":["Deze boek is interessant.","Dit boek is interessant.","Die boek is interessant."],"exp":"بما أن [[boek]] اسم het-woord مفرد ونشير إلى شيء قريب، الضمير الصحيح هو [[dit]]."},{"exp":"لـ het-woord مفرد قريب، الضمير الصحيح هو [[dit]]."},{"exp":"في حالة الجمع للشيء البعيد، تُستخدم دائماً [[die]]، لا فرق إن كان de-woord أو het-woord."},{"exp":"كل من [[Dit]] (للشيء/الشخص القريب) و [[Dat]] (للشيء/الشخص الأبعد قليلاً) صحيحان في التعريف المستقل."},{"q":"الترتيب الصحيح: «هذه السيارة جديدة» (de auto، قريب)","exp":"بما أن [[auto]] اسم de-woord وقريب، الضمير الصحيح هو [[deze]]."},{"q":"الترتيب الصحيح: «ذلك البيت معروض للبيع» (het huis، بعيد)","exp":"بما أن [[huis]] اسم het-woord وبعيد، الضمير الصحيح هو [[dat]]."}]},"b1-voltooid-verleden-tijd":{"title":"الماضي التام البعيد (Voltooid Verleden Tijd)","sum":"يُبنى [[Voltooid Verleden Tijd]] من **had** أو **was** + صيغة الفعل الثالث (deelwoord)، ويُستخدم للتعبير عن حدث وقع قبل لحظة أخرى في الماضي.","blocks":[{"h":"بنية الفعل","p":"يتكوّن الماضي التام البعيد الهولندي من جزأين: الفعل المساعد **had/hadden** أو **was/waren** + [[voltooid deelwoord]] (الفعل الثالث/التصريف الثالث للفعل). والاختيار بين [[had]] و[[was]] هو تمامًا كالاختيار بين [[heb]] و[[ben]] في الماضي التام الحاضر (voltooid tegenwoordige tijd): أفعال الحركة وتغيّر الحالة تُصرَّف مع [[zijn]]، وبقية الأفعال مع [[hebben]].","table":{"head":["الفاعل","أفعال hebben","أفعال zijn"],"rows":[["ik","had gewerkt","was gegaan"],["jij/u","had gewerkt","was gegaan"],["hij/zij","had gewerkt","was gegaan"],["wij/jullie/zij","hadden gewerkt","waren gegaan"]]},"ex":["كنت قد فعلت ذلك من قبل.","كانوا قد رحلوا من قبل."],"tip":"أفعال مثل [[blijven]] و[[worden]] و[[gebeuren]] تُصرَّف أيضًا مع [[zijn]]، لا مع [[hebben]]."},{"h":"الاستخدام: الماضي السابق للماضي","p":"نستخدم [[voltooid verleden tijd]] عندما نريد أن نقول إن أمرًا ما قد حدث قبل لحظة أخرى في الماضي. هذا الزمن يقابل تمامًا **الماضي التام البعيد** في العربية: لدينا نقطة في الماضي (بصيغة [[verleden tijd]] البسيطة) وحدث سابق لها (بصيغة [[voltooid verleden tijd]]).","ex":["عندما وصلت إلى المحطة، كان القطار قد تحرك من قبل.","قال إنه لم يكن قد زار باريس من قبل أبدًا.","بعد أن كنا قد تناولنا الطعام، ذهبنا في نزهة على الأقدام."]},{"h":"كلمات إشارة شائعة","p":"كلمات مثل [[al]] (من قبلُ)، و[[nog niet]] (ليس بعدُ)، و[[net]] (للتوّ)، و[[voordat]] (قبل أن)، و[[nadat]] (بعد أن) غالبًا ما ترافق الماضي التام البعيد وتحدّد العلاقة الزمنية بين حدثين ماضيين.","list":["[[al]] = من قبلُ، حتى ذلك الوقت","[[nog niet]] = ليس ... بعدُ","[[net]] = للتوّ، في تلك اللحظة (في الماضي)","[[voordat]]/[[nadat]] = قبل أن / بعد أن"]},{"h":"ترتيب الكلمات في الجمل الفرعية","p":"عندما يرد [[voltooid verleden tijd]] في جملة فرعية (بعد [[toen]] أو [[nadat]] أو [[voordat]] أو [[omdat]])، يُنقل الفعل المساعد ([[had]]/[[was]]) إلى نهاية الجملة الفرعية ويقع بعد الفعل الثالث: **...omdat hij het geld niet had meegenomen.**","ex":["كنت سعيدًا لأنني كنت قد حصلت على شهادتي أخيرًا.","لأن المطر كان قد انهمر بشدة، كانت الطريق مبللة."],"tip":"في الجملة الفرعية، يأتي الفعل المساعد دائمًا بعد الفعل الثالث وفي نهاية الجملة: [[...dat hij het niet gezien had]] (لا had gezien)."}],"ex":[{"q":"أي جملة تُظهر الماضي التام البعيد الصحيح؟ (كان قد رحل من قبل)","options":["Hij was al gegaan.","Hij had al gegaan.","Hij is al gegaan.","Hij ging al."],"exp":"[[gaan]] فعل حركة ويُصرَّف مع [[zijn]]، لذا الصيغة الصحيحة هي [[was gegaan]]."},{"exp":"الفعل [[beginnen]] يُصرَّف مع [[zijn]]، وبما أن الفاعل مفرد (de film) فإن الفعل المساعد هو [[was]]."},{"q":"املأ الفراغ بالخيار الصحيح: Ik ___ het boek al gelezen voordat de film uitkwam.","options":["had","was","heb","ben"],"exp":"الفعل [[lezen]] يُصرَّف مع [[hebben]]، لذا الماضي التام البعيد له هو [[had gelezen]]."},{"exp":"الفعل [[worden]] يُصرَّف مع [[zijn]]؛ الفاعل المفرد المؤنث (zij) ← [[was]]."},{"q":"ابحث عن الترتيب الصحيح للكلمات لتكوين الجملة: «كان قد رحل عندما وصلتُ».","exp":"البنية: الفاعل + was + al + الفعل الثالث + toen + الجملة الفرعية. الفعل المساعد [[was]] لأن [[vertrekken]] يُصرَّف مع zijn."},{"q":"أي جملة تعبّر بشكل صحيح عن أنه «لم يكن قد زار باريس أبدًا حتى تلك اللحظة»؟","options":["Hij was nog nooit in Parijs geweest.","Hij is nog nooit in Parijs geweest.","Hij was nog nooit in Parijs.","Hij heeft nog nooit in Parijs geweest."],"exp":"للحدث الذي يسبق لحظة أخرى في الماضي، نستخدم [[was ... geweest]] (الماضي التام البعيد لـ zijn)."},{"exp":"الفاعل الجمع (ze/zij) يأتي مع الفعل المساعد [[hadden]]؛ الفعل [[eten]] يُصرَّف مع [[hebben]]."},{"q":"ما الفرق بين «Ik had het gedaan» و«Ik heb het gedaan»؟","options":["الأولى تُظهر أن الفعل حدث قبل لحظة أخرى في الماضي؛ والثانية تقول فقط إن الفعل حدث في الماضي (وامتدّ أثره إلى الآن).","لا فرق بينهما.","الأولى للمستقبل.","الثانية ماضٍ تام بعيد."],"exp":"[[had gedaan]] هو الماضي التام البعيد (الماضي السابق للماضي)، في حين أن [[heb gedaan]] هو الماضي التام الحاضر (perfect) الذي له صلة بالزمن الحاضر."},{"exp":"[[geboren worden]] يُصرَّف مع [[zijn]]؛ الفاعل المفرد (ik) ← [[was]]."}]},"b1-betrekkelijke-bijzinnen":{"title":"الجمل الموصولة (die/dat/waar/wie)","sum":"تُستخدم الجمل الموصولة بـ [[die]] و[[dat]] و[[waar + حرف جر]] و[[حرف جر + wie]] (للأشخاص) لوصف الاسم السابق لها.","blocks":[{"h":"die أم dat؟","p":"لتكوين الجملة الموصولة، نستخدم [[die]] أو [[dat]] حسب جنس الاسم الذي نشير إليه: إذا كان الاسم من نوع [[de-woord]] (أو كان جمعًا) نستخدم [[die]]؛ وإذا كان الاسم من نوع [[het-woord]] المفرد نستخدم [[dat]].","table":{"head":["نوع الاسم","الضمير الموصول","مثال"],"rows":[["de-woord (مفرد)","die","de man die..."],["het-woord (مفر
