 with the infinitive at the end of the sentence is often used for a polite request.","ex":["Would you wait here for a moment?","Could you close the door?"],"tip":"This form of request is much more polite and much more common in everyday speech than a direct imperative with [[u]]."},{"h":"Common imperative expressions","p":"There are a few fixed and very common imperative expressions that are often seen in daily life and on signs.","list":["[[Pas op!]] = Watch out!","[[Let op!]] = Pay attention!","[[Niet roken]] = No smoking (on a sign)","[[Wacht even.]] = Wait a moment."]}],"ex":[{"q":"What is the correct imperative form of [[komen]] for jij?","options":["Jij komt!","Kom!","Komen!"],"exp":"The simple imperative is formed from the verb stem (the same form as ik), and the subject is left out: [[Kom!]]"},{"q":"Which is the correct polite imperative?","options":["U komt binnen.","Komt u binnen.","Komen u binnen."],"exp":"In the polite imperative, the verb with [[-t]] comes before [[u]]: [[Komt u binnen]]."},{"q":"Which is the correct negative imperative?","options":["Niet loop zo snel!","Loop niet zo snel!","Loop zo snel niet!"],"exp":"In a negative imperative, [[niet]] comes after the verb and adverb: [[Loop niet zo snel!]]"},{"exp":"The simple imperative is formed from the verb stem: [[Kom]]."},{"exp":"The fixed expression [[Maak je geen zorgen]] means \"don't worry\"."},{"exp":"In a polite request with [[Wilt u...]], the infinitive of the main verb comes at the end of the sentence."},{"q":"Correct order: \"Get up!\" (to jij)","exp":"The separable verb [[opstaan]] also splits apart in the imperative: [[Sta op!]]"},{"q":"Correct order: \"Please sit down\" (polite)","exp":"The polite imperative: the verb with [[-t]] ([[Gaat]]), then [[u]], then the rest of the sentence."}]},"a2-aanwijzende-voornaamwoorden":{"title":"Demonstrative pronouns","sum":"For something nearby, [[deze]] (de-woord/plural) and [[dit]] (het-woord) are used, and for something farther away, [[die]] (de-woord/plural) and [[dat]] (het-woord) are used.","blocks":[{"h":"Overview table of demonstrative pronouns","p":"Demonstrative pronouns in Dutch depend on two things: **distance** (near or far) and the **gender of the noun** (de-woord or het-woord), as well as whether it's singular or plural.","table":{"head":["Distance","Singular de-woord","Singular het-woord","Plural (either gender)"],"rows":[["near","deze","dit","deze"],["far","die","dat","die"]]}},{"h":"deze and dit (near)","p":"[[deze]] is used to refer to a nearby singular **de-woord**, and [[dit]] for a nearby singular **het-woord**.","ex":["This car is new.","This house is very old."]},{"h":"die and dat (far)","p":"[[die]] is used to refer to a distant singular **de-woord** (or any plural noun), and [[dat]] for a distant singular **het-woord**.","ex":["That car over there belongs to my neighbor.","That house at the end of the street is for sale."]},{"h":"The plural case","p":"In the plural, it doesn't matter whether the original noun is a de-woord or a het-woord: [[deze]] is always used for near, and [[die]] for far.","ex":["These books are mine.","Those houses are very expensive."]},{"h":"Independent use as a pronoun","p":"Demonstrative pronouns can be used alone, without a noun, often together with the verb [[zijn]]; in this use, [[dit]] and [[dat]] are very common, and even when the following noun is plural, [[dat]] can still be used.","ex":["This is my brother.","That's beautiful!","Those are my parents."],"tip":"In the sentence [[Dat zijn mijn ouders]], even though [[ouders]] is plural, [[dat]] (not [[die]]) is used, because in this use it acts as a general introducer rather than a full demonstrative adjective agreeing with the noun."}],"ex":[{"q":"Which pronoun is correct to refer to a nearby de-woord?","options":["dit","deze","dat"],"exp":"For a nearby singular de-woord, the correct pronoun is [[deze]]."},{"q":"Which pronoun is correct to refer to a distant het-woord?","options":["die","dat","deze"],"exp":"For a distant singular het-woord, the correct pronoun is [[dat]]."},{"q":"Which sentence is correct? (het boek)","options":["Deze boek is interessant.","Dit boek is interessant.","Die boek is interessant."],"exp":"Since [[boek]] is a singular het-woord and we're referring to something nearby, the correct pronoun is [[dit]]."},{"exp":"For a nearby singular het-woord, the correct pronoun is [[dit]]."},{"exp":"In the plural for something distant, [[die]] is always used, regardless of whether it's a de-woord or a het-woord."},{"exp":"Both [[Dit]] (for something/someone nearby) and [[Dat]] (for something/someone slightly farther) are correct in an independent introduction."},{"q":"Correct order: \"This car is new\" (de auto, near)","exp":"Since [[auto]] is a de-woord and it's near, the correct pronoun is [[deze]]."},{"q":"Correct order: \"That house is for sale\" (het huis, far)","exp":"Since [[huis]] is a het-woord and it's far, the correct pronoun is [[dat]]."}]},"b1-voltooid-verleden-tijd":{"title":"The Pluperfect (Voltooid Verleden Tijd)","sum":"The [[Voltooid Verleden Tijd]] is formed with **had** or **was** + the past participle (deelwoord), and is used to show that something happened before another moment further in the past.","blocks":[{"h":"Verb structure","p":"The Dutch pluperfect is made of two parts: the auxiliary verb **had/hadden** or **was/waren** + the [[voltooid deelwoord]] (past participle). The choice between [[had]] and [[was]] works exactly like the choice between [[heb]] and [[ben]] in the present perfect (voltooid tegenwoordige tijd): verbs of motion and change of state are conjugated with [[zijn]], and the rest with [[hebben]].","table":{"head":["Subject","hebben-verbs","zijn-verbs"],"rows":[["ik","had gewerkt","was gegaan"],["jij/u","had gewerkt","was gegaan"],["hij/zij","had gewerkt","was gegaan"],["wij/jullie/zij","hadden gewerkt","waren gegaan"]]},"ex":["I had already done it.","They had already left."],"tip":"Verbs like [[blijven]], [[worden]], [[gebeuren]] are also conjugated with [[zijn]], not [[hebben]]."},{"h":"Usage: the past before the past","p":"We use the [[voltooid verleden tijd]] when we want to say that something happened before another moment in the past. This corresponds to the English pluperfect: we have one reference point in the past (expressed with the simple [[verleden tijd]]) and an event that occurred earlier still (expressed with the [[voltooid verleden tijd]]).","ex":["When I arrived at the station, the train had already left.","He said that he had never been to Paris before.","After we had eaten, we went for a walk."]},{"h":"Common signal words","p":"Words like [[al]] (already), [[nog niet]] (not yet), [[net]] (just), [[voordat]] (before) and [[nadat]] (after) often accompany the pluperfect and mark the time relationship between two past events.","list":["[[al]] = already, by then","[[nog niet]] = not yet","[[net]] = just, just now (in the past)","[[voordat]]/[[nadat]] = before / after"]},{"h":"Word order in subordinate clauses","p":"When the [[voltooid verleden tijd]] occurs in a subordinate clause (after [[toen]], [[nadat]], [[voordat]], [[omdat]]), the auxiliary verb ([[had]]/[[was]]) moves to the end of the subordinate clause and comes after the past participle: **...omdat hij het geld niet had meegenomen.**","ex":["I was happy because I had finally gotten my diploma.","Because it had rained hard, the road was wet."],"tip":"In a subordinate clause, the auxiliary verb always comes after the past participle, at the very end of the clause: [[...dat hij het niet gezien had]] (not had gezien)."}],"ex":[{"q":"Which sentence correctly expresses the pluperfect? (He had already gone)","options":["Hij was al gegaan.","Hij had al gegaan.","Hij is al gegaan.","Hij ging al."],"exp":"[[gaan]] is a verb of motion and is conjugated with [[zijn]], so the correct form is [[was gegaan]]."},{"exp":"The verb [[beginnen]] is conjugated with [[zijn]], and since the subject is singular (de film), the auxiliary is [[was]]."},{"q":"Fill in the blank with the correct option: Ik ___ het boek al gelezen voordat de film uitkwam.","options":["had","was","heb","ben"],"exp":"[[lezen]] is conjugated with [[hebben]], so its pluperfect is [[had gelezen]]."},{"exp":"[[worden]] is conjugated with [[zijn]]; the singular feminine subject (zij) → [[was]]."},{"q":"Find the correct word order to form the sentence \"He had already left by the time I arrived.\"","exp":"Structure: subject + was + al + past participle + toen + subordinate clause. The auxiliary is [[was]] because [[vertrekken]] is conjugated with zijn."},{"q":"Which sentence correctly expresses that someone \"had never been to Paris up to that point\"?","options":["Hij was nog nooit in Parijs geweest.","Hij is nog nooit in Parijs geweest.","Hij was nog nooit in Parijs.","Hij heeft nog nooit in Parijs geweest."],"exp":"For an event that holds true before another moment in the past, we use [[was ... geweest]] (the pluperfect of zijn)."},{"exp":"A plural subject (ze/zij) takes the auxiliary [[hadden]]; [[eten]] is conjugated with [[hebben]]."},{"q":"What is the difference between \"Ik had het gedaan\" and \"Ik heb het gedaan\"?","options":["The first shows that something happened before another moment in the past; the second simply states that something happened in the past (up to now).","There is no difference.","The first is for the future.","The second is the pluperfect."],"exp":"[[had gedaan]] is the pluperfect (the past before the past), while [[heb gedaan]] is the present perfect, which relates to the present moment."},{"exp":"[[geboren worden]] is conjugated with [[zijn]]; singular subject (ik) → [[was]]."}]},"b1-betrekkelijke-bijzinnen":{"title":"Relative clauses (die/dat/waar/wie)","sum":"Relative clauses with [[die]], [[dat]], [[waar + preposition]] and [[preposition + wie]] (for people) describe a preceding noun.","blocks":[{"h":"die or dat?","p":"To form a relative clause, we use [[die]] or [[dat]] depending on the gender of the noun being referred to: if the noun is a [[de-woord]] (or is plural), we use [[die]]; if the noun is a singular [[het-woord]], we use [[dat]].","table":{"head":["Noun type","Relative pronoun","Example"],"rows":[["de-woord (singular)","die","de man die..."],["het-woord (singular)","dat","het boek dat..."],["plural (de or het)","die","de boeken die..."]]},"ex":["The man standing there is my neighbor.","The house we bought is very old."],"tip":"The verb in a relative clause always moves to the end of it: [[het boek dat ik gisteren gekocht heb]]."},{"h":"waar + preposition for things","p":"When a relative clause refers to a thing or concept (not a person) that takes a preposition, we use [[waar + preposition]] instead of [[die/dat]], such as [[waarmee]] (with which), [[waarover]] (about which), [[waarin]] (in which).","ex":["This is the pen I write with.","The book we were talking about is very famous."],"list":["[[waarmee]] = with which","[[waarover]] = about which","[[waarin]] = in which","[[waarop]] = on which / that (one) is waiting for"]},{"h":"wie for people after a preposition","p":"For people, when there is a preposition, we use [[preposition + wie]] instead of [[waar]], and not [[die]]: **de vrouw met wie ik praatte** (the woman I was talking with). The preposition comes before [[wie]], not after it as with waar.","ex":["The colleague I work with is very kind.","The friend I told it to lives in Utrecht."],"tip":"In colloquial speech other constructions are sometimes heard, but in formal writing [[preposition + wie]] is the most correct form."},{"h":"Relative clauses with no specific antecedent (wat)","p":"When a relative clause refers to a whole clause or a general idea (not a specific noun), or follows indefinite pronouns like [[alles]], [[iets]], [[niets]], we use [[wat]] instead of [[dat]].","ex":["That's all I know.","He said nothing that I didn't already know."]}],"ex":[{"q":"Which relative pronoun is correct? \"De fiets ___ ik gekocht heb, is kapot.\"","options":["die","dat","wat","wie"],"exp":"[[fiets]] is a de-woord, so the relative pronoun is [[die]]."},{"q":"\"Het kind ___ daar speelt, is mijn zoon.\" Which option is correct?","options":["dat","die","wat","waar"],"exp":"[[kind]] is a het-woord, so by the grammatical rule the relative pronoun is [[dat]] (even though it refers to a person)."},{"exp":"The verb [[werken met]] takes the preposition [[met]], so the correct combination is [[waarmee]] (not just waar)."},{"q":"Which sentence is correct? (the friend I went to the cinema with)","options":["De vriend met wie ik naar de bioscoop ging.","De vriend waarmee ik naar de bioscoop ging.","De vriend die ik mee naar de bioscoop ging.","De vriend wie ik naar de bioscoop ging."],"exp":"For people after a preposition we use [[preposition + wie]], not [[waar]] (which is only for things/concepts)."},{"exp":"After indefinite pronouns like [[alles]] we use [[wat]], not [[dat]]."},{"q":"Find the correct word order for the sentence \"The book I am reading is very interesting.\"","exp":"The verb of the relative clause ([[lees]]) moves to the end of that part; since [[boek]] is a het-woord, the relative pronoun is [[dat]]."},{"q":"\"Dit is het probleem ___ ik over praat.\" Which option?","options":["waarover","waarin","die","wat"],"exp":"The verb [[praten over]] takes the preposition [[over]], so the combination [[waarover]] is correct."},{"exp":"[[mensen]] is plural, so the relative pronoun is always [[die]] (even if its singular form would be a het-woord)."},{"q":"Why is wie used instead of die in \"De vrouw aan wie ik het boek gaf\"?","options":["Because a preposition (aan) comes before the relative pronoun and it refers to a person.","Because vrouw is plural.","Because wie is always used instead of die.","There is no reason, both are equally correct."],"exp":"When a relative clause refers to a person and a preposition is needed before the relative pronoun, [[preposition + wie]] must be used, not die."}]},"b1-te-infinitief":{"title":"The te + infinitive construction (te + infinitief)","sum":"Some Dutch verbs and expressions require the second verb to take the form [[te + infinitief]], such as [[proberen te]], [[beginnen te]], and the [[om ... te]] construction.","blocks":[{"h":"The om...te form for expressing purpose","p":"The [[om ... te + infinitief]] construction is used to express the purpose or goal of an action, equivalent to \"in order to...\". [[om]] comes at the start of this part, and the infinitive with [[te]] comes at the end.","ex":["I'm learning Dutch so that I can work in the Netherlands.","He's saving money to buy a house."],"tip":"If there are two verbs in this construction (like kunnen werken), [[te]] only comes before the second verb/infinitive: om te kunnen werken."},{"h":"Verbs followed by te + infinitive","p":"Certain verbs are always followed by [[te]] before the second verb, including [[proberen te]] (to try to), [[beginnen te]] (to begin to), [[hoeven te]] (to not need to), [[vergeten te]] (to forget to) and [[besluiten te]] (to decide to).","list":["[[proberen te]] = to try to","[[beginnen te]] = to begin to","[[hoeven te]] = to not have to (in negative sentences)","[[vergeten te]] = to forget to","[[besluiten te]] = to decide to"],"ex":["I try to exercise every day.","He forgot to call his mother."]},{"h":"Difference with modal verbs (bare infinitive without te)","p":"After modal verbs ([[modale werkwoorden]]) such as [[kunnen]], [[mogen]], [[moeten]], [[willen]], [[zullen]], and also after [[gaan]], [[blijven]], [[komen]] and [[laten]], the second verb takes the bare infinitive, without [[te]].","table":{"head":["Category","Example"],"rows":[["with te","Hij probeert te slapen."],["without te (modal verb)","Hij kan slapen."],["without te (gaan/komen/blijven)","Hij gaat slapen."]]},"ex":["I want to go to bed early tonight.","We're staying here to wait."],"tip":"Common mistake: never say \"Hij kan te slapen\" — modal verbs never take te."},{"h":"hoeven te in negative sentences","p":"The verb [[hoeven te]] is almost always used in negative sentences or with [[niet]]/[[geen]], and means \"to not need to\", unlike [[moeten]], which is used for \"must/have to\".","ex":["You don't need to do that.","They don't need to work tomorrow."]}],"ex":[{"q":"Which option is correct? \"Hij leert elke dag Nederlands ___ beter te spreken.\"","options":["om","te","voor","dat"],"exp":"The [[om ... te]] construction is used to express purpose."},{"exp":"The verb [[proberen]] is used with [[te + infinitief]]."},{"q":"Which sentence is grammatically correct?","options":["Hij kan goed zwemmen.","Hij kan goed te zwemmen.","Hij kan te goed zwemmen.","Hij te kan goed zwemmen."],"exp":"After the modal verb [[kunnen]], the second verb takes the bare infinitive, without [[te]]."},{"exp":"[[hoeven te]] in a negative sentence means \"to not need to\"; singular subject je → hoeft."},{"q":"Find the correct word order for the sentence \"I got up early so as not to miss the train.\"","exp":"The [[om ... te]] construction expresses purpose: the infinitive [[missen]] with [[te]] comes at the end."},{"q":"Which verb does not need te after it?","options":["gaan","proberen","beginnen","vergeten"],"exp":"[[gaan]], like the modal verbs, is used without [[te]]: \"Hij gaat slapen.\""},{"exp":"[[vergeten te]] = to forget (to), used with te + infinitive."},{"q":"What is the difference between hoeven te and moeten?","options":["hoeven te expresses absence of necessity (usually in a negative sentence), moeten expresses necessity/obligation.","There is no difference.","hoeven te is only used in affirmative sentences.","moeten always comes with te."],"exp":"[[hoeven te]] is usually used with negation for \"not needing to\", and [[moeten]] for \"must\"."},{"exp":"[[besluiten te]] = to decide to, goes together with te + infinitive."}]},"b1-voorwaardelijke-wijs":{"title":"The conditional mood (zou/zouden + infinitive)","sum":"The Dutch conditional mood is formed with [[zou]]/[[zouden]] + the infinitive, and is used to express real and unreal conditions with [[als]]-clauses.","blocks":[{"h":"The structure zou/zouden","p":"[[zou]] (singular) and [[zouden]] (plural) are the auxiliary verbs of the conditional mood, and come together with the main verb in infinitive form at the end of the sentence: **Ik zou dat niet doen.**","table":{"head":["Subject","zou/zouden"],"rows":[["ik, jij/u, hij/zij","zou"],["wij, jullie, zij","zouden"]]},"ex":["I would love to travel to Paris.","We would solve that problem differently."]},{"h":"Real conditions (reële conditie)","p":"When a condition is realistic and achievable, the [[als]]-clause uses the present tense, and the main clause can also be in the present/future or imperative; there's no need for [[zou]].","ex":["If it rains, I'll take an umbrella.","If you have time, you can help me."],"tip":"In a real condition, the auxiliary [[zou]] is not needed; only the simple present tense is used."},{"h":"Unreal conditions (irreële conditie) and zou","p":"For unreal or hypothetical conditions (something that isn't true now or wasn't true in the past), the [[als]]-clause uses the [[verleden tijd]] (simple past), and the main clause is formed with [[zou/zouden]] + infinitive.","ex":["If I were rich, I would buy a house (but I'm not).","If they had more time, they would travel more often."],"tip":"For unreal conditions relating to the past, [[als]] + pluperfect and [[zou/zouden hebben/zijn]] + past participle are used: Als ik het geweten had, zou ik anders gehandeld hebben."},{"h":"Verb position: als at the start or middle of the sentence","p":"If the [[als]]-clause comes at the start of the sentence, the main clause after it begins with a verb (subject-verb inversion), because the [[als]]-clause itself occupies the first position.","ex":["If the weather was nice, we would go to the park.","We would go to the park if the weather was nice."],"tip":"Both orders (als first or second) are correct; it's just that when als comes first, the verb must come immediately after the comma."}],"ex":[{"q":"Which option is correct for the unreal condition? \"Als ik meer geld ___, zou ik een auto kopen.\"","options":["had","heb","had gehad","zou hebben"],"exp":"In an unreal condition, the als-clause uses the [[verleden tijd]] (had), and the main clause uses [[zou]] + infinitive."},{"exp":"This is a real condition (it might rain tomorrow), so the simple present tense is used, not zou."},{"q":"Which sentence correctly shows an unreal condition?","options":["Als ik jou was, zou ik dat niet zeggen.","Als ik jou ben, zal ik dat niet zeggen.","Als ik jou was, zeg ik dat niet.","Als ik jou zou zijn, zeg ik dat niet."],"exp":"The correct structure: als + verleden tijd (was) ... zou + infinitief (zou zeggen)."},{"exp":"A plural subject (wij) requires the plural auxiliary [[zouden]]."},{"q":"Find the correct word order for the sentence \"If I had time, I would help you.\"","exp":"Because the sentence starts with als, the main clause starts with the verb (zou): subject-verb inversion."},{"q":"\"Als ik het eerder geweten had, ___ ik anders gehandeld hebben.\" Which option?","options":["zou","had","ben","zal"],"exp":"For an unreal condition relating to the past, the main clause is formed with [[zou/zouden]] + hebben/zijn + past participle."},{"exp":"A real condition is expressed with the simple present tense (bent), because there's a genuine possibility."},{"q":"Why is zou used in the sentence \"Zou je me kunnen helpen?\"","options":["To make a polite, indirect request","To express the future tense","To state a general truth","Because the verb kunnen always comes with zou"],"exp":"[[zou]] + kunnen is often used to form polite requests, not only for conditions."},{"exp":"The fixed expression \"als ik jou was\" (if I were you) uses [[was]], even for the subject ik."}]},"b1-lijdende-vorm":{"title":"The passive voice (Lijdende Vorm)","sum":"The passive voice is formed with [[worden]] (for a process) or [[zijn]] (for a result/state) + the past participle; the agent performing the action is introduced with [[door]].","blocks":[{"h":"worden-passive: process and action","p":"To express that an action is happening or is being carried out (focus on the process), we use [[worden]] as the auxiliary + the past participle. This is the most common type of passive in Dutch.","table":{"head":["Tense","Structure","Example"],"rows":[["present","word(t)/worden + past participle","Het huis wordt gebouwd."],["past","werd(en) + past participle","Het huis werd gebouwd."]]},"ex":["This book is read by many people.","The letter was sent yesterday."],"tip":"The auxiliary [[worden]] must agree with the tense of the sentence: present = word/wordt/worden, past = werd/werden."},{"h":"zijn-passive: result and state","p":"When the focus is on the end result of an action (not the process itself), we use [[zijn]] + the past participle. This type of passive usually describes a state that has already been completed.","ex":["This house has already been built (it's now in that state).","The door is closed (current state)."],"tip":"Compare: [[De deur wordt gesloten]] (someone is closing the door right now; process) versus [[De deur is gesloten]] (the door is already closed; result)."},{"h":"Introducing the agent with door","p":"In a passive sentence, if we want to say who or what performed the action, we use [[door]] before the agent.","ex":["This painting was made by a famous artist.","The decision is made by the director."]},{"h":"Converting an active sentence into the passive","p":"To convert an active sentence into the passive, the object of the active sentence becomes the subject of the passive sentence, the verb changes to [[worden]] + past participle, and the original subject (if mentioned) follows [[door]].","ex":["The cook prepares the food. The food is prepared by the cook."],"tip":"Verbs that have no object, or are intransitive ([[onovergankelijk]]), like [[slapen]] or [[komen]], usually cannot be made passive."}],"ex":[{"q":"Which worden-passive sentence is correct? (This house is being built)","options":["Het huis wordt gebouwd.","Het huis is gebouwd.","Het huis bouwt.","Het huis heeft gebouwd."],"exp":"For a process happening in the present, [[wordt]] + past participle is used."},{"exp":"For the past tense in the worden-passive, the singular auxiliary [[werd]] is used."},{"q":"What is the difference between \"De deur wordt gesloten\" and \"De deur is gesloten\"?","options":["The first shows the ongoing process of closing; the second shows the resulting state of being closed.","There is no difference.","The first is past tense, the second is present.","The second is not passive."],"exp":"[[wordt]] = worden-passive for a process; [[is]] = zijn-passive for the final result/state."},{"exp":"Singular subject (dit gebouw) + present tense → [[wordt]]."},{"q":"Find the correct word order for the sentence \"This book is read by millions of people.\"","exp":"Passive structure: new subject + wordt + (door + original subject) + past participle."},{"q":"Convert the active sentence \"De regering neemt de beslissing.\" into the passive.","options":["De beslissing wordt door de regering genomen.","De regering wordt de beslissing genomen.","De beslissing is de regering genomen.","De beslissing neemt door de regering."],"exp":"The object of the active sentence (de beslissing) becomes the subject of the passive sentence, and the original subject follows [[door]]."},{"exp":"The past participle of [[oplossen]] is [[opgelost]]; the zijn-passive expresses the final result/state."},{"q":"Which verb usually cannot be made passive?","options":["slapen","bouwen","lezen","schrijven"],"exp":"An intransitive verb ([[onovergankelijk]]) like [[slapen]] has no object, so it cannot be turned into the passive."},{"exp":"A plural subject (veel huizen) takes the plural auxiliary [[worden]]."}]},"b1-vaste-voorzetsels":{"title":"Verbs with a fixed preposition","sum":"Many Dutch verbs come with a fixed preposition, such as [[wachten op]], [[houden van]], [[denken aan]]; to refer to or ask about this combination, [[er/waar + preposition]] is used.","blocks":[{"h":"Common verbs with a fixed preposition","p":"Many Dutch verbs are always paired with a specific preposition that completes the verb's meaning, and this combination must be kept together.","list":["[[wachten op]] = to wait for","[[houden van]] = to love/like","[[denken aan]] = to think of/about","[[zich ergeren aan]] = to be annoyed/irritated by","[[geloven in]] = to believe in","[[zorgen voor]] = to take care of"],"ex":["I'm waiting for the bus.","She loves chocolate."],"tip":"These combinations must be memorized together, because the corresponding preposition in English is often different or can be dropped, while in Dutch it is obligatory."},{"h":"er + preposition to refer to something already mentioned","p":"When we want to refer to a concept already mentioned, with its fixed preposition, without repeating the noun, we put [[er]] before the preposition, such as [[erop]] (to/for it), [[eraan]] (of/to it), [[ervan]] (of it).","ex":["Are you thinking about the appointment? Yes, I'm thinking about it.","Are you waiting for the answer? Yes, I'm waiting for it."],"tip":"If the referent is a person, instead of [[er + preposition]] we use [[preposition + personal pronoun]]: denk aan hem/haar, not eraan."},{"h":"Forming questions with waar + preposition","p":"To ask a question about something that takes a fixed preposition, we combine [[waar]] with that preposition, such as [[waarop]] (for what), [[waaraan]] (of/to what), [[waarvan]] (of what).","ex":["What are you waiting for?","What are you thinking about?"],"tip":"For people, instead of [[waar + preposition]] we use [[preposition + wie]]: Aan wie denk je? (not waaraan)."},{"h":"More common verbs","p":"There are more verbs with a fixed preposition that are common at B1 level, which you should learn together with their preposition, not in isolation.","list":["[[praten over]] = to talk about","[[dromen van]] = to dream about","[[genieten van]] = to enjoy","[[twijfelen aan]] = to doubt","[[rekenen op]] = to count on"],"ex":["We often talk about politics.","I doubt his plan."]}],"ex":[{"q":"Which preposition goes with the verb wachten?","options":["op","aan","van","in"],"exp":"[[wachten op]] = to wait for, is a fixed combination."},{"exp":"[[houden van]] = to love/like; the fixed preposition is [[van]]."},{"q":"\"Denk je aan je moeder? Ja, ik denk ___.\" Which option?","options":["eraan","erop","ervan","aan het"],"exp":"To refer to something already mentioned with [[aan]], [[eraan]] is used."},{"exp":"The verb [[wachten op]] becomes [[waarop]] in a question with waar."},{"q":"Find the correct word order for the sentence \"I often think about the holidays.\"","exp":"[[denken aan]] = to think about; the adverb [[vaak]] comes after the verb and before the preposition."},{"q":"Which sentence is correct for referring to a person (not a thing)?","options":["Ik denk vaak aan haar.","Ik denk er vaak aan haar.","Ik denk vaak eraan haar.","Ik denk haar vaak aan."],"exp":"For people, [[er + preposition]] is not used; instead [[preposition + personal pronoun]] is used: aan haar."},{"exp":"[[twijfelen aan]] = to doubt; conjugation for subject ik: twijfel."},{"q":"\"Waar praten jullie over?\" This question is about which fixed verb?","options":["praten over","praten aan","praten van","praten op"],"exp":"[[praten over]] = to talk about; its question form is [[waarover]]."},{"exp":"[[genieten van]] = to enjoy; the fixed preposition is [[van]]."}]},"b1-tmp-volgorde":{"title":"Time-Manner-Place (TMP) word order in a sentence","sum":"In a Dutch sentence, adverbs of time, manner, and place usually come in the order [[Tijd - Manier - Plaats]] (time - manner - place).","blocks":[{"h":"The basic TMP rule","p":"When a sentence contains several different adverbs, their natural order is usually **time (Tijd) → manner (Manier) → place (Plaats)**. This can be remembered with the abbreviation [[TMP]].","ex":["I'm going to Amsterdam by train tomorrow.","She works hard at the office every day."],"tip":"If one of these three elements is missing, the rest keep the same order; only the missing part is left out."},{"h":"More examples of TMP order","p":"In these examples, we can clearly see how each category of adverb (time, manner, place) takes its proper place.","table":{"head":["Time","Manner","Place"],"rows":[["morgen","met de trein","naar Amsterdam"],["elke dag","hard","op kantoor"],["vanavond","samen","in het restaurant"]]},"ex":["Tonight we're eating together at the restaurant."]},{"h":"Exceptions: emphasis and the first position of the sentence","p":"To put extra emphasis on the time or place, it can be moved to the first position of the sentence, before the verb. In this case the verb still keeps the second position (the V2 rule), but the rest of the adverbs stay in the same TMP order.","ex":["Tomorrow I'm going to Amsterdam by train.","To Amsterdam, I'm going tomorrow by train."],"tip":"When one of the adverbs is moved to the start of the sentence, the subject comes after the verb (inversion), because the verb must keep the second position of the sentence."},{"h":"Place relative to the direct object","p":"The place adverb usually comes after the direct object (if it's short and definite). At B1 level, it's best to follow the basic TMP rule and keep place adverbs near the end of the sentence.","ex":["He calmly puts the book on the table tomorrow."]}],"ex":[{"q":"Which word order follows the TMP rule correctly?","options":["Ik ga morgen met de bus naar school.","Ik ga met de bus morgen naar school.","Ik ga naar school morgen met de bus.","Ik ga met de bus naar school morgen."],"exp":"The correct order: time (morgen) → manner (met de bus) → place (naar school)."},{"exp":"The preposition of place for \"office\" in Dutch is [[op kantoor]]."},{"q":"Find the correct word order for the sentence \"Tonight we're going to the cinema together.\"","exp":"TMP order: time (vanavond) → manner (samen) → place (naar de bioscoop)."},{"q":"In the sentence \"Morgen ga ik naar het park.\", why does the subject (ik) come after the verb?","options":["Because the time adverb (morgen) has taken the first position of the sentence, and the verb must stay in second position.","Because the subject always comes after the verb.","Because morgen is a verb.","There is no particular reason."],"exp":"By the V2 rule in Dutch, the verb always holds the second position in the sentence; when an adverb moves to the first position, the subject moves to right after the verb."},{"exp":"The preposition of place [[door het park]] means \"through the park\" and belongs in the place part of the sentence."},{"q":"Which sentence does not have the correct order?","options":["Ik ga naar Amsterdam morgen met de trein.","Ik ga morgen met de trein naar Amsterdam.","Morgen ga ik met de trein naar Amsterdam.","Met de trein ga ik morgen naar Amsterdam."],"exp":"In the first option, the TMP order is not followed (place comes before time and manner)."},{"exp":"The time adverb [[vanavond]] must come before manner/place."},{"q":"Find the correct word order for the sentence \"He works hard at the factory every day.\"","exp":"TMP order: time (elke dag) → manner (hard) → place (in de fabriek)."},{"q":"What does the abbreviation TMP mean in Dutch grammar?","options":["Tijd, Manier, Plaats (time, manner, place)","Tijd, Modus, Persoon","Tekst, Manier, Positie","Tijd, Mening, Plaats"],"exp":"TMP stands for the usual order of adverbs in a Dutch sentence: time, manner, place."}]},"b1-indirecte-rede":{"title":"Reported speech (Indirecte Rede)","sum":"In Dutch reported speech, the clause is introduced with [[dat]] or a question word, and the verb tense is often shifted back one step (tense shift).","blocks":[{"h":"Reporting statements with dat","p":"To report statements (non-questions) indirectly, we use [[dat]], and the verb moves to the end of the subordinate clause.","ex":["He says: 'I am tired.' He says that he is tired.","She said that she would come tomorrow."],"tip":"The tense of the main verb ([[zegt/zei]]) does not change; only the verb inside the [[dat]]-clause may change depending on the tense of the main verb."},{"h":"Tense shift","p":"When the main reporting verb is in the past tense ([[zei]], [[vertelde]]), the verb inside the [[dat]]-clause usually also shifts back one step: the present tense becomes the simple past, and the simple past becomes the pluperfect.","table":{"head":["Direct speech","Indirect speech (after a past-tense verb)"],"rows":[["'Ik werk hard.'","dat hij hard werkte."],["'Ik heb het gedaan.'","dat hij het gedaan had."],["'Ik zal komen.'","dat hij zou komen."]]},"ex":["He said: 'I work hard.' He said that he worked hard."],"tip":"If the main verb is in the present tense ([[zegt]]), usually no tense shift is needed."},{"h":"Reporting questions with a question word or of","p":"To report questions that start with a question word (wie, wat, waar, wanneer, hoe, waarom), the same word is kept. For yes/no questions (without a question word), we use [[of]] (whether).","ex":["He asked: 'Where do you live?' He asked where I lived.","She asked: 'Are you coming tomorrow?' She asked whether I was coming tomorrow."],"tip":"In both cases, the verb moves to the end of the subordinate clause, just as with [[dat]]-clauses."},{"h":"Reporting commands and requests with om...te","p":"To report a command or request (imperative) indirectly, the [[om ... te + infinitief]] construction is usually used, instead of [[dat]].","ex":["He said: 'Close the door.' He asked me to close the door.","The teacher told us to be quiet."]}],"ex":[{"q":"What is the indirect speech form of \"Ik ben ziek.\" after \"Hij zei dat...\"?","options":["hij ziek was.","hij ziek is.","hij ziek was geweest.","hij was ziek."],"exp":"Because the main verb ([[zei]]) is past tense, the present tense inside the quote ([[ben]]) shifts to the simple past ([[was]]); the verb comes at the end of the dat-clause."},{"exp":"To report statements, the conjunction [[dat]] is used."},{"q":"What is the indirect form of the question \"Waar woon je?\"","options":["Hij vroeg waar ik woonde.","Hij vroeg dat waar ik woonde.","Hij vroeg of waar ik woonde.","Hij vroeg waar woon ik."],"exp":"For questions with a question word, the same word (waar) is kept and the verb moves to the end of the clause; dat or of is not used."},{"exp":"For yes/no questions (without a question word), [[of]] is used."},{"q":"Find the correct word order for the sentence \"He said that he would come tomorrow\" (indirect speech).","exp":"Structure: subject + zei + dat + subject of the subordinate clause + ... + auxiliary (zou) + main verb (komen) at the end."},{"q":"Which is the correct indirect form of the command \"Doe de deur dicht.\"?","options":["Hij vroeg mij om de deur dicht te doen.","Hij vroeg mij dat de deur dicht doen.","Hij zei dat doe de deur dicht.","Hij vroeg of ik de deur dichtdoe."],"exp":"To report a command/request, the [[om ... te + infinitief]] construction is used."},{"exp":"Because the original quote was in the present perfect (heb gelezen) and the reporting verb is in the past, it shifts back one step to the pluperfect (had gelezen)."},{"q":"Which statement about tense shift is correct?","options":["When the main reporting verb is in the past, the verb inside the reported clause usually also shifts back one step.","The verb tense never changes in reported speech.","Only modal verbs undergo tense shift.","Tense shift only happens in written language."],"exp":"General rule: main verb in the past → the verb inside the quote also shifts back one step (present→past, past→pluperfect)."},{"exp":"The structure for reporting a request: [[om ... te + infinitief]]; te comes before the infinitive zijn."}]},"b1-toen-als-wanneer":{"title":"The difference between toen, als and wanneer","sum":"[[toen]] is used for one specific event in the past, [[als]] for repeated events and conditions, and [[wanneer]] for questions or repeated events in the present/future.","blocks":[{"h":"toen: a specific moment in the past","p":"[[toen]] is used only for a **single, specific** event in the past; it is never used for the present or future, or for repeated events.","ex":["When I was ten, we moved to Rotterdam.","When the phone rang, I had just gotten in the shower."],"tip":"If the sentence is in the past tense and talks about a specific (not repeated) event, [[toen]] is always correct, not [[als]]."},{"h":"als: repetition in the past and conditions","p":"[[als]] in the past tense is used for **repeated or habitual** events (equivalent to \"whenever\"), and is also used to express conditions in any tense (present, future, or even repeated past).","ex":["When(ever) I was little, I often played outside.","If it rains, I'll stay inside."],"tip":"Signs of repetition in the past are usually words like [[vaak]], [[altijd]], [[elke keer]], which often accompany [[als]]."},{"h":"wanneer: questions and repetition in the present/future","p":"[[wanneer]] is usually used to **ask a question** about time (when?), and can also be used like [[als]] for repeated events in the present or future (in more formal writing).","ex":["When are you coming home?","Whenever it rains, I grab an umbrella."],"tip":"In everyday speech, [[als]] is often preferred over [[wanneer]] for repetition in the present/future; [[wanneer]] sounds more formal."},{"h":"Quick comparison table","p":"To help remember this better, this table summarizes the use of each of the three words.","table":{"head":["Word","Usage","Example"],"rows":[["toen","once, past","Toen ik aankwam, regende het."],["als","repetition (past/present/future) or condition","Als ik moe ben, ga ik slapen."],["wanneer","question; or repetition (formal)","Wanneer ga je op vakantie?"]]}}],"ex":[{"q":"Which option is correct? \"___ ik klein was, woonden we in Utrecht.\"","options":["Toen","Als","Wanneer","Of"],"exp":"Because this is a specific, one-time period in the past (not repeated), [[toen]] must be used."},{"exp":"For a repeated event in the past (indicated by the word altijd), [[als]] is used, not toen."},{"q":"Which sentence is correct for asking \"When are you going to the cinema?\"","options":["Wanneer ga je naar de bioscoop?","Toen ga je naar de bioscoop?","Als ga je naar de bioscoop?","Of ga je naar de bioscoop?"],"exp":"[[wanneer]] is used to form a question about time."},{"exp":"This is a specific, one-time event, so [[toen]] is correct."},{"q":"Why is the sentence \"Als ik klein was, ging ik altijd met mijn opa wandelen.\" correct with als, not toen?","options":["Because this is a repeated/habitual action in the past (indicated by altijd).","Because als is always more correct than toen.","Because the sentence is about the future.","There is no reason; both are exactly the same."],"exp":"[[als]] is used in the past for repetition/habit; [[toen]] is only for a specific, one-time event."},{"exp":"In an indirect question about time, [[wanneer]] is used."},{"q":"Find the correct word order for the sentence \"When I arrived at the station, the train had left.\"","exp":"Because this is a specific moment in the past, [[toen]] is used; the verb of the subordinate clause (aankwam) comes at the end of that part."},{"q":"Which sentence is incorrect?","options":["Toen het regent, blijf ik binnen.","Als het regent, blijf ik binnen.","Toen het regende, bleef ik binnen.","Als het regende, bleef ik altijd binnen."],"exp":"[[toen]] is never used for the present tense; the first sentence should use [[als]]."},{"q":"When can wanneer be used instead of als in the past?","options":["Never; for a repeated event in the past, als must be used, not wanneer.","wanneer can always replace als.","wanneer is only used in the past.","toen and wanneer are always interchangeable."],"exp":"[[wanneer]] is for questions or repetition in the present/future; for repetition in the past, [[als]] must be used, not wanneer."}]},"b2-lijdende-vorm-varianten":{"title":"The Passive Voice: Advanced Forms","sum":"In addition to the [[worden]]-passive and the [[zijn]]-passive, the passive voice can also be formed with modal verbs ([[moeten worden gedaan]]), with [[te + infinitief]] ([[te lezen zijn]]), and impersonally ([[er wordt gedanst]]).","blocks":[{"h":"Review: the [[worden]]-passief versus the [[zijn]]-passief","p":"Dutch has two types of passive. The **[[worden]]-passief** expresses an **action in progress** (the dynamic passive), as in [[De deur wordt geopend]] (someone is opening the door right now). The **[[zijn]]-passief** expresses a **completed result/state** (the stative passive), as in [[De deur is geopend]] (the door is open now, the result of the action).","table":{"head":["Passive type","Structure","Use"],"rows":[["worden-passief","[[worden/werd + voltooid deelwoord]]","An action in progress or an event"],["zijn-passief","[[zijn/was + voltooid deelwoord]]","A result or state following the action"]]},"ex":["The car is washed every week (a recurring action).","The car has been washed (it's clean now; the result).","The report was written yesterday (an action in the past).","The report had already been written before I arrived (a state/result in the past)."]},{"h":"Modal passive: [[moeten/kunnen/mogen + worden + voltooid deelwoord]]","p":"When a modal verb (such as [[moeten]], [[kunnen]], [[mogen]]) is combined with a passive sentence, the structure is as follows: the conjugated modal verb in second position in the sentence, plus a verb cluster at the end consisting of the past participle and [[worden]]. For example [[Het werk moet gedaan worden]] (this work must be done). Both orders, [[gedaan worden]] and [[worden gedaan]], are common in the verb cluster.","ex":["This work must be completed tomorrow.","That mistake could easily have been prevented.","Decisions like this should not be made without reason."]},{"h":"Passive with [[zijn + te + infinitief]]","p":"The construction [[zijn + te + infinitief]] expresses the **possibility or ease** of doing something, similar to '-able' in English. For example, [[Dit boek is goed te lezen]] means 'this book reads well / is easy to read.' With separable verbs, [[te]] goes between the prefix and the verb, as in [[op te lossen]].","ex":["This book is easy to read.","The text was not understandable.","This problem is not easily solvable."],"tip":"In separable verbs like [[oplossen]], [[te]] always goes between the prefix and the main part of the verb: [[op-te-lossen]], not [[te oplossen]]."},{"h":"Impersonal passive: [[er wordt gedanst]]","p":"When a verb is **intransitive** (it has no direct object) and we want to emphasize the action itself without mentioning a subject, the impersonal passive is used: [[er]] + [[worden]] + past participle. For example, [[Er wordt hier niet gerookt]] (no smoking here). If another element starts the sentence, [[er]] moves to after the verb: [[Hier wordt niet gerookt]] or [[Gisteravond werd er laat gewerkt]].","ex":["No smoking here.","There was dancing and singing all evening.","There was work done late into the night yesterday evening."],"tip":"Because the impersonal passive has no logical subject (the verb is intransitive), this type of sentence cannot be converted into a personal passive."}],"ex":[{"q":"Het boek ___ op dit moment vertaald (de vertaler is er nu mee bezig).","options":["is","wordt","werd","zijn"],"exp":"Since the action is in progress (not a result), the [[worden]]-passief must be used: [[wordt vertaald]]."},{"q":"Nadat het werk af was, ___ het al ingeleverd (a completed result in the past).","options":["werd","wordt","was","zijn"],"exp":"Here a completed result in the past is being referred to (a state), so the past-tense form of the [[zijn]]-passief, namely [[was]], is used."},{"exp":"In the modal passive, the modal verb (moet) is followed by the cluster [[afgemaakt worden]] or [[worden afgemaakt]]; both orders are acceptable."},{"q":"Which sentence is the correct equivalent of 'The rules must be followed.'?","options":["De regels moeten gevolgd worden.","De regels moeten volgen worden.","De regels moeten worden gevolgen.","De regels zijn gevolgd moeten worden."],"exp":"Correct structure: modal verb ([[moeten]]) + past participle ([[gevolgd]]) + [[worden]]."},{"exp":"The construction [[zijn + te + infinitief]] expresses the possibility or ease of doing something: [[te begrijpen]] means 'understandable'."},{"q":"Which sentence is an example of the impersonal passive?","options":["Er wordt hard gewerkt.","Het werk wordt gedaan.","Hij wordt geholpen.","De brief werd gestuurd."],"exp":"In the impersonal passive there is no logical subject and the verb is intransitive ([[werken]]); the sentence begins with [[er]]."},{"q":"Put the sentence in the correct order: 'There was work done late into the night yesterday evening.' (impersonal passive)","exp":"When another element such as [[Gisteravond]] occupies the first position in the sentence, the dummy subject [[er]] comes after the verb, not at the start of the sentence."},{"q":"Put the words in the correct order: 'This problem can easily be solved.'","exp":"In the modal passive, the verb cluster can appear in two orders: [[opgelost worden]] or [[worden opgelost]]."},{"exp":"When a sentence begins with the impersonal passive construction, it starts with the dummy subject [[er]] and the verb [[worden]]."}]},"b2-deelwoorden":{"title":"Participles (Deelwoorden)","sum":"Present participles ([[-end]]) and past participles can be used like an **adjective**, an **adverb**, or as part of a **reduced participial clause**, as in [[een lachend kind]] and [[de gesloten deur]].","blocks":[{"h":"The present participle as an adjective ([[-end]])","p":"The present participle is formed by adding [[-end]] to the infinitive ([[lachen]] → [[lachend]]) and is placed before a noun like an adjective. The usual adjective rule about the ending -e also applies to it: before a plural noun or with a definite article, [[-e]] is always added; before an indefinite singular het-word, it appears without [[-e]].","ex":["A laughing child was playing in the garden.","The declining figures worried the analysts.","The scorching sun had made it very hot."]},{"h":"The present participle as an adverb","p":"The present participle, unchanged (with no [[-e]] added), can describe, like an adverb, **the manner in which the main verb's action is performed** or a simultaneous action. For example, [[Lopend naar huis dacht hij aan het gesprek]] (walking home, he thought about the conversation).","ex":["Singing, she went up the stairs.","He left the stadium, waving."]},{"h":"The past participle as an adjective","p":"The past participle (such as [[gesloten]], [[gebroken]], [[gemaakt]]) can also be placed before a noun like an adjective, to show a **resulting/passive** state. Important note: participles ending in [[-en]] (such as [[gesloten]], [[gebroken]], [[geschreven]]) **never** take an extra [[-e]]; but those ending in [[-d]] or [[-t]] (such as [[gemaakt]]) follow the regular adjective rule.","table":{"head":["Participle type","Example","Can take -e?"],"rows":[["Ends in -en (like gesloten)","de gesloten deur / een gesloten doos","No, always unchanged"],["Ends in -d/-t (like gemaakt)","een gemaakt plan / het gemaakte plan","Yes, following the regular adjective rule"]]},"ex":["The closed door surprised everyone.","The drawn-up plan was approved."]},{"h":"The reduced participial clause (participiale bijzin)","p":"A past participle at the start of a sentence can replace a full causal or temporal subordinate clause, especially in formal and literary style. For example, [[Vermoeid door de lange reis, viel hij meteen in slaap]] instead of [[Omdat hij vermoeid was door de lange reis, viel hij meteen in slaap]].","ex":["Startled by the loud noise, the cat ran away.","Seated by the window, she watched the rain."],"tip":"This construction is seen mainly in formal and literary writing, and is equivalent to a full adverbial clause with [[omdat]] or [[terwijl]]."}],"ex":[{"q":"Een ___ kind speelde in de tuin. (lachen, present participle)","options":["lachend","lachende","lacht","gelachen"],"exp":"Since [[kind]] is a het-word and appears with the indefinite article [[een]], the present participle appears without an extra [[-e]]: [[lachend]]."},{"q":"De ___ cijfers verontrustten de analisten. (dalen, plural)","options":["dalend","dalende","daalt","gedaald"],"exp":"Before a plural noun, [[-e]] is always added: [[dalende]] cijfers."},{"exp":"The present participle without an extra [[-e]], used adverbially, expresses a state simultaneous with the main verb."},{"q":"Which option is correct: 'de ___ deur' (sluiten, past participle, adjective)","options":["gesloten","geslotene","sluitend","gesloten e"],"exp":"A past participle ending in [[-en]] (such as [[gesloten]]) never takes [[-e]], whether with a de-word or a het-word."},{"q":"Which option is correct: 'een ___ plan' (maken, past participle, het-word, indefinite)","options":["gemaakt","gemaakte","makend","gemaken"],"exp":"Since [[plan]] is a het-word and appears with the indefinite [[een]], the past participle (which ends in -t) appears without [[-e]]: [[gemaakt]]."},{"exp":"With the definite article [[het]], [[-e]] is always added, even for a het-word: [[het gemaakte plan]]."},{"q":"Put the sentence in the correct order: 'Startled by the loud noise, the cat ran away.'","exp":"The participial clause with the past participle comes at the start of the sentence and is separated from the main clause by a comma; it is equivalent to 'because it was startled'."},{"q":"Which sentence is an example of the present participle used as an adverb?","options":["Zingend liep ze de trap op.","De zingende vogels waren mooi.","Zij heeft gezongen.","Het gezang was prachtig."],"exp":"In the first option, [[Zingend]], without agreeing with any noun, describes adverbially the manner in which the main verb ([[liep]]) is performed."}]},"b2-nominalisatie":{"title":"Nominalization of Verbs (Nominalisatie)","sum":"In **formal written** Dutch style, nominalization ([[nominalisatie]]) is often used instead of a verb, as in [[het onderzoeken]] or [[het onderzoek]] in place of a full verbal clause.","blocks":[{"h":"Nominalization with [[het + infinitief]]","p":"The infinitive of a verb is turned into a neuter (abstract) noun with the article [[het]]. This construction is used when there is no common derived noun for that verb, or when we want to name the action itself in general terms. For example, [[het roken]] (smoking) or [[het ontbreken]] (the absence/lack).","ex":["Smoking is forbidden here.","Due to the absence of evidence, the case was closed."]},{"h":"Nominalization with nominal suffixes ([[-ing]], [[-tie]], etc.)","p":"Many verbs have their own derived noun, which in formal style is used instead of a verbal clause: [[ontwikkelen]] → [[ontwikkeling]], [[informeren]] → [[informatie]], [[vergaderen]] → [[vergadering]], [[afronden]] → [[afronding]]. These nouns are usually connected to the rest of the sentence with [[van]].","ex":["The development of the city proceeded quickly.","After the completion of the research, the report was published."]},{"h":"Rewriting a sentence from verbal style to nominal style","p":"When rewriting, the subject of the subordinate clause is usually turned into a [[door + noun]] phrase, and the main verb becomes a derived noun. For example: [[Nadat de minister het voorstel had goedgekeurd, ging de wet in]] → [[Na de goedkeuring van het voorstel door de minister ging de wet in]].","ex":["After the proposal was approved by the minister, the law took effect.","Due to the rise in prices, inflation increased."]},{"h":"Notes and limitations","p":"Excessive nominalization can make a text heavy, abstract, and difficult to read (known as 'bureaucratic Dutch'). In everyday speech, verbal style is usually more natural, and nominalization is mostly reserved for formal reports, academic papers, and legal texts.","list":["Administrative and formal reports","Scientific and academic papers","Legal texts","News headlines"],"tip":"In formal written Dutch, excessive nominalization can make a text heavy and unnatural; in speech, the verb is usually used instead."}],"ex":[{"q":"Which option is the nominal (formal) equivalent of 'Doordat de prijzen stijgen, ...'?","options":["Door de stijging van de prijzen, ...","Door het stijgen prijzen, ...","Door prijzen stijgend, ...","Door de prijzen te stijgen, ..."],"exp":"The formal nominalized form of the verb [[stijgen]] is the noun [[de stijging]], which connects to the rest of the sentence with [[van]]."},{"exp":"In formal style, the verb [[afronden]] is often replaced by the derived noun [[afronding]], rather than [[het + infinitive]]."},{"q":"Which sentence is an example of [[het + infinitive]] used as a noun?","options":["Het roken is hier verboden.","Het rook is hier verboden.","Roken verboden hier is.","Hij rookt hier niet."],"exp":"In [[het roken]], the infinitive [[roken]] has been turned into a neuter noun with the article [[het]]."},{"exp":"When there is no common derived noun, the construction [[het + infinitive]] is used to nominalize the verb: [[het ontbreken]]."},{"q":"Put the sentence in the correct order: 'After the proposal was approved by the minister, the law took effect.'","exp":"The subject of the original verbal clause ([[minister]]) becomes a [[door + noun]] phrase in the nominal construction, and the main verb becomes the noun [[goedkeuring]]."},{"q":"What is the formal derived noun of the verb 'ontwikkelen'?","options":["ontwikkeling","ontwikkelen","ontwikkelaar","ontwikkelend"],"exp":"The suffix [[-ing]] turns the verb [[ontwikkelen]] into the formal noun [[ontwikkeling]]."},{"q":"Which option is excessively and unnaturally nominal in style?","options":["Door de uitvoering van de betaling door de klant werd de levering van het product door het bedrijf gestart.","Toen de klant betaalde, stuurde het bedrijf het product.","De klant betaalde en het bedrijf leverde.","Zodra de klant betaald had, leverde het bedrijf."],"exp":"A chain of successive nominal phrases with [[van]]/[[door]] makes a text heavy and unnatural; good writing should maintain a balance."},{"exp":"The formal noun derived from [[ontwikkelen]] is [[ontwikkeling]]."}]},"b2-formeel-register":{"title":"Formal and Informal Register","sum":"Dutch **formal** and **informal** register differ in pronoun use ([[u]] versus [[je/jij]]), vocabulary ([[derhalve]] versus [[daarom]]), and letter-writing conventions.","blocks":[{"h":"The pronoun [[u]] versus [[je/jij]]","p":"[[u]] is the formal, polite second-person pronoun, used for strangers, older people, formal situations, and customer service. [[je/jij]] is the informal pronoun for friends, family, peers, and children. The verb used with [[u]] is conjugated like [[hij/zij]]: [[u heeft/hebt]], [[u bent]], [[u kunt/kan]].","ex":["Could you help me? (formal)","Can you help me? (informal)"]},{"h":"Formal vocabulary and connectives","p":"In formal writing, certain words and connectives replace their everyday equivalents.","table":{"head":["Formal","Informal","Meaning"],"rows":[["derhalve","daarom","therefore"],["teneinde","om... te","in order to"],["hetgeen","wat","which (referring to the whole preceding clause)"],["desondanks","toch","nevertheless"],["dientengevolge","daardoor","as a result of that"]]},"ex":["He was ill, therefore he could not come. (formal)","He was ill, so he couldn't come. (informal)"]},{"h":"Conventions of formal letters and emails","p":"A formal Dutch letter usually begins with [[Geachte heer/mevrouw,]] and ends with [[Met vriendelijke groet,]]. Formal requests are often phrased with the polite conditional construction [[zou u... kunnen]], rather than the simpler [[kun je]].","ex":["Dear Mr. Janssen, following your letter of May 3rd...","Could you reply by tomorrow?"],"tip":"The fixed phrase [[naar aanleiding van]] (following/with regard to) and closing a letter with [[Met vriendelijke groet]] are among the most common conventions of formal Dutch letters."},{"h":"Other markers of formal style","p":"Formal style avoids contractions ([['t]], [['n]], [[ie]]) and uses the full form of words ([[het]], [[een]], [[hij]]). It also tends to prefer the passive voice and nominal style (nominalisatie), and uses colloquial modal particles like [[toch]] and [[gewoon]] less often.","ex":["This cannot be done. (formal)","It just can't be done. (informal)"]}],"ex":[{"q":"Which sentence is appropriate in a formal letter to an unfamiliar person?","options":["Kunt u mij hierover informeren?","Kun je me hierover vertellen?","Vertel me er even over.","Weet jij hier iets van?"],"exp":"In a formal letter to an unfamiliar person, the pronoun [[u]] and a formal tone must be used."},{"q":"What is the formal equivalent of 'daarom'?","options":["derhalve","toch","gewoon","maar"],"exp":"[[derhalve]] is the formal equivalent of 'daarom/therefore' and is used in formal writing."},{"exp":"The formal fixed phrase [[naar aanleiding van]], meaning 'following/with regard to', always takes the preposition [[van]]."},{"q":"Which sentence is informal?","options":["'t Kan gewoon niet, joh.","Dit is helaas niet mogelijk.","Wij kunnen hieraan niet voldoen.","Dit verzoek kan niet worden ingewilligd."],"exp":"The use of the contraction [['t]] instead of [[het]] and the colloquial word [[joh]] are signs of a fully informal style."},{"q":"Put together the formal sentence: 'Could you reply by tomorrow?'","exp":"Using the conditional [[zou... kunnen]] together with [[u]] gives the request a more polite and formal tone than the simpler [[kun je]]."},{"exp":"The fixed closing phrase of a formal Dutch letter is [[Met vriendelijke groet]] (or groeten)."},{"q":"Which description of 'hetgeen' is incorrect?","options":["[[hetgeen]] is only used to refer to people","[[hetgeen]] is the formal equivalent of 'wat' and refers to the whole preceding clause","[[hetgeen]] is common in formal and legal writing","[[hetgeen]] can be replaced with 'wat' in informal style"],"exp":"[[hetgeen]] is used to refer to things, concepts, or the entire preceding clause, not to people; so the first option is incorrect."},{"q":"In an informal conversation with a friend, which pronoun is more natural?","options":["je/jij","u","Uw","U"],"exp":"In friendly, informal speech, [[je/jij]] is always used, not [[u]], which is for formal situations and unfamiliar or older people."}]},"b2-modale-partikels":{"title":"Modal Particles","sum":"Modal particles such as [[toch]], [[wel]], [[maar]], [[eens]], [[even]], and [[gewoon]] have no independent lexical meaning of their own, but subtly change the speaker's tone and attitude.","blocks":[{"h":"[[toch]]: seeking confirmation or a mild contrast with expectation","p":"[[toch]] is often used to seek confirmation or reassurance about something we expect, or to express a mild contrast with a prior assumption. For example, [[Je komt toch?]] (you're coming, right?) or [[Het is toch niet zo moeilijk]] (it's really not that hard, after all).","ex":["You still remember, right?","Oh just go ahead and do it already."]},{"h":"[[wel]]: mild reassurance against doubt","p":"[[wel]] confirms something in the face of doubt, worry, or a negative expectation. For example, [[Het zal wel lukken]] (it'll work out, don't worry).","ex":["He'll come late, but he will come.","Yes, that's true (despite earlier doubt)."]},{"h":"[[maar]] and [[eens]]: softening commands and requests","p":"[[maar]] in imperative sentences softens the tone and makes it friendlier, as though the task were trivial and easy: [[Kom maar binnen]] (come on in, it's fine). [[eens]] softens a request into 'just try it once/for a moment': [[Kijk eens hier]]. The combination [[maar eens]] is also common: [[Probeer het maar eens]].","ex":["Go ahead and sit down, it's fine.","Just listen carefully for a moment."]},{"h":"[[even]] and [[gewoon]]: minimizing a request and simplifying reality","p":"[[even]] indicates that the requested task is short and requires little effort, as in [[Kun je dat even checken?]]. [[gewoon]], meaning 'just/simply,' describes a fact plainly and without embellishment, or makes a command sound ordinary: [[Doe het gewoon]] (just do it).","ex":["Wait a moment.","He's just tired, not angry."],"tip":"Several modal particles can be combined (such as [[toch wel]], [[maar eens]]), which makes the tone softer or more natural; the order of these particles is generally fairly fixed."}],"ex":[{"q":"Je komt ___ naar het feest? (seeking mild confirmation)","options":["toch","eens","even","gewoon"],"exp":"[[toch]], at the end or in the middle of a sentence, is used to seek confirmation or reassurance about something we expect."},{"q":"Het zal ___ wel goed komen. (reassurance/mild confidence against doubt)","options":["toch","wel","maar","eens"],"exp":"[[wel]] expresses mild reassurance against doubt or worry: 'it'll be fine in the end'."},{"exp":"[[maar]] in imperative sentences softens the tone and makes it friendlier, as though the task were trivial and easy."},{"q":"Kun je dat ___ checken voor me? (a small, quick request)","options":["eens","even","gewoon","toch"],"exp":"[[even]] shows that the requested task is short and simple, making the request sound more polite and low-effort."},{"exp":"[[gewoon]] here, meaning 'just/simply,' describes the fact plainly and without embellishment."},{"q":"Probeer het ___ eens. (combining encouragement with a request to try)","options":["maar","toch","wel","even"],"exp":"The combination [[maar eens]] is common: [[maar]] softens the tone and [[eens]] means 'try it once'."},{"q":"Which sentence is the most natural equivalent of 'You're coming after all, right?'","options":["Je komt toch?","Je komt even?","Je komt gewoon?","Je komt maar?"],"exp":"[[toch]] conveys exactly this kind of seeking confirmation of an expectation."},{"exp":"[[eens]] in imperative sentences, meaning 'for a moment/once,' makes a request feel more concrete and slightly softer."}]},"b2-samengestelde-voegwoorden":{"title":"Advanced Conjunctions","sum":"Advanced conjunctions such as [[ondanks dat]], [[ook al]], [[zodat]], [[zodra]], [[terwijl]], [[mits]], and [[tenzij]] express concessive, result, time, and conditional relationships, each with its own grammatical nuances.","blocks":[{"h":"[[ondanks dat]] and [[ook al]]: although/even though","p":"Both express a concessive relationship, meaning 'although/even if', and form a subordinate clause with verb-final order. [[ondanks dat]] is considered somewhat more informal by some linguists (the more formal equivalent being [[ondanks het feit dat]]), whereas [[ook al]] is entirely natural and common, and is often accompanied by [[toch]] in the main clause.","ex":["Although it was raining, we went for a walk.","Even if it's late, we'll still go."]},{"h":"[[zodat]] versus [[zodra]]","p":"These two conjunctions are often confused for each other because of their similar appearance, but they have entirely different meanings. [[zodat]] expresses a relationship of **result or purpose** (so that). [[zodra]] expresses a **temporal** relationship (as soon as).","ex":["He whispered, so that no one heard.","As soon as I get home, I'll call you."]},{"h":"[[terwijl]]: simultaneity or contrast","p":"[[terwijl]] is used both to express the **simultaneity** of two actions and to express **contrast**, depending on context.","ex":["She was reading a book, while he was cooking. (simultaneity)","He was complaining, even though he himself had made the mistake. (contrast)"]},{"h":"[[mits]] and [[tenzij]]: positive and negative conditions","p":"[[mits]] is a relatively formal positive condition meaning 'provided that'. [[tenzij]] is a negative condition meaning 'unless'.","ex":["You may go, provided that you come back on time.","We'll continue, unless it starts raining heavily."],"tip":"In a subordinate clause that begins with these conjunctions, the verb moves to the end of the clause; if this clause comes at the start of the sentence, the verb of the main clause comes immediately after it (inversion)."}],"ex":[{"q":"___ ik moe was, ging ik toch naar de training. (although)","options":["Ook al","Zodat","Mits","Tenzij"],"exp":"[[ook al]], meaning 'although/even if,' expresses a concessive relationship."},{"q":"Hij fluisterde, ___ niemand het zou horen. (result/purpose)","options":["zodra","zodat","terwijl","mits"],"exp":"[[zodat]] expresses the result or purpose of an action; it should not be confused with [[zodra]] (as soon as)."},{"exp":"[[zodra]], meaning 'as soon as,' expresses a temporal relationship, not a result."},{"q":"Je mag gaan, ___ je op tijd terug bent. (a formal positive condition)","options":["tenzij","mits","terwijl","ondanks dat"],"exp":"[[mits]] is a relatively formal positive condition meaning 'provided that'."},{"q":"We gaan door met de wedstrijd, ___ het heel hard gaat regenen. (unless)","options":["mits","tenzij","zodat","ook al"],"exp":"[[tenzij]] expresses a negative condition meaning 'unless'."},{"exp":"[[terwijl]] is used to express the simultaneity of two actions, or sometimes contrast."},{"q":"Put the sentence together: 'Although it was raining, we went for a walk.'","exp":"After a subordinate clause that begins with [[ondanks dat]] and ends with a comma, the verb of the main clause comes immediately (inversion): [[gingen we]]."},{"q":"Put the sentence together: 'As soon as he arrived, we started.'","exp":"The verb of the [[zodra]] subordinate clause moves to the end of the clause ([[kwam]]), and after the comma, the verb of the main clause comes."}]},"b2-infinitiefconstructies":{"title":"Advanced Infinitive Constructions","sum":"Advanced infinitive constructions such as [[aan het + infinitief]] (progressive), [[laten + infinitief]] (causative), and [[zitten/staan/liggen + te + infinitief]] show details about how an action is performed.","blocks":[{"h":"[[aan het + infinitief]]: the progressive form","p":"The construction [[zijn + aan het + infinitief]] expresses an action in progress, similar to the progressive tense in other languages. For example, [[Ik ben aan het koken]] (I am cooking right now).","ex":["She is studying right now.","We were talking when the phone rang."]},{"h":"[[laten + infinitief]]: the causative construction","p":"[[laten]] + infinitive has a causative meaning, 'having something done by someone else' or 'allowing/letting something happen'. For example, [[Ik laat mijn auto repareren]] (I'm having my car repaired; I'm not repairing it myself).","ex":["She gets her hair cut (by the hairdresser).","Just let him go."]},{"h":"[[zitten/staan/liggen + te + infinitief]]: bodily posture + an action in progress","p":"Posture verbs ([[zitten]], [[staan]], [[liggen]], and sometimes [[lopen]]) together with [[te + infinitief]] describe an action in progress that is accompanied by the natural bodily posture for that action. The choice of posture verb depends on the logical bodily position of the activity: [[zitten]] for reading/sitting, [[liggen]] for sleeping, [[staan]] for standing and waiting.","ex":["He is sitting reading.","She is standing waiting for the bus.","The children are lying asleep."]},{"h":"Comparing [[aan het]] with [[zitten/staan/liggen te]]","p":"Both constructions are progressive, but [[zitten/staan/liggen + te]] also indicates bodily posture and has a livelier, more colloquial tone; [[aan het]] is more neutral and general, and is preferred when bodily posture is unimportant or unspecified.","tip":"If a person's bodily posture is unspecified or unimportant, [[aan het]] is more natural; if the bodily posture naturally matches the verb (such as sitting for reading), [[zitten/staan/liggen te]] is more common and livelier."}],"ex":[{"q":"Ik ben ___ koken. (doing something right now)","options":["aan het","te","laten","zitten"],"exp":"The progressive construction [[aan het + infinitive]] is used for 'being in the middle of doing something': [[aan het koken]]."},{"q":"Zij ___ haar haar knippen bij de kapper. (causative, something done by someone else)","options":["is","laat","zit","staat"],"exp":"[[laten]] + infinitive has the causative meaning of 'having something done by someone else': [[haar laten knippen]]."},{"exp":"Since reading is usually done while sitting, the posture verb [[zitten]] is the most natural choice: [[zit te lezen]]."},{"q":"De kinderen ___ te slapen. (lying down, asleep)","options":["zitten","staan","liggen","lopen"],"exp":"For sleeping, the natural posture verb is [[liggen]]: [[liggen te slapen]]."},{"q":"'We waren aan het praten toen de telefoon ging.' What kind of action does this sentence describe?","options":["An action that was in progress in the past","An action that had not yet begun","A permanent state","A request"],"exp":"[[aan het + infinitive]] in the past tense describes an action that was in progress in the past."},{"exp":"After [[laten]], the second verb appears as a bare infinitive (without te): [[laten uitleggen]]."},{"q":"Put the sentence together: 'She was standing by the window, waiting for the bus.'","exp":"For standing and waiting, the natural posture verb is [[staan]] + [[te]] + infinitive: [[staan te wachten]]."},{"q":"Put the sentence together: 'I am busy writing a letter.'","exp":"In the construction [[aan het + infinitive]], the object ([[een brief]]) is placed before [[aan het]]: [[ben een brief aan het schrijven]]."}]},"c1-beknopte-bijzinnen":{"title":"Reduced Subordinate Clauses","sum":"When the subject of the subordinate clause and the main clause are the same, the clause can be reduced using an **infinitive** or a **participle**, as in [[Gebouwd in de 17e eeuw, trekt het kasteel toeristen]].","blocks":[{"h":"Replacing a purpose/causal clause with [[om... te + infinitief]]","p":"When a purpose or causal subordinate clause shares its subject with the main clause, it can be reduced using the construction [[om... te + infinitief]]. For example, [[Hij trainde hard om de wedstrijd te winnen]] instead of a fuller clause with [[zodat]] or [[omdat]].","ex":["In order to arrive on time, she left early.","He read the book to know more."]},{"h":"Replacing with the past participle","p":"When the verb of the subordinate clause can be passivized and its subject is the same as that of the main clause, the clause can be reduced using a past participle at the start of the sentence. For example, [[Omdat het boek goed geschreven was, werd het een bestseller]] → [[Goed geschreven, werd het boek een bestseller]].","ex":["Built in the 17th century, the castle attracts many tourists.","Convinced by the arguments, the committee voted in favor."]},{"h":"Replacing with the present participle","p":"When a subordinate clause expresses simultaneity or a reason with a shared subject, its verb can be turned into a present participle. For example, [[Terwijl hij liep, dacht hij aan haar]] → [[Lopend, dacht hij aan haar]].","ex":["Knowing it was dangerous, he went anyway.","Realizing he was late, he ran to the station."]},{"h":"The main limitation: a shared subject is required","p":"This reduction is only possible when the subject of the subordinate clause is exactly the same as the (logical) subject of the main clause. If the subjects differ, the subordinate clause must remain in full, with its own conjunction.","tip":"If the subject of the subordinate clause is not the same as the subject of the main clause, it cannot be reduced; in that case, the full clause with its conjunction must be kept."}],"ex":[{"q":"Which option is the reduced version of 'Omdat hij moe was, ging hij slapen.'?","options":["Moe, ging hij slapen.","Hij moe was, ging hij slapen.","Omdat moe, ging hij slapen.","Moe zijnd, ging hij slapen."],"exp":"When the subject of the subordinate clause and the main clause is the same, the adjective/participle ([[moe]]) can be placed directly at the start of the sentence, and the conjunction and verb can be dropped."},{"q":"Which sentence cannot easily be converted into a reduced clause?","options":["Omdat ik moe was, ging ik naar bed.","Omdat hij het boek goed schreef, werd het succesvol.","Omdat zij ziek was, bleef ze thuis.","Omdat het laat was, gingen we naar huis."],"exp":"In the second option, the subject of the subordinate clause ([[hij]]) is not the same as the logical subject of the main clause ([[het boek]]); so simple reduction is not possible."},{"exp":"The past participle [[Gebouwd]] at the start of the sentence reduces the subordinate clause 'because it was built in the 17th century'."},{"exp":"The present participle [[Wetende]] replaces 'Omdat hij wist' because the subject is the same."},{"q":"Put the sentence together: 'In order to arrive on time, she left early.'","exp":"To express purpose with a shared subject, the construction [[om... te + infinitive]] is used at the start of the sentence."},{"q":"Put the sentence together: 'Convinced by the arguments, the committee voted in favor.'","exp":"The past participle [[Overtuigd]] replaces the full clause 'Omdat de commissie overtuigd was'."},{"q":"The sentence 'Gebouwd in de 17e eeuw, trekt het kasteel veel toeristen.' is equivalent to which full clause?","options":["Omdat het kasteel in de 17e eeuw gebouwd werd, trekt het veel toeristen.","Terwijl het kasteel gebouwd wordt, trekt het toeristen.","Het kasteel bouwt zichzelf in de 17e eeuw.","Mits het kasteel gebouwd is, trekt het toeristen."],"exp":"The reduced participial clause with the past passive verb ([[gebouwd]]) replaces the full causal clause with [[omdat]] and the passive verb."},{"exp":"[[Geschrokken]] is the past participle of the verb [[schrikken]] and reduces the clause 'because the cat was startled'."}]},"c1-naamwoordstijl":{"title":"Nominal Style versus Verbal Style","sum":"Formal and academic Dutch often prefers **nominal** style ([[naamwoordstijl]]) over **verbal** style ([[werkwoordstijl]]), meaning actions are expressed as noun phrases like [[de stijging van de prijzen]] instead of as verbs.","blocks":[{"h":"Defining nominal style and verbal style","p":"**[[werkwoordstijl]]** (verbal style) relies on verbs and subordinate clauses; it is natural and dynamic and is used mostly in speech and narration. **[[naamwoordstijl]]** (nominal style) compresses information into noun phrases; it is common in academic, administrative, and journalistic Dutch and creates a more objective, formal tone, but it can make the text heavier.","ex":["The government decided that it would raise taxes. (verbal style)","The government made the decision to raise taxes. (nominal style)"]},{"h":"How a verb is converted into a noun phrase","p":"To convert to nominal style, the main verb is turned into a derived noun (often with the suffix [[-ing]] or [[-tie]]) and is connected to the rest of the sentence with the preposition [[van]], [[tot]], or [[over]]; sometimes several clauses are compressed into one nominal sentence.","table":{"head":["Verbal style","Nominal style"],"rows":[["doordat de prijzen stijgen","door de stijging van de prijzen"],["nadat het onderzoek is afgerond","na afronding van het onderzoek"],["omdat het probleem is opgelost","door de oplossing van het probleem"]]},"ex":["Due to the rise in prices, inflation increased.","After the completion of the research, the report was published."]},{"h":"Stylistic usage: where and why","p":"Nominal style is common in formal reports, academic papers, legal texts, and news headlines because of its compactness and objective/neutral tone. However, excessive use of it is criticized as 'bureaucratic Dutch' (ambtelijk Nederlands), because it makes the text difficult and unnatural.","list":["Formal and administrative reports","Scientific and academic papers","Legal texts","Compact news headlines"]},{"h":"A full rewriting example","p":"Comparing a sentence in both styles shows how the subject of the subordinate clause becomes a [[door + noun]] phrase and the main verb becomes a derived noun.","ex":["When prices rose, inflation rose too. (verbal style)","The rise in prices caused a rise in inflation. (nominal style)"],"tip":"In well-written Dutch, professional writers usually use a mix of nominal and verbal style so that the text is both precise and readable."}],"ex":[{"q":"Which option is the nominal version of 'De regering besloot dat ze de belasting zou verhogen.'?","options":["De regering nam het besluit tot belastingverhoging.","De regering besluit belasting verhogen.","De regering, verhogend belasting, besloot.","Verhoging belasting besloot de regering."],"exp":"In nominal style, the main verb becomes a noun ([[besluit]]) and the subordinate clause's verb becomes a compound noun ([[belastingverhoging]])."},{"exp":"The formal derived noun from [[stijgen]] is [[stijging]]."},{"q":"Which sentence is an example of a more natural verbal style?","options":["Toen de prijzen stegen, steeg de inflatie.","Door de stijging van de prijzen steeg de inflatie.","Bij stijging van prijzen, inflatiestijging.","De prijsstijging veroorzaakte inflatiestijging."],"exp":"The first option, with the verbal temporal clause ([[toen... stegen]]), is an example of a more dynamic and natural verbal style in speech; the remaining options are nominal."},{"exp":"The formal noun derived from [[afronden]] is [[afronding]], common in formal nominal style."},{"q":"What is the main characteristic of nominal style (naamwoordstijl)?","options":["Information is compressed into noun phrases and the tone becomes more objective and formal","The sentence is always shorter than in verbal style","It is only common in colloquial language","Main verbs are dropped and the sentence remains without a verb"],"exp":"In nominal style, actions are expressed as nouns and connected to the rest of the sentence with van/door, which creates a more objective and formal tone; the sentence do
